<title>26 秋季複習本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a sticker-book study app — chunky outlined cards with offset "sticker" shadows on a dotted sky page, a piggy-bank mascot, and a candy accent per subject. */
:root{
  --bg:#eef5ff; --dot:#d6e4fb; --panel:#ffffff; --ink:#22264a; --mute:#5d6386; --line:#22264a; --soft:#e8eefb; --hair:#cfd8ee;
  --basic:#2f86e0; --deriv:#0fa89a; --invest:#f07a12; --law:#e0407a; --mgmt:#7556f0; --cfa:#2f9e44; --acc:var(--deriv);
  --plain:#dff7f3; --life:#fff0d9; --exam:#ece6ff; --why:#fff7c7; --good:#1f9d55; --bad:#d9412b; --hit:#fff3a6;
  --pig:#ffb3c8; --pigd:#e8799a; --gold:#ffcf3a;
  --f-display:"Huninn","Noto Sans TC","PingFang TC",sans-serif; --f-zh:"Huninn","Noto Sans TC","PingFang TC",sans-serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --sh:4px 4px 0 var(--line);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151a33; --dot:#212a4d; --panel:#1f2547; --ink:#f1f2ff; --mute:#b1b6da; --line:#0a0d1f; --soft:#2a3160; --hair:#39417a;
  --basic:#6fb6ff; --deriv:#3fe0cf; --invest:#ffa64d; --law:#ff7aa6; --mgmt:#a68cff; --cfa:#6fdc86; --plain:#173b3d; --life:#3d3020; --exam:#2f2a5a; --why:#3b3718; --good:#5ee09a; --bad:#ff8a73; --hit:#4a4316; --pig:#f2a0ba; --pigd:#c95f80; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151a33; --dot:#212a4d; --panel:#1f2547; --ink:#f1f2ff; --mute:#b1b6da; --line:#0a0d1f; --soft:#2a3160; --hair:#39417a;
  --basic:#6fb6ff; --deriv:#3fe0cf; --invest:#ffa64d; --law:#ff7aa6; --mgmt:#a68cff; --cfa:#6fdc86; --plain:#173b3d; --life:#3d3020; --exam:#2f2a5a; --why:#3b3718; --good:#5ee09a; --bad:#ff8a73; --hit:#4a4316; --pig:#f2a0ba; --pigd:#c95f80; color-scheme:dark }
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg) radial-gradient(var(--dot) 1.5px,transparent 1.6px) 0 0/22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75}
body[data-subj="basic"]{--acc:var(--basic)} body[data-subj="re"]{--acc:var(--re)} body[data-subj="invest"]{--acc:var(--invest)} body[data-subj="law"]{--acc:var(--law)} body[data-subj="mgmt"]{--acc:var(--mgmt)} body[data-subj="cfa"]{--acc:var(--cfa)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:3px solid var(--line)}
.topin{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
#stabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{border:2.5px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 14px 6px;cursor:pointer;position:relative;font-weight:700;font-family:var(--f-display);box-shadow:2px 2px 0 var(--line);transition:transform .12s}
.stab:hover{transform:translateY(-2px)}
.stab[aria-current="page"]{color:#fff} .stab.basic[aria-current="page"]{background:var(--basic)} .stab.re[aria-current="page"]{background:var(--re)} .stab.deriv[aria-current="page"]{background:var(--deriv)} .stab.invest[aria-current="page"]{background:var(--invest)} .stab.law[aria-current="page"]{background:var(--law)} .stab.mgmt[aria-current="page"]{background:var(--mgmt)} .stab.home[aria-current="page"]{background:var(--pigd)} .stab.cfa[aria-current="page"]{background:var(--cfa)}
#hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:13px}

#hud .ttl{font-family:var(--f-zh);font-weight:700} .xpbar{width:90px;height:12px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)} .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pigd))}
.streak{display:flex;align-items:center;gap:2px;font-weight:700} .flm{fill:#ff6b3d}
.snd,.lang button{white-space:nowrap;border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:0 8px;cursor:pointer;font-size:12px;font-weight:700}
.lang{display:inline-flex;gap:0} .lang button{border-radius:0;margin-left:-2px} .lang button:first-child{border-radius:8px 0 0 8px;margin:0} .lang button:last-child{border-radius:0 8px 8px 0}
.lang button[aria-pressed="true"],.snd[aria-pressed="true"]{background:var(--acc);color:#fff}
.bar{display:block;height:8px;border-radius:5px;background:var(--soft);overflow:hidden;--p:0%;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;width:var(--p);background:var(--acc);transition:width .4s}
.bar.mini{position:absolute;left:14px;right:14px;bottom:2px;height:3px;border:0;background:transparent}
.stab.basic .bar i{background:var(--basic)} .stab.re .bar i{background:var(--re)} .stab.deriv .bar i{background:var(--deriv)} .stab.invest .bar i{background:var(--invest)} .stab.law .bar i{background:var(--law)} .stab.mgmt .bar i{background:var(--mgmt)} .stab[aria-current="page"] .bar i{background:#fff}
main{max-width:1200px;margin:0 auto;padding-block:20px 80px;padding-inline:16px}
.shead{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;padding-bottom:12px}

.intro{color:var(--mute);max-width:70ch;margin:4px 0 0}

.ptabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding:4px 4px 8px}
.ptab{border:2.5px solid var(--line);background:var(--panel);padding:6px 14px;cursor:pointer;border-radius:12px;white-space:nowrap;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.ptab[aria-selected="true"]{background:var(--acc);color:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.tipbox{margin-bottom:14px}
.mascot{display:flex;gap:10px;align-items:center} .mascot .pig{flex:none}
.bubble{position:relative;margin:0;background:var(--panel);border:2.5px solid var(--line);border-radius:16px;padding:8px 14px;box-shadow:3px 3px 0 var(--line);max-width:640px}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--line)}
.pig .pk-b{fill:var(--pig);stroke:var(--line);stroke-width:2.5} .pig .pk-s{fill:var(--pigd);stroke:var(--line);stroke-width:2} .pig .pk-d{fill:var(--line)} .pig .pk-e{fill:#22264a} .pig .pk-w{fill:#fff} .pig .pk-c{fill:#ff8fae;opacity:.7} .pig .pk-m{fill:none;stroke:#22264a;stroke-width:2.5;stroke-linecap:round} .pig .pk-coin{fill:var(--gold);stroke:var(--line);stroke-width:2} .pig .pk-ct{font:700 11px var(--f-display);fill:#22264a}
.learn{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 110px);overflow:auto;padding:2px 6px 6px 2px}
.toc a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;background:var(--panel);border:2px solid var(--line);font-weight:500}
.toc a:hover{background:var(--soft)} .cnt{font-size:11px;color:var(--mute);font-weight:700}
@media (max-width:820px){.learn{grid-template-columns:minmax(0,1fr)}.toc{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
.cards{min-width:0;display:flex;flex-direction:column;gap:20px}
.searchbar input{width:100%;padding:10px 14px;border:2.5px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:3px 3px 0 var(--line)}
.sec{display:flex;flex-direction:column;gap:18px;scroll-margin-top:100px}
.sec>h3{font-size:24px;font-family:var(--f-zh);display:inline-block;align-self:flex-start;background:var(--acc);color:#fff;padding:2px 14px;border-radius:10px;border:2.5px solid var(--line);transform:rotate(-1deg)}
.card,.fcardx{background:var(--panel);border:2.5px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sh)}
.card.done{background:linear-gradient(var(--panel),var(--panel)) padding-box;border-color:var(--good)} .card.flash{animation:pop .8s 2}
.card header,.fcardx header{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.card h4,.fcardx h4{font-size:21px;font-family:var(--f-zh);font-weight:700} .en{font-family:var(--f-display);font-size:13px;color:var(--mute);font-weight:500}
.cfa{font-size:11.5px;font-weight:700;background:var(--gold);color:#22264a;border:2px solid var(--line);border-radius:999px;padding:0 9px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:640px){.duo{grid-template-columns:1fr}}
.duo>div,.exam,.why,.stepsbox,.oops,.fqq,.symtable,.calc{border-radius:14px;padding:10px 14px;min-width:0;border:2px dashed var(--hair)} .duo p{margin:2px 0 0}
.plain{background:var(--plain)} .life{background:var(--life)} .exam{background:var(--exam);position:relative} .exam p{margin:2px 0;font-family:Georgia,"Times New Roman",serif;font-size:15.5px;padding-right:56px}
.why{background:var(--why)} .why p{margin:2px 0} .oops{background:color-mix(in srgb,var(--bad) 9%,var(--panel))} .oops ul,.stepsbox ol{margin:4px 0;padding-left:1.4em}
.mini{position:absolute;right:10px;top:10px;border:2px solid var(--line);background:var(--panel);border-radius:8px;font-size:12px;padding:0 8px;cursor:pointer;font-weight:700}
.en-ans{position:relative;padding-right:56px}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
figure{margin:0;overflow-x:auto} .fig{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.fig text{fill:var(--ink);font-family:var(--f-body);font-size:11px} .fig .sm{font-size:10px;fill:var(--mute)} .fig .hd{font-size:12px;font-weight:700;fill:var(--ink)} .fig .bt{font-size:11px;fill:var(--ink)}
.fig .bx{fill:var(--soft);stroke:var(--line);stroke-width:2} .fig .bx.c1{fill:color-mix(in srgb,var(--acc) 22%,var(--panel))} .fig .bx.c2{fill:var(--plain)} .fig .bx.c3{fill:var(--life)} .fig .bx.c0{fill:color-mix(in srgb,var(--acc) 12%,var(--panel))}
.fig .ax,.fig .grid{stroke:var(--hair);stroke-width:1.2} .fig .grid{stroke-dasharray:2 3}
.fig .ln{fill:none;stroke:var(--mute);stroke-width:2.5;stroke-linecap:round} .fig .ln.a2,.fig .ar.a2{stroke:var(--acc)} .fig .thick{stroke-width:3.5} .fig .dash{stroke-dasharray:5 4;stroke:var(--mute);fill:none;stroke-width:1.8}
.fig .ar{stroke:var(--mute);stroke-width:1.8;fill:none} .fig .ahd{fill:var(--mute)} .fig .dot{fill:var(--acc);stroke:var(--line);stroke-width:1.5} .fig .br{stroke:var(--acc);stroke-width:2.5} .fig .wick{stroke:var(--ink);stroke-width:2}
.fig .kred{fill:#e5484d;stroke:var(--line);stroke-width:1.5} .fig .kblk{fill:#2f9e6b;stroke:var(--line);stroke-width:1.5} .fig .grad{fill:var(--soft);stroke:var(--line)}
.fig .seg.s1{fill:var(--acc)} .fig .seg.s2{fill:color-mix(in srgb,var(--acc) 45%,var(--panel))} .fig .seg.s3{fill:var(--soft);stroke:var(--line)} .fig text.a2{fill:var(--acc)}
details summary{cursor:pointer;font-weight:700;color:var(--acc)} .body{max-width:74ch} .body ul,.body ol{padding-left:1.3em;margin:6px 0} .body li{margin:3px 0}
.note{font-size:14px;color:var(--mute);border-left:4px solid var(--acc);padding-left:10px}
.formula{font-family:var(--f-display);font-size:17px;background:var(--why);padding:6px 14px;border-radius:10px;display:inline-block;border:2px solid var(--line)}
.route{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none;counter-reset:rt}
.route li{counter-increment:rt}
.route a{display:inline-block;padding:4px 10px;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:14px}
.route a::before{content:counter(rt) '. ';font-weight:700;color:var(--acc)}
.grpbox{display:flex;flex-direction:column;gap:18px;scroll-margin-top:100px}
.grp{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--soft);border:2px dashed var(--acc)}
.grp b{font-size:18px}
.grp p{margin:2px 0 0;color:var(--mute);font-size:14px}
.grpn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700}
.body details.deep{margin:6px 0;padding:2px 0 2px 10px;border-left:3px solid var(--hair)}
.body details.deep[open]{border-left-color:var(--acc)}
.body details.deep>summary{font-weight:400;color:var(--ink);list-style:none}
.body details.deep>summary::-webkit-details-marker{display:none}
.body details.deep>summary::before{content:'▸ ';color:var(--acc);font-weight:700}
.body details.deep[open]>summary::before{content:'▾ '}
.body details.deep>summary b{color:var(--acc)}
.body details.deep>summary small{color:var(--mute)}
.body .dk{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;margin-right:6px;border-radius:6px;background:var(--soft);border:1px solid var(--hair);color:var(--mute)}
.tbl.cmp td{min-width:9em}
.tbl.cmp td:first-child{min-width:6em}
.tbl.cmp th.us{background:color-mix(in srgb,var(--basic) 18%,var(--panel))}
.tbl.cmp th.tw{background:color-mix(in srgb,var(--law) 18%,var(--panel))}
.terms{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin:8px 0 0} .terms dt{font-weight:700} .terms dd{margin:0;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;font-weight:500} .chk input{accent-color:var(--good);width:20px;height:20px}
.xpchip{font-size:11px;background:var(--gold);color:#22264a;border-radius:999px;padding:0 6px;font-weight:700;border:1.5px solid var(--line)}
.tblwrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:14px;margin:6px 0;min-width:100%} .tbl th,.tbl td{border:1.5px solid var(--hair);padding:5px 9px;text-align:left;vertical-align:top} .tbl th{background:var(--soft)}
.tbl.num td{font-variant-numeric:tabular-nums} .tbl tr.hit td{background:var(--hit)}
.arts td:first-child{white-space:nowrap;font-family:var(--f-display)} .arts.masked .artc{color:transparent;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--panel) 6px,var(--panel) 12px)} .arts.masked tr.peek .artc{color:inherit;background:none} .arts tr{cursor:pointer}
.wg{border:2.5px dashed var(--acc);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--acc) 6%,var(--panel))}
.wg-row{display:flex;flex-wrap:wrap;gap:10px 16px} .wg label{display:block;font-size:13px;color:var(--mute)} .wg label input,.wg label select{display:block;margin-top:2px} .wg label b{font-family:var(--f-display);color:var(--ink)}
.wg label.full{width:100%} .wg input[type=number],.wg input[type=text],.wg select{border:2px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel);min-width:0;width:100%;max-width:200px} .wg label.full input{max-width:none}
.wg input[type=range],.calc input[type=range]{accent-color:var(--acc);width:150px} .wg-out{margin:0;font-size:14px} .sm-p{font-size:14px;color:var(--mute);margin:0}
.cell{width:64px!important;border:1.5px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--panel)}
.pill{display:inline-block;font-size:12px;padding:0 9px;border-radius:999px;background:var(--soft);color:var(--ink);border:1.5px solid var(--line);font-weight:700} .pill.good{background:color-mix(in srgb,var(--good) 25%,var(--panel))} .pill.bad{background:color-mix(in srgb,var(--bad) 25%,var(--panel))} .en-pill{background:var(--exam);font-size:11px;vertical-align:middle}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.flip{border:2.5px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;text-align:left;cursor:pointer;min-height:84px;font-size:14px;box-shadow:3px 3px 0 var(--line);transition:transform .15s}
.flip:hover{transform:rotate(-1deg)} .flip .f2{display:none} .flip.on .f1{display:none} .flip.on .f2{display:block} .flip.on{background:var(--plain)}
.btn{border:2.5px solid var(--line);background:var(--acc);color:#fff;border-radius:12px;padding:6px 16px;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)} .btn.ghost{background:var(--panel);color:var(--ink)} .btn.on{background:var(--acc);color:#fff} .btn:disabled{opacity:.5;cursor:not-allowed} .btn.big{padding:10px 24px;font-size:17px}
.quizbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px} .quizbar select{border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--panel);max-width:100%}
.quizbar label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0;font-weight:700}

.ez.lead{margin:0 0 12px} .ez.lead::before{content:'先看懂'}
.ez b{font-weight:700}
.ubar{margin:0 0 10px} .ubar .lbl{margin-bottom:6px} .uchips{display:flex;flex-wrap:wrap;gap:8px}

.ucount{margin-bottom:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.mode{border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh);transition:transform .12s;color:#22264a}

.arena{min-height:200px}

.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px} .win h3{font-size:26px;font-family:var(--f-zh)}
