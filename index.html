    syms:{ pay:['收益（每單位）','payoff (per unit)','到期那天這張合約讓你多賺或少付的錢'], ST:['到期時的現貨價格','spot price at maturity T','到期那天東西「真正」的市價'], K:['交割價／約定價','delivery price','當初講好要用多少錢買賣'] },
    why:'你約好用 K 買。到期時東西值 S<sub>T</sub>。如果 S<sub>T</sub> 比 K 貴，你用便宜的 K 買到值 S<sub>T</sub> 的東西 → 賺 S<sub>T</sub> − K。如果 S<sub>T</sub> 比 K 便宜，你還是得用 K 買 → 虧（數字變負的）。空頭剛好相反，所以兩個人的收益加起來永遠 = 0（零和遊戲）。',
    steps:['先決定你是買方（long）還是賣方（short）','買方：拿「到期市價」減「約定價」','賣方：拿「約定價」減「到期市價」','再乘上合約數量（例如 100 盎司）就是總金額'],
    vars:[{k:'K',s:'K',v:1400,min:1000,max:1800,step:10},{k:'ST',s:'S<sub>T</sub>',v:1300,min:1000,max:1800,step:10},{k:'q',s:'數量',v:100,min:1,max:1000,step:1}],
    calc:v=>`Long：(${v.ST} − ${v.K}) × ${v.q} = <b>${fx((v.ST-v.K)*v.q)}</b><br>Short：(${v.K} − ${v.ST}) × ${v.q} = <b>${fx((v.K-v.ST)*v.q)}</b>`,
    oops:['把 long 和 short 的順序弄反：記「買方希望漲 → S<sub>T</sub> 放前面」','忘了乘合約規模（一口 100 oz）'],
    exam:'The payoff from a long forward position is S<sub>T</sub> − K, and the payoff from a short position is K − S<sub>T</sub>, where K is the delivery price and S<sub>T</sub> is the spot price at maturity.',
    cfa:'CFA Level I Derivatives：forward 的 payoff 與 value 是必考基礎。' },
  { id:'F2', t:'買權 Call 的收益與利潤', en:'Call option payoff and profit',
    q:'買了一個「可以用 K 買」的權利，到期賺多少？',
    tex:'<v s="pay">Payoff</v> = max(<v s="ST">S<sub>T</sub></v> − <v s="K">K</v>, 0)　　<v s="pr">Profit</v> = Payoff − <v s="c">c</v>',
    syms:{ pay:['收益','payoff','到期執行權利拿到的錢（還沒扣成本）'], ST:['到期股價','stock price at expiration','到期那天股票值多少'], K:['執行價','strike / exercise price','你有權用多少錢買'], c:['買權權利金','call premium','買這個權利一開始付的錢'], pr:['利潤','profit','真正賺的：收益扣掉權利金'] },
    why:'<b>max(A, 0)</b> 的意思是「A 和 0 選比較大的那個」。為什麼？因為你是「有權利、沒義務」：股價比 K 高 → 執行，賺 S<sub>T</sub>−K；股價比 K 低 → 不執行，收益就是 0，不會變負的。但當初付的權利金 c 是拿不回來的，所以利潤 = 收益 − c。最多只會虧 c。',
    steps:['算 S<sub>T</sub> − K','如果是負數 → 改成 0（不執行）','收益 − 權利金 = 利潤','損益兩平點：S<sub>T</sub> = K + c'],
    vars:[{k:'K',s:'K',v:100,min:50,max:150,step:5},{k:'ST',s:'S<sub>T</sub>',v:115,min:50,max:160,step:1},{k:'c',s:'c',v:5,min:0,max:20,step:0.5}],
    calc:v=>{const p=Math.max(v.ST-v.K,0);return `max(${v.ST} − ${v.K}, 0) = max(${fx(v.ST-v.K)}, 0) = <b>${fx(p)}</b>${v.ST<v.K?'（不執行）':'（執行）'}<br>Profit = ${fx(p)} − ${v.c} = <b>${fx(p-v.c)}</b>；損益兩平 = ${v.K} + ${v.c} = ${fx(v.K+v.c)}`;},
    oops:['payoff 和 profit 搞混：題目問 profit 才要扣權利金','賣方（short call）的利潤 = c − max(S<sub>T</sub>−K, 0)，最大損失無限'],
    exam:'A long call has a payoff of max(S<sub>T</sub> − K, 0); its profit equals the payoff minus the premium paid. The maximum loss is limited to the premium.',
    cfa:'CFA Level I：option payoff/profit diagrams、breakeven 每年都考。' },
  { id:'F3', t:'賣權 Put 的收益與利潤', en:'Put option payoff and profit',
    q:'買了一個「可以用 K 賣」的權利，到期賺多少？',
    tex:'<v s="pay">Payoff</v> = max(<v s="K">K</v> − <v s="ST">S<sub>T</sub></v>, 0)　　<v s="pr">Profit</v> = Payoff − <v s="p">p</v>',
    syms:{ pay:['收益','payoff','執行賣權拿到的錢'], K:['執行價','strike price','你有權用多少錢賣'], ST:['到期股價','price at expiration','到期那天的市價'], p:['賣權權利金','put premium','買這個保險付的錢'], pr:['利潤','profit','收益扣權利金'] },
    why:'賣權像「保價險」。市價跌到 S<sub>T</sub>，你卻能用比較高的 K 賣出 → 賺 K − S<sub>T</sub>。市價比 K 高的話，你自己去市場賣比較好，不用這個權利 → 收益 0。老師的大頭菜例：保證能 99 鈴錢賣出，就是 K = 99 的 put。',
    steps:['算 K − S<sub>T</sub>','負數 → 0','減掉權利金','損益兩平：S<sub>T</sub> = K − p','最大利潤 = K − p（股價跌到 0）'],
    vars:[{k:'K',s:'K',v:70,min:40,max:120,step:5},{k:'ST',s:'S<sub>T</sub>',v:55,min:0,max:130,step:1},{k:'p',s:'p',v:7,min:0,max:20,step:0.5}],
    calc:v=>{const x=Math.max(v.K-v.ST,0);return `max(${v.K} − ${v.ST}, 0) = <b>${fx(x)}</b><br>Profit = ${fx(x)} − ${v.p} = <b>${fx(x-v.p)}</b>；損益兩平 = ${v.K} − ${v.p} = ${fx(v.K-v.p)}`;},
    oops:['把 K 和 S<sub>T</sub> 順序寫成 call 的樣子','以為 put 是「賣出選擇權」：put 是「賣的權利」，買 put 的人是 long put'],
    exam:'A long put has a payoff of max(K − S<sub>T</sub>, 0). It is used to protect against a fall in the price of the underlying asset.',
    cfa:'CFA：protective put = 股票 + long put，是重要策略。' },
  { id:'F4', t:'每日結算的損益', en:'Daily settlement gain',
    q:'今天收盤後，我的保證金帳戶要加減多少錢？',
    tex:'<v s="g">當日損益</v> = (<v s="Ft">F<sub>t</sub></v> − <v s="F0">F<sub>t−1</sub></v>) × <v s="z">合約規模</v> × <v s="n">口數</v>　（空頭再乘 −1）',
    syms:{ g:['當日損益','daily gain/loss','今天被加進或扣出帳戶的錢'], Ft:['今天結算價','today’s settlement price','今天收盤時大家同意的期貨價'], F0:['昨天結算價','previous settlement price','昨天的結算價（第一天用成交價）'], z:['合約規模','contract size','一口等於多少單位（黃金 100 oz）'], n:['口數','number of contracts','你買了幾口'] },
    why:'期貨不是等到到期才算帳，而是「每天」把今天跟昨天的價差結清（marking to market）。多頭希望價格上漲，所以今天比昨天高就賺；空頭相反。',
    steps:['今天價 − 昨天價（每單位變動）','× 每口幾單位','× 幾口','多頭直接用；空頭變號','加到保證金餘額上'],
    vars:[{k:'F0',s:'F<sub>t−1</sub>',v:1450,min:1300,max:1900,step:0.1},{k:'Ft',s:'F<sub>t</sub>',v:1441,min:1300,max:1900,step:0.1},{k:'z',s:'規模',v:100,min:1,max:5000,step:1},{k:'n',s:'口數',v:2,min:1,max:20,step:1}],
    calc:v=>`Long：(${v.Ft} − ${v.F0}) × ${v.z} × ${v.n} = <b>${fx((v.Ft-v.F0)*v.z*v.n,2)}</b>；Short：<b>${fx(-(v.Ft-v.F0)*v.z*v.n,2)}</b>`,
    oops:['忘記乘口數','把「累積損益」當成「當日損益」'],
    exam:'Futures contracts are marked to market daily: the gain or loss is (F<sub>t</sub> − F<sub>t−1</sub>) × contract size × number of contracts, and it is credited to or debited from the margin account.',
    cfa:'CFA：futures 的 mark-to-market 與 margin 機制。' },
  { id:'F5', t:'保證金追繳的價格', en:'Price that triggers a margin call',
    q:'價格跑到哪裡，我會被叫去補錢？',
    tex:'多頭：<v s="P">P*</v> = <v s="F">F<sub>0</sub></v> − (<v s="IM">IM</v> − <v s="MM">MM</v>) ÷ <v s="z">每口規模</v><br>空頭：<v s="P">P*</v> = <v s="F">F<sub>0</sub></v> + (<v s="IM">IM</v> − <v s="MM">MM</v>) ÷ <v s="z">每口規模</v>',
    syms:{ P:['追繳觸發價','margin call price','價格碰到這裡就要補錢'], F:['成交價','initial futures price','你進場時的期貨價'], IM:['原始保證金（每口）','initial margin','進場要押的錢'], MM:['維持保證金（每口）','maintenance margin','帳戶最低不能低於這條線'], z:['每口規模','contract size','一口幾單位'] },
    why:'IM − MM 是「緩衝墊」：你最多能虧多少錢才會碰到維持線。把這筆錢除以每口的單位數，就變成「每單位價格能動多少」。多頭怕跌，所以從成交價往下扣；空頭怕漲，所以往上加。<br><b>重點</b>：用「每口」的 IM、MM 和「每口」的規模算，口數會被約掉，不影響答案！',
    steps:['緩衝 = IM − MM（例：4,000 − 3,000 = 1,000）','每單位價格緩衝 = 緩衝 ÷ 每口規模（1,000 ÷ 5,000 = 0.20）','判斷方向：long 減、short 加','17.20 + 0.20 = 17.40（課本 2.1，short）','被追繳後要補到「原始」保證金，不是補到維持！'],
    vars:[{k:'F',s:'F<sub>0</sub>',v:17.2,min:1,max:200,step:0.1},{k:'IM',s:'IM',v:4000,min:500,max:20000,step:100},{k:'MM',s:'MM',v:3000,min:0,max:20000,step:100},{k:'z',s:'規模',v:5000,min:1,max:50000,step:100}],
    calc:v=>{const d=(v.IM-v.MM)/v.z;return `緩衝每單位 = (${v.IM} − ${v.MM}) ÷ ${v.z} = ${fx(d)}<br>Long：${v.F} − ${fx(d)} = <b>${fx(v.F-d)}</b>；Short：${v.F} + ${fx(d)} = <b>${fx(v.F+d)}</b>`;},
    oops:['補繳金額補到維持保證金（錯！要補到原始）','用「總」保證金除以「每口」規模（兩邊單位要一致）','多空方向搞反'],
    exam:'A margin call occurs when the balance falls below the maintenance margin. For a short position this happens when the futures price rises by (initial margin − maintenance margin) / contract size.',
    cfa:'CFA：variation margin 的計算題型。' },
  { id:'F6', t:'未平倉量的變化', en:'Change in open interest',
    q:'今天交易完，市場上「還沒平倉的合約」多了還是少了？',
    tex:'Δ<v s="OI">OI</v> = <v s="a">買方開倉</v> − <v s="d">賣方平倉</v> = <v s="c">賣方開倉</v> − <v s="b">買方平倉</v>',
    syms:{ OI:['未平倉量','open interest','市場上還活著的合約數（只算一邊）'], a:['買方開倉','new longs','買的人中，建立新部位的'], b:['買方平倉','longs closing… 其實是空方買回','買的人中，買回來平掉舊空單的'], c:['賣方開倉','new shorts','賣的人中，建立新部位的'], d:['賣方平倉','longs closing out','賣的人中，賣掉平掉舊多單的'] },
    why:'把每筆成交想成「一個買方配一個賣方」。兩個都是新人 → 多一張合約（OI+1）；兩個都在退場 → 少一張（OI−1）；一個進一個出 → 合約換手，數量不變。把所有配對加總，算出來剛好等於「買方開倉 − 賣方平倉」。',
    steps:['成交量 = 買方開 + 買方平 = 賣方開 + 賣方平','代公式：買方開 − 賣方平','驗算：賣方開 − 買方平，答案應該一樣','負數 = OI 減少'],
    vars:[{k:'a',s:'買方開',v:600,min:0,max:5000,step:50},{k:'c',s:'賣方開',v:800,min:0,max:5000,step:50},{k:'vol',s:'成交量',v:2000,min:0,max:10000,step:100}],
    calc:v=>{const b=v.vol-v.a,d=v.vol-v.c;return `買方平 = ${v.vol} − ${v.a} = ${b}；賣方平 = ${v.vol} − ${v.c} = ${d}<br>ΔOI = ${v.a} − ${d} = <b>${v.a-d}</b>（驗算 ${v.c} − ${b} = ${v.c-b}）`;},
    oops:['把成交量直接當 OI 變化','用「買方開 − 買方平」（錯，要交叉：買方開配賣方平）'],
    exam:'Open interest is the total number of contracts outstanding. It went down by 600 because 1,200 longs closed out while only 600 new longs were opened.',
    cfa:'CFA：open interest vs. trading volume 的觀念題。' },
  { id:'F7', t:'基差與避險後的實際價格', en:'Basis and effective hedged price',
    q:'用期貨避險後，我最後實際買到／賣到的價格是多少？',
    tex:'<v s="b">b</v> = <v s="S">S</v> − <v s="F">F</v>　　實際價格 = <v s="F1">F<sub>1</sub></v> + <v s="b2">b<sub>2</sub></v>',
    syms:{ b:['基差','basis','現貨跟期貨的價差'], S:['現貨價','spot price','要避險的那個東西現在的價格'], F:['期貨價','futures price','所用期貨的價格'], F1:['開始避險時的期貨價','futures price when hedge is set up','你鎖定的價格'], b2:['平倉時的基差','basis when hedge is closed out','平倉那天 S<sub>2</sub> − F<sub>2</sub>，事先不知道 → 風險來源'] },
    why:'以 short hedge 為例：你在市場用 S<sub>2</sub> 賣掉東西，期貨部位賺 F<sub>1</sub> − F<sub>2</sub>。加起來 S<sub>2</sub> + F<sub>1</sub> − F<sub>2</sub> = F<sub>1</sub> + (S<sub>2</sub> − F<sub>2</sub>) = <b>F<sub>1</sub> + b<sub>2</sub></b>。F<sub>1</sub> 是已知的，只有 b<sub>2</sub> 不知道，所以叫「基差風險」。到期日平倉時 b<sub>2</sub> = 0（收斂），就能完全鎖在 F<sub>1</sub>。',
    steps:['b<sub>2</sub> = S<sub>2</sub> − F<sub>2</sub>','實際價格 = F<sub>1</sub> + b<sub>2</sub>（買方、賣方都一樣）','賣方：b<sub>2</sub> 越大越好（基差變強有利）','買方：b<sub>2</sub> 越小越好'],
    vars:[{k:'F1',s:'F<sub>1</sub>',v:2.2,min:0,max:100,step:0.05},{k:'S2',s:'S<sub>2</sub>',v:2.0,min:0,max:100,step:0.05},{k:'F2',s:'F<sub>2</sub>',v:1.9,min:0,max:100,step:0.05}],
    calc:v=>`b<sub>2</sub> = ${v.S2} − ${v.F2} = ${fx(v.S2-v.F2)}<br>實際價格 = ${v.F1} + ${fx(v.S2-v.F2)} = <b>${fx(v.F1+v.S2-v.F2)}</b>`,
    oops:['寫成 F − S（定義是 S − F）','以為 long hedge 的公式不一樣：其實也是 F<sub>1</sub> + b<sub>2</sub>'],
    exam:'Basis = spot price − futures price. The effective price obtained with a hedge is F<sub>1</sub> + b<sub>2</sub>; uncertainty about b<sub>2</sub> is called basis risk.',
    cfa:'CFA：basis、convergence、hedging 的概念。' },
  { id:'F8', t:'最小變異避險比率 h*', en:'Minimum variance hedge ratio',
    q:'每 1 單位的現貨，要配多少單位的期貨，風險才最小？',
    tex:'<v s="h">h*</v> = <v s="r">ρ</v> × <v s="sS">σ<sub>S</sub></v> ÷ <v s="sF">σ<sub>F</sub></v>',
    syms:{ h:['最適避險比率','minimum variance hedge ratio','期貨數量 ÷ 現貨數量的最佳比例'], r:['相關係數（rho）','correlation coefficient','現貨與期貨「一起動」的程度，−1 到 1'], sS:['現貨價格變動的標準差（sigma S）','standard deviation of ΔS','現貨價格每期大概晃多大'], sF:['期貨價格變動的標準差','standard deviation of ΔF','期貨價格每期大概晃多大'] },
    why:'想像你用「玩具車」去平衡「真車」的晃動。<br>① 如果兩個完全同步（ρ=1）、晃動一樣大，就 1 比 1。<br>② 期貨晃得比較大（σ<sub>F</sub> 大）→ 少用一點期貨就夠（除以 σ<sub>F</sub>）。<br>③ 現貨晃得比較大 → 要多用一點（乘 σ<sub>S</sub>）。<br>④ 兩者不太同步（ρ 小）→ 期貨幫不了太多，用少一點（乘 ρ）；ρ = 0 時完全不用避險。<br>數學上：讓 ΔS − hΔF 的變異數最小，對 h 微分 = 0 就得到這個公式。',
    steps:['找出三個數：ρ、σ<sub>S</sub>、σ<sub>F</sub>（題目會給）','相乘再相除：ρ × σ<sub>S</sub> ÷ σ<sub>F</sub>','例 3.13：0.7 × 1.2 ÷ 1.4 = 0.6','意思：每 1 磅現貨配 0.6 磅期貨'],
    vars:[{k:'r',s:'ρ',v:0.7,min:0,max:1,step:0.01},{k:'sS',s:'σ<sub>S</sub>',v:1.2,min:0.01,max:5,step:0.01},{k:'sF',s:'σ<sub>F</sub>',v:1.4,min:0.01,max:5,step:0.01}],
    calc:v=>`h* = ${v.r} × ${v.sS} ÷ ${v.sF} = <b>${fx(v.r*v.sS/v.sF)}</b>　剩餘風險 = √(1−ρ²) = ${fx(Math.sqrt(1-v.r*v.r)*100,1)}% 的原本風險`,
    oops:['σ<sub>S</sub>、σ<sub>F</sub> 放反','h*=1 不代表完美避險（3.10）'],
    exam:'The minimum variance hedge ratio is h* = ρσ<sub>S</sub>/σ<sub>F</sub>, where ρ is the correlation between changes in the spot and futures prices.',
    cfa:'CFA Level II/III 會用到 hedge ratio；Level I 先懂概念。' },
  { id:'F9', t:'最適契約口數 N*', en:'Optimal number of contracts',
    q:'知道比例後，到底要買或賣幾口期貨？',
    tex:'<v s="N">N*</v> = <v s="h">h*</v> × <v s="QA">Q<sub>A</sub></v> ÷ <v s="QF">Q<sub>F</sub></v>',
    syms:{ N:['口數','number of contracts','要交易幾口'], h:['避險比率','hedge ratio','上一個公式算出來的'], QA:['要避險的數量','size of position being hedged','你手上（或未來要買賣）多少單位'], QF:['每口期貨的數量','size of one futures contract','一口期貨代表多少單位'] },
    why:'h* × Q<sub>A</sub> = 「需要多少單位的期貨」。但期貨是一口一口賣的，所以再除以一口的大小，就知道要幾口。就像你需要 120,000 磅，一箱 40,000 磅 → 3 箱。',
    steps:['先算 h*','需要的期貨單位 = h* × Q<sub>A</sub>','÷ 每口規模 = 口數','四捨五入到整數','方向：未來要買 → long；未來要賣 → short'],
    vars:[{k:'h',s:'h*',v:0.6,min:0,max:2,step:0.01},{k:'QA',s:'Q<sub>A</sub>',v:200000,min:0,max:5000000,step:1000},{k:'QF',s:'Q<sub>F</sub>',v:40000,min:1,max:100000,step:100}],
    calc:v=>`N* = ${v.h} × ${fx(v.QA)} ÷ ${fx(v.QF)} = <b>${fx(v.h*v.QA/v.QF,2)}</b> ≈ ${Math.round(v.h*v.QA/v.QF)} 口`,
    oops:['忘記乘 h*','沒有說明 long 還是 short'],

DATA.invest.formulas = [
  { id:'G1', t:'CAPM／證券市場線 SML', en:'Capital Asset Pricing Model',

    why:'中括號裡面是「每承擔 1 單位總風險，能多拿多少報酬」，也就是市場的夏普比率（Sharpe ratio）。乘上你的風險 σ<sub>p</sub> 就是你的加給。CML 只適用「有效率的組合」（無風險資產＋市場組合），單一股票要用 SML。',

DATA.basic.formulas = [
  { id:'B1', t:'報酬率', en:'Holding period return', q:'這筆投資賺了百分之幾？',
    tex:'<v s="R">R</v> = (<v s="P1">P<sub>1</sub></v> − <v s="P0">P<sub>0</sub></v> + <v s="D">D</v>) ÷ <v s="P0">P<sub>0</sub></v>',
    syms:{R:['報酬率','holding period return','這段期間賺了幾 %'],P1:['期末價格','ending price','賣出（或現在）的價格'],P0:['期初價格','beginning price','買進的價格'],D:['期間收到的現金','income (dividend / coupon)','股利或利息']},
    why:'分子是「總共賺到多少錢」：價差（P<sub>1</sub> − P<sub>0</sub>）加上中間拿到的現金 D。分母是本金。除完就是「每 1 元本金賺了多少」。',
    steps:['價差 = P<sub>1</sub> − P<sub>0</sub>','加上股利 D','÷ P<sub>0</sub>','× 100%'],
    vars:[{k:'P0',s:'P<sub>0</sub>',v:50,min:1,max:500,step:1},{k:'P1',s:'P<sub>1</sub>',v:55,min:0,max:500,step:1},{k:'D',s:'D',v:2,min:0,max:50,step:0.5}],
    calc:v=>`(${v.P1} − ${v.P0} + ${v.D}) ÷ ${v.P0} = ${fx(v.P1-v.P0+v.D)} ÷ ${v.P0} = <b>${fx((v.P1-v.P0+v.D)/v.P0*100,2)}%</b>`,
    oops:['分母用期末價格','忘了加股利'], exam:'The holding period return is (P<sub>1</sub> − P<sub>0</sub> + D)/P<sub>0</sub>.', cfa:'CFA Level I Quant：holding period return。' },
  { id:'B2', t:'複利終值', en:'Future value with compounding', q:'現在的錢放 n 年後會變成多少？',
    tex:'<v s="FV">FV</v> = <v s="PV">PV</v> × (1 + <v s="r">r</v>)<sup><v s="n">n</v></sup>',
    syms:{FV:['終值','future value','未來會變成多少'],PV:['現值','present value','現在投入的錢'],r:['每期利率','interest rate per period','例如年利率 5% = 0.05'],n:['期數','number of periods','放幾年（幾期）']},
    why:'每過一期，錢都乘上 (1 + r)。過 n 期就乘 n 次 → (1 + r)<sup>n</sup>。這就是「利滾利」：第二年的利息是用「本金＋第一年利息」來算。',
    steps:['1 + r','算 n 次方','× PV'],
    vars:[{k:'PV',s:'PV',v:100,min:1,max:100000,step:1},{k:'r',s:'r (%)',v:10,min:0,max:30,step:0.5},{k:'n',s:'n',v:3,min:0,max:40,step:1}],
    calc:v=>`${v.PV} × (1 + ${v.r/100})<sup>${v.n}</sup> = ${v.PV} × ${fx(Math.pow(1+v.r/100,v.n))} = <b>${fx(v.PV*Math.pow(1+v.r/100,v.n),2)}</b>（單利只有 ${fx(v.PV*(1+v.r/100*v.n),2)}）`,
    oops:['把 (1 + r)<sup>n</sup> 算成 1 + r × n（那是單利）','利率忘了換成小數'], exam:'With annual compounding, FV = PV(1 + r)<sup>n</sup>.', cfa:'CFA Level I Quant：time value of money（超級基礎）。' },
  { id:'B3', t:'現值（折現）', en:'Present value', q:'未來的錢，今天值多少？',
    tex:'<v s="PV">PV</v> = <v s="FV">FV</v> ÷ (1 + <v s="r">r</v>)<sup><v s="n">n</v></sup>',
    syms:{PV:['現值','present value','今天值多少'],FV:['未來金額','future value','未來會拿到的錢'],r:['折現率','discount rate','你要求的報酬率／利率'],n:['期數','periods','幾年後拿到']},
    why:'就是複利公式倒過來。問自己：「今天要存多少，n 年後才會變成 FV？」答案就是 FV 除以成長倍數。利率越高、等越久，現值越小。',
    steps:['(1 + r)<sup>n</sup>','FV ÷ 它'],
    vars:[{k:'FV',s:'FV',v:1331,min:1,max:100000,step:1},{k:'r',s:'r (%)',v:10,min:0,max:30,step:0.5},{k:'n',s:'n',v:3,min:0,max:40,step:1}],
    calc:v=>`${v.FV} ÷ ${fx(Math.pow(1+v.r/100,v.n))} = <b>${fx(v.FV/Math.pow(1+v.r/100,v.n),2)}</b>`,
    oops:['乘以 (1 + r)<sup>n</sup>（方向反了）'], exam:'The present value of a future cash flow is FV/(1 + r)<sup>n</sup>.', cfa:'CFA Level I：discounted cash flow 的基礎。' },
  { id:'B4', t:'期望報酬', en:'Expected return', q:'考慮各種可能，平均會賺多少？',
    tex:'<v s="E">E(R)</v> = Σ <v s="p">p<sub>i</sub></v> × <v s="R">R<sub>i</sub></v>',
    syms:{E:['期望報酬','expected return','長期平均'],p:['第 i 種情況的機率','probability','全部加起來 = 1'],R:['第 i 種情況的報酬','return in state i','']},
    why:'每種情況「出現的次數比例」乘上「那時候的報酬」再加總，就是加權平均。',
    steps:['每種情況：機率 × 報酬','全部加起來'],
    vars:[{k:'p1',s:'好 機率',v:0.3,min:0,max:1,step:0.05},{k:'r1',s:'好 報酬%',v:20,min:-50,max:80,step:1},{k:'p2',s:'普通 機率',v:0.5,min:0,max:1,step:0.05},{k:'r2',s:'普通 報酬%',v:10,min:-50,max:80,step:1},{k:'r3',s:'差 報酬%',v:-5,min:-80,max:50,step:1}],
    calc:v=>{const p3=+(1-v.p1-v.p2).toFixed(2);return `差的機率 = 1 − ${v.p1} − ${v.p2} = ${p3}<br>${v.p1}×${v.r1} + ${v.p2}×${v.r2} + ${p3}×(${v.r3}) = <b>${fx(v.p1*v.r1+v.p2*v.r2+p3*v.r3,2)}%</b>`;},
    oops:['機率加總不等於 1'], exam:'Expected return is the probability-weighted average of possible returns.', cfa:'CFA Quant：expected value。' },
  { id:'B5', t:'標準差', en:'Standard deviation', q:'報酬晃動得多厲害（風險多大）？',
    tex:'<v s="s">σ</v> = √[ Σ <v s="p">p<sub>i</sub></v> × (<v s="R">R<sub>i</sub></v> − <v s="E">E(R)</v>)² ]',
    syms:{s:['標準差','standard deviation','風險的大小'],p:['機率','probability',''],R:['各情況報酬','return in state i',''],E:['期望報酬','expected return','平均']},
    why:'① 每個結果跟平均差多少（R − E）。② 有正有負會互相抵消，所以先平方。③ 用機率加權平均 → 變異數。④ 平方後單位變成「%²」很奇怪，開根號回到 % → 標準差。',
    steps:['算 E(R)','每個 R − E(R)','平方','× 機率後加總 = 變異數','開根號'],
    vars:[{k:'r1',s:'情況1 報酬%',v:20,min:-50,max:80,step:1},{k:'r2',s:'情況2 報酬%',v:0,min:-50,max:80,step:1}],
    calc:v=>{const E=(v.r1+v.r2)/2;const var_=((v.r1-E)**2+(v.r2-E)**2)/2;return `兩種情況各 50%：E = ${fx(E,2)}%<br>σ² = 0.5×(${v.r1}−${fx(E,2)})² + 0.5×(${v.r2}−${fx(E,2)})² = ${fx(var_,2)}　→ σ = <b>${fx(Math.sqrt(var_),2)}%</b>`;},
    oops:['忘了開根號','沒平方直接加（正負抵消變 0）'], exam:'Standard deviation measures the dispersion of returns around the mean and is used as a measure of total risk.', cfa:'CFA Quant：variance and standard deviation。' },
  { id:'B6', t:'相關係數', en:'Correlation coefficient', q:'兩個資產是不是一起漲跌？',
    tex:'<v s="r">ρ</v> = <v s="c">Cov(X,Y)</v> ÷ (<v s="sx">σ<sub>X</sub></v> × <v s="sy">σ<sub>Y</sub></v>)',
    syms:{r:['相關係數','correlation','−1 到 1'],c:['共變異數','covariance','一起偏離平均的程度'],sx:['X 的標準差','σ of X',''],sy:['Y 的標準差','σ of Y','']},
    why:'共變異數有方向但沒有固定刻度（單位一換數字就變），除以兩個標準差就把它「標準化」成 −1～1，可以直接比較。',
    steps:['算 Cov','算 σ<sub>X</sub>、σ<sub>Y</sub>','相除'],
    vars:[{k:'c',s:'Cov',v:0.006,min:-0.05,max:0.05,step:0.001},{k:'sx',s:'σ<sub>X</sub>',v:0.1,min:0.01,max:1,step:0.01},{k:'sy',s:'σ<sub>Y</sub>',v:0.2,min:0.01,max:1,step:0.01}],
    calc:v=>{const r=v.c/(v.sx*v.sy);return `${v.c} ÷ (${v.sx} × ${v.sy}) = <b>${fx(r,3)}</b>${Math.abs(r)>1?'（超過 ±1，這組數字不可能存在）':''}`;},
    oops:['忘了乘兩個標準差'], exam:'Correlation equals covariance divided by the product of the two standard deviations; it ranges from −1 to +1.', cfa:'CFA Quant＋Portfolio：covariance、correlation。' },
  { id:'B7', t:'兩資產組合的報酬與風險', en:'Two-asset portfolio', q:'把錢分成兩份投資，整體報酬與風險是多少？',
    tex:'<v s="Rp">E(R<sub>p</sub>)</v> = <v s="w">w</v>R<sub>1</sub> + (1−<v s="w">w</v>)R<sub>2</sub><br><v s="sp">σ<sub>p</sub>²</v> = w²σ<sub>1</sub>² + (1−w)²σ<sub>2</sub>² + 2w(1−w)<v s="r">ρ</v>σ<sub>1</sub>σ<sub>2</sub>',
    syms:{Rp:['組合期望報酬','portfolio expected return','加權平均'],w:['投資在資產 1 的比例','weight','0～1'],sp:['組合變異數','portfolio variance','開根號 = 組合標準差'],r:['相關係數','correlation','越小 → 分散效果越好']},
    why:'報酬就是簡單的加權平均。風險卻<b>不是</b>加權平均：多了最後一項「2w(1−w)ρσ<sub>1</sub>σ<sub>2</sub>」。ρ 越小（甚至負的），這一項越小，組合風險就比兩個單獨的都低 → 這就是分散投資的數學。',
    steps:['報酬：權重 × 報酬，加總','風險：代入三項','開根號'],
    vars:[{k:'w',s:'w',v:0.5,min:0,max:1,step:0.05},{k:'s1',s:'σ<sub>1</sub>%',v:20,min:0,max:60,step:1},{k:'s2',s:'σ<sub>2</sub>%',v:30,min:0,max:60,step:1},{k:'r',s:'ρ',v:0.2,min:-1,max:1,step:0.05}],
    calc:v=>{const w=v.w,a=v.s1/100,b=v.s2/100;const vp=w*w*a*a+(1-w)**2*b*b+2*w*(1-w)*v.r*a*b;return `σ<sub>p</sub>² = ${fx(w*w*a*a)} + ${fx((1-w)**2*b*b)} + ${fx(2*w*(1-w)*v.r*a*b)} = ${fx(vp)}<br>σ<sub>p</sub> = <b>${fx(Math.sqrt(Math.max(vp,0))*100,2)}%</b>（加權平均會是 ${fx((w*a+(1-w)*b)*100,2)}%，差距就是分散的好處）`;},
    oops:['把組合標準差當成加權平均'], exam:'Portfolio risk is lower than the weighted average of individual risks whenever the correlation is less than +1.', cfa:'CFA Level I Portfolio Management：必考。' },
  { id:'B8', t:'夏普比率', en:'Sharpe ratio', q:'每承擔 1 單位總風險，多賺多少？',
    tex:'<v s="S">Sharpe</v> = (<v s="Rp">R<sub>p</sub></v> − <v s="rf">R<sub>f</sub></v>) ÷ <v s="s">σ<sub>p</sub></v>',
    syms:{S:['夏普比率','Sharpe ratio','風險調整後的績效'],Rp:['組合報酬','portfolio return',''],rf:['無風險利率','risk-free rate',''],s:['組合標準差','portfolio standard deviation','總風險']},
    why:'R<sub>p</sub> − R<sub>f</sub> 是「比放定存多賺的部分」（超額報酬），除以「承擔的風險」。像比較兩份打工的「時薪」，而不是只看總薪水。',

  p2_7:['A trader buys two July futures contracts on frozen orange juice concentrate. Each contract is for the delivery of 15,000 pounds. The current futures price is 160 cents per pound, the initial margin is $6,000 per contract, and the maintenance margin is $4,500 per contract. What price change would lead to a margin call? Under what circumstances could $2,000 be withdrawn from the margin account?','A margin call occurs if the price falls below 150 cents; $2,000 can be withdrawn if the price rises to 166.67 cents.'],
  p2_13:['The forward price of the Swiss franc for delivery in 45 days is quoted as 1.1000. The futures price for a contract that will be delivered in 45 days is 0.9000. Explain these two quotes. Which is more favorable for a trader wanting to sell Swiss francs?','The forward quote is CHF per USD; the futures quote is USD per CHF. 1/1.1 = 0.9091 > 0.9000, so the forward market is more attractive for selling Swiss francs.'],

  p3_13:['The standard deviation of monthly changes in the spot price of live cattle is 1.2 (cents per pound). The standard deviation of monthly changes in the futures price for the closest contract is 1.4. The correlation between the futures price changes and the spot price changes is 0.7. It is now October 15. A beef producer is committed to purchasing 200,000 pounds of live cattle on November 15 and wants to use December live cattle futures contracts (40,000 pounds each) to hedge. What strategy should the beef producer follow?','h* = 0.7 × 1.2/1.4 = 0.6. Long 0.6 × 200,000/40,000 = 3 December contracts, closing out on November 15.'],

  p3_23:['A company wishes to hedge its exposure to a new fuel whose price changes have a 0.6 correlation with gasoline futures price changes. The company will lose $1 million for each 1 cent increase in the price per gallon of the new fuel over the next three months. The new fuel’s price changes have a standard deviation that is 50% greater than price changes in gasoline futures prices. What should the hedge ratio be? What is the exposure in gallons? What position in gasoline futures should be taken? How many contracts (42,000 gallons each) should be traded?','h* = 0.9; exposure = 100 million gallons; long 90 million gallons; about 2,143 contracts.'],
  p3_4:['A company has a $20 million portfolio with a beta of 1.2. The index futures price is 1,080 and each contract is for delivery of $250 times the index. What is the hedge that minimizes risk? What should the company do to reduce the beta to 0.6?','Short 89 contracts; to reduce beta to 0.6, short 44 contracts.'],
  p3_10:['“If the minimum variance hedge ratio is calculated as 1.0, the hedge must be perfect.” Is this statement true? Explain.','False. h* = 1 when, for example, ρ = 0.5 and σS = 2σF; since ρ < 1 the hedge is not perfect.'],

function applyPrefs() {

  document.body.style.setProperty('--zoom', ST.zoom || 1);

}
function stat(key, field, n = 1) { ST.stats = ST.stats || {}; const s = ST.stats[key] = ST.stats[key] || {}; s[field] = (s[field] || 0) + n; save(); }

// 兩段式確認按鈕：第一次按變成「確定？」，3 秒內再按才執行
function armed(btn, label, run) {
  let t; btn.onclick = () => {
    if (btn.dataset.armed) { clearTimeout(t); delete btn.dataset.armed; btn.textContent = label; run(); return; }
    btn.dataset.armed = 1; btn.textContent = '確定嗎？再按一次'; btn.classList.add('danger-on');
    t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; btn.classList.remove('danger-on'); }, 3000);
  };
}
