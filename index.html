      plain:'CFA 協會的會員和考生都要遵守一份「道德規範」（6 條大原則）和「專業行為準則」（7 大類、23 條細則）。違反的話可能被取消考試資格或證照。',
      life:'就像學校的校規：校訓是大原則（誠實、負責），校規細則寫清楚哪些事不能做、違反會怎樣處分。',
      body:'<h4>Code of Ethics：會員與考生必須……</h4><ol><li>以<b>誠信、能力、勤勉、尊重</b>和合乎道德的方式對待公眾、客戶、潛在客戶、雇主、員工、同事和全球資本市場的其他參與者。</li><li>把<b>投資專業的誠信</b>和<b>客戶的利益</b>放在自己的利益之上。</li><li>進行投資分析、提出建議、採取行動時，要<b>合理謹慎</b>並做出<b>獨立的專業判斷</b>。</li><li>以專業和合乎道德的方式執業，讓自己和整個專業<b>有好的名聲</b>。</li><li>推動<b>資本市場的誠信與活力</b>，造福社會。</li><li><b>維持並提升</b>自己和其他投資專業人士的專業能力。</li></ol><h4>七大準則（下面每一類都有一張卡）</h4><ul><li>I 專業精神 Professionalism（A–E）</li><li>II 資本市場誠信 Integrity of Capital Markets（A–B）</li><li>III 對客戶的責任 Duties to Clients（A–E）</li><li>IV 對雇主的責任 Duties to Employers（A–C）</li><li>V 投資分析、建議與行動 Investment Analysis, Recommendations, and Actions（A–C）</li><li>VI 利益衝突 Conflicts of Interest（A–C）</li><li>VII 會員與考生的責任 Responsibilities as a CFA Institute Member or Candidate（A–B）</li></ul><h4>Professional Conduct Program（懲戒程序）</h4><ul><li>由 Designated Officer 調查（來源：自我申報、客戶投訴、媒體、考場監考報告等）。</li><li>結果可能是：不處分、發警告信（cautionary letter）、或提出處分。被處分的人可以接受，或要求 <b>Disciplinary Review Committee</b> 聽證。</li><li>處分：公開譴責（public censure）、暫停會籍、撤銷會籍與證照；考生可能被<b>取消考試資格</b>。</li><li>會員每年要填 <b>Professional Conduct Statement</b>，申報是否有被調查或訴訟。</li></ul>',
      ex:'Members and candidates must place the integrity of the investment profession and the interests of clients above their own personal interests.' },
    { id:'xe3', t:'Standard I：專業精神（A–E）', en:'Standard I — Professionalism',
      plain:'要懂法律、保持獨立客觀、不誇大不作假、不做會損害專業名聲的事，並保持專業能力。',
      life:'當班長要知道校規、不收同學好處去偏袒、不幫自己的功勞灌水、不在外面做讓班上丟臉的事，也要真的會做班長的工作。',
      body:'<h4>I(A) Knowledge of the Law 了解法律</h4><ul><li>要遵守<b>比較嚴格</b>的那一個：法律、法規、或 CFA 準則。</li><li>知道別人違法時，<b>不能參與或協助</b>，要和這件事<b>劃清界線（dissociate）</b>：先向主管或法遵部門反映；必要時拒絕繼續做、甚至離職。</li><li>不強制要向主管機關檢舉（whistleblowing），但可能是必要的（例如法律要求）。</li><li>例：本國法律比 CFA 準則寬鬆 → 照準則；在國外執業，當地法律比較嚴 → 照當地法律。</li></ul><h4>I(B) Independence and Objectivity 獨立與客觀</h4><ul><li>不能提供、索取或接受會影響獨立判斷的禮物或好處。</li><li><b>客戶</b>給的禮物（因為過去表現好）：可以收，但要<b>告知雇主</b>。</li><li><b>發行公司、券商</b>給的：只能收價值不高的（例如普通的商務餐）。去公司參訪的機票和住宿最好<b>自己付</b>。</li><li>發行公司付費請你寫研究報告：只能收<b>固定費用</b>，不能和報告結論或股價掛鉤，並要揭露。</li><li>主管或業務部門施壓要你調高評等 → 不能照做。</li></ul><h4>I(C) Misrepresentation 不實陳述</h4><ul><li>不能故意誤導：包括誇大自己的資格、服務、績效，保證報酬（固定收益商品除外，例如保證的定存利率可說）。</li><li><b>抄襲（plagiarism）</b>：引用別人的研究要註明出處。例外：公開的事實數據（例如政府統計）可以不註明。</li><li>用第三方的研究，要說明來源；把別人的報告拿掉作者名字當成自己的 → 違反。</li></ul><h4>I(D) Misconduct 不當行為</h4><ul><li>不能做出不誠實、詐欺、欺騙的專業行為，或任何損害自己專業名聲、誠信或能力的行為。</li><li>個人私生活（例如參加抗議活動被逮捕）通常不算，除非它反映出你的誠信有問題（例如酗酒影響工作、說謊）。</li></ul><h4>I(E) Competence 專業能力</h4><ul><li>要以專業能力行事，並持續維持和提升能力。做不熟悉的業務（例如新市場、新商品）前要先學會或找專家。</li></ul>',
      ex:'When applicable law and the CFA Institute Standards differ, members and candidates must comply with the more strict requirement.' },
    { id:'xe4', t:'Standard II：資本市場誠信（A–B）', en:'Standard II — Integrity of Capital Markets',
      plain:'不能用重大非公開資訊（內線消息）交易，也不能操縱市場價格或交易量。',
      life:'考試前偷看到考卷，不只自己不能用，也不能傳給朋友；在拍賣會上找同學假裝喊價把價格炒高，也是作弊。',
      body:'<h4>II(A) Material Nonpublic Information 重大非公開資訊</h4><ul><li><b>重大（material）</b>：公開後很可能影響股價，或理性投資人會想知道。資訊越具體、越可靠，越可能是重大。</li><li><b>非公開（nonpublic）</b>：還沒有向市場廣泛公布。只告訴部分分析師的資訊仍然是非公開。</li><li>拿到 MNPI：<b>不能交易，也不能讓別人交易</b>（包括客戶、親友）。應該請公司公開資訊，並告知法遵部門。</li><li><b>馬賽克理論（mosaic theory）</b>：把公開資訊和「非重大」的非公開資訊拼起來，得出重大結論 → <b>可以</b>用，不違反。例：觀察工廠停車場的車變多，加上公開財報，推論銷售成長。</li><li>公司應建立<b>防火牆（firewall）</b>：投資銀行部和研究、交易部門隔開；設限制名單（restricted list）、觀察名單（watch list）。</li><li>只是聽到風聲（例如在電梯聽到併購消息），只要是重大且非公開，就不能用。</li></ul><h4>II(B) Market Manipulation 市場操縱</h4><ul><li><b>資訊型操縱</b>：散布假消息或謠言來影響價格（例：在網路上散布假的併購消息再賣股）。</li><li><b>交易型操縱</b>：用交易製造假的價格或交易量（例：自己跟自己對作、炒作冷門股、壟斷券源造成軋空）。</li><li>合法的避稅交易、增加流動性的正常造市不算，重點是<b>有沒有誤導市場的意圖</b>。</li></ul>',
      ex:'Under the mosaic theory, an analyst may reach a material conclusion by combining public information with nonmaterial nonpublic information without violating the Standard.' },
    { id:'xe5', t:'Standard III：對客戶的責任（A–E）', en:'Standard III — Duties to Clients',
      plain:'對客戶要忠實謹慎、公平對待每位客戶、只推薦適合的商品、誠實呈現績效、替客戶保密。',
      life:'你幫全班訂便當：要選大家能吃的（適合性）、不能先幫好朋友留最好吃的（公平）、不能謊報價格（績效呈現）、不能把誰不吃什麼到處說（保密）。',
      body:'<h4>III(A) Loyalty, Prudence, and Care 忠實、審慎與關注</h4><ul><li>客戶利益優先於雇主和自己的利益。</li><li>要搞清楚「客戶是誰」：退休基金的客戶是<b>基金的受益人</b>（員工），不是發起的公司。</li><li><b>代理投票（proxy voting）</b>：是客戶資產的一部分，要以客戶利益投票；可以做成本效益分析，不一定每一票都要投。</li><li><b>軟錢（soft dollars）</b>：用客戶的交易佣金換來的研究，必須真的對客戶有幫助（「客戶的錢只能用在客戶身上」）。要追求最佳執行（best execution）。</li></ul><h4>III(B) Fair Dealing 公平對待</h4><ul><li>提供投資建議、採取行動時，要<b>公平</b>對待所有客戶。公平不是完全相同：可以提供不同等級的服務，但要揭露，且不能傷害其他客戶。</li><li>改變推薦評等時，要讓所有客戶<b>同時</b>（或盡量同時）知道，不能先告訴大客戶。</li><li>交易分配：IPO 超額認購時要按比例分配（pro rata），<b>不能優先給自己、家人或員工</b>的帳戶。</li></ul><h4>III(C) Suitability 適合性</h4><ul><li>建立投資關係時要了解客戶：投資經驗、風險與報酬目標、限制條件，寫成<b>投資政策書（IPS）</b>，並<b>定期（至少每年）更新</b>。</li><li>建議和行動要符合客戶的整體投資組合。</li><li>客戶自己要求的不適合交易（unsolicited trade）：可以執行，但要先說明它不適合；如果明顯影響整體投組，應討論更新 IPS。</li><li>管理基金時，要按照基金<b>公開的投資策略和限制</b>（mandate）操作。</li></ul><h4>III(D) Performance Presentation 績效呈現</h4><ul><li>績效資訊要<b>公平、正確、完整</b>。不能只挑表現好的帳戶、不能拿模擬績效假裝是真的、換公司後不能把前公司的績效說成自己的（除非揭露且符合條件）。</li><li>建議遵循 GIPS，但不是強制。</li></ul><h4>III(E) Preservation of Confidentiality 保密</h4><ul><li>現任、前任和潛在客戶的資訊都要保密。</li><li>例外：資訊涉及客戶的<b>違法行為</b>、<b>法律要求</b>揭露、<b>客戶同意</b>揭露。</li><li>配合 CFA 協會 Professional Conduct Program 的調查而提供資訊 → 不違反。</li></ul>',
      ex:'When a member recommends a change in rating, all clients should be informed of the change at the same time so that no client group is disadvantaged.' },
    { id:'xe6', t:'Standard IV：對雇主的責任（A–C）', en:'Standard IV — Duties to Employers',
      plain:'工作時要為雇主的利益著想；在外面接案要先拿到書面同意；當主管要盡力防止部屬違規。',
      life:'在飲料店打工，不能偷偷把客人帶去自己朋友的店；如果有人私下付你錢叫你推銷某款飲料，要先跟老闆講；當上店長要負責教新人別出錯。',
      body:'<h4>IV(A) Loyalty 忠誠</h4><ul><li>不能做傷害雇主的事：例如洩漏機密、挖走客戶、和雇主競爭。</li><li><b>準備離職</b>：在職時可以做準備（例如找辦公室、註冊公司），但<b>不能</b>在職時招攬客戶，也<b>不能帶走</b>客戶名單、研究、模型等公司資料（包括電子檔）。</li><li>離職後：沒有競業條款時，可以聯絡前客戶，但只能用<b>公開資訊或自己記得的資訊</b>，不能用前公司的紀錄。</li><li>吹哨（whistleblowing）：為了保護客戶或市場誠信而揭發雇主違法，不違反忠誠義務。</li><li>獨立承攬人（independent contractor）也要遵守合約中的責任。</li></ul><h4>IV(B) Additional Compensation Arrangements 額外報酬</h4><ul><li>如果有人因為你的工作給你額外報酬（例如客戶說績效好就給獎金），必須先取得<b>所有相關方的書面同意</b>（通常是雇主）。</li><li>要揭露報酬的性質、金額、期間。</li></ul><h4>IV(C) Responsibilities of Supervisors 主管責任</h4><ul><li>要盡<b>合理努力</b>確保部屬遵守法律和準則。</li><li>要有合適的法遵制度；如果公司沒有足夠的制度，應<b>以書面拒絕</b>擔任主管職責，直到制度建立。</li><li>發現違規時要立即調查並採取行動（例如限制部屬的業務），不能只是口頭警告後就不管。</li></ul>',
      ex:'Members must obtain written consent from all parties involved before accepting compensation or other benefits that might create a conflict of interest with their employer.' },
    { id:'xe7', t:'Standard V：投資分析、建議與行動（A–C）', en:'Standard V — Investment Analysis, Recommendations, and Actions',
      plain:'做研究要認真、有合理依據；和客戶溝通要說清楚投資流程與風險、分清事實和意見；研究紀錄要保存。',
      life:'寫報告要有根據，不能憑感覺；跟老師報告時要說「這是數據」還是「這是我的猜測」；筆記和資料要留著，以後才能證明你怎麼得出結論。',
      body:'<h4>V(A) Diligence and Reasonable Basis 盡職與合理基礎</h4><ul><li>分析、建議、行動都要<b>勤勉、獨立、徹底</b>，並有研究支持的<b>合理且充分的基礎</b>。</li><li>用第三方研究：要先評估它的假設和方法是否可靠。</li><li>用量化模型：要了解模型的假設、限制，並測試極端情境。</li><li><b>團隊研究</b>：不同意團隊結論時，只要報告有合理基礎，可以在報告上署名；也可以要求把名字拿掉。</li><li>選外部經理人（例如委外基金）要做盡職調查。</li></ul><h4>V(B) Communication with Clients and Prospective Clients 與客戶溝通</h4><ul><li>要揭露投資流程的<b>基本原則和一般格式</b>，以及流程的重大改變。</li><li>要說明投資的<b>重大風險與限制</b>。</li><li>要用合理判斷決定哪些因素重要，並讓客戶知道。</li><li>要<b>區分事實和意見</b>（例如預測 EPS 是意見，不能說成事實）。</li></ul><h4>V(C) Record Retention 紀錄保存</h4><ul><li>要保留支持投資分析和建議的紀錄（記錄是屬於<b>公司</b>的）。</li><li>當地法規沒有規定時，CFA 協會建議至少保存 <b>7 年</b>。</li></ul>',
      ex:'Members and candidates must distinguish between fact and opinion in the presentation of investment analysis and recommendations.' },
    { id:'xe8', t:'Standard VI：利益衝突（A–C）', en:'Standard VI — Conflicts of Interest',
      plain:'可能影響獨立判斷的利益關係都要揭露；交易順序是客戶 → 雇主 → 自己；轉介費要事先告知。',
      life:'你推薦同學去某家補習班，如果補習班會給你介紹費，要先講；團購搶到限量商品，要先分給訂購的同學，自己最後拿。',
      body:'<h4>VI(A) Disclosure of Conflicts 揭露利益衝突</h4><ul><li>要向客戶、潛在客戶和雇主<b>完整、公平</b>地揭露所有可能影響獨立性的事項，並用<b>清楚易懂</b>的方式、放在顯眼的地方。</li><li>常見衝突：持有推薦公司的股票、擔任該公司董事、薪酬和業績連動、公司和發行人有投資銀行業務往來。</li><li>擔任其他公司董事 → 要告知雇主。</li></ul><h4>VI(B) Priority of Transactions 交易優先順序</h4><ul><li>順序：<b>客戶和雇主的交易優先</b>於自己（受益所有人 beneficial owner）的交易。</li><li>家人帳戶如果是付費的正常客戶 → 要和其他客戶一樣對待，不能因為是家人就延後或優先。</li><li>公司應有的制度：IPO 限制員工參與、交易前預先核准（preclearance）、封閉期（blackout period）、申報個人交易。</li></ul><h4>VI(C) Referral Fees 轉介費</h4><ul><li>因推薦商品或服務而收到或支付的任何報酬或好處，要在<b>簽約前</b>向雇主、客戶、潛在客戶揭露。</li><li>要揭露性質和估計金額（例如每介紹一位客戶得到多少）。</li></ul>',
      ex:'Investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner.' },
    { id:'xe9', t:'Standard VII：會員與考生的責任（A–B）', en:'Standard VII — Responsibilities as a CFA Institute Member or Candidate',
      plain:'不能在 CFA 考試作弊或洩題；提到 CFA 頭銜或考試時不能誇大，CFA 只能當形容詞用。',
      life:'考完不能把考題貼到網路上；也不能在名片上寫「準 CFA」或「CFA Level II」，就像還沒畢業不能自稱「醫生」。',
      body:'<h4>VII(A) Conduct as Participants in CFA Institute Programs 參與 CFA 計畫的行為</h4><ul><li>不能作弊、不能提供不實資訊、不能違反考場規則。</li><li><b>不能洩露考題內容</b>，包括考後討論具體題目、透露哪些主題考得多。可以說一般性的心得（例如「考試很難」「我讀了 300 小時」）。</li><li>可以表達對 CFA 協會、考試制度的意見或批評，這不違反。</li><li>會員要每年繳會費並提交 Professional Conduct Statement。</li></ul><h4>VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program</h4><ul><li><b>CFA 是形容詞</b>：可以說「CFA charterholder」，不能說「I am a CFA」（當名詞）。不能用 CFA 當部分頭銜（例如「CFA Level I」「CFA candidate 2028」）。</li><li>持證人在名字後寫「John Lee, CFA」→ 可以。</li><li><b>考生</b>：可以說「Level II candidate in the CFA Program」，但只有在<b>已報名、等考試</b>時才算 candidate。</li><li>通過考試：可以說「我通過了 CFA Program Level I」，不能說「我是 Level I CFA」。</li><li>可以說「一次考過三級」（如果是事實），但不能暗示這代表能力比別人強或投資績效較好。</li><li>停止繳會費或沒交 PCS → 不能再使用 CFA 頭銜。</li></ul>',
      ex:'The CFA designation must always be used as an adjective, never as a noun or an abbreviation; a candidate cannot use a partial designation such as “CFA Level II.”' },
    { id:'xe10', t:'全球投資績效標準 GIPS', en:'Introduction to the Global Investment Performance Standards (GIPS)',
      plain:'GIPS 是一套全球統一的績效計算和呈現規則，讓投資人可以公平比較不同資產管理公司的績效。',
      life:'每家補習班都說自己「上榜率 90%」，但算法都不一樣。GIPS 就像規定大家都要用同一套公式、同一種統計範圍，才能比較。',
      body:'<ul><li><b>目的</b>：公平呈現、完整揭露，避免挑好的帳戶（cherry-picking）或只報好的期間。</li><li><b>誰可以聲明遵循</b>：只有<b>公司（firm）</b>可以，個人、單一商品不能單獨聲明。資產擁有者（asset owner，例如退休基金）也可以採用。</li><li>必須<b>全公司</b>都遵循，不能只有部分部門。</li><li><b>組合（composite）</b>：把投資目標或策略相同的投資組合合在一起計算績效。所有<b>實際、付費、全權委託（discretionary）</b>的投資組合都要歸入至少一個 composite。不能事後把表現差的帳戶拿掉。</li><li>剛開始遵循時，至少要呈現 <b>5 年</b>（或成立以來未滿 5 年的全部期間）符合 GIPS 的績效，之後每年增加，直到至少 10 年。</li><li><b>驗證（verification）</b>：由獨立第三方檢查整家公司的 composite 建立與計算流程。<b>不是強制</b>，但建議做；驗證是針對整家公司，不是單一 composite。</li><li>聲明用語要照規定：「[Firm] claims compliance with the Global Investment Performance Standards (GIPS®)…」不能說「部分遵循」。</li><li>GIPS 是自願的，但遵循就要全部遵循；如果當地法律和 GIPS 衝突，要遵守法律並揭露衝突。</li></ul>',
      ex:'Only investment management firms and asset owners, not individuals or single products, can claim compliance with the GIPS standards, and compliance must be on a firm-wide basis.' },
    { id:'xe11', t:'道德題怎麼解：應用技巧', en:'Ethics Application',
      plain:'道德題通常是一段情境，問「有沒有違反」或「違反哪一條」。要先找出誰的利益受影響，再對應準則。',
      life:'就像看裁判判決：先看發生了什麼事，再看規則書哪一條適用，最後判斷有沒有犯規。',
      body:'<ol><li><b>找角色</b>：題目裡誰是會員或考生？誰是客戶、雇主？</li><li><b>找利益衝突</b>：誰可能吃虧？客戶 → III；雇主 → IV；市場 → II；CFA 頭銜 → VII。</li><li><b>對應條文</b>：用關鍵字找。<ul><li>禮物、招待、壓力 → I(B)</li><li>抄襲、保證報酬、誇大 → I(C)</li><li>內線、謠言 → II</li><li>IPO 分配、評等變更通知 → III(B)</li><li>IPS、不適合的交易 → III(C)</li><li>帶走客戶名單、外部兼差 → IV(A)、IV(B)</li><li>沒有研究依據就推薦 → V(A)</li><li>沒揭露持股或董事職位 → VI(A)</li><li>員工先買、客戶後買 → VI(B)</li></ul></li><li><b>選「最好」的做法</b>：選項常有三種：完全不揭露（違反）、揭露一部分（可能還是違反）、完整揭露或拒絕（正確）。</li></ol><h4>常見陷阱</h4><ul><li>「沒造成損失」不代表沒違反：準則看的是<b>行為</b>，不是結果。</li><li>「公司要求的」不是理由：主管叫你做違規的事，你還是違反。</li><li>「別人都這樣做」也不是理由。</li><li>揭露了不一定就沒事：有些行為（例如用內線交易）揭露了也還是違反。</li></ul>',
      ex:'A violation of the Standards may occur even when no client suffers a financial loss, because the Standards focus on the member’s conduct rather than on the outcome.' }
  ]},
  { id:'x-quant', t:'2. 計量方法 Quantitative Methods（6–9%）', cards: [
    { id:'xq1', t:'報酬率：利率的組成與各種報酬的算法', en:'Rates and Returns', pre:['bret','bannual'],
      plain:'利率可以拆成「無風險實質利率」加上各種補償（通膨、違約、流動性、到期期限）。報酬率有很多種算法：算術平均、幾何平均、金額加權、時間加權……要知道什麼時候用哪一種。',
      life:'借錢給不熟的人，你會要求比較高的利息：因為怕他不還（違約）、怕錢要等很久（期限）、怕這段期間物價漲（通膨）。',
      body:'<h4>利率的組成</h4><p class="formula">利率 = 實質無風險利率 + 通膨溢酬 + 違約風險溢酬 + 流動性溢酬 + 到期期限溢酬</p><ul><li>實質無風險利率 + 通膨溢酬 ≈ <b>名目無風險利率</b>（例如短期國庫券利率）。</li><li>精確關係：(1 + 名目) = (1 + 實質) × (1 + 通膨)。</li></ul><h4>持有期間報酬 HPR</h4><p class="formula">HPR = (P<sub>1</sub> − P<sub>0</sub> + D<sub>1</sub>) ÷ P<sub>0</sub></p><p>多期：(1 + R) = (1 + R<sub>1</sub>)(1 + R<sub>2</sub>)…(1 + R<sub>n</sub>)</p><h4>三種平均</h4><ul><li><b>算術平均</b>：(R<sub>1</sub> + … + R<sub>n</sub>) ÷ n。適合估計<b>下一期</b>的期望報酬。</li><li><b>幾何平均</b>：[(1 + R<sub>1</sub>)…(1 + R<sub>n</sub>)]<sup>1/n</sup> − 1。代表<b>多期的實際複合成長率</b>。幾何 ≤ 算術，波動越大差越多。</li><li><b>調和平均</b>：n ÷ Σ(1/X<sub>i</sub>)。用在<b>定期定額</b>算平均買入成本。調和 ≤ 幾何 ≤ 算術。</li><li>例：+50%、−50% → 算術平均 0%，幾何平均 √(1.5 × 0.5) − 1 = −13.4%（真的賠錢了）。</li></ul><h4>金額加權 vs 時間加權</h4><ul><li><b>金額加權報酬 MWR</b>：就是投資人現金流的 <b>IRR</b>。會受到「什麼時候加碼、減碼」影響 → 反映<b>投資人</b>的實際報酬。</li><li><b>時間加權報酬 TWR</b>：每次有現金流進出就切一段，算每段的 HPR，再用幾何連結。<b>不受現金流時點影響</b> → 適合評估<b>基金經理人</b>（因為經理人無法控制客戶何時加減碼）。</li><li>如果在績效好的期間前加碼，MWR &gt; TWR。</li></ul><h4>其他報酬</h4><ul><li><b>年化</b>：R<sub>年</sub> = (1 + R<sub>期</sub>)<sup>c</sup> − 1，c = 一年有幾期。例：週報酬 0.2% → (1.002)<sup>52</sup> − 1 = 10.95%。</li><li><b>連續複利報酬</b>：r = ln(1 + HPR)。多期連續複利報酬可以<b>直接相加</b>。</li><li><b>毛報酬 vs 淨報酬</b>：毛報酬扣交易成本、未扣管理費；淨報酬扣掉所有費用。</li><li><b>稅前 vs 稅後</b>、<b>名目 vs 實質</b>報酬。</li><li><b>槓桿報酬</b>：R<sub>L</sub> = R + (V<sub>B</sub>/V<sub>E</sub>)(R − r<sub>D</sub>)，借來的錢 V<sub>B</sub>、自有資金 V<sub>E</sub>、借款利率 r<sub>D</sub>。</li></ul>',
      ex:'The time-weighted rate of return is not affected by the timing of external cash flows, so it is the preferred measure for evaluating a portfolio manager.' },
    { id:'xq2', t:'貨幣時間價值：債券、股票、年金都是折現', en:'The Time Value of Money in Finance', pre:['bpv','bint'],
      plain:'所有金融商品的價格，都是「未來現金流折現回今天」的總和。只要會畫現金流時間軸、會折現，就能算債券、股票、貸款。',
      life:'房貸每個月繳固定金額，就是一個年金；銀行算你能借多少，就是把你未來每個月繳的錢折現加總。',
      body:'<h4>基本公式</h4><p class="formula">FV = PV × (1 + r)<sup>N</sup>　　PV = FV ÷ (1 + r)<sup>N</sup></p><ul><li><b>有效年利率 EAR</b> = (1 + 名目利率/m)<sup>m</sup> − 1；連續複利 EAR = e<sup>r</sup> − 1。</li><li>普通年金（ordinary annuity）：每期<b>期末</b>付款；期初年金（annuity due）：<b>期初</b>付款，PV = 普通年金 PV × (1 + r)。</li><li>普通年金 PV = A × [1 − (1 + r)<sup>−N</sup>] ÷ r。</li><li><b>永續年金</b> PV = A ÷ r；<b>成長永續年金</b> PV = A<sub>1</sub> ÷ (r − g)。</li></ul><h4>固定收益商品</h4><ul><li><b>折價（零息）債券</b>：只在到期付面額，PV = FV ÷ (1 + r)<sup>N</sup>。</li><li><b>附息債券</b>：PV = Σ 票息 ÷ (1 + r)<sup>t</sup> + 面額 ÷ (1 + r)<sup>N</sup>。市場利率 &gt; 票面利率 → 折價；&lt; → 溢價。</li><li><b>攤還貸款</b>：每期付相同金額，前期利息多、本金少，後期相反。</li><li>負利率時零息債價格會高於面額。</li></ul><h4>股票</h4><ul><li>固定股利（特別股）：V = D ÷ r。</li><li>固定成長（Gordon）：V<sub>0</sub> = D<sub>1</sub> ÷ (r − g)，要求 r &gt; g。</li><li>兩階段成長：前幾年高成長逐年折現，之後用 Gordon 算「終值」再折回今天。</li><li><b>隱含報酬和成長率</b>：r = D<sub>1</sub>/P<sub>0</sub> + g；g = r − D<sub>1</sub>/P<sub>0</sub>。</li></ul><h4>現金流可加性與無套利</h4><ul><li>同一時間點的現金流可以相加，不同時間要先折到同一點。</li><li>即期利率與遠期利率：(1 + S<sub>2</sub>)<sup>2</sup> = (1 + S<sub>1</sub>)(1 + F<sub>1,1</sub>)，否則有套利機會。</li><li>匯率遠期：F = S × (1 + i<sub>報價貨幣</sub>) ÷ (1 + i<sub>基準貨幣</sub>)。</li></ul><h4>計算機（BA II Plus）</h4><ul><li>N、I/Y、PV、PMT、FV 輸入四個求第五個；記得<b>現金流出入正負號要相反</b>。</li><li>期初年金：2ND → BGN。每年付款次數 P/Y 建議固定設 1，自己換算每期利率。</li><li>不規則現金流用 CF 鍵，再按 NPV（輸入 I）或 IRR。</li></ul>',
      ex:'The value of any financial instrument equals the present value of its expected future cash flows discounted at an appropriate market discount rate.' },
    { id:'xq3', t:'敘述統計：集中趨勢、離散程度、偏態、峰態', en:'Statistical Measures of Asset Returns', pre:['bmean','bsd'],
      plain:'要描述一堆報酬資料，要看「中心在哪」（平均、中位數）、「散得多開」（標準差）、「歪不歪」（偏態）、「尾巴胖不胖」（峰態）。',
      life:'全班考試成績：平均 70 分（中心）；有人 30 有人 100（散開）；大部分人考高、少數人考很爛 → 左偏；極端高分低分特別多 → 肥尾。',
      body:'<h4>集中趨勢</h4><ul><li><b>平均數</b>：受極端值影響大。<b>中位數</b>：排序後中間那個，不受極端值影響。<b>眾數</b>：出現最多次。</li><li>處理極端值：<b>截尾平均</b>（trimmed mean，去掉頭尾各 x%）、<b>縮尾平均</b>（winsorized mean，把頭尾的值換成第 x 百分位的值）。</li></ul><h4>分位數 Quantiles</h4><p class="formula">第 y 百分位的位置 L<sub>y</sub> = (n + 1) × y ÷ 100</p><ul><li>四分位數（quartile）、五分位數（quintile）、十分位數（decile）。四分位距 IQR = Q3 − Q1。</li><li>箱型圖（box and whisker plot）用來看分布和極端值。</li></ul><h4>離散程度</h4><ul><li><b>全距</b> = 最大 − 最小。</li><li><b>平均絕對離差 MAD</b> = Σ|X<sub>i</sub> − X̄| ÷ n。</li><li><b>樣本變異數</b> s² = Σ(X<sub>i</sub> − X̄)² ÷ (<b>n − 1</b>)；樣本標準差 s = √s²。分母用 n − 1 是為了讓估計不偏。</li><li><b>目標下方差</b>（target semideviation）：只算低於目標報酬 B 的觀察值：√[Σ<sub>X≤B</sub>(X<sub>i</sub> − B)² ÷ (n − 1)]。衡量下檔風險。</li><li><b>變異係數 CV</b> = s ÷ X̄：每單位報酬承擔多少風險，用來比較不同規模的資料，<b>越低越好</b>。</li></ul><h4>偏態 Skewness</h4><ul><li><b>正偏（右偏）</b>：右邊尾巴長，有少數很大的正報酬。平均 &gt; 中位數 &gt; 眾數。</li><li><b>負偏（左偏）</b>：左邊尾巴長，有少數很大的虧損。平均 &lt; 中位數 &lt; 眾數。投資人通常<b>喜歡正偏</b>、討厭負偏。</li><li>常態分布偏態 = 0。</li></ul><h4>峰態 Kurtosis</h4><ul><li>常態分布峰態 = 3；<b>超額峰態</b> = 峰態 − 3。</li><li>超額峰態 &gt; 0：<b>高狹峰（leptokurtic）、肥尾</b>，極端事件比常態分布預期的多。大部分資產報酬都是這樣 → 用常態分布會<b>低估</b>風險。</li><li>超額峰態 &lt; 0：低闊峰（platykurtic）、瘦尾。</li></ul><h4>相關性</h4><ul><li>樣本共變異數 s<sub>XY</sub> = Σ(X − X̄)(Y − Ȳ) ÷ (n − 1)；相關係數 r = s<sub>XY</sub> ÷ (s<sub>X</sub> s<sub>Y</sub>)，介於 −1 和 +1。</li><li>用<b>散布圖</b>看兩個變數的關係。</li><li>限制：只衡量<b>線性</b>關係；受極端值影響；<b>相關不等於因果</b>；可能是<b>虛假相關</b>（spurious correlation），例如兩者都受第三個變數影響。</li></ul>',
      ex:'A distribution with positive excess kurtosis has fatter tails than the normal distribution, so using a normal distribution would underestimate the probability of extreme returns.' },
    { id:'xq4', t:'機率樹、條件期望值與貝氏定理', en:'Probability Trees and Conditional Expectations',
      plain:'用「樹狀圖」把各種情境和機率列出來，就能算期望值；有新資訊時，用貝氏定理更新原本的機率判斷。',
      life:'天氣預報說明天 70% 會下雨。早上起床看到烏雲密布，你會覺得下雨的機率更高了 → 這就是用新資訊更新機率（貝氏）。',
      body:'<h4>期望值與變異數</h4><p class="formula">E(X) = Σ P(x<sub>i</sub>) × x<sub>i</sub>　　σ² = Σ P(x<sub>i</sub>) × [x<sub>i</sub> − E(X)]²</p><h4>機率規則</h4><ul><li><b>乘法</b>：P(AB) = P(A | B) × P(B)。若獨立：P(AB) = P(A) × P(B)。</li><li><b>加法</b>：P(A 或 B) = P(A) + P(B) − P(AB)。互斥時 P(AB) = 0。</li><li><b>全機率法則</b>：P(A) = P(A | S<sub>1</sub>)P(S<sub>1</sub>) + P(A | S<sub>2</sub>)P(S<sub>2</sub>) + …（S 是互斥且完整的情境）。</li><li><b>勝算（odds）</b>：事件 E 發生的勝算 = P(E) ÷ [1 − P(E)]。</li></ul><h4>條件期望值與機率樹</h4><ul><li>E(X | S)：在情境 S 發生時，X 的期望值。</li><li><b>全期望值法則</b>：E(X) = E(X | S<sub>1</sub>)P(S<sub>1</sub>) + E(X | S<sub>2</sub>)P(S<sub>2</sub>) + …</li><li>機率樹：第一層分情境（例如景氣好／壞），第二層分結果（例如 EPS 高／低）。每條路徑的機率 = 沿路機率相乘。</li></ul><h4>貝氏定理 Bayes’ formula</h4><p class="formula">P(事件 | 新資訊) = P(新資訊 | 事件) × P(事件) ÷ P(新資訊)</p><ul><li>P(事件)：<b>事前機率</b>（prior）；P(事件 | 新資訊)：<b>事後機率</b>（posterior）。</li><li>分母 P(新資訊) 用全機率法則算。</li><li>例：公司有 60% 機率會擴張。擴張的公司有 70% 會提前開記者會，不擴張的只有 20%。看到開記者會，擴張的機率 = 0.7 × 0.6 ÷ (0.7 × 0.6 + 0.2 × 0.4) = 0.42 ÷ 0.50 = <b>84%</b>。</li></ul>',
      ex:'Bayes’ formula updates a prior probability for an event in response to new information to obtain a posterior probability.' },
    { id:'xq5', t:'投資組合數學與安全第一比率', en:'Portfolio Mathematics', pre:['bcorr','bdiv'],
      plain:'投資組合的期望報酬是各資產報酬的加權平均；但風險不是加權平均，因為資產之間會互相抵銷。相關性越低，分散效果越好。',
      life:'同時賣雨傘和防曬乳：下雨天雨傘賣得好、晴天防曬乳賣得好，合起來每天的營收就比較穩定。',
      body:'<h4>兩資產投資組合</h4><p class="formula">E(R<sub>p</sub>) = w<sub>1</sub>E(R<sub>1</sub>) + w<sub>2</sub>E(R<sub>2</sub>)</p><p class="formula">σ<sub>p</sub>² = w<sub>1</sub>²σ<sub>1</sub>² + w<sub>2</sub>²σ<sub>2</sub>² + 2w<sub>1</sub>w<sub>2</sub>ρ<sub>12</sub>σ<sub>1</sub>σ<sub>2</sub></p><ul><li>Cov(R<sub>1</sub>, R<sub>2</sub>) = ρ<sub>12</sub>σ<sub>1</sub>σ<sub>2</sub>。</li><li>只要 ρ &lt; +1，組合的標準差就<b>小於</b>個別標準差的加權平均 → 分散投資的好處。ρ = −1 時可以組出零風險的組合。</li><li>N 個資產：要算 N(N − 1)/2 個共變異數。</li></ul><h4>用聯合機率算共變異數</h4><p class="formula">Cov(R<sub>A</sub>, R<sub>B</sub>) = Σ P(s) × [R<sub>A,s</sub> − E(R<sub>A</sub>)] × [R<sub>B,s</sub> − E(R<sub>B</sub>)]</p><h4>常態分布的重要數字</h4><ul><li>約 68% 落在平均 ±1σ；90% 在 ±1.645σ；95% 在 ±1.96σ；99% 在 ±2.58σ。</li><li>標準化：z = (X − μ) ÷ σ。</li></ul><h4>安全第一比率 Roy’s safety-first ratio</h4><p class="formula">SFRatio = [E(R<sub>p</sub>) − R<sub>L</sub>] ÷ σ<sub>p</sub></p><ul><li>R<sub>L</sub> 是投資人「最低可接受報酬」（shortfall level）。</li><li>選 <b>SFRatio 最高</b>的組合，因為它跌破 R<sub>L</sub> 的機率最低（假設常態分布）。</li><li>跌破的機率 = N(−SFRatio)。</li><li>R<sub>L</sub> = 無風險利率時，SFRatio 就是 Sharpe ratio。</li></ul>',
      ex:'As long as the correlation between two assets is less than +1, the portfolio standard deviation is less than the weighted average of the individual standard deviations.' },
    { id:'xq6', t:'模擬方法：對數常態、蒙地卡羅、拔靴法', en:'Simulation Methods',
      plain:'股價不會變負的，所以常用「對數常態分布」描述。真實世界太複雜算不出公式時，就用電腦模擬幾千次，看結果的分布。',
      life:'你想知道「每天搭公車上學會不會遲到」，可以模擬幾千天：每天的塞車時間隨機抽，最後看有幾天遲到。',
      body:'<h4>對數常態分布 Lognormal</h4><ul><li>如果 ln(X) 是常態分布，X 就是對數常態分布。<b>只有正值、右偏</b>。</li><li>連續複利報酬是常態 → 價格是對數常態，正好符合「價格不會小於 0」。</li><li>連續複利報酬 r = ln(P<sub>1</sub>/P<sub>0</sub>) = ln(1 + HPR)，多期可以相加：r<sub>0,T</sub> = r<sub>1</sub> + r<sub>2</sub> + … + r<sub>T</sub>。</li><li>若每期報酬獨立同分布（i.i.d.）：T 期報酬的平均 = Tμ，變異數 = Tσ² → 標準差隨 √T 增加（波動度年化用 √T）。</li></ul><h4>蒙地卡羅模擬 Monte Carlo</h4><ol><li>設定要模擬的變數（例如股價）和時間範圍。</li><li>指定風險因子的機率分布和參數。</li><li>用亂數產生器抽出每個風險因子的值。</li><li>算出這次模擬的結果（例如選擇權價值）。</li><li>重複幾千次，看結果的平均、分布。</li></ol><ul><li>優點：能處理複雜的商品（例如路徑相依的選擇權）、可以做敏感度分析。</li><li>缺點：結果取決於假設的分布（垃圾進、垃圾出）；不像公式能看出變數之間的因果關係。</li></ul><h4>歷史模擬與拔靴法 Bootstrap</h4><ul><li><b>歷史模擬</b>：直接用過去真實發生的變化抽樣。假設未來會像過去，但無法模擬沒發生過的情境。</li><li><b>拔靴法（bootstrapping）</b>：從觀察到的樣本中<b>抽出後放回</b>，重複抽樣很多次，用來估計統計量的分布（例如標準誤）。不需要假設母體分布。</li><li>拔靴法 vs 刀切法（jackknife）：刀切法是每次<b>拿掉一個</b>觀察值、不放回。</li></ul>',
      ex:'If continuously compounded returns are normally distributed, then asset prices are lognormally distributed, which is consistent with prices being bounded below by zero.' },
    { id:'xq7', t:'抽樣與估計：中央極限定理、信賴區間', en:'Estimation and Inference',
      plain:'我們通常拿不到整個母體的資料，只能抽樣。中央極限定理告訴我們：樣本夠大時，樣本平均數會接近常態分布，所以可以算信賴區間。',
      life:'想知道全台灣大學生平均每月花多少錢，不可能問每一個人，只能隨機問 1,000 人，再推估全體大概在哪個範圍。',
      body:'<h4>抽樣方法</h4><ul><li><b>機率抽樣</b>：<ul><li>簡單隨機抽樣：每個人被抽到的機率相同。</li><li><b>分層隨機抽樣</b>（stratified）：先依特徵分層（例如債券依到期日、評等），每層按比例抽。債券指數複製常用。</li><li>群集抽樣（cluster）：把母體分成很多群，隨機抽幾群（一階段：整群都要；二階段：群內再抽）。比較省錢但較不精確。</li></ul></li><li><b>非機率抽樣</b>：便利抽樣（convenience）、判斷抽樣（judgmental，靠專家挑）。快但可能有偏誤。</li><li><b>抽樣誤差</b> = 樣本統計量 − 母體參數。</li></ul><h4>中央極限定理 CLT</h4><ul><li>不論母體是什麼分布，只要樣本數夠大（一般 <b>n ≥ 30</b>），樣本平均數的分布會接近<b>常態分布</b>。</li><li>樣本平均數的平均 = 母體平均 μ；變異數 = σ² ÷ n。</li></ul><p class="formula">標準誤 SE = σ ÷ √n（σ 未知時用 s ÷ √n）</p><ul><li>n 越大，標準誤越小，估計越精確。</li></ul><h4>點估計與信賴區間</h4><ul><li>好的估計量：<b>不偏</b>（期望值 = 參數）、<b>有效</b>（變異最小）、<b>一致</b>（n 越大越接近真值）。</li><li>信賴區間 = 點估計 ± 信賴係數 × 標準誤。</li><li>常用 z 值：90% → 1.645；95% → 1.96；99% → 2.58。</li><li>母體變異數未知、樣本小：用 <b>t 分布</b>（自由度 n − 1，尾巴比常態胖）。</li></ul><h4>重抽樣 Resampling</h4><ul><li>拔靴法、刀切法可以在沒有公式時估計標準誤和信賴區間。</li></ul><h4>抽樣偏誤</h4><ul><li><b>資料探勘偏誤</b>（data snooping）：反覆測試同一份資料，總會找到「顯著」的規律。</li><li><b>樣本選擇偏誤</b>：例如<b>存活者偏誤</b>（只看還存在的基金，績效被高估）。</li><li><b>前視偏誤</b>（look-ahead）：用了當時還拿不到的資料。</li><li><b>時間區間偏誤</b>：結果只在某段期間成立。</li></ul>',
      ex:'According to the central limit theorem, the sampling distribution of the sample mean is approximately normal for large samples, regardless of the population distribution.' },
    { id:'xq8', t:'假設檢定：步驟、兩種錯誤、常用檢定', en:'Hypothesis Testing',
      plain:'假設檢定是用樣本資料判斷「某個說法是否站得住腳」。先假設它是真的（虛無假設），如果資料和它差太多，就拒絕它。',
      life:'法庭審判：先假設被告無罪（虛無假設），證據夠強才判有罪（拒絕虛無假設）。冤枉好人是型一錯誤，放走壞人是型二錯誤。',
      body:'<h4>步驟</h4><ol><li>寫出假設：<b>虛無假設 H<sub>0</sub></b>（一定包含等號，例如 μ = 0、μ ≤ 0）和<b>對立假設 H<sub>a</sub></b>（你想證明的）。</li><li>選檢定統計量。</li><li>決定顯著水準 α（例如 5%）。</li><li>寫出決策規則（臨界值）。</li><li>算統計量、做決策。</li></ol><ul><li>雙尾：H<sub>0</sub>: μ = μ<sub>0</sub>；單尾：H<sub>0</sub>: μ ≤ μ<sub>0</sub> vs H<sub>a</sub>: μ &gt; μ<sub>0</sub>。</li><li>5% 顯著水準臨界 z 值：雙尾 ±1.96；單尾 1.645。1%：雙尾 ±2.58；單尾 2.33。</li></ul><p class="formula">檢定統計量 = (樣本統計量 − 假設值) ÷ 標準誤</p><h4>兩種錯誤</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>H<sub>0</sub> 為真</th><th>H<sub>0</sub> 為假</th></tr><tr><td>拒絕 H<sub>0</sub></td><td><b>型一錯誤</b>（機率 α）</td><td>正確（機率 = 檢定力 1 − β）</td></tr><tr><td>不拒絕 H<sub>0</sub></td><td>正確</td><td><b>型二錯誤</b>（機率 β）</td></tr></table></div><ul><li>降低 α 會增加 β；要同時降低兩者只能<b>增加樣本數</b>。</li><li><b>p 值</b>：在 H<sub>0</sub> 為真時，看到這麼極端結果的機率；也就是<b>能拒絕 H<sub>0</sub> 的最小顯著水準</b>。p 值 &lt; α → 拒絕。</li><li>「不拒絕」不等於「接受」H<sub>0</sub>。</li><li><b>統計顯著不一定有經濟意義</b>：扣掉交易成本、稅之後可能不賺錢。</li><li>多重檢定問題：測試很多假設時，有些會碰巧顯著 → 可用 Benjamini–Hochberg 等方法調整 p 值。</li></ul><h4>常用檢定</h4><div class="tblwrap"><table class="tbl"><tr><th>檢定什麼</th><th>統計量</th><th>自由度</th></tr><tr><td>單一平均數</td><td>t = (X̄ − μ<sub>0</sub>) ÷ (s/√n)</td><td>n − 1</td></tr><tr><td>兩個獨立樣本的平均數差</td><td>t（合併變異數）</td><td>n<sub>1</sub> + n<sub>2</sub> − 2</td></tr><tr><td>成對樣本平均差（不獨立，例如同一時期兩個策略）</td><td>t = d̄ ÷ s<sub>d̄</sub></td><td>n − 1</td></tr><tr><td>單一變異數</td><td>χ² = (n − 1)s² ÷ σ<sub>0</sub>²</td><td>n − 1</td></tr><tr><td>兩個變異數是否相等</td><td>F = s<sub>1</sub>² ÷ s<sub>2</sub>²（大的放分子）</td><td>n<sub>1</sub> − 1, n<sub>2</sub> − 1</td></tr></table></div><ul><li>χ² 和 F 分布都是<b>非負、右偏</b>的。</li></ul>',
      ex:'The p-value is the smallest level of significance at which the null hypothesis can be rejected; if the p-value is less than the significance level, we reject the null.' },
    { id:'xq9', t:'母數與無母數檢定、獨立性檢定', en:'Parametric and Non-Parametric Tests of Independence',
      plain:'母數檢定要假設資料符合某種分布（例如常態）；資料有極端值、只有排名或分類時，就改用不需要這些假設的無母數檢定。',
      life:'比較兩個班的成績，如果只知道「名次」而不知道分數，就只能用排名來比 → 無母數方法。',
      body:'<h4>什麼時候用無母數檢定</h4><ul><li>資料不符合分布假設（例如嚴重偏態、樣本小）。</li><li>有很多極端值。</li><li>資料是<b>排名（順序）</b>或<b>類別</b>。</li><li>要檢定的不是參數（例如「資料是否隨機」）。</li></ul><h4>相關係數的檢定（母數）</h4><p class="formula">t = r√(n − 2) ÷ √(1 − r²)，自由度 n − 2</p><ul><li>H<sub>0</sub>: ρ = 0。樣本越大，同樣的 r 越容易顯著。</li></ul><h4>Spearman 等級相關（無母數）</h4><ul><li>先把兩組資料各自排名，再算排名之間的相關係數：r<sub>S</sub> = 1 − 6Σd<sub>i</sub>² ÷ [n(n² − 1)]，d = 兩個排名的差。</li><li>大樣本（n &gt; 30）時一樣用上面的 t 統計量檢定。</li><li>不受極端值影響。</li></ul><h4>卡方獨立性檢定（列聯表）</h4><ul><li>檢定兩個<b>類別變數</b>是否獨立。例：基金規模（大／中／小）和投資風格（價值／成長）有沒有關係。</li><li>每格期望次數 E<sub>ij</sub> = 列合計 × 行合計 ÷ 總數。</li></ul><p class="formula">χ² = Σ (O<sub>ij</sub> − E<sub>ij</sub>)² ÷ E<sub>ij</sub>，自由度 = (r − 1)(c − 1)</p><ul><li>χ² 越大，觀察值和「如果獨立」的預期差越多 → 拒絕獨立。這是<b>右尾</b>檢定。</li></ul>',
      ex:'A nonparametric test is appropriate when the data are ranks or when the assumptions of a parametric test, such as normality, are not met.' },
    { id:'xq10', t:'簡單線性迴歸', en:'Simple Linear Regression',
      plain:'用一個變數 X 去解釋另一個變數 Y，找一條「最貼近所有點」的直線。斜率告訴你 X 變動 1 單位，Y 平均變動多少。',
      life:'讀書時數（X）和考試分數（Y）畫在圖上，找出一條線：多讀 1 小時大約多 3 分 → 斜率 = 3。',
      body:'<h4>模型</h4><p class="formula">Y<sub>i</sub> = b<sub>0</sub> + b<sub>1</sub>X<sub>i</sub> + ε<sub>i</sub></p><ul><li>Y：被解釋變數（dependent）；X：解釋變數（independent）；b<sub>0</sub> 截距、b<sub>1</sub> 斜率；ε 誤差項。</li><li><b>最小平方法 OLS</b>：讓殘差平方和（SSE）最小。</li></ul><p class="formula">b̂<sub>1</sub> = Cov(X, Y) ÷ Var(X)　　b̂<sub>0</sub> = Ȳ − b̂<sub>1</sub>X̄</p><h4>四個假設</h4><ol><li><b>線性</b>：X 和 Y 是線性關係。</li><li><b>同質變異</b>（homoskedasticity）：每個觀察值的誤差變異數相同。</li><li><b>獨立</b>：誤差項彼此不相關（時間序列常違反 → 自我相關）。</li><li><b>常態</b>：誤差項服從常態分布。</li></ol><p>用殘差圖檢查：殘差應該沒有規律地散在 0 附近。</p><h4>變異數分析 ANOVA</h4><ul><li>SST（總變異）= SSR（迴歸解釋的）+ SSE（沒解釋的）。</li><li><b>R² = SSR ÷ SST</b>：Y 的變異有多少比例被 X 解釋。簡單迴歸中 R² = r²。</li><li>MSR = SSR ÷ 1；MSE = SSE ÷ (n − 2)。</li><li><b>F = MSR ÷ MSE</b>（自由度 1, n − 2）：檢定斜率是否為 0。簡單迴歸時 F = t²。</li><li><b>估計標準誤 SEE = √MSE</b>：越小代表配適越好。</li></ul><h4>斜率檢定與預測</h4><ul><li>t = (b̂<sub>1</sub> − B<sub>1</sub>) ÷ s<sub>b̂1</sub>，自由度 n − 2。</li><li>預測值 Ŷ = b̂<sub>0</sub> + b̂<sub>1</sub>X<sub>f</sub>；預測區間 = Ŷ ± t<sub>c</sub> × s<sub>f</sub>。X<sub>f</sub> 離 X̄ 越遠，預測區間越寬。</li></ul><h4>函數形式</h4><ul><li><b>log-lin</b>：ln Y = b<sub>0</sub> + b<sub>1</sub>X（Y 以固定比率成長）。</li><li><b>lin-log</b>：Y = b<sub>0</sub> + b<sub>1</sub>ln X。</li><li><b>log-log</b>：ln Y = b<sub>0</sub> + b<sub>1</sub>ln X，b<sub>1</sub> 就是<b>彈性</b>（X 變 1%，Y 變 b<sub>1</sub>%）。</li></ul>',
      ex:'The coefficient of determination (R²) measures the fraction of the total variation in the dependent variable that is explained by the independent variable.' },
    { id:'xq11', t:'大數據、人工智慧與機器學習入門', en:'Introduction to Big Data Techniques',
      plain:'大數據是又多、又快、又雜的資料。機器學習讓電腦自己從資料中找規律，分成「有標準答案」的監督式學習和「沒有標準答案」的非監督式學習。',
      life:'監督式學習像老師給你一堆考古題和答案，叫你學會解題；非監督式學習像給你一堆照片，叫你自己分成幾類。',
      body:'<h4>大數據的特徵</h4><ul><li><b>Volume</b> 量大、<b>Velocity</b> 速度快、<b>Variety</b> 種類多（結構化、半結構化、非結構化）、<b>Veracity</b> 可信度（雜訊、錯誤）。</li><li>來源：傳統（財報、交易資料）和<b>另類資料</b>（衛星影像、信用卡交易、社群媒體、感測器）。</li><li>結構化資料：表格；非結構化：文字、影像、聲音。</li></ul><h4>人工智慧與機器學習</h4><ul><li><b>監督式學習</b>（supervised）：資料有標籤（答案）。<ul><li>迴歸（預測數值，例如股價）。</li><li>分類（預測類別，例如會不會違約）。</li></ul></li><li><b>非監督式學習</b>（unsupervised）：沒有標籤。<ul><li><b>分群</b>（clustering，例如把股票依特性分組）。</li><li><b>降維</b>（dimension reduction，例如主成分分析 PCA）。</li></ul></li><li><b>深度學習</b>：多層的類神經網路，用在影像、語音辨識。</li><li><b>強化學習</b>：透過試錯和獎勵來學習。</li></ul><h4>模型問題</h4><ul><li><b>過度配適</b>（overfitting）：把雜訊也學進去，訓練資料表現很好，新資料很差。</li><li><b>配適不足</b>（underfitting）：模型太簡單，抓不到規律。</li><li>資料切成<b>訓練集</b>、<b>驗證集</b>、<b>測試集</b>，用沒看過的資料評估模型。</li></ul><h4>應用</h4><ul><li>自然語言處理 NLP：分析財報、新聞、電話會議的語氣。</li><li>文字探勘、情緒分析、詐欺偵測、演算法交易、機器人理財。</li><li>風險：資料品質、模型是黑盒子難解釋、偏誤。</li></ul>',
      ex:'Overfitting occurs when a model learns the noise in the training data, so it performs well in-sample but poorly on new data.' }
  ]}
  ]
};
// ===== CFA Level I 完整筆記（2/4）：經濟學、公司理財、財務報表分析 =====
DATA.cfa.sections.push(
  { id:'x-econ', t:'3. 經濟學 Economics（6–9%）', cards: [
    { id:'xc1', t:'廠商與市場結構', en:'Firms and Market Structures',
      plain:'市場依「廠商多少、產品有沒有差異、進入門檻高低」分成四種：完全競爭、獨占性競爭、寡占、獨占。結構不同，廠商定價能力和長期利潤也不同。',
      life:'夜市賣珍奶的攤販很多（接近完全競爭）；手搖飲連鎖品牌各有特色（獨占性競爭）；電信公司只有幾家（寡占）；台電供電（獨占）。',
      body:'<h4>四種市場結構</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>完全競爭</th><th>獨占性競爭</th><th>寡占</th><th>獨占</th></tr><tr><td>廠商數</td><td>很多</td><td>很多</td><td>少數</td><td>一家</td></tr><tr><td>產品差異</td><td>同質</td><td>有差異</td><td>同質或有差異</td><td>沒有替代品</td></tr><tr><td>進入障礙</td><td>很低</td><td>低</td><td>高</td><td>非常高</td></tr><tr><td>定價能力</td><td>沒有（價格接受者）</td><td>有一些</td><td>有一些到很大</td><td>很大</td></tr><tr><td>非價格競爭</td><td>沒有</td><td>廣告、品牌</td><td>廣告、品牌</td><td>廣告</td></tr></table></div><h4>利潤最大化</h4><ul><li>所有廠商都在 <b>MR = MC</b>（邊際收益 = 邊際成本）的產量生產。</li><li><b>完全競爭</b>：P = MR = MC。長期有自由進出 → <b>經濟利潤 = 0</b>，價格 = 最低平均成本。</li><li><b>獨占</b>：需求曲線向下，MR &lt; P。產量比完全競爭少、價格比較高 → 有無謂損失（deadweight loss）。</li><li><b>獨占性競爭</b>：短期可能有利潤，長期因為新廠商進入，經濟利潤趨近 0，但價格仍高於最低平均成本（有超額產能）。</li></ul><h4>寡占模型</h4><ul><li><b>拗折需求曲線</b>（kinked demand）：漲價時對手不跟、降價時對手跟 → 價格很僵固。</li><li><b>Cournot</b>：各廠商在假設對手產量不變下決定產量 → 結果介於獨占和完全競爭之間。</li><li><b>Stackelberg</b>：領導廠商先決定產量，跟隨者再決定 → 領導者產量較大。</li><li><b>Nash 均衡</b>：在對手策略給定下，沒有人想改變自己的策略。囚犯困境 → 寡占勾結（cartel）很難維持。</li><li><b>主導廠商</b>（dominant firm）：一家大廠訂價，小廠跟隨。</li></ul><h4>短期與長期的停業決策</h4><ul><li>短期：價格 &lt; <b>平均變動成本 AVC</b> → 停業（shut down）。AVC ≤ P &lt; ATC → 繼續生產（至少能分攤部分固定成本）。</li><li>長期：價格 &lt; <b>平均總成本 ATC</b> → 退出市場。</li><li><b>規模經濟</b>：產量增加時長期平均成本下降；<b>規模不經濟</b>：上升。最低長期平均成本的產量叫最小效率規模。</li></ul><h4>辨認市場結構</h4><ul><li><b>N 家集中度</b>：前 N 大廠商市占率加總。缺點：看不出併購對市場力量的影響。</li><li><b>HHI 指數</b>：所有廠商市占率的<b>平方和</b>（例：4 家各 25% → 4 × 0.25² = 0.25）。越高越集中。</li><li>兩者都沒有考慮<b>潛在進入者</b>和需求彈性。</li><li>需求彈性：完全競爭的單一廠商面對完全彈性的需求。</li></ul>',
      ex:'In the long run, firms in a perfectly competitive market earn zero economic profit because free entry drives price down to the minimum of average total cost.' },
    { id:'xc2', t:'景氣循環、失業與通膨', en:'Understanding Business Cycles',
      plain:'經濟會經歷擴張和衰退的循環。不同階段，企業的存貨、雇用、投資行為不同。經濟學家用領先、同時、落後指標判斷景氣位置。',
      life:'就像季節：春天（復甦）商家開始進貨、夏天（擴張）大家搶人手、秋天（趨緩）存貨堆積、冬天（衰退）裁員減產。',
      body:'<h4>景氣循環四階段</h4><ul><li><b>復甦</b>（recovery）：GDP 從谷底回升，企業開始補存貨、先增加工時再雇人。</li><li><b>擴張</b>（expansion）：GDP 成長高於潛在水準，雇用增加，投資擴大，通膨開始上升。</li><li><b>趨緩</b>（slowdown）：成長放慢，存貨堆積，央行可能升息。</li><li><b>衰退</b>（contraction）：GDP 下降，裁員，企業縮減投資。</li><li><b>信用循環</b>：景氣好時放款寬鬆，資產價格上漲；景氣差時緊縮，放大景氣循環。</li></ul><h4>景氣指標</h4><div class="tblwrap"><table class="tbl"><tr><th>領先指標（先動）</th><th>同時指標</th><th>落後指標（後動）</th></tr><tr><td>股價、殖利率利差（長短利差）、新屋建照、製造業新訂單、平均每週工時、首次申請失業救濟人數、消費者預期</td><td>工業生產、非農就業人數、個人所得、製造業與貿易銷售</td><td>平均失業期間、存貨與銷售比、單位勞動成本、銀行基本放款利率、商業貸款餘額、服務業 CPI</td></tr></table></div><h4>失業</h4><ul><li><b>摩擦性</b>：換工作期間的短暫失業。</li><li><b>結構性</b>：技能和工作需求不匹配（例如產業轉型）。</li><li><b>循環性</b>：景氣衰退造成。只有這種會隨景氣變化。</li><li><b>怯志工作者</b>（discouraged workers）：放棄找工作，不算在勞動力 → 失業率可能低估。</li><li>失業率是<b>落後</b>指標：景氣好轉時，企業先增加現有員工工時，之後才雇人。</li></ul><h4>通貨膨脹</h4><ul><li><b>通膨</b>：物價持續上漲。<b>通縮</b>：物價持續下跌（債務實質負擔變重，消費延後）。<b>惡性通膨</b>：極高通膨。<b>停滯性通膨</b>：高通膨＋高失業。</li><li><b>反通膨</b>（disinflation）：通膨率下降但仍為正。</li><li><b>成本推動</b>：工資、原物料上漲；<b>需求拉動</b>：需求超過產能。</li><li>衡量：CPI、PPI、PCE；<b>核心通膨</b>排除食物和能源。</li><li>物價指數偏誤：替代偏誤、品質偏誤、新產品偏誤 → 通常<b>高估</b>通膨。</li></ul>',
      ex:'Leading economic indicators, such as stock prices and the yield curve spread, tend to turn before the overall economy and are used to predict business cycle turning points.' },
    { id:'xc3', t:'財政政策：政府花錢與課稅', en:'Fiscal Policy',
      plain:'政府用「花錢」和「課稅」來影響經濟。景氣差時多花錢或減稅（擴張），景氣過熱時少花錢或加稅（緊縮）。',
      life:'疫情時政府發振興券、紓困金，就是擴張性財政政策，希望大家多消費帶動經濟。',
      body:'<h4>工具</h4><ul><li><b>支出</b>：移轉支付（社會福利、失業救濟）、經常性支出（公務員薪水、物品）、資本支出（基礎建設）。</li><li><b>收入</b>：直接稅（所得稅、財產稅）、間接稅（營業稅、消費稅、關稅）。</li><li>好的稅制：簡單、有效率、公平、能產生足夠收入。</li></ul><h4>乘數效果</h4><p class="formula">財政乘數 = 1 ÷ [1 − c(1 − t)]</p><ul><li>c = 邊際消費傾向（MPC）；t = 稅率。例：c = 0.8、t = 0.25 → 乘數 = 1 ÷ (1 − 0.6) = 2.5。</li><li><b>平衡預算乘數 = 1</b>：政府增加支出並同額加稅，GDP 仍會增加同樣金額（因為支出全部進入 GDP，但加稅只減少一部分消費）。</li></ul><h4>自動穩定因子 vs 權衡性政策</h4><ul><li><b>自動穩定因子</b>：不用立法就會自動作用。例如累進所得稅、失業救濟 → 景氣差時稅收自動下降、補助自動增加。</li><li><b>權衡性政策</b>：政府主動決定的政策（例如推出振興方案）。</li></ul><h4>財政政策的困難</h4><ul><li><b>時間落後</b>：認知落後（發現問題）、行動落後（立法）、效果落後（政策生效）。</li><li>其他：資訊不足、政府擴張可能<b>排擠</b>（crowding out）民間投資（借錢推高利率）、充分就業時擴張只會造成通膨、供給面問題（例如能源短缺）財政政策幫不上。</li><li><b>李嘉圖等價</b>（Ricardian equivalence）：民眾預期今天減稅將來會加稅，所以把減稅的錢存起來 → 減稅無效。</li></ul><h4>財政赤字與政府負債</h4><ul><li>擔心：未來稅負加重、排擠效果、可能用印鈔解決（通膨）。</li><li>不擔心：如果借錢投資在有生產力的建設、負債是欠本國人民、赤字可以在衰退時提振需求。</li><li>衡量財政立場：要看<b>結構性（循環調整後）赤字</b>，因為景氣差時赤字自然會變大。</li></ul>',
      ex:'Automatic stabilizers, such as progressive income taxes and unemployment benefits, reduce the severity of business cycles without requiring new legislation.' },
    { id:'xc4', t:'貨幣政策：央行如何調控經濟', en:'Monetary Policy',
      plain:'央行透過調整利率和貨幣供給來控制通膨、穩定經濟。降息是寬鬆（刺激經濟），升息是緊縮（抑制通膨）。',
      life:'就像開車：經濟跑太快（通膨）時央行踩煞車（升息），跑太慢時踩油門（降息）。但踩下去要過一陣子車速才會改變。',
      body:'<h4>央行的角色與目標</h4><ul><li>角色：發行貨幣、政府的銀行、銀行的銀行、最後貸款者、監管金融體系、管理外匯存底。</li><li>主要目標：<b>物價穩定</b>（低而穩定的通膨）；有些央行也有充分就業目標（例如美國聯準會的雙重目標）。</li><li>有效的央行：<b>獨立</b>（不受政治干預）、<b>可信</b>（說到做到）、<b>透明</b>（說明決策理由）。</li></ul><h4>工具</h4><ul><li><b>政策利率</b>：例如美國的聯邦基金利率目標、央行對銀行的放款利率。最主要的工具。</li><li><b>公開市場操作</b>：買債券 → 釋出資金（寬鬆）；賣債券 → 收回資金（緊縮）。</li><li><b>存款準備率</b>：調高 → 銀行能放款的錢變少（緊縮）。</li></ul><h4>傳導機制</h4><p>政策利率改變 → 影響市場利率、資產價格、預期與信心、匯率 → 影響消費和投資、淨出口 → 影響總需求 → 影響通膨。</p><h4>重要觀念</h4><ul><li><b>貨幣數量學說</b>：MV = PY（貨幣 × 流通速度 = 物價 × 實質產出）。</li><li><b>貨幣中立性</b>：長期而言，貨幣只影響物價，不影響實質產出。</li><li><b>費雪效果</b>：名目利率 = 實質利率 + 預期通膨（+ 風險溢酬）。</li><li><b>中性利率</b> = 實質趨勢成長率 + 通膨目標。政策利率高於中性利率 → 緊縮；低於 → 寬鬆。</li><li><b>通膨目標制</b>：公開宣布通膨目標（通常約 2%），提高可信度。</li><li><b>匯率目標制</b>：把本國貨幣釘住另一國貨幣，等於放棄獨立的貨幣政策。</li></ul><h4>貨幣政策的限制</h4><ul><li>長期利率不一定跟著短期利率變動（市場預期）。</li><li><b>流動性陷阱</b>：利率已接近 0，民眾寧願持有現金 → 降息無效。可用<b>量化寬鬆 QE</b>（央行大量買債券）。</li><li>通縮時實質利率很難降低。</li><li>新興市場央行可信度較低。</li></ul><h4>財政與貨幣政策的組合</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>寬鬆貨幣</th><th>緊縮貨幣</th></tr><tr><td>擴張財政</td><td>利率低、總需求大增，政府與民間都擴張</td><td>利率高、政府部門擴張、民間縮小</td></tr><tr><td>緊縮財政</td><td>利率低、民間部門擴張、政府縮小</td><td>利率高、總需求下降</td></tr></table></div>',
      ex:'An effective central bank should be independent, credible, and transparent so that its policy announcements shape inflation expectations.' },
    { id:'xc5', t:'地緣政治與地緣政治風險', en:'Introduction to Geopolitics',
      plain:'地緣政治研究國家之間的政治、經濟關係如何受地理和權力影響。投資人要評估戰爭、制裁、貿易衝突等事件對市場的影響。',
      life:'台灣的半導體產業很強，但因為兩岸關係和地理位置，國際投資人會評估「地緣政治風險」，影響外資投資意願。',
      body:'<h4>參與者</h4><ul><li><b>國家行為者</b>（state actors）：政府、領導人。</li><li><b>非國家行為者</b>：跨國企業、國際組織（聯合國、WTO）、非政府組織、甚至個人。</li></ul><h4>合作 vs 不合作</h4><ul><li>國家合作的動機：國家安全、取得資源、經濟利益、文化交流。</li><li>影響合作的因素：國內政治、地理、標準化（例如貿易規則一致）、文化。</li><li><b>全球化</b>：商品、服務、資本、人員跨國流動增加。<b>民族主義</b>：優先考慮本國利益、減少依賴外國。</li></ul><h4>四種國家行為原型</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>傾向全球化</th><th>傾向民族主義</th></tr><tr><td>合作</td><td><b>多邊主義</b> Multilateralism：和多國簽貿易協定、融入全球供應鏈</td><td><b>雙邊主義</b> Bilateralism：一對一和特定國家合作</td></tr><tr><td>不合作</td><td><b>霸權</b> Hegemony：開放但靠自己的規模影響他國</td><td><b>自給自足</b> Autarky：盡量自己生產、很少對外貿易（例：北韓）</td></tr></table></div><h4>地緣政治的工具</h4><ul><li><b>國家安全工具</b>：軍事、結盟、戰爭。</li><li><b>經濟工具</b>：貿易協定、關稅、制裁、出口管制。</li><li><b>金融工具</b>：貨幣、外資限制、凍結資產、限制使用國際支付系統。</li></ul><h4>地緣政治風險</h4><ul><li><b>事件風險</b>：可預期時間的事件（例如選舉）。</li><li><b>外生風險</b>：突發事件（例如戰爭爆發、恐攻）。</li><li><b>主題風險</b>：長期持續的趨勢（例如氣候變遷、網路攻擊、移民）。</li><li>評估三面向：<b>發生機率</b>、<b>影響速度</b>（velocity，多快衝擊市場）、<b>影響規模</b>。</li><li>對投資的影響：波動度上升、供應鏈中斷、資金流向避險資產；可用情境分析評估。</li></ul>',
      ex:'Geopolitical risk can be assessed by its likelihood, the velocity of its impact on markets, and the size and nature of that impact.' },
    { id:'xc6', t:'國際貿易：比較利益與貿易限制', en:'International Trade',
      plain:'就算一個國家什麼都做得比較好，專心做自己「機會成本最低」的東西再互相交換，大家都會更好。但關稅、配額等限制會讓整體福利下降。',
      life:'你寫作業和打字都比同學快，但打字只比他快一點、寫作業快很多。你專心寫作業、他幫忙打字，兩人總共能完成更多事。',
      body:'<h4>GDP vs GNP</h4><ul><li><b>GDP</b>：在國內生產的所有最終商品和服務（不管誰生產）。</li><li><b>GNP</b>：本國國民生產的（不管在哪裡生產）。</li></ul><h4>貿易的好處與成本</h4><ul><li>好處：比較利益帶來的效率、規模經濟、更多產品選擇、競爭帶來的創新。</li><li>成本：進口競爭產業的失業、所得分配改變。</li></ul><h4>絕對利益與比較利益</h4><ul><li><b>絕對利益</b>：用比較少的資源生產某產品。</li><li><b>比較利益</b>：生產某產品的<b>機會成本比較低</b>。貿易的基礎是比較利益。</li><li><b>Ricardo 模型</b>：比較利益來自<b>勞動生產力</b>（技術）的差異。</li><li><b>Heckscher–Ohlin 模型</b>：比較利益來自<b>生產要素稟賦</b>的差異（勞動多的國家出口勞力密集產品；資本多的國家出口資本密集產品）。貿易會讓充裕要素的所得上升。</li></ul><h4>貿易限制</h4><ul><li><b>關稅</b>：對進口品課稅 → 國內價格上升、國內生產增加、消費減少、政府有稅收、整體有無謂損失。</li><li><b>進口配額</b>：限制進口數量。效果和關稅類似，但政府沒有稅收；拿到配額的外國廠商得到<b>配額租</b>（quota rent）。</li><li><b>出口補貼</b>：政府補貼出口 → 國內價格上升，福利下降。</li><li><b>自願出口限制 VER</b>：出口國自己限制出口量。</li><li>大國課關稅可能改善貿易條件，讓本國福利增加；小國課關稅一定讓本國福利下降。</li><li>資本管制：限制資金跨國流動。</li></ul><h4>區域貿易協定（整合程度由低到高）</h4><ol><li><b>自由貿易區</b>（FTA）：成員間沒有關稅，對外各自訂關稅。</li><li><b>關稅同盟</b>：再加上<b>共同對外關稅</b>。</li><li><b>共同市場</b>：再加上<b>生產要素（勞工、資本）自由流動</b>。</li><li><b>經濟同盟</b>：再加上共同的經濟制度和政策。</li><li><b>貨幣同盟</b>：再加上<b>共同貨幣</b>（例如歐元區）。</li></ol><h4>國際組織</h4><ul><li><b>IMF</b>：維持國際貨幣體系穩定、協助國際收支有困難的國家。</li><li><b>世界銀行</b>：協助開發中國家減少貧窮、提供發展融資。</li><li><b>WTO</b>：制定國際貿易規則、解決貿易爭端。</li></ul>',
      ex:'A country has a comparative advantage in producing a good if its opportunity cost of producing that good is lower than that of its trading partner.' },
    { id:'xc7', t:'資本流動、外匯市場與匯率制度', en:'Capital Flows and the FX Market',
      plain:'外匯市場是全世界最大的金融市場。匯率可以由市場決定，也可以被政府固定。國際收支記錄一國和外國之間的所有交易。',
      life:'出國旅行要換外幣；如果台幣升值，同樣的台幣可以換到更多日圓，去日本玩比較便宜，但台灣的出口商收到的美元換回台幣變少。',
      body:'<h4>外匯市場參與者</h4><ul><li><b>賣方</b>：大型銀行（造市）。</li><li><b>買方</b>：企業、投資機構（共同基金、退休基金、避險基金）、保險公司、政府與主權基金、央行、零售投資人。</li><li>交易類型：<b>即期</b>（spot，通常 T+2 交割）、<b>遠期</b>（forward）、<b>換匯</b>（FX swap：即期和遠期一買一賣）、期貨、選擇權。</li></ul><h4>名目匯率與實質匯率</h4><ul><li>名目匯率：市場報價。</li><li><b>實質匯率</b>：考慮兩國物價後的匯率，反映<b>真實購買力</b>。</li></ul><p class="formula">實質匯率（本國/外國）= 名目匯率（本國/外國）× (外國物價 ÷ 本國物價)</p><ul><li>本國通膨比外國高、名目匯率不變 → 實質匯率下降（本國貨幣實質升值，出口競爭力下降）。</li></ul><h4>匯率制度（由固定到浮動）</h4><ol><li><b>沒有自己的法定貨幣</b>：直接用別國貨幣（美元化），或貨幣同盟（歐元）。</li><li><b>貨幣發行局</b>（currency board）：法律規定本國貨幣可依固定匯率兌換外幣，且要有足額外匯準備（例：香港）。</li><li><b>傳統固定釘住</b>：匯率在中心匯率 ±1% 內波動。</li><li><b>目標區</b>：允許較大波動範圍（例如 ±2%）。</li><li><b>爬行釘住</b>（crawling peg）：定期小幅調整中心匯率。</li><li><b>管理浮動</b>：央行會干預但沒有固定目標。</li><li><b>獨立浮動</b>：由市場決定。</li></ol><p>理想的匯率制度要同時做到<b>匯率穩定、資本自由流動、獨立貨幣政策</b>，但這三者<b>不可能同時達成</b>（不可能三角）。</p><h4>國際收支 BOP</h4><ul><li><b>經常帳</b>：商品和服務貿易、所得（利息、股利）、經常移轉（例如外援、匯款）。</li><li><b>資本帳</b>：資本移轉、非生產性非金融資產（例如專利權）的買賣。</li><li><b>金融帳</b>：直接投資、證券投資、其他投資、外匯存底變動。</li><li>經常帳 + 資本帳 + 金融帳 ≈ 0（加上誤差與遺漏）。</li><li>經常帳與儲蓄的關係：<b>(X − M) = (S − I) + (T − G)</b>。經常帳赤字代表國內儲蓄不足以支應投資和政府赤字。</li></ul>',
      ex:'Under a currency board arrangement, the domestic currency is fully backed by foreign currency reserves and is convertible into the anchor currency at a fixed rate.' },
    { id:'xc8', t:'匯率計算：報價、交叉匯率、遠期匯率', en:'Exchange Rate Calculations',
      plain:'匯率報價 A/B 代表「1 單位 B 值多少 A」。學會看報價方向，就能算升貶值、交叉匯率，以及用利率差算出遠期匯率。',
      life:'USD/TWD = 32 代表 1 美元可以換 32 台幣。如果變成 30，台幣升值、美元貶值。',
      body:'<h4>報價慣例</h4><ul><li>CFA 用 <b>A/B（價格貨幣/基準貨幣）</b>：1 單位<b>基準貨幣 B</b> 值多少<b>價格貨幣 A</b>。例：JPY/USD = 150 → 1 美元 = 150 日圓。</li><li>注意：市場慣用寫法常相反（例如市場寫 USDJPY），考試以題目定義為準。</li><li><b>直接報價</b>：本國貨幣/外國貨幣；<b>間接報價</b>：外國/本國。</li></ul><h4>升值與貶值</h4><ul><li>A/B 從 S<sub>0</sub> 變成 S<sub>1</sub>：<b>基準貨幣 B</b> 的變動 = S<sub>1</sub>/S<sub>0</sub> − 1。</li><li>價格貨幣 A 的變動 = S<sub>0</sub>/S<sub>1</sub> − 1（不是直接加負號！）。</li><li>例：USD/EUR 從 1.10 變 1.21 → 歐元升值 10%；美元貶值 1.10/1.21 − 1 = −9.09%。</li></ul><h4>交叉匯率</h4><p class="formula">A/C = A/B × B/C</p><ul><li>例：JPY/USD = 150、USD/EUR = 1.10 → JPY/EUR = 150 × 1.10 = 165。</li><li>如果報價方向不對，先取倒數再相乘，讓中間的貨幣抵銷。</li></ul><h4>遠期匯率（拋補利率平價 CIP）</h4><p class="formula">F<sub>A/B</sub> = S<sub>A/B</sub> × [1 + i<sub>A</sub> × (天數/360)] ÷ [1 + i<sub>B</sub> × (天數/360)]</p><ul><li>利率比較<b>高</b>的貨幣，遠期會<b>貶值</b>（遠期貼水），否則就有套利機會。</li><li>遠期點數（forward points）：F − S，通常以 1/10,000 表示（例如 +25 點 = 0.0025）。</li><li><b>遠期溢價／貼水</b>：F − S ＝ S × (i<sub>A</sub> − i<sub>B</sub>) × (天數/360) ÷ [1 + i<sub>B</sub> × (天數/360)]。基準貨幣 B 利率較低 → B 的遠期溢價（F &gt; S）。</li><li>例：S(USD/EUR) = 1.10，美元利率 5%、歐元利率 3%，一年期 → F = 1.10 × 1.05 ÷ 1.03 = 1.1214。歐元利率較低，遠期升值。</li></ul>',
      ex:'Covered interest rate parity implies that the currency with the higher interest rate will trade at a forward discount.' }
  ]},
  { id:'x-corp', t:'4. 公司理財 Corporate Issuers（6–9%）', cards: [
    { id:'xr1', t:'企業組織型態與上市', en:'Organizational Forms, Corporate Issuer Features, and Ownership', pre:['bforms'],
      plain:'企業可以是獨資、合夥或公司。不同型態在「老闆要不要負無限責任」「要繳幾層稅」「籌錢容易嗎」上很不一樣。公司可以選擇上市或維持私有。',
      life:'一個人開早餐店是獨資；三個朋友合開咖啡廳是合夥；要開連鎖品牌向大眾募資，就要成立股份有限公司甚至上市。',
      body:'<h4>組織型態比較</h4><div class="tblwrap"><table class="tbl"><tr><th>型態</th><th>法律主體</th><th>老闆責任</th><th>稅</th><th>籌資與轉讓</th></tr><tr><td>獨資</td><td>和老闆相同</td><td>無限責任</td><td>只課個人所得稅（傳遞課稅 pass-through）</td><td>靠老闆自己的錢</td></tr><tr><td>普通合夥 GP</td><td>和合夥人相同</td><td>所有合夥人無限責任</td><td>傳遞課稅</td><td>有限</td></tr><tr><td>有限合夥 LP</td><td>和合夥人相同</td><td>普通合夥人無限責任，<b>有限合夥人有限責任</b>（但不能參與經營）</td><td>傳遞課稅</td><td>私募基金常用</td></tr><tr><td>公司 Corporation</td><td><b>獨立法人</b></td><td>股東<b>有限責任</b></td><td>常有<b>雙重課稅</b>（公司課營所稅，股東拿股利再課一次）</td><td>容易籌資、股份容易轉讓</td></tr></table></div><ul><li>公司的特徵：經營權和所有權分離（產生代理問題）、永續存在。</li><li>有些國家有特殊型態：有限責任合夥 LLP、LLC 等（有限責任＋傳遞課稅）。</li></ul><h4>上市公司 vs 私人公司</h4><ul><li><b>上市公司</b>：股票在交易所交易，要定期公開財報，受監管多。好處：容易籌資、股票有流動性、可以用股票併購。</li><li><b>私人公司</b>：揭露要求少、比較能長期經營，但股票流動性差、籌資管道少。</li><li>私人 → 上市：<b>IPO</b>（承銷商協助發行新股）、<b>直接上市</b>（direct listing，不發新股、只讓現有股東的股票上市）、<b>SPAC 併購</b>（和已上市的空白支票公司合併）。</li><li>上市 → 私人：<b>下市</b>（例如私募基金透過<b>槓桿收購 LBO</b> 買下全部股份）。</li><li>近年趨勢：上市公司數量減少、私募市場變大。</li></ul>',
      ex:'A key feature of the corporate form is that shareholders have limited liability, but corporate profits may be subject to double taxation.' },
    { id:'xr2', t:'投資人與其他利害關係人', en:'Investors and Other Stakeholders',
      plain:'股東和債權人對公司的期待不同：股東喜歡冒險（賺越多分越多），債權人喜歡穩定（只要能還錢就好）。公司還有員工、客戶、供應商、政府等利害關係人。',
      life:'你借錢給朋友開店（債權人），你只在乎他能不能還錢；另一個朋友出錢入股（股東），他希望店越賺越多，願意冒險擴張。',
      body:'<h4>股東 vs 債權人的報酬</h4><ul><li><b>債權人</b>：報酬固定（利息＋本金），上檔有限；優先求償。報酬圖像<b>賣出賣權</b>。</li><li><b>股東</b>：剩餘求償權，上檔無限、下檔最多賠光投資。報酬圖像<b>買進以公司資產為標的的買權</b>。</li><li>所以股東偏好高風險（波動越大，買權越值錢），債權人偏好低風險 → 利益衝突。</li><li>股東有投票權選董事；債權人靠<b>契約條款</b>（covenants）保護自己。</li></ul><h4>利害關係人</h4><ul><li><b>股東</b>：包括控制股東、少數股東。</li><li><b>債權人</b>：銀行、債券持有人。</li><li><b>董事會</b>：代表股東監督經營團隊。</li><li><b>經理人</b>：負責日常經營，薪酬可能和股價連動。</li><li><b>員工</b>：關心薪資、工作保障、工作環境。</li><li><b>客戶</b>：關心產品品質和價格。</li><li><b>供應商</b>：關心公司能否準時付款、持續訂貨。</li><li><b>政府與監管者</b>：關心稅收、法規遵循、社會影響。</li></ul><h4>股東理論 vs 利害關係人理論</h4><ul><li><b>股東理論</b>：公司的目標是讓股東財富最大化。</li><li><b>利害關係人理論</b>：公司應該平衡所有利害關係人的利益。</li></ul><h4>ESG 考量</h4><ul><li><b>E 環境</b>：氣候變遷、汙染、資源使用。</li><li><b>S 社會</b>：勞工權益、人權、客戶隱私、社區關係。</li><li><b>G 治理</b>：董事會組成、高管薪酬、股東權利、會計透明度。</li><li>ESG 問題可能帶來實質財務影響（罰款、商譽受損、訴訟）。</li></ul>',
      ex:'Because shareholders have a residual claim with unlimited upside, they may prefer riskier projects than creditors, who receive a fixed claim.' },
    { id:'xr3', t:'公司治理：衝突、機制、風險與好處', en:'Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits',
      plain:'公司治理是一套規則，確保經營者真的為股東和利害關係人做事。它要處理「老闆不在場時，經理人會不會偷懶或自肥」的問題。',
      life:'你請人幫你顧店，要設好規則（打卡、帳目公開）、有人監督（店長、監視器）、表現好有獎金，才不怕被偷懶或偷錢。',
      body:'<h4>主要利益衝突（代理問題）</h4><ul><li><b>股東 vs 經理人</b>：經理人可能追求高薪、擴大帝國、規避風險或過度冒險、資訊不對稱。</li><li><b>控制股東 vs 少數股東</b>：大股東可能透過關係人交易、雙層股權結構謀取私利。</li><li><b>股東 vs 債權人</b>：股東可能把錢拿去做高風險投資、發太多股利、借更多錢（傷害既有債權人）。</li><li><b>其他</b>：經理人與董事、股東與政府、客戶與供應商等。</li></ul><h4>治理機制</h4><ul><li><b>股東機制</b>：股東會、投票（選董事、重大事項）、<b>委託書</b>（proxy）投票、股東提案、<b>股東積極主義</b>（activism）、集體訴訟、敵意併購的威脅。</li><li>投票方式：<b>直接投票</b>（一股一票、每個席次分開投）vs <b>累積投票</b>（票數可以集中投給一位候選人 → 有利少數股東選出代表）。</li><li><b>雙層股權</b>（dual-class）：創辦人持有多票股份，保有控制權。</li><li><b>董事會</b>：<ul><li>獨立董事比例越高，監督越有效。</li><li><b>分期改選</b>（staggered/classified board）：每年只改選部分董事 → 防止敵意併購，但也降低股東對董事會的控制。</li><li>董事長與 CEO 分開比較好。</li><li>功能性委員會：<b>審計</b>（監督財報與內外部稽核）、<b>治理</b>、<b>薪酬</b>、<b>提名</b>、風險、投資委員會。</li></ul></li><li><b>債權人機制</b>：契約條款（covenants）、擔保品、債權人委員會。</li><li><b>經理人機制</b>：薪酬設計（股票選擇權、限制股、績效獎金、追回條款 clawback）。</li><li><b>其他</b>：員工（勞動法、工會）、客戶與供應商（合約）、政府（法規、公司法）。</li></ul><h4>治理的風險與好處</h4><ul><li>治理不良的風險：決策品質差、法律與監管風險、聲譽受損、違約風險上升。</li><li>良好治理的好處：營運效率、更好的控制、降低資金成本、更好的財務績效。</li><li>分析師評估：董事會組成與獨立性、高管薪酬是否和長期績效連動、股東權利、長期風險管理。</li></ul><h4>ESG 投資方式</h4><ul><li><b>排除篩選</b>（negative screening）：剔除特定產業（菸草、武器）。</li><li><b>正向篩選</b>：挑選 ESG 表現好的公司（best-in-class）。</li><li><b>ESG 整合</b>：把 ESG 因素納入一般的財務分析。</li><li><b>主題投資</b>：投資特定主題（例如再生能源）。</li><li><b>影響力投資</b>：追求可衡量的社會或環境效益，同時有財務報酬。</li><li><b>議合</b>（engagement）：透過股東身分影響公司行為。</li></ul>',
      ex:'Cumulative voting allows shareholders to direct all of their votes to a single board candidate, which helps minority shareholders gain board representation.' },
    { id:'xr4', t:'營運資金與流動性管理', en:'Working Capital and Liquidity',
      plain:'營運資金是公司日常運作需要的錢（現金、存貨、應收帳款減掉應付帳款）。公司要確保手上隨時有足夠現金付帳，又不能放太多閒錢。',
      life:'開飲料店：進貨要先付錢（存貨），客人用信用卡付款要幾天後才入帳（應收帳款），供應商允許月底才付（應付帳款）。這中間的時間差就需要營運資金。',
      body:'<h4>流動性來源</h4><ul><li><b>主要來源</b>：手上的現金、短期投資、營運產生的現金流、短期融資（銀行額度、商業本票）。</li><li><b>次要來源</b>：處分資產、協商債務、申請破產重整 → 會影響正常營運，是最後手段。</li><li><b>拖累流動性</b>（drags）：收款延遲（應收帳款收不回）、存貨過時、借款條件變差。</li><li><b>拉扯流動性</b>（pulls）：付款提早（供應商要求現金交易）、銀行降低信用額度。</li></ul><h4>現金循環週期 CCC</h4><p class="formula">CCC = 存貨週轉天數 DOH + 應收帳款天數 DSO − 應付帳款天數 DPO</p><ul><li>DOH = 365 ÷ 存貨週轉率（COGS/平均存貨）；DSO = 365 ÷ 應收帳款週轉率（營收/平均應收）；DPO = 365 ÷ 應付帳款週轉率（採購/平均應付）。</li><li>CCC 越短，資金被綁住的時間越少。</li></ul><h4>流動性比率</h4><ul><li><b>流動比率</b> = 流動資產 ÷ 流動負債。</li><li><b>速動比率</b> = (現金 + 短期投資 + 應收帳款) ÷ 流動負債。</li><li><b>現金比率</b> = (現金 + 短期投資) ÷ 流動負債。</li></ul><h4>放棄現金折扣的成本</h4><p class="formula">成本 = (1 + 折扣 ÷ (1 − 折扣))<sup>365 ÷ 延後付款天數</sup> − 1</p><ul><li>例：「2/10, net 30」（10 天內付款打 98 折，否則 30 天內付全額）→ 延後 20 天的成本 = (1 + 0.02/0.98)<sup>365/20</sup> − 1 ≈ <b>44.6%</b>。比借錢貴很多 → 應該借錢來拿折扣。</li></ul><h4>營運資金策略</h4><ul><li><b>保守型</b>：持有較多流動資產、多用長期資金 → 安全但報酬較低。</li><li><b>積極型</b>：流動資產少、多用短期資金 → 報酬高但流動性風險大。</li><li>短期融資來源：銀行信用額度（承諾 vs 非承諾）、商業本票（大公司）、應收帳款融資或<b>應收帳款承購</b>（factoring）、存貨融資。</li></ul>',
      ex:'The cash conversion cycle equals days of inventory on hand plus days of sales outstanding minus number of days of payables.' },
    { id:'xr5', t:'資本投資與資本預算', en:'Capital Investments and Capital Allocation',
      plain:'公司決定要不要投資一個專案（蓋工廠、買設備），要比較未來現金流的現值和成本。NPV 大於 0 就該做，因為它會讓股東更有錢。',
      life:'你考慮花 3 萬買一台咖啡機在宿舍賣咖啡。如果未來幾年賺的錢折現回今天超過 3 萬，就值得買。',
      body:'<h4>資本投資的類型</h4><ul><li><b>維持營運</b>（going concern）：汰換舊設備、維持現有業務。</li><li><b>法規、合規</b>：例如環保設備，常常沒有直接報酬但必須做。</li><li><b>擴張</b>：擴大產能、進入新市場。</li><li><b>其他</b>：高風險的新創專案。</li></ul><h4>資本配置流程</h4><ol><li>產生點子 → 2. 分析個別提案 → 3. 規劃整體資本預算 → 4. 監控與事後檢討（post-audit）。</li></ol><h4>原則</h4><ul><li>用<b>增量的稅後現金流</b>，不是會計利潤。</li><li>不考慮<b>沉沒成本</b>（已經花掉、收不回來的）。</li><li>要考慮<b>機會成本</b>（例如用公司現有的土地，土地可以賣掉的價值）和<b>外部性</b>（例如新產品搶走舊產品的銷售 = 侵蝕 cannibalization）。</li><li>融資成本已經反映在折現率裡，現金流不能再扣利息。</li></ul><h4>NPV 與 IRR</h4><p class="formula">NPV = Σ CF<sub>t</sub> ÷ (1 + r)<sup>t</sup> − 初始投資</p><ul><li>NPV &gt; 0 → 接受。NPV 就是專案為股東增加的價值。</li><li><b>IRR</b>：讓 NPV = 0 的折現率。IRR &gt; 要求報酬率 → 接受。</li><li>獨立專案：NPV 和 IRR 結論相同。</li><li><b>互斥專案</b>：可能衝突（規模不同、現金流時點不同）→ <b>以 NPV 為準</b>。因為 IRR 假設以 IRR 再投資，NPV 假設以資金成本再投資（較合理）。</li><li>IRR 的問題：非傳統現金流（正負號改變多次）可能有多個 IRR 或沒有 IRR。</li></ul><h4>投入資本報酬率 ROIC</h4><p class="formula">ROIC = 稅後營業利益 ÷ 平均投入資本</p><ul><li>ROIC &gt; 資金成本 → 公司在創造價值。</li></ul><h4>實質選擇權</h4><ul><li><b>時機選擇權</b>：延後投資等資訊更多。</li><li><b>放棄選擇權</b>：表現不好可以停掉、賣資產。</li><li><b>擴張選擇權</b>：表現好可以擴大。</li><li><b>彈性選擇權</b>：調整價格或產量。</li><li><b>基本選擇權</b>：專案價值取決於標的價格（例如油價）。</li><li>專案 NPV（含選擇權）= 傳統 NPV + 選擇權價值 − 選擇權成本。</li></ul><h4>常見錯誤</h4><ul><li>通膨處理不一致（現金流用名目、折現率用實質）、計入沉沒成本或間接費用、忽略機會成本、以 EPS 或會計數字做決策、主管偏愛的專案（pet projects）。</li></ul>',
      ex:'When NPV and IRR rankings conflict for mutually exclusive projects, the project with the higher NPV should be chosen because NPV directly measures the increase in shareholder wealth.' },
    { id:'xr6', t:'資本結構與資金成本', en:'Capital Structure',
      plain:'公司的錢來自借債和股東。借債便宜（利息可以抵稅），但借太多會有破產風險。找出負債與股東權益的最適比例，讓公司價值最大、資金成本最低。',
      life:'買房子可以用頭期款加房貸。房貸利率比較低，借多一點可以買更大的房子，但借太多萬一失業就繳不出來。',
      body:'<h4>加權平均資金成本 WACC</h4><p class="formula">WACC = w<sub>d</sub> × r<sub>d</sub> × (1 − t) + w<sub>p</sub> × r<sub>p</sub> + w<sub>e</sub> × r<sub>e</sub></p><ul><li>權重用<b>市場價值</b>（或目標資本結構）。</li><li>負債成本 r<sub>d</sub>：用債券殖利率（YTM），再乘 (1 − t) 因為利息可抵稅。</li><li>特別股成本 r<sub>p</sub> = 特別股股利 ÷ 特別股價格。</li><li>股權成本 r<sub>e</sub>：用 CAPM（r<sub>f</sub> + β × 市場風險溢酬）、股利折現模型（D<sub>1</sub>/P<sub>0</sub> + g）、或債券殖利率加風險溢酬法。</li></ul><h4>Modigliani–Miller 定理</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>沒有稅</th><th>有公司稅</th></tr><tr><td>命題 I（公司價值）</td><td>V<sub>L</sub> = V<sub>U</sub>：資本結構<b>不影響</b>公司價值</td><td>V<sub>L</sub> = V<sub>U</sub> + t × D：借越多越值錢（稅盾）</td></tr><tr><td>命題 II（股權成本）</td><td>r<sub>e</sub> = r<sub>0</sub> + (r<sub>0</sub> − r<sub>d</sub>) × D/E</td><td>r<sub>e</sub> = r<sub>0</sub> + (r<sub>0</sub> − r<sub>d</sub>)(1 − t) × D/E</td></tr><tr><td>WACC</td><td>不變</td><td>借越多越低</td></tr></table></div><ul><li>MM 假設：沒有稅、沒有交易成本、沒有破產成本、資訊對稱、可以用相同利率借貸。</li><li>槓桿增加 → 股東承擔更多風險 → 股權成本上升。</li></ul><h4>現實中的考量</h4><ul><li><b>財務困境成本</b>：直接成本（律師、清算費）、間接成本（客戶和供應商跑掉、錯失投資機會）。</li><li><b>代理成本</b>：負債可以約束經理人亂花錢（降低股權代理成本），但太多負債會讓股東傾向冒險。</li><li><b>資訊不對稱與融資順位理論</b>（pecking order）：經理人比外部投資人更了解公司 → 偏好順序：<b>內部資金 → 舉債 → 發新股</b>。發新股常被市場解讀為「股價被高估」的訊號。</li><li><b>靜態權衡理論</b>（static trade-off）：最適資本結構在「多借一塊錢的稅盾好處 = 增加的財務困境成本」的地方。在這一點 WACC 最低、公司價值最高。</li></ul><h4>影響資本結構的因素</h4><ul><li><b>生命週期</b>：新創公司現金流不穩定、資產多為無形 → 主要用股權；成熟公司現金流穩定 → 可以多借債。</li><li>營業風險、資產性質（有形資產可當擔保品）、產業特性、信用評等、市場時機。</li><li>經理人可能設定<b>目標資本結構</b>，實際比例會因市場價值變動而偏離。</li></ul><h4>補充：槓桿程度</h4><ul><li><b>營業槓桿 DOL</b> = %Δ營業利益 ÷ %Δ銷售量：固定營業成本越高越大。</li><li><b>財務槓桿 DFL</b> = %Δ淨利 ÷ %Δ營業利益：固定利息費用越高越大。</li><li><b>總槓桿 DTL</b> = DOL × DFL。</li></ul>',
      ex:'Under the static trade-off theory, the optimal capital structure occurs where the marginal benefit of the interest tax shield equals the marginal expected cost of financial distress.' },
    { id:'xr7', t:'商業模式', en:'Business Models',
      plain:'商業模式回答「公司怎麼賺錢」：賣什麼給誰、怎麼送到客戶手上、怎麼定價、靠哪些關鍵資源。分析公司時要先看懂它的商業模式。',
      life:'印表機賣很便宜，但墨水很貴 → 「刮鬍刀與刀片」模式；Netflix 每月收固定費用 → 訂閱制。',
      body:'<h4>商業模式的要素</h4><ul><li><b>客戶</b>：賣給誰（個人 B2C、企業 B2B、政府）、客戶的需求是什麼。</li><li><b>價值主張</b>：為什麼客戶要買你的（價格、品質、便利、獨特性）。</li><li><b>通路</b>：怎麼把產品送到客戶手上（直營、經銷、電商、全通路 omnichannel）。</li><li><b>定價</b>：怎麼收錢。</li><li><b>價值鏈</b>：公司自己做哪些環節、外包哪些、需要哪些關鍵資源和合作夥伴。</li></ul><h4>定價策略</h4><ul><li><b>價值定價</b>：依客戶認知的價值定價。</li><li><b>成本加成</b>：成本加上固定利潤率。</li><li><b>差別定價</b>：不同客戶不同價格（例如學生票、早鳥票、動態定價）。</li><li><b>免費增值</b>（freemium）：基本功能免費，進階功能收費。</li><li><b>刮鬍刀－刀片</b>：主產品便宜，耗材賺錢。</li><li><b>組合銷售</b>（bundling）：多項產品一起賣。</li><li><b>訂閱制</b>：定期收費，收入穩定可預測。</li><li><b>拍賣、反向拍賣</b>。</li></ul><h4>常見商業模式類型</h4><ul><li><b>平台／網路效應</b>：使用者越多，平台對每個人越有價值（例如社群媒體、外送平台、電商市集）。容易贏者全拿。</li><li><b>加盟</b>（franchise）：用別人的錢擴張，收權利金。</li><li><b>集團企業</b>（conglomerate）：跨多個不相關產業。</li><li><b>垂直整合 vs 外包</b>。</li><li><b>資產輕</b>（asset-light）：不擁有大量資產（例如 Airbnb）。</li><li>新創常見：快速成長、先虧損搶市占，要評估單位經濟效益（每位客戶的獲取成本 CAC vs 終身價值 LTV）。</li></ul>',
      ex:'A platform business model benefits from network effects, in which the value of the service to each user increases as more users join.' }
  ]},
  { id:'x-fsa', t:'5. 財務報表分析 Financial Statement Analysis（11–14%）', cards: [
    { id:'xf1', t:'財報分析入門：報表、準則與分析架構', en:'Introduction to Financial Statement Analysis', pre:['bbs','bis'],
      plain:'財報分析是用公司公布的財務報表，判斷它過去表現如何、未來可能怎樣。要知道財報有哪些、誰制定規則、還有哪些補充資訊。',
      life:'就像看同學的成績單：不只看總平均（淨利），還要看各科分數（明細）、老師評語（附註）、有沒有被記過（審計意見）。',
      body:'<h4>主要財務報表</h4><ul><li><b>資產負債表</b>（財務狀況表）：某一時點的資產、負債、股東權益。A = L + E。</li><li><b>損益表</b>（綜合損益表）：一段期間的收入、費用、淨利。</li><li><b>現金流量表</b>：一段期間的現金來源和用途（營業、投資、籌資）。</li><li><b>股東權益變動表</b>：股本、保留盈餘、其他綜合損益的變化。</li><li><b>附註</b>：會計政策、估計、細節（例如租賃、退休金、或有負債）。<b>很重要</b>。</li><li><b>管理階層討論與分析 MD&amp;A</b>：經營團隊對營運、趨勢、風險的說明（不一定經過審計）。</li></ul><h4>審計報告</h4><ul><li><b>無保留意見</b>（unqualified/clean）：財報允當表達。</li><li><b>保留意見</b>（qualified）：除了某些例外，大致允當。</li><li><b>否定意見</b>（adverse）：財報沒有允當表達。</li><li><b>無法表示意見</b>（disclaimer）：審計範圍受限，無法表示意見。</li><li><b>關鍵查核事項</b>（KAM / CAM）：審計師認為最重要、最需要判斷的事項。</li><li>美國上市公司還要對<b>內部控制</b>出具意見。</li></ul><h4>準則制定者與監管者</h4><ul><li><b>準則制定者</b>：IASB（國際財務報導準則 IFRS）、FASB（美國一般公認會計原則 US GAAP）。民間機構，負責訂規則。</li><li><b>監管者</b>：SEC（美國）、各國證管會、IOSCO（國際證券管理機構組織）。有法律權力要求遵守。</li><li><b>IFRS 概念架構</b>：財報的目標是提供對使用者有用的資訊。基本品質特性：<b>攸關性</b>、<b>忠實表述</b>；強化性品質：可比較性、可驗證性、時效性、可了解性。</li></ul><h4>財報分析架構（六步驟）</h4><ol><li>確定分析的目的和範圍。</li><li>蒐集資料。</li><li>處理資料（調整、算比率）。</li><li>分析和解讀資料。</li><li>提出結論和建議。</li><li>追蹤更新。</li></ol><h4>其他資訊來源</h4><ul><li>季報、法說會、新聞稿、產業資料、總體經濟資料、委託書（proxy statement，看高管薪酬和董事資訊）。</li></ul>',
      ex:'Financial statement notes and management’s discussion and analysis provide important information that is not presented on the face of the financial statements.' },
    { id:'xf2', t:'損益表分析：收入認列、費用、EPS', en:'Analyzing Income Statements',
      plain:'損益表要看公司收入怎麼認列、費用怎麼配合、有沒有一次性項目，最後算出每股盈餘 EPS。稀釋 EPS 要考慮可能變成股票的證券。',
      life:'補習班一次收一年的學費，不能在收錢當月全部算成收入，要隨著上課慢慢認列。',
      body:'<h4>收入認列五步驟（IFRS 15 / ASC 606）</h4><ol><li>辨認<b>合約</b>。</li><li>辨認<b>履約義務</b>（承諾給客戶的各項商品或服務）。</li><li>決定<b>交易價格</b>（包含變動對價，例如折扣、退貨）。</li><li>把交易價格<b>分攤</b>到各履約義務。</li><li>在<b>履約義務滿足時</b>認列收入（某一時點或隨時間）。</li></ol><ul><li>長期合約：依完工進度隨時間認列。</li><li><b>總額 vs 淨額</b>：公司是<b>主理人</b>（控制商品）→ 以總額認列收入；是<b>代理人</b>（只是仲介）→ 只認列佣金淨額。總額法營收較大，但淨利相同。</li></ul><h4>費用認列</h4><ul><li><b>配合原則</b>：費用在相關收入認列的期間認列（例如銷貨成本）。</li><li>期間費用：無法直接對應收入的（例如管理費用）在發生時認列。</li><li>壞帳、保固費用要用估計。</li></ul><h4>非經常性項目</h4><ul><li><b>停業單位</b>（discontinued operations）：已經或計畫處分的部門，<b>以稅後淨額</b>在繼續營業單位之後單獨列示。分析時通常排除。</li><li><b>不尋常或不常發生的項目</b>：例如重組費用、資產減損、訴訟和解，列在繼續營業單位中。</li><li><b>會計政策變更</b>：<b>追溯</b>調整以前年度（retrospective）。</li><li><b>會計估計變更</b>（例如耐用年限）：<b>推延</b>適用（prospective），不改以前年度。</li><li><b>前期錯誤更正</b>：重編以前年度報表（restatement）→ 警訊。</li></ul><h4>每股盈餘 EPS</h4><p class="formula">基本 EPS = (淨利 − 特別股股利) ÷ 加權平均流通在外普通股數</p><ul><li>加權平均股數：依流通期間加權；<b>股票股利和股票分割要追溯調整</b>（視為期初就發生）。</li><li><b>稀釋 EPS</b>：假設所有可能稀釋的證券都轉換成普通股。<ul><li><b>可轉換特別股</b>（if-converted）：分子加回特別股股利，分母加轉換股數。</li><li><b>可轉換公司債</b>：分子加回<b>稅後</b>利息 [利息 × (1 − t)]，分母加轉換股數。</li><li><b>選擇權、認股權證</b>（庫藏股法）：假設用行使價的收入在市場上買回股票。新增股數 = n × (平均股價 − 行使價) ÷ 平均股價。只有<b>價內</b>時才稀釋。</li></ul></li><li><b>反稀釋</b>證券（轉換後 EPS 反而上升）不納入計算。稀釋 EPS 一定 ≤ 基本 EPS。</li></ul><h4>綜合損益</h4><ul><li><b>綜合損益</b> = 淨利 + <b>其他綜合損益 OCI</b>。</li><li>OCI 常見項目：外幣換算調整數、現金流量避險的有效部分、FVOCI 債務工具的未實現損益、退休金再衡量（精算損益）、資產重估增值（IFRS）。</li></ul><h4>共同比損益表</h4><ul><li>每個項目除以<b>營收</b>，方便跨公司、跨年度比較（例如毛利率、營業利益率）。</li></ul>',
      ex:'Under the treasury stock method, the proceeds from exercising options are assumed to be used to repurchase shares at the average market price, so only in-the-money options are dilutive.' },
    { id:'xf3', t:'資產負債表分析', en:'Analyzing Balance Sheets', pre:['bbs'],
      plain:'資產負債表列出公司在某一天「擁有什麼、欠什麼」。要知道各項目怎麼衡量（成本、公允價值），以及無形資產、商譽、金融資產的處理方式。',
      life:'你的「個人資產負債表」：存款、手機、腳踏車是資產；欠朋友的錢、學貸是負債；兩者相減就是你的淨值。',
      body:'<h4>分類</h4><ul><li><b>流動</b>：一年（或一個營業週期）內會變成現金或要償還的。<b>非流動</b>：超過一年。</li><li>銀行等金融機構常用<b>流動性排序</b>的表達方式。</li></ul><h4>衡量基礎</h4><ul><li><b>歷史成本</b>：取得時的價格（例如土地、設備）。</li><li><b>攤銷後成本</b>：債務工具依有效利率法攤銷。</li><li><b>公允價值</b>：現在市場上賣得到的價格。</li></ul><h4>流動資產</h4><ul><li>現金與約當現金、短期投資、應收帳款（扣除備抵損失）、存貨、預付費用。</li></ul><h4>非流動資產</h4><ul><li><b>不動產、廠房及設備 PP&amp;E</b>：成本 − 累計折舊 − 減損。IFRS 可選<b>重估價模式</b>。</li><li><b>投資性不動產</b>（IFRS）：可選成本模式或公允價值模式（價值變動進損益）。</li><li><b>無形資產</b>：<ul><li>可辨認的（專利、商標、軟體）：有限耐用年限的要攤銷，無限的不攤銷但每年測試減損。</li><li><b>商譽</b> = 收購價格 − 被收購公司可辨認淨資產的公允價值。<b>不攤銷</b>，每年做減損測試。</li><li>內部產生的商譽、品牌<b>不能</b>認列為資產。</li></ul></li><li><b>金融資產</b>（IFRS 9）：<ul><li><b>攤銷後成本</b>：持有收取合約現金流的債務工具。</li><li><b>FVOCI</b>：公允價值變動進其他綜合損益（債務工具或選擇指定的股權投資）。</li><li><b>FVPL</b>：公允價值變動進損益（交易目的、衍生工具等）。</li></ul></li><li>遞延所得稅資產。</li></ul><h4>負債</h4><ul><li><b>流動負債</b>：應付帳款、應計費用、短期借款、一年內到期的長期負債、<b>預收收入</b>（unearned revenue，已收錢還沒交貨）。</li><li><b>非流動負債</b>：長期借款、公司債、租賃負債、遞延所得稅負債、退休金負債。</li></ul><h4>股東權益</h4><ul><li>股本與資本公積（contributed capital）、保留盈餘、<b>庫藏股</b>（買回自家股票，是權益的減項）、累積其他綜合損益 AOCI、<b>非控制權益</b>（子公司不屬於母公司的部分）。</li></ul><h4>共同比資產負債表與比率</h4><ul><li>每個項目除以<b>總資產</b>。</li><li>流動性比率：流動、速動、現金比率。</li><li>償債能力比率：負債比、負債權益比、財務槓桿（總資產/總權益）。</li></ul>',
      ex:'Goodwill is not amortized but is tested for impairment at least annually; internally generated goodwill cannot be recognized as an asset.' },
    { id:'xf4', t:'現金流量表（一）：分類與編製', en:'Analyzing Statements of Cash Flows I',
      plain:'現金流量表把現金的進出分成三類：營業、投資、籌資。淨利不等於現金，因為有折舊、應收帳款等非現金項目，所以要調整。',
      life:'你這個月接案賺了 2 萬（淨利），但客戶下個月才付錢，所以戶頭裡的現金其實沒有增加。',
      body:'<h4>三大類</h4><ul><li><b>營業活動 CFO</b>：日常營運的現金（收客戶的錢、付供應商、員工、稅）。</li><li><b>投資活動 CFI</b>：買賣長期資產和投資（買設備、賣子公司、買其他公司股票）。</li><li><b>籌資活動 CFF</b>：和資金提供者之間的現金（借錢、還款、發新股、買庫藏股、發股利）。</li></ul><h4>IFRS vs US GAAP 的分類差異</h4><div class="tblwrap"><table class="tbl"><tr><th>項目</th><th>IFRS</th><th>US GAAP</th></tr><tr><td>收到的利息</td><td>營業或投資</td><td>營業</td></tr><tr><td>收到的股利</td><td>營業或投資</td><td>營業</td></tr><tr><td>支付的利息</td><td>營業或籌資</td><td>營業</td></tr><tr><td>支付的股利</td><td>營業或籌資</td><td>籌資</td></tr><tr><td>所得稅</td><td>營業（可分攤到投資、籌資）</td><td>營業</td></tr><tr><td>銀行透支</td><td>可列為約當現金</td><td>籌資</td></tr></table></div><h4>直接法 vs 間接法</h4><ul><li><b>直接法</b>：列出各項現金收入和支出（收客戶的錢、付供應商的錢……）。資訊比較多，IFRS 和 GAAP 都<b>鼓勵</b>。</li><li><b>間接法</b>：從淨利開始調整。大部分公司用這個。GAAP 若用直接法，要另外附上間接法的調節表。</li><li>兩種方法只影響<b>營業活動</b>的表達，CFO 總額相同。</li></ul><h4>間接法步驟</h4><ol><li>從<b>淨利</b>開始。</li><li>加回<b>非現金費用</b>（折舊、攤銷、減損）。</li><li>減去<b>處分利得</b>、加回處分損失（因為處分的現金全部列在投資活動）。</li><li>調整營運資金變動：<ul><li>流動<b>資產增加 → 減</b>（例：應收帳款增加，表示營收沒收到現金）。</li><li>流動<b>負債增加 → 加</b>（例：應付帳款增加，表示費用還沒付現）。</li></ul></li></ol><h4>不影響現金的投資與籌資活動</h4><ul><li>例如用發行股票換取資產、債轉股、融資租賃取得資產 → 不列在現金流量表中，但要在<b>附註</b>揭露。</li></ul><h4>報表之間的連結</h4><ul><li>資產負債表項目的變動，會反映在損益表或現金流量表中。例：期初應收 + 營收 − 收現 = 期末應收。</li><li>期初現金 + CFO + CFI + CFF = 期末現金。</li></ul>',
      ex:'Under IFRS, interest paid may be classified as an operating or financing cash flow, whereas under US GAAP it must be classified as an operating cash flow.' },
    { id:'xf5', t:'現金流量表（二）：自由現金流與比率', en:'Analyzing Statements of Cash Flows II',
      plain:'自由現金流是公司在維持營運和投資後，真正可以分給資金提供者的現金。它比淨利更能反映公司的價值。',
      life:'你每月打工收入扣掉房租、生活費（營業）和換新手機（投資）之後，剩下可以存起來或還學貸的錢，就是你的自由現金流。',
      body:'<h4>間接法轉直接法</h4><ul><li>收客戶的現金 = 營收 − 應收帳款增加 + 預收收入增加。</li><li>付供應商的現金 = 銷貨成本 + 存貨增加 − 應付帳款增加。</li><li>付員工的現金 = 薪資費用 − 應付薪資增加。</li><li>付利息 = 利息費用 − 應付利息增加 + 折價攤銷（或 − 溢價攤銷）。</li><li>付稅 = 所得稅費用 − 應付所得稅增加 − 遞延所得稅負債增加。</li></ul><h4>自由現金流</h4><p class="formula">FCFF = CFO + 利息 × (1 − t) − 資本支出（FCInv）</p><p class="formula">FCFF = 淨利 + 非現金費用 + 利息 × (1 − t) − FCInv − 營運資金投資</p><p class="formula">FCFE = CFO − FCInv + 淨借款</p><ul><li><b>FCFF</b>（公司自由現金流）：可分給<b>所有</b>資金提供者（債權人和股東）。</li><li><b>FCFE</b>（股東自由現金流）：可分給<b>股東</b>。</li><li>US GAAP 下利息費用已經在 CFO 扣掉，算 FCFF 要加回稅後利息；IFRS 若把利息放在籌資活動，就不用加回。</li></ul><h4>現金流比率</h4><ul><li><b>績效比率</b>：<ul><li>現金流佔營收比 = CFO ÷ 營收。</li><li>資產現金報酬率 = CFO ÷ 平均總資產。</li><li>現金流佔營業利益比 = CFO ÷ 營業利益（衡量盈餘品質，太低是警訊）。</li><li>每股現金流 = (CFO − 特別股股利) ÷ 加權平均股數。</li></ul></li><li><b>償債能力比率</b>：<ul><li>負債保障 = CFO ÷ 總負債。</li><li>利息保障 = (CFO + 支付利息 + 支付稅) ÷ 支付利息。</li><li>再投資比率 = CFO ÷ 長期資產投資。</li><li>償債比率 = CFO ÷ 償還本金。</li><li>股利支付 = CFO ÷ 支付股利。</li></ul></li></ul><h4>分析重點</h4><ul><li>健康公司：CFO 為正且穩定，大部分來自核心營運；CFO 長期低於淨利是警訊。</li><li>成長期公司 CFI 通常是大的負數（大量投資）。</li><li>看 CFO 增加的原因：是賺更多錢，還是延後付款、減少存貨（不能持續）？</li></ul>',
      ex:'Free cash flow to the firm is the cash flow available to all of the company’s suppliers of capital after operating expenses and necessary investments have been made.' },
    { id:'xf6', t:'存貨分析：FIFO、LIFO 與存貨跌價', en:'Analysis of Inventories',
      plain:'存貨的成本流動假設會影響銷貨成本和期末存貨。物價上漲時，FIFO 的利潤較高、LIFO 的稅較少。存貨價值下跌時要提列跌價損失。',
      life:'便利商店的鮮奶：先進來的先賣（FIFO）是常理。但會計上可以假設「最後進的先賣」（LIFO），在物價上漲時讓成本看起來比較高、少繳稅。',
      body:'<h4>成本流動假設</h4><ul><li><b>個別認定法</b>：適合高價、可區分的商品（例如珠寶、汽車）。</li><li><b>先進先出 FIFO</b>：先買的先賣。期末存貨接近最新成本。</li><li><b>加權平均法</b>：用平均成本。</li><li><b>後進先出 LIFO</b>：後買的先賣。<b>只有 US GAAP 允許，IFRS 禁止</b>。美國稅法規定：報稅用 LIFO，財報也要用 LIFO（LIFO conformity rule）。</li></ul><h4>物價上漲時的比較</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>LIFO</th><th>FIFO</th></tr><tr><td>銷貨成本 COGS</td><td>較高</td><td>較低</td></tr><tr><td>毛利、淨利</td><td>較低</td><td>較高</td></tr><tr><td>所得稅</td><td>較低</td><td>較高</td></tr><tr><td>營業現金流 CFO</td><td><b>較高</b>（稅少）</td><td>較低</td></tr><tr><td>期末存貨</td><td>較低（舊成本）</td><td>較高（接近現值）</td></tr><tr><td>存貨週轉率</td><td>較高</td><td>較低</td></tr><tr><td>流動比率</td><td>較低</td><td>較高</td></tr></table></div><ul><li>結論：<b>FIFO 的資產負債表</b>比較能反映現值；<b>LIFO 的損益表</b>比較能反映現在的成本。</li></ul><h4>LIFO 準備與轉換</h4><p class="formula">存貨<sub>FIFO</sub> = 存貨<sub>LIFO</sub> + LIFO 準備</p><p class="formula">COGS<sub>FIFO</sub> = COGS<sub>LIFO</sub> − (期末 LIFO 準備 − 期初 LIFO 準備)</p><ul><li>轉換成 FIFO 後：淨利增加 = ΔLIFO 準備 × (1 − t)；保留盈餘增加 = LIFO 準備 × (1 − t)；負債（遞延稅）增加 = LIFO 準備 × t。</li><li><b>LIFO 清算</b>：銷售量大於進貨量，動用到舊的低成本存貨 → COGS 偏低、利潤虛增（不能持續）。看 LIFO 準備下降是警訊。</li></ul><h4>存貨的衡量（跌價）</h4><ul><li><b>IFRS</b>：<b>成本與淨變現價值孰低</b>（NRV = 預計售價 − 完工和銷售成本）。之後價值回升可以<b>迴轉</b>（不超過原始成本）。</li><li><b>US GAAP</b>：用 LIFO 或零售價法 → <b>成本與市價孰低</b>（市價 = 重置成本，但上限為 NRV、下限為 NRV − 正常利潤）；用其他方法 → 成本與 NRV 孰低。<b>不能迴轉</b>。</li><li>農產品、礦產品等特殊情況可以用 NRV 衡量。</li></ul><h4>存貨比率與分析</h4><ul><li>存貨週轉率 = COGS ÷ 平均存貨；存貨週轉天數 = 365 ÷ 存貨週轉率。</li><li>週轉率太高：可能存貨不足、錯失銷售。週轉率下降：存貨可能過時、銷售不佳。</li><li>原料、在製品增加可能代表預期需求上升；製成品堆積可能代表需求下降。</li></ul>',
      ex:'In a period of rising prices, LIFO results in higher cost of goods sold, lower taxes, and higher operating cash flow than FIFO.' },
    { id:'xf7', t:'長期資產分析：資本化、折舊、減損', en:'Analysis of Long-Term Assets',
      plain:'花錢買長期資產可以「資本化」（列成資產慢慢折舊），也可能直接「費用化」。不同處理方式會改變利潤、資產和現金流量表的分類。',
      life:'買一台用五年的筆電，如果花 5 萬當月全部算成費用，那個月看起來大虧；分五年攤，每年 1 萬，比較符合實際使用情形。',
      body:'<h4>資本化 vs 費用化</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>資本化</th><th>費用化</th></tr><tr><td>第一年淨利</td><td>較高</td><td>較低</td></tr><tr><td>之後幾年淨利</td><td>較低（有折舊）</td><td>較高</td></tr><tr><td>淨利波動</td><td>較平穩</td><td>較大</td></tr><tr><td>總資產、權益</td><td>較高</td><td>較低</td></tr><tr><td>CFO</td><td><b>較高</b>（支出列在 CFI）</td><td>較低</td></tr><tr><td>CFI</td><td>較低（流出）</td><td>較高</td></tr><tr><td>ROA、ROE（第一年）</td><td>較高</td><td>較低</td></tr></table></div><ul><li><b>資本化利息</b>：自建資產期間的借款利息可以資本化 → 利息保障倍數看起來較好；分析時通常把它加回利息費用。</li></ul><h4>無形資產</h4><ul><li><b>購入的</b>：以成本認列。</li><li><b>企業合併取得</b>：以公允價值認列，剩餘部分是商譽。</li><li><b>內部發展</b>：<ul><li>IFRS：<b>研究階段費用化</b>，<b>發展階段</b>若符合條件（技術可行、有意圖和能力完成等）<b>可資本化</b>。</li><li>US GAAP：研發<b>全部費用化</b>，例外是要出售的軟體在技術可行後的成本可資本化。</li></ul></li></ul><h4>折舊方法</h4><ul><li><b>直線法</b>：(成本 − 殘值) ÷ 耐用年限。</li><li><b>加速折舊</b>（例：倍數餘額遞減法 DDB）：折舊 = 2 ÷ 年限 × 期初帳面價值（不先扣殘值，但帳面不能低於殘值）。前期折舊多、淨利低。</li><li><b>生產數量法</b>：依實際使用量折舊。</li><li>IFRS 要求<b>組成部分折舊</b>（例如飛機的引擎和機身分開折舊）；US GAAP 允許但很少用。</li><li>耐用年限越長、殘值越高 → 折舊越少、淨利越高（可能被用來操縱盈餘）。</li></ul><h4>減損</h4><ul><li><b>IFRS</b>：有減損跡象時測試。帳面價值 &gt; <b>可回收金額</b>（公允價值減出售成本 與 使用價值 孰高）→ 減損。<b>可以迴轉</b>（商譽除外）。</li><li><b>US GAAP</b>（持有使用的資產）：兩步驟。①可回收性測試：帳面價值 &gt; <b>未折現</b>未來現金流 → 有減損；②減損金額 = 帳面價值 − 公允價值。<b>不能迴轉</b>。</li><li>減損是非現金費用，不影響當期現金流；之後折舊會減少。</li></ul><h4>重估價模式（IFRS）</h4><ul><li>資產可以用公允價值重估。增值先進 OCI（重估增值）；若迴轉之前認列在損益的減值，則進損益。</li><li>US GAAP 不允許向上重估。</li></ul><h4>分析用的估計</h4><ul><li>平均年齡 ≈ 累計折舊 ÷ 年折舊費用。</li><li>平均總年限 ≈ 總成本 ÷ 年折舊費用。</li><li>剩餘年限 ≈ 淨 PP&amp;E ÷ 年折舊費用。</li><li>資產老舊 → 可能即將需要大筆資本支出。</li></ul><h4>處分</h4><ul><li>處分損益 = 售價 − 帳面價值，列在損益表；現金全部列在 CFI。</li><li>報廢：帳面價值全部認列損失。</li></ul>',
      ex:'Capitalizing an expenditure rather than expensing it results in higher net income in the first year, higher total assets, and higher operating cash flow.' },
    { id:'xf8', t:'長期負債與權益：租賃、退休金、公司債、股份基礎給付', en:'Topics in Long-Term Liabilities and Equity',
      plain:'租約、退休金承諾、公司債都是長期負債。新的租賃會計規定讓大部分租約都要上資產負債表，避免公司把負債藏起來。',
      life:'租房子兩年，雖然房子不是你的，但你承諾每個月付房租。新的會計規則要求把「使用權」記成資產、「未來要付的房租」記成負債。',
      body:'<h4>公司債</h4><ul><li>發行時以<b>市場利率</b>折現：票面利率 &lt; 市場利率 → 折價發行；&gt; → 溢價發行。</li><li><b>有效利率法</b>：利息費用 = 期初帳面價值 × <b>發行時的市場利率</b>。<ul><li>折價債：利息費用 &gt; 票息，帳面價值逐年上升到面額。</li><li>溢價債：利息費用 &lt; 票息，帳面價值逐年下降。</li></ul></li><li>現金流量表：支付的票息列 CFO（US GAAP）；發行和還本列 CFF。零息債的利息到期才付現，CFO 被高估。</li><li>提前償還：損益 = 帳面價值 − 買回價格。</li><li>可選擇<b>公允價值選擇權</b>衡量（較少見）。</li><li><b>債務契約條款</b>：肯定條款（必須做的，例如維持某比率、按時付款）和否定條款（禁止做的，例如不能再借錢、不能賣重要資產）。</li></ul><h4>租賃（承租人）</h4><ul><li><b>IFRS 16</b>：單一模式，幾乎所有租賃都認列<b>使用權資產</b>和<b>租賃負債</b>（租金現值）。損益表：使用權資產<b>折舊</b> + 租賃負債<b>利息</b> → 前期費用較高（前重後輕）。例外：短期（≤ 12 個月）和低價值資產租賃可以不認列。</li><li><b>US GAAP（ASC 842）</b>：<ul><li><b>融資租賃</b>：和 IFRS 相同（折舊 + 利息）。</li><li><b>營業租賃</b>：資產負債表一樣認列使用權資產和負債，但損益表只認列<b>單一直線租賃費用</b>；現金流量表全部列在 CFO。</li></ul></li><li>融資租賃（IFRS 全部租賃）：本金部分列 CFF，利息部分依政策列 CFO 或 CFF → CFO 比營業租賃<b>高</b>。</li></ul><h4>租賃（出租人）</h4><ul><li><b>融資租賃</b>（實質上把資產所有權的風險報酬移轉）：除列資產，認列租賃應收款。US GAAP 的銷售型租賃還要認列銷貨毛利。</li><li><b>營業租賃</b>：資產留在帳上繼續折舊，租金收入認列為收入。</li></ul><h4>退休金計畫</h4><ul><li><b>確定提撥制 DC</b>：公司每期提撥固定金額，風險由員工承擔。提撥時認列費用，沒有長期負債。</li><li><b>確定給付制 DB</b>：公司承諾退休後給付固定金額，風險由公司承擔。</li><li>DB 的<b>淨退休金負債（資產）</b>= 確定給付義務（PBO，未來給付的現值）− 計畫資產公允價值。PBO &gt; 資產 → 提撥不足（負債）。</li><li>IFRS：服務成本和淨利息進損益，<b>再衡量</b>（精算損益、資產報酬與利息差）進 OCI 且不能轉回損益。</li></ul><h4>股份基礎給付</h4><ul><li>員工認股權、限制股：以<b>給與日的公允價值</b>衡量，在<b>既得期間</b>內認列為薪資費用。</li><li>選擇權公允價值要用模型估計（Black-Scholes 或二項式），涉及假設（波動度、預期期間）。</li></ul>',
      ex:'Under IFRS 16, a lessee recognizes a right-of-use asset and a lease liability for nearly all leases, and reports depreciation and interest expense on the income statement.' },
    { id:'xf9', t:'所得稅會計：遞延所得稅', en:'Analysis of Income Taxes',
      plain:'會計帳和稅法的規則不同，所以財報上的「所得稅費用」和實際要繳的稅會不一樣。暫時性差異會產生遞延所得稅資產或負債。',
      life:'公司用直線法折舊做財報，但報稅時用加速折舊（前期扣比較多、少繳稅）。這等於「稅晚點繳」，所以要記一筆遞延所得稅負債。',
      body:'<h4>基本名詞</h4><ul><li><b>課稅所得</b>：依稅法算出來的所得。<b>應付所得稅</b> = 課稅所得 × 稅率（今年實際要繳的）。</li><li><b>會計利潤</b>（稅前淨利）：依會計準則。</li><li><b>所得稅費用</b> = 應付所得稅 + ΔDTL − ΔDTA。</li><li><b>課稅基礎</b>（tax base）：資產或負債在稅法上的價值。</li></ul><h4>遞延所得稅負債 DTL 與資產 DTA</h4><ul><li><b>DTL</b>：會計利潤 &gt; 課稅所得（費用在稅上先扣），未來要多繳稅。例：報稅用加速折舊 → 資產的<b>帳面價值 &gt; 課稅基礎</b>。</li><li><b>DTA</b>：課稅所得 &gt; 會計利潤，未來可以少繳稅。例：保固費用、壞帳在財報先認列，報稅時實際發生才扣；可抵減的<b>營業虧損扣抵</b>（NOL carryforward）。資產的帳面價值 &lt; 課稅基礎，或負債的帳面價值 &gt; 課稅基礎。</li></ul><div class="tblwrap"><table class="tbl"><tr><th></th><th>帳面價值 &gt; 課稅基礎</th><th>帳面價值 &lt; 課稅基礎</th></tr><tr><td>資產</td><td>DTL</td><td>DTA</td></tr><tr><td>負債</td><td>DTA</td><td>DTL</td></tr></table></div><h4>暫時性差異 vs 永久性差異</h4><ul><li><b>暫時性差異</b>：未來會迴轉 → 產生遞延稅。</li><li><b>永久性差異</b>：永遠不會迴轉（例如免稅收入、不能扣抵的罰款）→ <b>不產生</b>遞延稅，但會讓<b>有效稅率</b>不等於法定稅率。</li></ul><h4>評價備抵與稅率變動</h4><ul><li>US GAAP：如果 DTA「很有可能（more likely than not）無法實現」，要提列<b>評價備抵</b>（valuation allowance）。增加評價備抵 → 淨利下降；減少 → 淨利上升（可被用來調節盈餘）。IFRS 則直接只認列可能實現的金額。</li><li>稅率改變：DTA、DTL 都要用新稅率<b>重新衡量</b>，差額進所得稅費用。稅率上升 → DTL 增加（費用增加）、DTA 增加（費用減少）。</li></ul><h4>分析</h4><ul><li><b>有效稅率</b> = 所得稅費用 ÷ 稅前淨利；<b>法定稅率</b>是法律規定的稅率。看附註的稅率調節表，了解差異原因是否可持續。</li><li>如果 DTL 預期不會迴轉（例如公司持續擴張、持續有加速折舊），分析時可以把 DTL 視為<b>權益</b>而不是負債。</li><li>IFRS 和 US GAAP 的 DTA、DTL 在資產負債表都列為<b>非流動</b>。</li></ul>',
      ex:'A deferred tax liability arises when taxable income is less than accounting profit because of temporary differences that will reverse in future periods.' },
    { id:'xf10', t:'財務報導品質與盈餘操縱警訊', en:'Financial Reporting Quality',
      plain:'財報品質有高有低。有些公司在規則允許範圍內選擇讓數字好看的方法，有些甚至造假。分析師要能看出警訊。',
      life:'有人只把考得好的考卷給爸媽看，或把「考 58 分」說成「差 2 分就及格」→ 雖然沒說謊，但呈現方式讓人誤會。',
      body:'<h4>財報品質 vs 盈餘品質</h4><ul><li><b>財報品質</b>：財報是否提供有用、忠實的資訊。</li><li><b>盈餘品質</b>：盈餘是否<b>可持續</b>、足以提供好的報酬。</li><li>兩者都高最好。財報品質低時，無法判斷盈餘品質。</li></ul><h4>品質光譜（由高到低）</h4><ol><li>符合準則、對決策有用、盈餘可持續且足夠。</li><li>符合準則、有用，但盈餘品質低（不可持續或太低）。</li><li>符合準則，但選擇有偏誤（<b>積極</b>：讓本期看起來更好；<b>保守</b>：讓本期看起來更差）。</li><li>符合準則，但「盈餘管理」（刻意選擇來達成目標）。</li><li>不符合準則（例如違反會計規定）。</li><li>虛構交易（造假，最差）。</li></ol><ul><li>「保守」也不一定好：例如 <b>big bath</b>（新任 CEO 一次認列大量損失，之後盈餘看起來成長）、<b>cookie jar reserves</b>（好年度多提準備，壞年度迴轉）。</li></ul><h4>舞弊三角</h4><ul><li><b>動機</b>（壓力）：達到分析師預期、獎金、債務條款。</li><li><b>機會</b>：內控不良、會計規則有很多判斷空間。</li><li><b>合理化</b>：經理人說服自己這樣做沒關係。</li></ul><h4>約束機制</h4><ul><li>市場（股價反應、資金成本）、監管機關（SEC 等）、審計師、私人契約（債權人監督）、董事會與審計委員會。</li></ul><h4>常見警訊</h4><ul><li><b>收入</b>：改變收入認列政策、<b>bill-and-hold</b>（開了發票但貨還留在公司）、<b>塞貨</b>（channel stuffing，期末大量出貨給經銷商）、應收帳款成長遠快於營收。</li><li><b>存貨</b>：存貨成長快於營收、LIFO 清算。</li><li><b>資本化</b>：把應該費用化的成本資本化、延長折舊年限、提高殘值。</li><li><b>現金流</b>：CFO 長期低於淨利；把營業項目分類到投資或籌資；延遲付款讓 CFO 暫時變好。</li><li><b>其他</b>：經常出現「非經常性」損失、大量關係人交易、頻繁更換審計師、財報時常重編、非 GAAP 指標和 GAAP 差距很大、總是剛好達成預期。</li></ul><h4>會計選擇與估計</h4><ul><li>壞帳準備、保固準備、存貨跌價、折舊年限、資產減損、商譽減損測試、遞延稅資產評價備抵、退休金假設 → 都有判斷空間。</li><li>非 GAAP 指標（例如調整後 EBITDA）：要看公司排除了哪些項目，是否合理。</li></ul>',
      ex:'Accounting choices that are conservative in the current period, such as a “big bath” write-off, can be used to inflate earnings in future periods.' },
    { id:'xf11', t:'財務比率分析與杜邦分析', en:'Financial Analysis Techniques',
      plain:'財務比率把報表上的數字變成可以比較的指標：週轉效率、流動性、償債能力、獲利能力。杜邦分析把 ROE 拆開，看出報酬是從哪裡來的。',
      life:'兩家店都賺 10 萬，但一家投入 50 萬、一家投入 500 萬 → 要用比率（報酬率）才看得出誰比較厲害。',
      body:'<h4>活動（效率）比率</h4><ul><li>存貨週轉率 = COGS ÷ 平均存貨；存貨天數 DOH = 365 ÷ 存貨週轉率。</li><li>應收帳款週轉率 = 營收 ÷ 平均應收帳款；DSO = 365 ÷ 週轉率。</li><li>應付帳款週轉率 = 採購 ÷ 平均應付帳款；DPO = 365 ÷ 週轉率。</li><li>營運資金週轉率 = 營收 ÷ 平均營運資金。</li><li>固定資產週轉率 = 營收 ÷ 平均固定資產淨額。</li><li>總資產週轉率 = 營收 ÷ 平均總資產。</li></ul><h4>流動性比率</h4><ul><li>流動比率、速動比率、現金比率。</li><li>防禦區間比率 = (現金 + 短期投資 + 應收帳款) ÷ 每日現金支出：不靠新收入能撐幾天。</li><li>現金循環週期 = DOH + DSO − DPO。</li></ul><h4>償債能力比率</h4><ul><li>負債對資產比 = 總負債 ÷ 總資產。</li><li>負債對資本比 = 總負債 ÷ (總負債 + 總權益)。</li><li>負債對權益比 = 總負債 ÷ 總權益。</li><li><b>財務槓桿比率</b> = 平均總資產 ÷ 平均總權益。</li><li>利息保障倍數 = EBIT ÷ 利息費用。</li><li>固定費用保障倍數 = (EBIT + 租賃費用) ÷ (利息 + 租賃費用)。</li></ul><h4>獲利能力比率</h4><ul><li>毛利率、營業利益率、稅前淨利率、<b>淨利率</b> = 淨利 ÷ 營收。</li><li>ROA = 淨利 ÷ 平均總資產（或用稅後 EBIT）。</li><li><b>ROE</b> = 淨利 ÷ 平均股東權益。</li><li>投入資本報酬率 = EBIT ÷ (負債 + 權益)。</li></ul><h4>杜邦分析</h4><p class="formula">ROE = 淨利率 × 總資產週轉率 × 財務槓桿 = (NI/營收) × (營收/資產) × (資產/權益)</p><p class="formula">五因子：ROE = (NI/EBT) × (EBT/EBIT) × (EBIT/營收) × (營收/資產) × (資產/權益)</p><ul><li>NI/EBT：<b>稅負比率</b>（越高稅越少）；EBT/EBIT：<b>利息負擔比率</b>（越高利息越少）；EBIT/營收：營業利益率。</li><li>ROE 上升如果是來自槓桿增加，不一定是好事（風險增加）。</li></ul><h4>評價與其他比率</h4><ul><li>本益比 P/E、股價現金流比 P/CF、股價營收比 P/S、股價淨值比 P/B。</li><li>股利支付率 = 股利 ÷ 淨利；保留率 b = 1 − 股利支付率。</li><li><b>可持續成長率 g = b × ROE</b>。</li></ul><h4>比率分析的限制</h4><ul><li>不同會計方法難以比較、跨產業不能直接比、需要判斷基準（同業、歷史）、季節性、多元化公司難找可比公司。</li><li>可以搭配<b>趨勢分析</b>（時間序列）、<b>橫斷面分析</b>（和同業比）、<b>共同比</b>報表。</li><li>信用分析常用：EBITDA 利息保障、FFO/負債、負債/EBITDA。</li><li>部門分析：用部門資料算各部門的利潤率、資產報酬率。</li></ul>',
      ex:'The DuPont decomposition shows that return on equity equals net profit margin multiplied by total asset turnover multiplied by financial leverage.' },
    { id:'xf12', t:'財報預測模型入門', en:'Introduction to Financial Statement Modeling',
      plain:'分析師用過去的財報和對產業、公司的了解，預測未來的營收、成本、利潤和現金流，再用來估算公司價值。',
      life:'預測下學期的生活費：先估「收入」（打工時數 × 時薪），再估房租、伙食等支出，最後看能存多少錢。',
      body:'<h4>營收預測方法</h4><ul><li><b>由上而下</b>（top-down）：從總體經濟或產業規模出發 → 市場成長率 × 公司市占率。例：GDP 成長 → 產業成長 → 公司營收。</li><li><b>由下而上</b>（bottom-up）：從公司的細節出發，例如門市數 × 每店營收、產能 × 價格、各產品線加總。</li><li><b>混合法</b>：兩者結合。</li></ul><h4>成本預測</h4><ul><li>銷貨成本：常以毛利率預測，要考慮原物料價格、避險部位、競爭狀況。</li><li>營業費用（銷售、管理、研發）：區分固定和變動成本；有規模經濟時費用率會下降。</li><li>非營業項目：利息費用（看負債水準和利率）、稅率（看法定稅率、地區組合）。</li><li>資本支出：維持性資本支出（約等於折舊）+ 成長性資本支出。</li><li>營運資金：用週轉天數預測。</li></ul><h4>競爭分析</h4><ul><li>用 <b>Porter 五力</b>分析產業的獲利能力，判斷公司的利潤率能否維持。</li></ul><h4>通膨與通縮的影響</h4><ul><li>公司能否把成本上漲轉嫁給客戶？取決於市場地位、需求彈性。</li><li>通膨對營收（價格上漲）和成本（原料、工資上漲）的影響時點不同。</li></ul><h4>預測的心理偏誤</h4><ul><li><b>過度自信</b>：預測區間太窄。</li><li><b>控制幻覺</b>：以為加更多細節就更準。</li><li><b>保守偏誤</b>：有新資訊時調整太慢。</li><li><b>代表性偏誤</b>：用過去的分類套用到新情況。</li><li><b>確認偏誤</b>：只找支持自己看法的資訊。</li><li>對策：用情境分析、和基本比率比較、請別人挑戰你的假設。</li></ul><h4>預測期間與情境</h4><ul><li>短期預測可以很細；長期假設會<b>趨向產業平均</b>（均值回歸）。</li><li>預測期間的長度取決於投資策略、產業週期、公司特殊情況（例如併購）。</li><li>做<b>敏感度分析</b>（改變一個假設看結果變化）和<b>情境分析</b>（樂觀、基本、悲觀）。</li></ul>',
      ex:'A top-down approach to revenue forecasting starts with expectations for the overall economy or industry and then estimates the company’s market share.' }
  ]}
);
