DATA.basic.formulas = [
  { id:'B1', t:'報酬率', en:'Holding period return', q:'這筆投資賺了百分之幾？',
    tex:'<v s="R">R</v> = (<v s="P1">P<sub>1</sub></v> − <v s="P0">P<sub>0</sub></v> + <v s="D">D</v>) ÷ <v s="P0">P<sub>0</sub></v>',
    syms:{R:['報酬率','holding period return','這段期間賺了幾 %'],P1:['期末價格','ending price','賣出（或現在）的價格'],P0:['期初價格','beginning price','買進的價格'],D:['期間收到的現金','income (dividend / coupon)','股利或利息']},
    why:'分子是「總共賺到多少錢」：價差（P<sub>1</sub> − P<sub>0</sub>）加上中間拿到的現金 D。分母是本金。除完就是「每 1 元本金賺了多少」。',
    steps:['價差 = P<sub>1</sub> − P<sub>0</sub>','加上股利 D','÷ P<sub>0</sub>','× 100%'],
    vars:[{k:'P0',s:'P<sub>0</sub>',v:50,min:1,max:500,step:1},{k:'P1',s:'P<sub>1</sub>',v:55,min:0,max:500,step:1},{k:'D',s:'D',v:2,min:0,max:50,step:0.5}],
    calc:v=>`(${v.P1} − ${v.P0} + ${v.D}) ÷ ${v.P0} = ${fx(v.P1-v.P0+v.D)} ÷ ${v.P0} = <b>${fx((v.P1-v.P0+v.D)/v.P0*100,2)}%</b>`,
    oops:['分母用期末價格','忘了加股利'], exam:'The holding period return is (P<sub>1</sub> − P<sub>0</sub> + D)/P<sub>0</sub>.', cfa:'CFA Level I Quant：holding period return。' },
  { id:'B2', t:'複利終值', en:'Future value with compounding', q:'現在的錢放 n 年後會變成多少？',
    tex:'<v s="FV">FV</v> = <v s="PV">PV</v> × (1 + <v s="r">r</v>)<sup><v s="n">n</v></sup>',
    syms:{FV:['終值','future value','未來會變成多少'],PV:['現值','present value','現在投入的錢'],r:['每期利率','interest rate per period','例如年利率 5% = 0.05'],n:['期數','number of periods','放幾年（幾期）']},
    why:'每過一期，錢都乘上 (1 + r)。過 n 期就乘 n 次 → (1 + r)<sup>n</sup>。這就是「利滾利」：第二年的利息是用「本金＋第一年利息」來算。',
    steps:['1 + r','算 n 次方','× PV'],
    vars:[{k:'PV',s:'PV',v:100,min:1,max:100000,step:1},{k:'r',s:'r (%)',v:10,min:0,max:30,step:0.5},{k:'n',s:'n',v:3,min:0,max:40,step:1}],
    calc:v=>`${v.PV} × (1 + ${v.r/100})<sup>${v.n}</sup> = ${v.PV} × ${fx(Math.pow(1+v.r/100,v.n))} = <b>${fx(v.PV*Math.pow(1+v.r/100,v.n),2)}</b>（單利只有 ${fx(v.PV*(1+v.r/100*v.n),2)}）`,
    oops:['把 (1 + r)<sup>n</sup> 算成 1 + r × n（那是單利）','利率忘了換成小數'], exam:'With annual compounding, FV = PV(1 + r)<sup>n</sup>.', cfa:'CFA Level I Quant：time value of money（超級基礎）。' },
  { id:'B3', t:'現值（折現）', en:'Present value', q:'未來的錢，今天值多少？',
    tex:'<v s="PV">PV</v> = <v s="FV">FV</v> ÷ (1 + <v s="r">r</v>)<sup><v s="n">n</v></sup>',
    syms:{PV:['現值','present value','今天值多少'],FV:['未來金額','future value','未來會拿到的錢'],r:['折現率','discount rate','你要求的報酬率／利率'],n:['期數','periods','幾年後拿到']},
    why:'就是複利公式倒過來。問自己：「今天要存多少，n 年後才會變成 FV？」答案就是 FV 除以成長倍數。利率越高、等越久，現值越小。',
    steps:['(1 + r)<sup>n</sup>','FV ÷ 它'],
    vars:[{k:'FV',s:'FV',v:1331,min:1,max:100000,step:1},{k:'r',s:'r (%)',v:10,min:0,max:30,step:0.5},{k:'n',s:'n',v:3,min:0,max:40,step:1}],
    calc:v=>`${v.FV} ÷ ${fx(Math.pow(1+v.r/100,v.n))} = <b>${fx(v.FV/Math.pow(1+v.r/100,v.n),2)}</b>`,
    oops:['乘以 (1 + r)<sup>n</sup>（方向反了）'], exam:'The present value of a future cash flow is FV/(1 + r)<sup>n</sup>.', cfa:'CFA Level I：discounted cash flow 的基礎。' },
  { id:'B4', t:'期望報酬', en:'Expected return', q:'考慮各種可能，平均會賺多少？',
    tex:'<v s="E">E(R)</v> = Σ <v s="p">p<sub>i</sub></v> × <v s="R">R<sub>i</sub></v>',
    syms:{E:['期望報酬','expected return','長期平均'],p:['第 i 種情況的機率','probability','全部加起來 = 1'],R:['第 i 種情況的報酬','return in state i','']},
    why:'每種情況「出現的次數比例」乘上「那時候的報酬」再加總，就是加權平均。',
    steps:['每種情況：機率 × 報酬','全部加起來'],
    vars:[{k:'p1',s:'好 機率',v:0.3,min:0,max:1,step:0.05},{k:'r1',s:'好 報酬%',v:20,min:-50,max:80,step:1},{k:'p2',s:'普通 機率',v:0.5,min:0,max:1,step:0.05},{k:'r2',s:'普通 報酬%',v:10,min:-50,max:80,step:1},{k:'r3',s:'差 報酬%',v:-5,min:-80,max:50,step:1}],
    calc:v=>{const p3=+(1-v.p1-v.p2).toFixed(2);return `差的機率 = 1 − ${v.p1} − ${v.p2} = ${p3}<br>${v.p1}×${v.r1} + ${v.p2}×${v.r2} + ${p3}×(${v.r3}) = <b>${fx(v.p1*v.r1+v.p2*v.r2+p3*v.r3,2)}%</b>`;},
    oops:['機率加總不等於 1'], exam:'Expected return is the probability-weighted average of possible returns.', cfa:'CFA Quant：expected value。' },
  { id:'B5', t:'標準差', en:'Standard deviation', q:'報酬晃動得多厲害（風險多大）？',
    tex:'<v s="s">σ</v> = √[ Σ <v s="p">p<sub>i</sub></v> × (<v s="R">R<sub>i</sub></v> − <v s="E">E(R)</v>)² ]',
    syms:{s:['標準差','standard deviation','風險的大小'],p:['機率','probability',''],R:['各情況報酬','return in state i',''],E:['期望報酬','expected return','平均']},
    why:'① 每個結果跟平均差多少（R − E）。② 有正有負會互相抵消，所以先平方。③ 用機率加權平均 → 變異數。④ 平方後單位變成「%²」很奇怪，開根號回到 % → 標準差。',
    steps:['算 E(R)','每個 R − E(R)','平方','× 機率後加總 = 變異數','開根號'],
    vars:[{k:'r1',s:'情況1 報酬%',v:20,min:-50,max:80,step:1},{k:'r2',s:'情況2 報酬%',v:0,min:-50,max:80,step:1}],
    calc:v=>{const E=(v.r1+v.r2)/2;const var_=((v.r1-E)**2+(v.r2-E)**2)/2;return `兩種情況各 50%：E = ${fx(E,2)}%<br>σ² = 0.5×(${v.r1}−${fx(E,2)})² + 0.5×(${v.r2}−${fx(E,2)})² = ${fx(var_,2)}　→ σ = <b>${fx(Math.sqrt(var_),2)}%</b>`;},
    oops:['忘了開根號','沒平方直接加（正負抵消變 0）'], exam:'Standard deviation measures the dispersion of returns around the mean and is used as a measure of total risk.', cfa:'CFA Quant：variance and standard deviation。' },
  { id:'B6', t:'相關係數', en:'Correlation coefficient', q:'兩個資產是不是一起漲跌？',
    tex:'<v s="r">ρ</v> = <v s="c">Cov(X,Y)</v> ÷ (<v s="sx">σ<sub>X</sub></v> × <v s="sy">σ<sub>Y</sub></v>)',
    syms:{r:['相關係數','correlation','−1 到 1'],c:['共變異數','covariance','一起偏離平均的程度'],sx:['X 的標準差','σ of X',''],sy:['Y 的標準差','σ of Y','']},
    why:'共變異數有方向但沒有固定刻度（單位一換數字就變），除以兩個標準差就把它「標準化」成 −1～1，可以直接比較。',
    steps:['算 Cov','算 σ<sub>X</sub>、σ<sub>Y</sub>','相除'],
    vars:[{k:'c',s:'Cov',v:0.006,min:-0.05,max:0.05,step:0.001},{k:'sx',s:'σ<sub>X</sub>',v:0.1,min:0.01,max:1,step:0.01},{k:'sy',s:'σ<sub>Y</sub>',v:0.2,min:0.01,max:1,step:0.01}],
    calc:v=>{const r=v.c/(v.sx*v.sy);return `${v.c} ÷ (${v.sx} × ${v.sy}) = <b>${fx(r,3)}</b>${Math.abs(r)>1?'（超過 ±1，這組數字不可能存在）':''}`;},
    oops:['忘了乘兩個標準差'], exam:'Correlation equals covariance divided by the product of the two standard deviations; it ranges from −1 to +1.', cfa:'CFA Quant＋Portfolio：covariance、correlation。' },
  { id:'B7', t:'兩資產組合的報酬與風險', en:'Two-asset portfolio', q:'把錢分成兩份投資，整體報酬與風險是多少？',
    tex:'<v s="Rp">E(R<sub>p</sub>)</v> = <v s="w">w</v>R<sub>1</sub> + (1−<v s="w">w</v>)R<sub>2</sub><br><v s="sp">σ<sub>p</sub>²</v> = w²σ<sub>1</sub>² + (1−w)²σ<sub>2</sub>² + 2w(1−w)<v s="r">ρ</v>σ<sub>1</sub>σ<sub>2</sub>',
    syms:{Rp:['組合期望報酬','portfolio expected return','加權平均'],w:['投資在資產 1 的比例','weight','0～1'],sp:['組合變異數','portfolio variance','開根號 = 組合標準差'],r:['相關係數','correlation','越小 → 分散效果越好']},
    why:'報酬就是簡單的加權平均。風險卻<b>不是</b>加權平均：多了最後一項「2w(1−w)ρσ<sub>1</sub>σ<sub>2</sub>」。ρ 越小（甚至負的），這一項越小，組合風險就比兩個單獨的都低 → 這就是分散投資的數學。',
    steps:['報酬：權重 × 報酬，加總','風險：代入三項','開根號'],
    vars:[{k:'w',s:'w',v:0.5,min:0,max:1,step:0.05},{k:'s1',s:'σ<sub>1</sub>%',v:20,min:0,max:60,step:1},{k:'s2',s:'σ<sub>2</sub>%',v:30,min:0,max:60,step:1},{k:'r',s:'ρ',v:0.2,min:-1,max:1,step:0.05}],
    calc:v=>{const w=v.w,a=v.s1/100,b=v.s2/100;const vp=w*w*a*a+(1-w)**2*b*b+2*w*(1-w)*v.r*a*b;return `σ<sub>p</sub>² = ${fx(w*w*a*a)} + ${fx((1-w)**2*b*b)} + ${fx(2*w*(1-w)*v.r*a*b)} = ${fx(vp)}<br>σ<sub>p</sub> = <b>${fx(Math.sqrt(Math.max(vp,0))*100,2)}%</b>（加權平均會是 ${fx((w*a+(1-w)*b)*100,2)}%，差距就是分散的好處）`;},
    oops:['把組合標準差當成加權平均'], exam:'Portfolio risk is lower than the weighted average of individual risks whenever the correlation is less than +1.', cfa:'CFA Level I Portfolio Management：必考。' },
  { id:'B8', t:'夏普比率', en:'Sharpe ratio', q:'每承擔 1 單位總風險，多賺多少？',
    tex:'<v s="S">Sharpe</v> = (<v s="Rp">R<sub>p</sub></v> − <v s="rf">R<sub>f</sub></v>) ÷ <v s="s">σ<sub>p</sub></v>',
    syms:{S:['夏普比率','Sharpe ratio','風險調整後的績效'],Rp:['組合報酬','portfolio return',''],rf:['無風險利率','risk-free rate',''],s:['組合標準差','portfolio standard deviation','總風險']},
    why:'R<sub>p</sub> − R<sub>f</sub> 是「比放定存多賺的部分」（超額報酬），除以「承擔的風險」。像比較兩份打工的「時薪」，而不是只看總薪水。',
    steps:['超額報酬 = R<sub>p</sub> − R<sub>f</sub>','÷ σ<sub>p</sub>'],
    vars:[{k:'Rp',s:'R<sub>p</sub>%',v:12,min:-20,max:50,step:0.5},{k:'rf',s:'R<sub>f</sub>%',v:2,min:0,max:10,step:0.25},{k:'s',s:'σ<sub>p</sub>%',v:20,min:1,max:60,step:1}],
    calc:v=>`(${v.Rp} − ${v.rf}) ÷ ${v.s} = <b>${fx((v.Rp-v.rf)/v.s,3)}</b>`,
    oops:['用 β 當分母（那是 Treynor）'], exam:'The Sharpe ratio measures excess return per unit of total risk.', cfa:'CFA Level I：Sharpe ratio 必考。' },
  { id:'B9', t:'貝他', en:'Beta', q:'這支股票對大盤有多敏感？',
    tex:'<v s="b">β<sub>i</sub></v> = <v s="c">Cov(R<sub>i</sub>, R<sub>M</sub>)</v> ÷ <v s="v">σ<sub>M</sub>²</v> = <v s="r">ρ<sub>iM</sub></v> × <v s="si">σ<sub>i</sub></v> ÷ <v s="sm">σ<sub>M</sub></v>',
    syms:{b:['貝他','beta',''],c:['與市場的共變異數','covariance with market',''],v:['市場變異數','market variance',''],r:['與市場的相關係數','correlation with market',''],si:['股票標準差','stock σ',''],sm:['市場標準差','market σ','']},
    why:'把 Cov 換成 ρσ<sub>i</sub>σ<sub>M</sub> 就得到第二個寫法。發現了嗎？它跟衍金的 h* = ρσ<sub>S</sub>/σ<sub>F</sub> 長得一模一樣！所以用指數期貨避險時，β 就是避險比率。',
    steps:['ρ × σ<sub>i</sub>','÷ σ<sub>M</sub>'],
    vars:[{k:'r',s:'ρ',v:0.8,min:-1,max:1,step:0.05},{k:'si',s:'σ<sub>i</sub>%',v:30,min:1,max:80,step:1},{k:'sm',s:'σ<sub>M</sub>%',v:20,min:1,max:60,step:1}],
    calc:v=>`${v.r} × ${v.si} ÷ ${v.sm} = <b>${fx(v.r*v.si/v.sm,3)}</b>`,
    oops:['除以 σ<sub>M</sub> 而不是 σ<sub>M</sub>²（用 Cov 的寫法時）'], exam:'Beta equals the covariance of the asset with the market divided by the variance of the market.', cfa:'CFA Level I：beta、CAPM 必考。' }
];
// ===== 不動產財管（清大磨課師）：依九個單元標題整理的複習卡 =====
// 內容為依單元主題自行整理的重點，數字與法規以課程講義和最新公告為準
DATA.re = {
  name: '不動產', full: '不動產財管', hue: 're',
  intro: '清大磨課師（影片課）。期中 11/12：單元 1–6（法規、固定利率與浮動利率房貸、MBS Ⅰ–Ⅱ）；期末 12/17：單元 7–9（MBS Ⅲ與衍生品、逆向房貸與房市危機）。這裡依單元標題整理重點，看完影片後用來複習；細節以老師的講義為準。',
  sections: [
  { id:'re1', t:'1. 房地產相關法規', cards: [
    { id:'re1a', t:'抵押權：房貸的法律基礎', en:'Mortgage (hypothec) under the Civil Code',
      plain:'借錢買房時，銀行會在房子上設定「抵押權」。房子還是你的、你照樣住，但如果你不還錢，銀行可以聲請法院拍賣房子，從拍賣價金優先拿回借款。',
      life:'把機車借據交給朋友保管當擔保：機車照樣是你在騎，但你不還錢，朋友可以把機車賣掉抵債，而且比其他債主先拿錢。',
      body:'<p class="ez lead">房貸其實是兩件事：你<b>欠銀行錢</b>（債），以及你把房子<b>押給銀行當保證</b>（抵押權）。抵押權就是「如果你不還，銀行可以把房子拍賣、先拿錢」的權利。下面每一點都在講這個權利的細節。</p><ul><li><b>普通抵押權</b>（民法 §860）：對債務人或第三人<b>不移轉占有</b>而供擔保的不動產，得就其賣得價金<b>優先受償</b>。<span class="ez">「不移轉占有」＝房子還是你住、你用，銀行只是在登記簿上掛一個名字。「優先受償」＝房子被拍賣後，銀行比其他債主（例如你欠錢的朋友）先拿錢。</span></li><li><b>最高限額抵押權</b>（民法 §881-1）：在約定的最高金額內，擔保一定範圍內<b>不特定</b>的債權（例如企業和銀行的往來借款、可循環動用的房貸）。<span class="ez">普通抵押權是「擔保這一筆借款」；最高限額抵押權是先設一個上限（例如 1,200 萬），在這個額度內借了又還、還了又借都算數，不用每借一次就去登記一次。</span></li><li>債務到期沒清償 → 抵押權人可以<b>聲請法院拍賣</b>抵押物（民法 §873）。<span class="ez">注意：台灣的銀行不能自己把房子收走，一定要透過<b>法院</b>拍賣，拍賣的錢再拿來還債。</span></li><li><b>順位</b>：同一不動產可設定多個抵押權，依登記先後受償（第一順位最優先）→ 二胎房貸利率較高。<span class="ez">同一間房子可以押給好幾家銀行。拍賣後先還第一順位，有剩才輪到第二順位。第二順位（二胎）比較可能拿不到錢，風險高，所以利率比較高。</span></li><li>抵押權具有<b>從屬性</b>（跟著債權走）與<b>不可分性</b>（債權還沒全部清償前，抵押物全部都擔保）。<span class="ez"><b>從屬性</b>：抵押權是為了債而存在，債還清了，抵押權也跟著消失；債被轉讓，抵押權也跟著走。<b>不可分性</b>：借 1,000 萬還了 900 萬，房子不會只剩「十分之一」被押著，還是整間都押著，直到全部還完。</span></li><li>抵押權要<b>登記</b>才生效（不動產物權變動採登記生效主義）。<span class="ez">沒去地政事務所登記，抵押權就不存在。登記也讓其他人查得到「這間房子已經押給誰」。</span></li></ul>' },
    { id:'re1b', t:'金融監理：銀行法 §72-2 與央行選擇性信用管制', en:'Bank lending limits and selective credit controls',
      plain:'政府擔心銀行把太多錢借給房地產、房價過熱，所以限制銀行的不動產放款比例，央行也會限制特定族群（例如買第二戶、公司買房）的貸款成數。',
      life:'學校規定福利社一天最多只能賣多少零食，避免大家都只吃零食；央行就是在限制「借錢買房」這種零食。',
      body:'<p class="ez lead">這張卡在講政府怎麼<b>踩煞車</b>：避免銀行把太多錢借進房市、避免大家借太多錢炒房。兩個工具：限制銀行的放款總量（銀行法），以及限制每一筆貸款能借幾成（央行）。</p><ul><li><b>銀行法 §72-2</b>：商業銀行的住宅與企業建築放款總額，原則上不得超過存款總餘額加金融債券發售額的 <b>30%</b>（部分項目如特定自用住宅貸款可排除）。目的是控制銀行對不動產的集中度風險。<span class="ez">意思是：銀行收到的存款，最多只能有大約三成拿去借給買房、蓋房的人。如果銀行把錢都押在房地產，房市一崩，銀行就會一起倒。</span></li><li><b>央行選擇性信用管制</b>：針對特定對象限制<b>貸款成數（LTV）</b>、取消<b>寬限期</b>等，例如：公司法人購置住宅、自然人第二戶以上購屋、高價住宅、餘屋與購地貸款。央行近年多次加碼調整，<b>確切成數以央行最新規定為準</b>。<span class="ez">「選擇性」＝只針對特定族群，不是全部人。例如買第二間房、公司買住宅、買很貴的房子，能借的成數會被壓低，也不能有寬限期（前幾年只繳利息）。目的是打擊投資客，不影響首購自住的人。</span></li><li><b>LTV</b>（loan-to-value）＝ 貸款金額 ÷ 房屋價值：LTV 越高，借款人自備款越少，違約風險越高。<span class="ez">例：房子 1,000 萬、借 800 萬 → LTV 80%，自己出 200 萬。LTV 越高，房價只要跌一點，房子就不夠還貸款，借款人比較可能放棄不繳。</span></li><li><b>DTI</b>（debt-to-income）＝ 每月還款 ÷ 每月所得：銀行用來評估還款能力，一般希望在約 1/3 以內。<span class="ez">例：月收入 9 萬、每月要還 3 萬 → DTI 約 33%。這個比率越高，代表薪水有越大一塊要拿去還錢，萬一收入減少就容易還不出來。</span></li><li>總體審慎政策（macroprudential）：用 LTV、DTI 上限等工具抑制房市與信用過度擴張。<span class="ez">「總體審慎」＝不是看單一銀行安不安全，而是看整個金融體系。LTV、DTI 上限就像整個社會的借錢上限。</span></li></ul>' },
    { id:'re1c', t:'交易與稅制：實價登錄、平均地權條例、房地合一稅', en:'Transaction disclosure and property taxation',
      plain:'為了讓房市透明、打擊炒房，政府要求成交價格公開（實價登錄），限制預售屋轉售，並對短期買賣的房地課較高的所得稅（房地合一稅）。',
      life:'二手球鞋平台公開每筆成交價，就不容易被亂喊價；如果平台還規定「買到限量鞋一年內轉賣要多繳手續費」，就能減少黃牛。',
      body:'<p class="ez lead">這張卡是台灣近年「打炒房」的三套工具：讓成交價<b>透明</b>（實價登錄）、讓預售屋<b>不能隨便轉賣</b>（平均地權條例）、讓<b>短期買賣要繳重稅</b>（房地合一稅）。</p><ul><li><b>實價登錄 2.0</b>（2021 年起施行）：成交資訊<b>門牌完整揭露</b>、<b>預售屋</b>在銷售前要報備且成交後即時申報、紅單交易納管。<span class="ez">以前只揭露「某某路 100–200 號」，現在門牌完整，大家查得到每一戶真實成交價，建商和投資客比較難哄抬。「紅單」是預售屋還沒簽約前的購屋預約單，以前常被拿來轉賣炒作。</span></li><li><b>平均地權條例修正</b>（2023）：<ul><li>預售屋及新建成屋<b>禁止換約轉售</b>（有例外）。<span class="ez">換約轉售＝還沒交屋就把買房的權利賣給別人賺價差。禁止後，投資客就很難靠「買預售、轉手賺」來炒。</span></li><li><b>私法人</b>購買住宅改採<b>許可制</b>。<span class="ez">私法人就是公司。以前有人用公司名義大量買住宅避稅、炒房；現在公司要買住宅得先經過政府許可。</span></li><li>炒作行為（例如散布不實資訊、聯合哄抬）可處罰；設檢舉獎金。</li><li>預售屋解約要申報。</li></ul></li><li><b>房地合一稅 2.0</b>（2021/7/1 起）：個人出售房地依<b>持有期間</b>課稅：2 年內 45%、超過 2 年未滿 5 年 35%、5–10 年 20%、超過 10 年 15%；<b>自住</b>房地符合條件（本人、配偶或未成年子女設籍並居住滿 6 年）稅率 10%，且有 400 萬元免稅額。<span class="ez">概念：持有越短 → 越像炒作 → 稅越重。例：2 年內就賣，賺的錢要繳 45%；放 10 年以上只要 15%。真的自住滿 6 年，賺 400 萬以內不用繳，超過部分只課 10%。</span></li><li>持有成本：<b>地價稅</b>、<b>房屋稅</b>（「囤房稅 2.0」對非自住多戶提高稅率）。<span class="ez">持有成本＝每年只要擁有房子就要繳的稅。囤房稅讓「手上很多間房、又不是自住」的人每年繳更多，鼓勵把空屋拿出來賣或租。</span></li></ul>' },
    { id:'re1d', t:'證券化法規：金融資產證券化與不動產證券化條例', en:'Securitization acts in Taiwan', cfa:'Fixed Income：securitization',
      plain:'台灣有兩部法律讓「房貸」和「房地產」可以切成證券賣給投資人：一部處理貸款債權（例如 MBS），一部處理不動產本身（REITs、REATs）。',
      life:'把一整棟大樓切成很多小股份，讓每個人都能用小錢投資收租 → 不動產證券化。',
      body:'<p class="ez lead">證券化＝把<b>不好賣的資產</b>（一筆一筆的房貸、一整棟大樓）切成很多小單位的證券，讓一般投資人也能買。台灣有兩部法：一部處理「債權」（房貸、車貸），一部處理「不動產本身」。</p><ul><li><b>金融資產證券化條例</b>（2002）：銀行可以把房貸、車貸等債權信託或讓與給特殊目的機構（SPV／特殊目的信託），發行受益證券或資產基礎證券 → 例如<b>住宅貸款證券（MBS）</b>。<span class="ez">流程像這樣：銀行有一堆房貸，每個月都會收到借款人的還款。銀行把這些房貸交給一個專門的機構（SPV），SPV 發行證券賣給投資人，以後借款人繳的錢就分給投資人。銀行則馬上拿回現金。</span></li><li><b>不動產證券化條例</b>（2003）：<ul><li><b>REITs</b>（不動產投資信託）：先向投資人<b>募集資金</b>，再去<b>買</b>不動產或相關權利，收租金分配給投資人。<span class="ez">想像大家合資買一棟辦公大樓：先湊錢，再買樓，收到的租金按比例分給大家。在股市就能買到，金額很小也能參與。</span></li><li><b>REATs</b>（不動產資產信託）：不動產所有人<b>把不動產信託</b>給受託機構，換成受益證券賣給投資人（先有不動產、後有錢）。<span class="ez">和 REITs 方向相反：已經有一棟樓的人（例如建商）把樓交給信託，切成證券賣出去換現金。記法：REITs 先有錢再買樓；REATs 先有樓再換錢。</span></li></ul></li><li>證券化的好處：資產流動化、發起銀行取得資金、分散風險、投資人有新的投資工具；風險：資訊不對稱、結構複雜（2008 年金融海嘯的教訓）。<span class="ez">好處是錢可以流動起來；壞處是包裝太多層，投資人看不清楚裡面到底有什麼，出問題時損失會擴散到很多人身上。</span></li></ul>' }
  ]},
  { id:'re2', t:'2. 固定利率抵押貸款Ⅰ', cards: [
    { id:'re2a', t:'固定利率房貸與本息平均攤還（CPM）', en:'Fixed-rate constant payment mortgage', pre:['bpv','bint'], cfa:'Fixed Income：mortgage cash flows',
      plain:'固定利率房貸最常見的是「本息平均攤還」：每個月繳一樣的金額，前期大部分是利息，後期大部分是本金。每月付款額就是把貸款當成年金的現值去反推。',
      life:'借 1,000 萬、年利率 2%、20 年：每月大約繳 5 萬 589 元。第一個月利息就有約 1 萬 6,667 元，本金只還了約 3 萬 3,900 元。',
      body:'<p class="ez lead">這是最常見的房貸：<b>每個月繳一樣多</b>。但這固定的金額裡，「利息」和「本金」的比例每個月都在變：一開始欠很多，所以大部分在付利息；越到後面欠得越少，大部分就在還本金。</p><p class="formula">每月付款 PMT = L × r ÷ [1 − (1 + r)<sup>−n</sup>]</p><ul><li>L：貸款金額；r：<b>月利率</b>（年利率 ÷ 12）；n：總期數（年數 × 12）。<span class="ez">公式不用死背推導，只要知道：房貸是月繳，所以利率要除以 12、年數要乘以 12。這個公式就是年金現值公式反過來解出每期付款。</span></li><li>每期付款拆成：<b>利息 = 期初餘額 × r</b>；<b>本金 = PMT − 利息</b>。<span class="ez">每個月先算這個月要付的利息（還欠多少 × 月利率），剩下的錢才拿去還本金。</span></li><li>期末餘額 = 期初餘額 − 本期本金。<span class="ez">例：欠 1,000 萬、月利率 0.1667% → 第 1 個月利息 16,667 元；付 50,589 元，扣掉利息後有 33,922 元拿去還本金；月底還欠 999 萬 6,078 元。下個月再用新的餘額重算利息。</span></li><li><b>剩餘本金</b>（貸款餘額）= 剩下所有付款以原利率折現的<b>現值</b>：B<sub>k</sub> = PMT × [1 − (1 + r)<sup>−(n−k)</sup>] ÷ r。<span class="ez">想知道「現在還欠多少」，不用一個月一個月扣：把剩下還沒付的那些月付款，全部用原利率折回今天，就是目前的餘額。</span></li><li>例：L = 1,000 萬、年利率 2%、20 年 → r = 0.1667%、n = 240 → PMT ≈ <b>50,589</b> 元；總利息 ≈ 50,589 × 240 − 1,000 萬 ≈ 214 萬。<span class="ez">1,000 萬借 20 年，付了大約 1,214 萬，多出來的 214 萬就是利息。</span></li><li>期限越長，每月付款越少，但<b>總利息越多</b>；利率越高，前期利息占比越高。<span class="ez">期限拉長 → 每個月輕鬆一點，但欠錢的時間變長，付的利息總額變多。</span></li><li>計算機：N = 240、I/Y = 2/12、PV = 1,000 萬、FV = 0 → CPT PMT。<span class="ez">財務計算機輸入：期數、每期利率、借到的錢（現值），未來餘額為 0（要還完），按 CPT PMT 就算出每月付款。</span></li></ul>',
      terms:[['攤還表','amortization schedule：列出每期的付款、利息、本金、餘額'],['LTV','貸款成數 = 貸款 ÷ 房價'],['寬限期','只繳利息、不還本金的期間，之後每月付款會變高']] },
    { id:'re2b', t:'本金平均攤還（CAM）與其他還款方式', en:'Constant amortization mortgage and alternatives',
      plain:'除了本息平均攤還，還可以選「本金平均攤還」：每期還一樣多的本金，利息隨餘額遞減，所以每月付款一開始最高、之後越來越少，總利息比較少。',
      life:'分期還朋友 12,000 元：每月固定還 1,000 本金再加利息（本金攤還），第一個月最辛苦；或每月繳一樣多（本息攤還），比較好規劃。',
      body:'<p class="ez lead">除了「每月繳一樣」，房貸還有好幾種還法。差別在於：<b>本金什麼時候還</b>。本金還得越快，欠錢的時間越短，總利息越少，但前期負擔越重。</p><ul><li><b>本金平均攤還 CAM</b>：每期本金 = L ÷ n；利息 = 期初餘額 × r → 付款逐期<b>遞減</b>。前期負擔重，但總利息比 CPM 少（因為本金還得比較快）。<span class="ez">例：借 1,200 萬、20 年 → 每月固定還本金 5 萬，加上利息。第 1 個月利息最多，所以第 1 個月最貴；之後欠得越來越少，利息變少，月付款跟著變少。</span></li><li><b>本息平均攤還 CPM</b>：付款固定，最常見，方便規劃。<span class="ez">每月金額都一樣，比較好安排家庭預算，所以最多人選。</span></li><li><b>只付利息＋到期一次還本</b>（interest-only / balloon）：每期只付利息，到期有大筆氣球款 → 再融資風險高。<span class="ez">平常只付利息、本金完全不動，最後一期要一次還清全部本金（像氣球一樣最後才鼓起來）。風險是到時候拿不出這筆錢，又借不到新貸款。</span></li><li><b>漸增型付款 GPM</b>（graduated payment mortgage）：前幾年付款較低、逐年增加，適合所得預期會成長的年輕人；前期付款可能小於利息 → <b>負攤還</b>（餘額增加）。<span class="ez">負攤還＝付的錢連利息都不夠，沒付到的利息被加進欠款，結果越繳欠越多。</span></li><li><b>寬限期</b>：前幾年只付利息，寬限期結束後要在剩下的期間攤還全部本金 → 付款會突然跳升（央行選擇性信用管制常限制寬限期）。<span class="ez">例：30 年房貸、前 3 年寬限期 → 前 3 年只繳利息，第 4 年起要用剩下 27 年把全部本金還完，月付款會一下子變多。</span></li><li>台灣例子：「新青安」貸款提供較長期限（最長 40 年）與寬限期，降低年輕人前期負擔（實際條件以政府公告為準）。<span class="ez">期限拉長到 40 年、加上寬限期，都是讓每個月繳少一點，但總利息會變多。</span></li></ul>' },
    { id:'re2c', t:'借款人的實際成本：手續費、點數與 APR', en:'Effective borrowing cost, points and APR',
      plain:'除了利率，房貸還有開辦費、點數（預付利息）等費用，借款人實際拿到的錢比較少，所以真正的借款成本比表定利率高。提前還款時，費用攤提的期間變短，實際成本會更高。',
      life:'借 100 元、利率 5%，但要先付 2 元手續費，你實際只拿到 98 元，卻要照 100 元還本付息 → 實際利率超過 5%。',
      body:'<p class="ez lead">銀行說「利率 2%」，但你真正的成本通常不只 2%，因為還有各種<b>先付的費用</b>。這張卡教你算「把所有費用都算進去之後，真正的利率是多少」。</p><ul><li><b>點數</b>（discount points）：1 點 = 貸款金額的 1%，在貸款時先付給貸方，換取較低的利率。<span class="ez">例：借 800 萬、付 1 點 → 先付 8 萬給銀行，換到比較低的利率。等於「先多付一點錢，之後每個月少付一點」。</span></li><li><b>有效借款成本</b>：解出讓「實際拿到的金額 = 未來付款的現值」的折現率（就是 IRR）：<span class="ez">例：借 1,000 萬，但扣掉手續費實際只拿到 980 萬，卻要照 1,000 萬來還。用「實際拿到 980 萬、之後付的那些錢」去算報酬率，算出來的利率會比 2% 高，那才是真實成本。</span></li></ul><p class="formula">L − 費用 = Σ PMT ÷ (1 + i)<sup>t</sup> + 提前還款時的餘額 ÷ (1 + i)<sup>k</sup></p><ul><li>持有期間越<b>短</b>，前期費用攤提的期間越短 → 有效成本越<b>高</b>。<span class="ez">費用是一開始就付的。如果 3 年後就賣房還清，這筆費用只分攤在 3 年上，每年負擔就很重；如果繳 20 年，每年分到的就很少。</span></li><li><b>APR</b>（美國 Truth in Lending 規定的年百分率）：假設持有到期計算，所以會<b>低估</b>提前還款者的實際成本。台灣則要求揭露「總費用年百分率」。<span class="ez">APR 是把費用算進去的年利率，但它假設你會一路繳到最後。實際上很多人幾年後就換屋或轉貸，所以真實成本比 APR 更高。</span></li><li><b>提前清償違約金</b>：通常在前 1–3 年提前還款要付一定比例（例如餘額的 1%），也會提高有效成本。<span class="ez">綁約期內提早還清要付罰金，就像手機綁約提前解約要付違約金。</span></li><li>選擇「低利率＋高費用」或「高利率＋低費用」：預計<b>持有越久</b>，越適合付點數換低利率。<span class="ez">道理：點數是一次性費用，低利率是每個月都省。住得越久，每個月省下的錢累積越多，越能把點數的錢賺回來。</span></li></ul>' }
  ]},
  { id:'re3', t:'3. 固定利率抵押貸款Ⅱ', cards: [
    { id:'re3a', t:'貸方的報酬與風險：收益率、提前還款、利率風險', en:'Lender yield and risks of fixed-rate mortgages', cfa:'Fixed Income：prepayment risk',
      plain:'對銀行來說，固定利率房貸的收益要算上收的費用；但它也承擔很多風險：利率上升時錢被綁在低利率（利率風險），利率下降時借款人提前還款（提前還款風險），還有借款人違約。',
      life:'你借朋友錢約定 10 年都收 2% 利息，後來銀行定存都 5% 了，你很虧；但如果利率掉到 1%，朋友會馬上借別人的錢來還你，你又沒得賺。',
      body:'<p class="ez lead">前面是站在<b>借款人</b>角度，這張換成<b>銀行</b>角度：銀行賺多少，又怕什麼。固定利率房貸讓銀行承擔很多風險，所以利率裡要包含這些風險的補償。</p><ul><li><b>貸方收益率</b>（lender yield）：用貸方實際付出的金額（L − 費用）和收到的付款算 IRR，會高於表定利率。<span class="ez">銀行借出 1,000 萬但先收了手續費，實際只拿出 980 萬，卻照 1,000 萬收款，所以銀行實際賺的利率比合約上寫的高。</span></li><li><b>利率風險</b>：市場利率上升，固定利率房貸的價值下跌；而且銀行的資金來源（存款）多為短期 → <b>期限錯配</b>（1980 年代美國儲貸危機的主因之一）。<span class="ez">銀行的錢來自存款，存款利率會隨市場變；但固定利率房貸收的利息 30 年都不變。市場利率一漲，銀行付給存戶的利息變多，收到的房貸利息卻沒變，就會虧錢。這就是「借短貸長」的期限錯配。</span></li><li><b>提前還款風險</b>：利率下跌時借款人轉貸或提前還款，貸方只能以較低利率再投資（借款人等於擁有一個<b>買權</b>）。<span class="ez">利率下跌時，借款人會借新的低利貸款來還舊的高利貸款。銀行被提早還錢，只能把錢拿去借給利率更低的人。借款人想還就還，就像手上有一個「可以用原價買回貸款」的權利（買權）。</span></li><li><b>違約風險</b>：LTV 越高、DTI 越高、房價下跌時，違約機率越高。<span class="ez">借得越多（LTV 高）、收入被還款吃掉越多（DTI 高），一遇到失業或房價下跌就越可能不繳。</span></li><li><b>流動性風險</b>：個別房貸不容易賣 → 證券化可以解決。<span class="ez">一筆房貸很難直接賣給別人（每筆條件都不一樣），銀行的錢就被綁住；打包成證券後就容易賣。</span></li><li>房貸利率 ≈ 無風險實質利率 + 預期通膨 + 違約風險溢酬 + 利率風險溢酬 + 提前還款風險溢酬 + 流動性溢酬。<span class="ez">房貸利率可以拆成很多塊：基本的時間價值、補償通膨，再加上每一種風險的補償。哪種風險越大，那一塊就越大。</span></li><li>貸款的市場價值 = 剩餘付款以<b>目前市場利率</b>折現；市場利率高於合約利率 → 貸款價值低於餘額。<span class="ez">例：你借給朋友 100 萬、利率 2%。現在市場上隨便借都有 4%，別人不會願意用 100 萬買你這筆只收 2% 的借據，所以它值不到 100 萬。</span></li></ul>' },
    { id:'re3b', t:'轉貸（再融資）決策', en:'Refinancing decision',
      plain:'利率下跌時，可以考慮借新的低利貸款還掉舊的高利貸款。要比較的是：未來每月省下的錢折現回來，有沒有超過轉貸要付的成本（違約金、手續費、代書費）。',
      life:'換電信方案：新方案每月便宜 200 元，但解約要付 3,000 元違約金。如果還會用超過 15 個月才划算。',
      body:'<p class="ez lead">轉貸＝借一筆新的、比較便宜的貸款，把舊貸款還掉。聽起來一定划算，但轉貸要付一堆費用，所以要算：<b>以後省下的錢，夠不夠付這次的費用</b>。</p><ul><li><b>轉貸的效益</b> = 每月付款的節省 → 在預計持有期間內的<b>現值</b>（用新貸款利率折現）＋ 期末餘額差異的現值。<span class="ez">把未來每個月省下的錢，全部換算成今天的價值加起來，才能和今天要付的費用公平比較。</span></li><li><b>轉貸的成本</b>：舊貸款的提前清償違約金、新貸款的開辦費、點數、設定費、代書費等。<span class="ez">這些都是「今天就要付」的錢。</span></li><li>決策：效益現值 &gt; 成本 → 轉貸（NPV &gt; 0）。<span class="ez">省下的錢（換算成今天）大於今天付的費用 → 值得轉貸；反之就不要轉。</span></li><li>也可以算<b>轉貸的報酬率</b>（IRR）：成本當期初投入、每月節省當報酬，和新貸款利率比較。<span class="ez">另一種看法：把轉貸當成一筆投資，今天付費用，之後每個月領回省下的錢，算這筆投資的報酬率夠不夠高。</span></li><li>預計持有期間越<b>短</b>，轉貸越不划算（省的時間不夠攤回成本）。<span class="ez">例：費用 9 萬、每月省 3,000 → 要 30 個月才回本。如果 2 年後就要賣房，還沒回本就結束了，不划算。</span></li><li>簡單判斷：<b>回收期</b> = 轉貸成本 ÷ 每月節省（但忽略時間價值）。<span class="ez">回收期很好算，但它把「今天的 1 元」和「2 年後的 1 元」當成一樣，所以只能當粗略判斷。</span></li><li>轉貸也可以順便調整期限或增貸，但延長期限會增加總利息。<span class="ez">例如舊貸款只剩 15 年，轉貸時又重新借 30 年，每月付款看起來變少很多，但其實是因為還款時間拉長，總利息不一定省。</span></li></ul>' },
    { id:'re3c', t:'貸款承作：還款能力、擔保品與房價評估', en:'Mortgage underwriting',
      plain:'銀行決定要不要借、借多少，會看「人」（所得、信用、負債）和「房子」（估價、地點、屋況），常用 LTV 和 DTI 兩個指標。',
      life:'朋友跟你借錢，你會想：他有沒有穩定打工收入（還款能力）、之前借錢有沒有準時還（信用）、他抵押的東西值多少（擔保品）。',
      body:'<p class="ez lead">「承作」就是銀行決定要不要借你錢、借多少。銀行看兩件事：<b>你還不還得起</b>（人），以及萬一你不還，<b>房子值不值錢</b>（擔保品）。</p><ul><li><b>借款人</b>：所得與工作穩定性、信用紀錄（台灣看聯徵中心）、既有負債、自備款來源。<span class="ez">聯徵中心就像全國的信用紀錄資料庫，記錄你有沒有遲繳信用卡、欠多少錢。</span></li><li><b>擔保品</b>：不動產<b>估價</b>（比較法、收益法、成本法）、區位、屋齡、用途、是否為特殊建物。<span class="ez">房子是銀行最後的保障，所以要先估它值多少。地點差、屋齡老、或是很難賣的特殊房屋（例如工業住宅、小坪數套房），銀行會借得比較少。</span></li><li><b>LTV</b>：越高風險越高 → 成數高的貸款利率較高或需要房貸保險。<span class="ez">借的成數越高，銀行萬一要拍賣，房子越可能不夠還，所以會用較高的利率或要求保險來補償。</span></li><li><b>DTI／負債比</b>：每月總還款 ÷ 每月所得。<span class="ez">看薪水夠不夠付每個月的還款。</span></li><li><b>寬限期與期限</b>：影響每月負擔與違約風險。<span class="ez">期限越長、有寬限期，每月負擔越輕，但寬限期結束時付款會跳升。</span></li><li>不動產估價三方法：<ul><li><b>比較法</b>：參考附近類似物件的成交價（實價登錄）。<span class="ez">最直覺的方法：隔壁同樣大小的房子上個月賣 1,500 萬，這間大概也差不多，再依樓層、屋況調整。</span></li><li><b>收益法</b>：價值 = 淨營業收入 ÷ 資本化率（出租型不動產）。<span class="ez">例：一間店面每年淨租金 60 萬，這類店面的報酬率大約 4%，價值 ≈ 60 萬 ÷ 4% = 1,500 萬。意思是「為了每年拿 60 萬，大家願意付多少錢」。</span></li><li><b>成本法</b>：土地價值 + 重建成本 − 折舊。<span class="ez">問「如果今天重新蓋一間一樣的，要花多少錢」，再扣掉這間已經舊掉的部分。常用在很少交易、也沒有租金收入的建物。</span></li></ul></li></ul>' }
  ]},
  { id:'re4', t:'4. 浮動利率抵押貸款', cards: [
    { id:'re4a', t:'浮動利率房貸（ARM）：指標利率＋加碼', en:'Adjustable-rate mortgage: index and margin',
      plain:'浮動利率房貸的利率不是固定的，而是「指標利率＋固定加碼」，定期調整。利率風險從銀行轉給借款人，所以初始利率通常比固定利率低。台灣大部分房貸就是這種。',
      life:'台灣的房貸常寫「郵局兩年期定儲機動利率 + 0.555%」：郵局利率調升，你的房貸利率就跟著升。',
      body:'<p class="ez lead">浮動利率＝利率會<b>跟著市場變</b>。銀行不會隨便亂調，而是綁一個公開的「指標利率」，再加上固定的「加碼」。台灣大部分房貸都是這種。</p><ul><li><b>合約利率 = 指標利率（index）+ 加碼（margin）</b>。<span class="ez">例：指標 1.72% + 加碼 0.5% = 2.22%。之後指標變成 2%，你的利率就變成 2.5%。加碼在簽約時就決定好，通常不會變。</span></li><li>指標利率：美國常用公債利率、SOFR 等；台灣常用<b>中華郵政二年期定儲機動利率</b>或各銀行的<b>定儲利率指數</b>。<span class="ez">指標利率必須是銀行自己不能任意操控的公開利率，借款人才不會吃虧。台灣最常見的是「郵局二年期定儲機動利率」。</span></li><li><b>調整頻率</b>：例如每月、每季、每年調整一次。<span class="ez">指標變動後，你的利率不會當天就變，而是到約定的時間點才一起調整。</span></li><li><b>風險分擔</b>：利率上升 → 借款人付款增加（<b>付款衝擊</b> payment shock）；貸方的利率風險較低，但借款人<b>違約風險</b>可能上升。<span class="ez">利率上升時，借款人每月要多繳很多錢（付款衝擊）。銀行雖然不怕利率變動了，卻要擔心借款人繳不出來。風險沒有消失，只是換了一種。</span></li><li>因為貸方承擔較少利率風險，ARM 的<b>初始利率通常低於</b>固定利率房貸。<span class="ez">銀行不用承擔利率上升的風險，就不用收那麼多風險補償，所以一開始的利率比較低。</span></li><li><b>優惠起始利率</b>（teaser rate）：前幾期利率特別低，之後跳回指標 + 加碼，可能造成付款大幅增加（次貸危機的問題之一）。<span class="ez">像手機門號的「前 6 個月半價」：一開始很便宜吸引你借，之後恢復正常價格，月付款可能突然暴增。</span></li><li><b>混合型</b>：前幾年固定、之後浮動（例如 5/1 ARM：前 5 年固定，之後每年調整）。<span class="ez">「5/1」：數字 5 是前 5 年固定，數字 1 是之後每 1 年調一次。</span></li></ul>' },
    { id:'re4b', t:'利率上下限、負攤還與 ARM 的預期收益', en:'Caps, negative amortization and ARM yields',
      plain:'為了保護借款人，浮動利率房貸可能設定利率上限（每次最多調多少、整個期間最高多少）。如果付款被設上限但利率還是升，就會出現負攤還：沒付的利息加回本金。',
      life:'手機吃到飽方案說「每年漲價不超過 50 元、總共最多漲到 999 元」→ 就像利率的每期上限和終身上限。',
      body:'<p class="ez lead">浮動利率對借款人的風險是「利率可能漲很多」。所以有些貸款會加上<b>上限</b>，保護借款人不會一下子付不出來。但這些保護是有代價的。</p><ul><li><b>每期調整上限</b>（periodic cap）：每次調整利率最多變動多少（例如 2%）。<span class="ez">例：現在 3%、每次最多調 2%。就算市場利率一口氣跳到 6%，這次最多只能調到 5%。</span></li><li><b>終身上限</b>（lifetime cap）：整個貸款期間利率最高不超過多少。<span class="ez">例：終身上限 8%。不管市場漲到多高，你的利率永遠不會超過 8%。</span></li><li><b>付款上限</b>（payment cap）：限制付款金額的增加幅度；若利率上升導致利息超過付款 → <b>負攤還</b>（negative amortization），貸款餘額反而增加。<span class="ez">例：本來每月利息 5 萬，但付款上限只能付 4.5 萬。沒付到的 5,000 元不會消失，而是被加進欠款，越繳欠越多。</span></li><li>利率上下限讓<b>貸方</b>又承擔部分利率風險 → 有上限的 ARM 加碼或初始利率會比較高。<span class="ez">有上限就等於銀行答應「利率漲太多的部分由我吸收」，這是一種保險，所以銀行會用比較高的利率向你收保費。</span></li><li><b>ARM 的預期收益率</b>：根據預期的指標利率路徑，算出每期利率與付款，再求貸方的 IRR（含費用）。<span class="ez">因為未來利率還不知道，只能先假設一條利率走勢，照這個走勢算出每期會收到多少錢，再算銀行的報酬率。</span></li><li>計算步驟：①用期初利率算付款 → ②算期末餘額 → ③下一期用新利率和剩餘期數重新計算付款 → 重複。<span class="ez">重點：每次利率改變，都用「當時還欠多少」和「還剩幾期」重新算一次月付款。</span></li><li><b>選擇 FRM 還是 ARM</b>：預期利率上升、想要穩定付款、持有很久 → 偏好固定利率；預期利率下降、持有期間短、能承擔波動 → 偏好浮動利率。<span class="ez">一句話：怕利率上漲、想要安穩 → 固定；覺得利率會下降、只會住幾年、承受得起波動 → 浮動。</span></li></ul>' },
    { id:'re4c', t:'固定 vs 浮動：風險如何在借貸雙方之間分配', en:'Risk allocation between borrower and lender',
      plain:'固定利率：利率風險在銀行、付款穩定在借款人。浮動利率：利率風險轉給借款人，銀行承擔的是借款人付不出來的違約風險。沒有免費的午餐，承擔風險的一方會要求補償。',
      life:'包車旅遊：說好固定價格，油價漲由司機吸收（固定利率）；照里程跳錶，油價漲你自己承擔（浮動利率），但通常起價比較便宜。',
      body:'<p class="ez lead">一句話：利率變動的風險一定要有人承擔。<b>固定利率</b>是銀行承擔，<b>浮動利率</b>是借款人承擔。誰承擔風險，誰就會要求補償，所以固定利率一開始比較貴。</p><div class="tblwrap"><table class="tbl"><tr><th></th><th>固定利率 FRM</th><th>浮動利率 ARM</th></tr><tr><td>利率風險</td><td>貸方承擔</td><td>主要由借款人承擔</td></tr><tr><td>初始利率</td><td>較高</td><td>較低</td></tr><tr><td>付款</td><td>固定、好規劃</td><td>會變動、有付款衝擊</td></tr><tr><td>提前還款誘因</td><td>利率下跌時很高</td><td>較低（利率會自動調降）</td></tr><tr><td>違約風險</td><td>較低</td><td>利率大漲時上升</td></tr></table></div><span class="ez">表格怎麼看：浮動利率把「利率漲」的痛轉給借款人，所以一開始比較便宜；但利率大漲時借款人繳不出來，違約風險反而變高。固定利率借款人比較安穩，但利率下跌時會想轉貸，銀行就要擔心被提前還款。</span><ul><li>美國以 30 年固定利率為主（有 Fannie Mae、Freddie Mac 收購並證券化）；台灣以浮動利率為主（銀行資金來源多為短期存款）。<span class="ez">美國銀行可以把 30 年固定利率房貸賣給 Fannie Mae、Freddie Mac，把利率風險丟出去，所以敢做固定利率。台灣銀行的錢多半是短期存款，存款利率會變，房貸利率也跟著變比較安全。</span></li><li>利率走升時，浮動利率房貸族的負擔會明顯增加，也是央行升息會影響房市的管道之一。<span class="ez">央行升息 → 定儲利率上升 → 房貸指標利率上升 → 大家每月房貸變多 → 買房意願下降。這就是升息能讓房市降溫的原因。</span></li></ul>' }
  ]},
  { id:'re5', t:'5. 不動產抵押貸款證券Ⅰ', cards: [
    { id:'re5a', t:'次級房貸市場與證券化的流程', en:'Secondary mortgage market and securitization', cfa:'Fixed Income：securitization',
      plain:'銀行放出房貸後，可以把一堆房貸打包賣給專門的機構，再切成證券賣給投資人。銀行拿回現金可以再放款，投資人得到房貸的現金流。',
      life:'麵包店把做好的麵包批發給超商賣（次級市場），自己就有錢買材料再做新的麵包（初級市場）。',
      body:'<p class="ez lead">銀行借你房貸後，不一定要自己抱著等你還 30 年。它可以把很多筆房貸<b>打包賣出去</b>，拿回現金再借給下一個人。買走房貸的人，之後就收你每個月繳的錢。這整個過程叫「證券化」。</p><ul><li><b>初級市場</b>：借款人向銀行借房貸。<b>次級市場</b>：房貸或房貸證券在投資人之間買賣。<span class="ez">像新書和二手書：初級市場是你第一次跟銀行借錢；次級市場是這筆「借據」之後在投資人之間轉手。</span></li><li>美國的關鍵機構：<ul><li><b>Ginnie Mae（GNMA）</b>：政府機構，保證以政府保險房貸（FHA、VA）組成的證券，有美國政府完全保證。<span class="ez">Ginnie Mae 本身就是政府機構，它保證的證券萬一房貸沒人繳，美國政府會付錢，所以幾乎沒有違約風險。</span></li><li><b>Fannie Mae（FNMA）</b>、<b>Freddie Mac（FHLMC）</b>：政府支持企業（GSE），收購符合標準（conforming）的房貸並證券化，提供保證；2008 年被政府接管。<span class="ez">GSE＝政府支持的「公司」，不是政府本身，但大家都覺得政府會救它（後來在 2008 年真的救了）。它們買下符合標準的房貸，包成證券再保證會付款。</span></li></ul></li><li>證券化流程：銀行（發起人）放貸 → 把房貸賣給 SPV（破產隔離）→ SPV 發行證券 → 服務機構收款、分配給投資人；可加上保證或信用增強。<span class="ez">一步一步看：①銀行借錢給你 → ②銀行把你的房貸賣給一個專門的空殼公司（SPV） → ③SPV 發行證券賣給投資人 → ④你每月繳的錢由服務機構收走，再分給投資人。<b>破產隔離</b>＝就算原本的銀行倒了，SPV 裡的房貸也不會被拿去還銀行的債，投資人很安全。</span></li><li>好處：銀行取得流動性、轉移利率風險、標準化讓資金跨區流動、降低房貸利率。<span class="ez">銀行很快拿回現金，就能再借給更多人；利率上升的風險也交給投資人承擔。全國的資金都能流向需要房貸的地方，房貸就變便宜。</span></li><li>問題：<b>發起後即出售</b>（originate-to-distribute）模式讓銀行審核鬆散（反正會賣掉），是 2008 年次貸危機的原因之一 → 後來要求發起人<b>保留部分風險</b>（risk retention）。<span class="ez">如果銀行借完馬上賣掉，借款人還不還錢就跟銀行無關，銀行就會亂借。解法：規定銀行要自己留一部分（約 5%），借款人不還時銀行也會虧，就會認真審核。</span></li><li>台灣：依《金融資產證券化條例》，銀行曾發行住宅貸款證券，但市場規模小（台灣房貸以浮動利率為主、銀行資金充裕）。<span class="ez">台灣銀行存款很多、不缺錢，浮動利率房貸也沒什麼利率風險需要丟出去，所以沒有強烈的動機把房貸賣掉。</span></li></ul>' },
    { id:'re5b', t:'不動產抵押貸款證券的種類：MBB、MPTS、MPTB', en:'Mortgage-backed bonds, pass-throughs and pay-through bonds', cfa:'Fixed Income：MBS',
      plain:'房貸證券有幾種結構：抵押擔保債券（房貸留在發行機構帳上、當擔保）、轉付證券（投資人直接分到房貸的本息）、轉手債券（介於兩者之間）。差別在於「誰承擔提前還款風險」和「資產在不在發行人帳上」。',
      life:'朋友用一堆借據當擔保跟你借錢，固定付你利息（MBB）；或直接把借據收到的錢原封不動轉給你（MPTS）。',
      body:'<p class="ez lead">房貸證券有三種包法。分辨它們只要問兩個問題：①房貸<b>還在不在發行人帳上</b>？②借款人提早還錢時，<b>誰倒楣</b>（提前還款風險由誰承擔）？</p><div class="tblwrap"><table class="tbl"><tr><th></th><th>抵押擔保債券 MBB</th><th>轉付證券 MPTS</th><th>轉手債券 MPTB</th></tr><tr><td>性質</td><td>發行人的<b>債務</b></td><td>投資人<b>擁有</b>房貸池的權益</td><td>發行人的債務</td></tr><tr><td>房貸在誰帳上</td><td>發行人</td><td>移出（賣給投資人）</td><td>發行人</td></tr><tr><td>投資人收到</td><td>固定票息，到期還本</td><td>房貸池的本金＋利息（扣服務費）</td><td>依房貸池的本息流量支付</td></tr><tr><td>提前還款風險</td><td>發行人承擔</td><td><b>投資人</b>承擔</td><td>投資人承擔</td></tr><tr><td>超額擔保</td><td>需要（通常很多）</td><td>不需要</td><td>通常需要</td></tr></table></div><span class="ez">用比喻記：<b>MBB</b> 像銀行發的普通債券，只是拿房貸當抵押品，投資人領固定利息，房貸提早還錢是銀行的事。<b>MPTS</b> 像直接把房貸「分給」投資人，借款人繳多少就轉給你多少，提早還錢也直接轉給你。<b>MPTB</b> 介於中間：法律上是銀行的債，但付給你的錢是照房貸池實際收到的錢來付。</span><ul><li><b>MBB</b>：超額擔保保護投資人，若擔保品價值下降，發行人要補足。<span class="ez">超額擔保＝發 100 億的債，卻放 120 億以上的房貸當擔保。房貸有人違約、有人提早還，價值會變少，多放一些才能確保投資人一定拿得到錢。</span></li><li><b>MPTS</b>（轉付證券）最常見：每月把房貸池收到的本金（含提前還款）和利息，扣除服務費和保證費後，按比例轉付給投資人。<span class="ez">「轉付」就是「轉手付給你」：房貸池這個月收到 1 億，扣掉手續費後全部轉給投資人。借款人提早還錢，投資人就提早拿回本金，這就是投資人要承擔的提前還款風險。</span></li><li><b>CMO</b>（下一單元）是把轉付現金流重新切成不同分券。<span class="ez">預告：有人想早點拿回錢、有人想晚點拿回錢，CMO 就是把同一池現金流切成不同期限的商品。</span></li></ul>' }
  ]},
  { id:'re6', t:'6. 不動產抵押貸款證券Ⅱ', cards: [
    { id:'re6a', t:'轉付證券的現金流與提前還款', en:'Pass-through cash flows and prepayment', cfa:'Fixed Income：MBS、prepayment risk',
      plain:'轉付證券每月的現金流 = 房貸池的利息（扣費）+ 預定本金 + 提前還款。提前還款的速度用 CPR、SMM、PSA 來描述，速度不同，投資人拿回錢的時間就不同。',
      life:'你借錢給 100 個人買房，每個月除了照表收錢，還會有人突然把剩下的全還清（搬家、轉貸），你收到錢的時間就會比預期早。',
      body:'<p class="ez lead">買轉付證券最頭痛的是：你不知道借款人<b>什麼時候會提早還錢</b>。這張卡在教你怎麼描述「提早還錢的速度」（SMM、CPR、PSA），以及每個月到底會收到多少錢。</p><ul><li><b>WAC</b>（加權平均票面利率）：房貸池的平均利率。<b>轉付利率</b> = WAC − 服務費 − 保證費。<span class="ez">例：借款人平均付 4.5%，服務機構收 0.25%、保證機構收 0.25%，投資人拿到 4.0%。中間的人都要抽成。</span></li><li><b>WAM</b>：加權平均到期期間。<span class="ez">池子裡每筆房貸剩下的年限不同，用餘額加權平均，代表這池房貸平均還剩多久。</span></li><li><b>SMM</b>（單月提前還款率）= 當月提前還款 ÷ (月初餘額 − 當月預定本金)。<span class="ez">意思是：本來這個月就該還的部分扣掉後，剩下的餘額裡有幾 % 被提早還掉了。例：SMM 0.5% ＝ 每個月有 0.5% 的餘額被提前還清。</span></li><li><b>CPR</b>（年化）= 1 − (1 − SMM)<sup>12</sup>。<span class="ez">把月的速度換成一年的速度。不是直接乘 12，因為每個月都是從「剩下的」餘額再提前還。例：SMM 1% → CPR ≈ 11.4%。</span></li><li><b>PSA 基準</b>：100% PSA = 第 1 個月 CPR 0.2%，每月增加 0.2%，第 30 個月達 6% 後固定。150% PSA 就是速度的 1.5 倍。<span class="ez">PSA 是業界共用的「標準速度」：新房貸剛借時很少人馬上換，所以從 0.2% 開始每個月加 0.2%，到第 30 個月穩定在 6%。說「200% PSA」就是比標準快一倍。</span></li><li>每月現金流計算：①利息 = 月初餘額 × 轉付利率/12；②預定本金（用 WAC 算的攤還）；③提前還款 = SMM × (月初餘額 − 預定本金)；④月末餘額 = 月初 − ② − ③。<span class="ez">每個月投資人收到三種錢：利息、原本就該還的本金、被提前還掉的本金。三者加起來就是這個月的現金流。</span></li><li>提前還款的原因：<b>利率下跌轉貸</b>（最主要）、搬家換屋、違約後由保證機構清償、部分提前還款。<span class="ez">最主要的原因是利率下跌時借款人去轉貸。其他像搬家賣房，也會把舊貸款一次還清。</span></li><li>其他影響：<b>耗竭效應</b>（burnout，對利率敏感的人已經轉貸過，剩下的不太會轉）、季節性、房價。<span class="ez">耗竭效應：利率第一次大跌時，很多人搶著轉貸；再跌一次時，會轉的人早就轉過了，剩下的都是「怎樣都不會轉」的人，所以提前還款速度上不去。季節性：夏天搬家的人多，提前還款也多。</span></li></ul>' },
    { id:'re6b', t:'MBS 的定價、收益與風險', en:'Pricing and risks of mortgage-backed securities', cfa:'Fixed Income：MBS pricing',
      plain:'MBS 的價格是預期現金流的現值，但現金流取決於提前還款速度，所以利率下跌時價格漲不多（負凸性），利率上升時又因為還款變慢而跌更多。投資人會要求比公債高的收益率作為補償。',
      life:'你買了一張「可以被隨時提前還款」的借據，利率下跌時對方會馬上還清，你賺不到漲價的好處；利率上升時對方拖著不還，你只能一直收低利息。',
      body:'<p class="ez lead">MBS 的價格 ＝ 未來會收到的錢折現回今天。麻煩在於：未來收到多少錢取決於提前還款，而提前還款又取決於利率。這讓 MBS 在利率變動時表現得很「不划算」。</p><ul><li><b>定價</b>：在假設的提前還款速度（例如 150% PSA）下，預測每月現金流，以要求的收益率折現。<span class="ez">先假設一個提前還款速度，算出每個月會收到多少錢，再折現加總。假設的速度不同，算出來的價格就不同。</span></li><li>折價 MBS（票面利率低於市場）：提前還款<b>越快</b>對投資人越<b>有利</b>（早拿回面額）；溢價 MBS 則相反。<span class="ez">折價買（例如 95 元買面額 100 的證券）：越早拿回 100 元，賺的價差越快到手，所以提前還款對你有利。溢價買（例如 105 元）：本金提早還回來只有 100 元，多付的 5 元就少賺回來了，所以提前還款對你不利。</span></li><li><b>收縮風險</b>：利率下跌 → 提前還款加速 → 再投資利率低、價格上漲有限（<b>負凸性</b>）。<span class="ez">一般債券利率下跌時價格會大漲。但 MBS 在利率下跌時，大家都去轉貸，你的本金被提早還回來，只能拿去投資利率更低的東西，所以價格漲不太上去。</span></li><li><b>延伸風險</b>：利率上升 → 提前還款減慢 → 存續期間變長、價格下跌更多。<span class="ez">利率上升時沒人想轉貸，大家慢慢還，你的錢被卡在低利率的 MBS 裡更久，價格跌得比一般債券更多。</span></li><li><b>平均存續期</b>（weighted average life）：提前還款越快越短。<span class="ez">平均存續期＝本金平均多久會回到你手上。提早還錢越多，越早拿回來。</span></li><li><b>選擇權調整利差 OAS</b>：考慮利率路徑與提前還款選擇權後，MBS 相對公債的額外利差，用來比較不同 MBS 的相對價值。<span class="ez">MBS 的收益率比公債高，但一部分是在補償你「借款人可以提早還錢」這個壞處。OAS 把這部分扣掉，看剩下的真實額外收益有多少，才能公平比較。</span></li><li>其他風險：違約風險（非機構 MBS）、流動性風險、模型風險（提前還款模型錯誤）。<span class="ez">機構 MBS（有 Ginnie Mae 等保證）幾乎不用擔心違約；民間發行的才有違約風險。模型風險＝預測提前還款的模型錯了，價格就算錯了。</span></li></ul>' }
  ]},
  { id:'re7', t:'7. 不動產抵押貸款證券Ⅲ及其衍生品Ⅰ', cards: [
    { id:'re7a', t:'擔保房貸憑證 CMO：循序償還與 Z 分券', en:'Collateralized mortgage obligations', cfa:'Fixed Income：CMO',
      plain:'CMO 把轉付證券的現金流重新切成好幾個分券（tranche），依序分配本金。短的分券先拿回本金，長的分券後拿，讓不同投資期間的投資人都能找到適合的證券。',
      life:'一家人輪流用一台電腦：老大先用到完成作業，接著換老二，再換老三。早用完的人（短分券）不用等很久，最後的人要等比較久，但可以用比較久。',
      body:'<p class="ez lead">CMO 想解決的問題：有人想要短期投資、有人想要長期投資，但轉付證券的期限很不確定。CMO 把同一池房貸的錢<b>切成好幾段</b>，規定本金先還給誰、後還給誰，讓不同需求的人各取所需。</p><ul><li><b>循序償還</b>（sequential-pay）：所有本金（含提前還款）先付給 A 分券，A 還完再付 B，依此類推；利息則按各分券的餘額支付。<span class="ez">像排隊領錢：所有本金先全部給 A，A 拿完才換 B，B 拿完才換 C。但利息每個分券都有，照各自還欠多少來算。</span></li><li>效果：A 分券期間短、收縮風險較小（但仍有）；後面的分券延伸風險較小、期間較長。CMO <b>重新分配</b>提前還款風險，但<b>沒有消除</b>。<span class="ez">提前還款變快時，最先受影響的是 A（很快就被還完）；後面的分券因為有前面的人擋著，比較不受影響。整池房貸的風險沒有變少，只是被重新分配給不同的人。</span></li><li><b>Z 分券</b>（累積分券 accrual tranche）：在前面分券還清前<b>不收現金</b>，應得的利息加到本金裡（類似零息債），讓前面分券更快還完。<span class="ez">Z 分券像排在最後面而且先不領錢的人：它該拿的利息不發現金，而是記在它的帳上（欠它的錢越來越多），省下來的現金拿去先還前面的分券。等前面都還完，Z 才開始領錢。</span></li><li>剩餘權益分券（residual）：所有分券付完後剩下的現金流，通常由發行人保留。<span class="ez">全部分券都付完後如果還有剩，就是剩餘權益，像公司的股東拿到最後剩下的錢。</span></li><li>CMO 是<b>轉手債券（pay-through）</b>結構的應用：發行人的債務，用房貸池的現金流支付。<span class="ez">回顧上一單元：轉手債券（MPTB）是發行人的債，但照房貸池的現金流付錢。CMO 就是這種結構切成很多段的版本。</span></li></ul>' },
    { id:'re7b', t:'PAC、支撐分券、浮動與反向浮動分券', en:'PAC/support tranches and floaters', cfa:'Fixed Income：PAC、support tranches',
      plain:'計畫攤還分券（PAC）只要提前還款速度在一定範圍內，就照表還本金，現金流很穩定；代價是由支撐分券吸收提前還款的變動，所以支撐分券風險很高。',
      life:'搭捷運：VIP 車廂（PAC）保證準時、不擁擠；其他車廂（支撐分券）吸收所有尖峰人潮，時快時慢。',
      body:'<p class="ez lead">PAC 是 CMO 裡最「穩」的分券：只要提前還款速度不要太誇張，它就照預定的時間表還本金。代價是：一定要有另一個分券（支撐分券）幫它吸收所有的波動。</p><ul><li><b>PAC</b>（planned amortization class）：在 PSA 的上下限範圍內（<b>PAC collar</b>，例如 100%–300% PSA），本金依預定時間表償還。<span class="ez">例：PAC collar 100%–300% PSA，代表提前還款速度只要介於標準的 1 倍到 3 倍之間，PAC 拿到本金的時間表就完全不會變。</span></li><li><b>支撐分券</b>（support / companion）：提前還款太快時先吸收多出來的本金，太慢時先少拿 → 保護 PAC。支撐分券收縮與延伸風險都很大，收益率較高。<span class="ez">支撐分券是 PAC 的「保鑣」：提前還款太快，多出來的本金先塞給支撐分券；太慢，少掉的本金先從支撐分券扣。它的現金流被搞得非常不穩定，所以要給它比較高的收益率才有人買。</span></li><li>如果支撐分券被還光，PAC 就會「破表」（busted PAC），變得和一般分券一樣。<span class="ez">保鑣被打光了（支撐分券的本金全部還完），PAC 就沒人保護，提前還款的波動會直接打到它身上。</span></li><li><b>TAC</b>（targeted amortization class）：只保護一個方向（通常是收縮風險）。<span class="ez">TAC 只防「還太快」這個方向，不防「還太慢」。保護比較少，收益率比 PAC 高一點。</span></li><li><b>浮動利率分券</b>（floater）：票息 = 參考利率 + 利差（有上限）；<b>反向浮動分券</b>（inverse floater）：票息 = K − L × 參考利率，利率上升時票息下降，價格對利率非常敏感。兩者合起來的現金流等於原本的固定利率分券。<span class="ez">例：反向浮動票息 = 20% − 2 × SOFR。SOFR 5% 時票息 10%；SOFR 升到 6% 時票息掉到 8%。利率一變，票息就反方向變兩倍，所以價格非常敏感。浮動＋反向浮動合起來，剛好等於原本那個固定利率的分券。</span></li></ul>' },
    { id:'re7c', t:'剝離式 MBS：只收利息（IO）與只收本金（PO）', en:'Stripped MBS: interest-only and principal-only', cfa:'Fixed Income：IO、PO',
      plain:'把房貸池的現金流拆成兩張證券：IO 只拿利息、PO 只拿本金。兩者對提前還款的反應完全相反，是很極端的利率衍生品。',
      life:'一棵果樹：一個人只收果實（利息，樹活越久收越多），另一個人只拿最後的木材（本金，越早拿到越好）。',
      body:'<p class="ez lead">把房貸池的錢拆成兩張證券：一張只收<b>本金</b>（PO），一張只收<b>利息</b>（IO）。重點只有一個：提前還款對兩者的影響<b>完全相反</b>。</p><ul><li><b>PO</b>（principal-only）：以深度折價買進，最後一定拿回全部本金。<b>提前還款越快越好</b>（越早拿回面額）→ 利率<b>下跌</b>時價值大漲。<span class="ez">例：花 60 元買 PO，未來一定會收回 100 元本金，只是不知道什麼時候。利率下跌 → 大家提早還錢 → 你很快就拿回 100 元，報酬很高，所以 PO 價值上升。</span></li><li><b>IO</b>（interest-only）：收入取決於餘額；提前還款越快，未來利息越少 → 利率<b>下跌</b>時價值<b>下跌</b>（可能拿不回成本）；利率上升時價值上升（少見的「和利率同方向」的資產）。<span class="ez">IO 收的是「餘額 × 利率」。大家提早還錢，餘額很快變 0，以後就沒有利息可收了，甚至可能連買的成本都收不回來。利率上升 → 沒人轉貸 → 餘額留得久 → 利息收得多 → IO 價值上升。</span></li><li>IO 有<b>負的存續期間</b>，可以用來避險（例如抵銷 MBS 投資組合的利率風險）。<span class="ez">一般債券利率上升價格會跌，IO 剛好相反。手上有很多 MBS 的人，買一些 IO 就能互相抵銷。</span></li><li>IO + PO = 原本的轉付證券。<span class="ez">把一份轉付證券的錢切成「利息那一份」和「本金那一份」，加回去就是原本的。</span></li><li>風險極高，價格對提前還款模型非常敏感。<span class="ez">提前還款速度只要猜錯一點，IO 和 PO 的價格就會差很多。</span></li></ul>' }
  ]},
  { id:'re8', t:'8. 不動產抵押貸款衍生品Ⅱ', cards: [
    { id:'re8a', t:'次級房貸、CDO 與再證券化', en:'Subprime mortgages, CDOs and re-securitization', cfa:'Fixed Income：CDO',
      plain:'次級房貸是借給信用差、所得證明不足的人。這些房貸被證券化後，風險較高的分券又被打包成 CDO 再切一次，甚至做出 CDO 的 CDO。評等機構給了太高的評等，風險被層層隱藏。',
      life:'把一堆爛蘋果混在一箱好蘋果裡，再把箱子分成「上層」和「下層」賣；接著把很多箱的下層再混一次分層賣 → 最後誰也搞不清楚自己買到多少爛蘋果。',
      body:'<p class="ez lead">這張卡在講 2008 年金融海嘯是怎麼「釀」出來的：借錢給<b>還不起的人</b>（次貸），再把這些房貸<b>包了一層又一層</b>，最後連包裝的人都看不清楚裡面有多危險。</p><ul><li><b>次級房貸</b>（subprime）：借款人信用分數低、高 LTV、所得文件不全（例如低文件或無文件貸款），常搭配<b>優惠起始利率</b>的 ARM。<span class="ez">次級＝信用比一般標準差的借款人。很多人連收入證明都沒有就借到錢，前兩年利率很低，之後利率一跳升就繳不出來。</span></li><li><b>CDO</b>（collateralized debt obligation）：以一池債務工具（公司債、貸款、MBS 的中間分券等）為擔保，再切成優先、中間、權益分券。<span class="ez">想像一棟三層樓，損失像大水從一樓淹上來：<b>權益分券</b>（一樓）最先被淹，報酬最高；<b>中間分券</b>（二樓）次之；<b>優先分券</b>（頂樓）最後才會被淹，最安全，報酬最低。</span></li><li><b>再證券化</b>：用次貸 MBS 的中間分券組成 CDO，靠分散和分層，讓大部分分券得到 AAA 評等；<b>CDO²</b> 再拿 CDO 分券組一次。<span class="ez">拿很多個「二樓」（次貸 MBS 的中間分券）重新蓋一棟新樓，新樓的頂樓又被評為 AAA。理由是「這麼多個二樓不可能同時淹水」。CDO² 是把這招再做一次。</span></li><li>問題：<ul><li>低估了房價<b>同時下跌</b>時違約的<b>相關性</b>，分散效果其實很小。<span class="ez">分散只有在「不會一起出事」時才有用。全國房價一起跌時，所有地方的次貸都一起違約，所有的「二樓」同時被淹，原本以為很安全的頂樓也淹了。</span></li><li>評等機構的利益衝突（發行人付費）與模型風險。<span class="ez">評等機構的錢是發行人付的，給太低的評等，發行人就去找別家，所以評等機構有放水的誘因。</span></li><li>結構太複雜，投資人無法評估真實風險。<span class="ez">包了好幾層之後，一張證券背後可能是幾千筆房貸，幾乎沒人能追到最底下是誰在借錢。</span></li></ul></li><li><b>合成 CDO</b>：不實際持有債券，而是用 CDS 取得信用風險。<span class="ez">不用真的買債券，而是透過「賣保險」（CDS）來承擔違約風險，效果一樣。這讓押注次貸的金額可以比實際存在的房貸還多。</span></li></ul>' },
    { id:'re8b', t:'信用違約交換 CDS 與房貸衍生品的風險', en:'Credit default swaps and systemic risk',
      plain:'CDS 像是債券的保險：買方定期付保費，標的違約時賣方賠償。但 CDS 可以在沒持有債券的情況下買賣，被大量拿來投機；當房貸大量違約，賣出大量 CDS 的公司（例如 AIG）就撐不住，引發系統性風險。',
      life:'很多人幫別人的房子買火災險，不是為了保障，而是在賭會不會失火；一旦真的燒起來，保險公司要賠的錢遠超過它的資本。',
      body:'<p class="ez lead">CDS 就是<b>違約保險</b>：你每年付保費，如果某家公司或某筆債券違約，賣保險的人要賠你。問題是：很多人買保險不是為了保護自己，而是在賭別人倒閉；賣保險的人自己也可能賠不起。</p><ul><li><b>CDS</b>：保護買方支付 CDS 利差（保費），參考實體或證券發生信用事件時，保護賣方賠償損失。<span class="ez">例：保額 1,000 萬、每年保費 2%（200 bp）→ 每年付 20 萬。如果違約時債券只回收 40%，賣方要賠 600 萬。</span></li><li><b>裸 CDS</b>（naked CDS）：買方沒有持有標的債券 → 純粹投機或避險其他曝險。<span class="ez">就像幫鄰居的房子買火災險：你自己沒房子在那裡，買保險純粹是在賭它會不會燒掉。</span></li><li>CDS 名目金額可以遠大於實際債券金額 → 損失被放大。<span class="ez">一筆 1 億的債券，可能有好幾億的 CDS 在押它違約。它真的違約時，要賠的錢比債券本身還多很多倍。</span></li><li><b>交易對手風險</b>：保護賣方本身可能倒閉（2008 年 <b>AIG</b> 需要美國政府紓困）。<span class="ez">交易對手風險＝賣你保險的人倒了，你的保險就沒用了。AIG 賣了大量 CDS，房貸大量違約時賠不起，政府只好出手救它，不然所有向它買保險的銀行都會跟著出事。</span></li><li>房貸相關指數：例如 ABX 指數，讓投資人可以放空次貸。<span class="ez">ABX 追蹤一籃子次貸證券的價格。電影《大賣空》裡的人就是透過 CDS 和這類工具押注次貸崩盤。</span></li><li><b>系統性風險</b>：金融機構互相持有大量衍生品部位，一家倒閉會連鎖影響（例如雷曼兄弟 2008/9/15 破產）。<span class="ez">銀行之間互相欠很多衍生品合約，一家倒了，跟它往來的銀行都收不到錢，接著也可能倒，像骨牌一樣。</span></li><li>危機後改革：標準化 OTC 衍生品要透過<b>中央結算</b>、提高資本與保證金要求、交易資訊申報。<span class="ez">中央結算＝雙方不直接交易，而是都跟結算所交易，由結算所收保證金、確保大家付得出錢。這樣一家倒掉不會直接拖垮對方。</span></li></ul>' }
  ]},
  { id:'re9', t:'9. 不動產逆向抵押貸款與房市危機解決方案', cards: [
    { id:'re9a', t:'逆向抵押貸款（以房養老）', en:'Reverse mortgage',
      plain:'一般房貸是「先拿錢、再慢慢還」，餘額越來越少；逆向房貸是年長者把房子抵押給銀行，銀行每月撥款給他，欠款越來越多，等到期或過世後再處分房子還錢。適合「有房子、但缺現金」的長者。',
      life:'阿公有一間房子但每月生活費不夠，他可以把房子抵押給銀行，每個月領一筆錢生活，房子照樣住到最後。',
      body:'<p class="ez lead">一般房貸：先拿一大筆錢買房，之後慢慢還，<b>欠款越來越少</b>。逆向房貸剛好相反：已經有房子的長輩把房子押給銀行，銀行<b>每個月發錢給他</b>，欠款越來越多，等他過世或搬走後再賣房還錢。</p><ul><li><b>現金流方向和一般房貸相反</b>：貸款餘額隨撥款和利息<b>累積上升</b>，屋主的權益（房價 − 餘額）逐漸下降。<span class="ez">例：房子 1,000 萬，銀行每月撥 3 萬。10 年後已經撥了 360 萬，再加上利息，欠款可能接近 450 萬；房子裡「屬於自己的部分」就剩大約 550 萬。</span></li><li>撥款方式：每月定額（終身或固定期間）、一次撥付、信用額度。<span class="ez">可以每月領固定金額（像退休金）、一次領一大筆、或開一個額度需要時才動用。</span></li><li><b>非追索權</b>（美國 HECM 等）：到期時若房屋價值不足以償還，借款人或繼承人不需補足，差額由保險承擔。<span class="ez">非追索權＝最多只拿房子抵債。就算欠款已經超過房價，子女也不用拿自己的錢補差額。</span></li><li>貸方承擔的風險：<ul><li><b>長壽風險</b>：借款人活得比預期久，撥款期間變長。<span class="ez">銀行原本以為大概發 15 年，結果長輩活了 25 年，多發的 10 年讓欠款大幅超過房價。</span></li><li><b>利率風險</b>：利率上升，欠款累積更快。<span class="ez">欠款會一直滾利息，利率越高，滾得越快。</span></li><li><b>房價風險</b>：房價下跌，擔保不足。<span class="ez">最後要靠賣房還錢，房價跌了就不夠還。</span></li><li>維修風險：屋主沒有好好維護房子。</li></ul></li><li><b>台灣「以房養老」</b>：內政部曾辦理公益型試辦，土地銀行等銀行自 2015 年起推出商業型；一般要求年滿一定年齡、房屋無貸款或負擔，撥貸成數、期間依各銀行規定。<span class="ez">台灣叫「以房養老」，適合「有房子、但手上現金不夠生活」的長者。</span></li><li>計算撥款金額：在預計期間內，每月撥款的終值（加上利息）不超過「預期房價 × 可貸成數」。<span class="ez">銀行算法：先估房子將來大概能賣多少、最多願意借幾成，再反推每個月最多能發多少錢，確保到期時欠款不會超過這個上限。</span></li></ul>' },
    { id:'re9b', t:'2008 房市危機：成因回顧', en:'Causes of the 2008 housing crisis', cfa:'Fixed Income：MBS、securitization',
      plain:'房價長期上漲讓大家以為不會跌，放款標準放寬（次貸、低文件貸款、優惠利率），證券化讓銀行不在乎借款人會不會還錢，加上高槓桿和衍生品，房價一反轉就全面崩盤。',
      life:'大家都覺得某款球鞋只會漲，借錢搶購；店家也不管你付不付得起，因為帳款會轉賣給別人。等價格一跌，借錢的人還不出錢，整條鏈一起倒。',
      body:'<p class="ez lead">2008 年危機不是單一原因造成的，而是一連串環節一起出錯：錢太便宜 → 亂借錢 → 借完就賣 → 包裝隱藏風險 → 大家都用高槓桿 → 房價一跌全部垮掉。按照順序讀下面每一點。</p><ul><li><b>低利率</b>與資金充沛（2001 年後），推升房價。<span class="ez">利率很低時借錢很便宜，大家都去買房，房價一直漲，大家就以為房價不會跌。</span></li><li><b>放款標準放寬</b>：次貸、Alt-A、低首付、優惠起始利率 ARM、負攤還貸款。<span class="ez">Alt-A 是信用介於優良和次貸之間、但文件不齊全的借款人。重點：連還款能力很差的人都借得到錢。</span></li><li><b>發起後即出售</b>模式：發起人不承擔風險 → 道德風險。<span class="ez">銀行借完就把房貸賣掉，借款人還不還錢已經不關它的事，所以只在乎借出去的量，不在乎品質。</span></li><li><b>證券化與再證券化</b>（MBS → CDO → CDO²）掩蓋風險；評等機構評等過高。<span class="ez">一層一層包裝後，看起來很安全的 AAA 證券，裡面其實裝的是次貸。</span></li><li><b>高槓桿</b>：投資銀行、特殊投資工具（SIV）以短期資金支應長期資產。<span class="ez">借短期的錢（每幾週就要借新還舊）去買長期的房貸證券。一旦沒人願意借短期資金給它，就只能賤價賣資產。</span></li><li><b>CDS</b> 大量發行，集中在少數機構。<span class="ez">很多人買了違約保險，但賣保險的集中在少數幾家（像 AIG），它們一倒，保險就全部失效。</span></li><li>引爆：2006 年起房價下跌、ARM 重設利率 → 違約大增 → MBS 和 CDO 大跌 → 金融機構虧損、資金市場凍結 → 雷曼破產（2008/9）。<span class="ez">骨牌順序：房價跌 → 優惠利率到期、付款變多 → 大量違約 → 房貸證券暴跌 → 持有這些證券的銀行虧大錢 → 銀行之間互不信任、不再互借 → 雷曼兄弟倒閉。</span></li><li>影響：全球金融海嘯、經濟衰退、大量法拍屋。</li></ul>' },
    { id:'re9c', t:'房市危機的解決方案', en:'Housing crisis solutions',
      plain:'危機後政府從幾個方向處理：救金融機構（注資、收購不良資產）、救屋主（貸款修改、轉貸）、救市場（央行買 MBS、壓低利率），以及事後修法避免重演。',
      life:'一場大火之後：先救火（紓困金融機構）、再救人（幫屋主保住房子）、最後修訂建築法規避免下一次失火（金融監理改革）。',
      body:'<p class="ez lead">危機後政府從三個方向救：<b>救銀行</b>（避免金融系統停擺）、<b>救屋主</b>（讓他們繳得起、不要被法拍）、<b>修法</b>（避免同樣的事再發生）。</p><h4>穩定金融體系</h4><ul><li><b>TARP</b>（2008）：問題資產紓困計畫，主要用來對銀行<b>注資</b>。<span class="ez">注資＝政府直接拿錢買銀行的股份，讓銀行有足夠的資本繼續營運。</span></li><li>Fannie Mae、Freddie Mac 被政府<b>接管</b>（conservatorship）。<span class="ez">這兩家收購了美國一大半的房貸，倒了房貸市場就會停擺，所以政府直接接手經營。</span></li><li>央行<b>量化寬鬆</b>：Fed 大量購買機構 MBS 和公債，壓低房貸利率、提供流動性。<span class="ez">央行買很多房貸證券 → 這些證券價格上升、利率下降 → 新房貸利率也下降 → 大家比較繳得起、也比較願意買房。</span></li></ul><h4>協助屋主</h4><ul><li><b>貸款修改</b>（loan modification）：降低利率、延長期限、本金寬減，讓付款降到可負擔水準（例如美國 <b>HAMP</b>）。<span class="ez">直接改合約：降利率、拉長年限，甚至減少本金，讓每月付款降到繳得起的程度。對銀行來說，少收一點總比法拍損失大好。</span></li><li><b>轉貸計畫</b>：讓房價低於貸款（underwater）的屋主也能以較低利率轉貸（例如 <b>HARP</b>）。<span class="ez">房價跌到比貸款還低的人，原本沒辦法轉貸（銀行不肯借）。HARP 讓他們也能轉到低利率的貸款，減輕負擔。</span></li><li><b>容忍期</b>（forbearance）：暫時減少或暫停付款。<span class="ez">例如失業的人，先讓他幾個月少繳或不繳，之後再補，度過難關。</span></li><li>處理不良貸款的方式：<b>短售</b>（short sale，以低於貸款餘額出售，貸方接受損失）、<b>以屋抵債</b>（deed in lieu of foreclosure）、<b>法拍</b>（foreclosure，成本最高、對社區影響最大）。<span class="ez">短售：房子賣的錢不夠還貸款，銀行同意吸收差額。以屋抵債：直接把房子交給銀行抵債。法拍最麻煩：要走法律程序、時間長、房子常空著沒人整理，連帶拖低附近房價。</span></li></ul><h4>監理改革</h4><ul><li><b>Dodd-Frank 法案</b>（2010）：要求評估借款人<b>還款能力</b>（ability-to-repay）、合格房貸（QM）標準、證券化發起人<b>保留風險</b>（約 5%）、設立消費者金融保護局（CFPB）、衍生品中央結算。<span class="ez">重點記法：放款前要確認借款人還得起（ATR）、證券化發起人要自己留一部分風險、成立專門保護消費者的機構（CFPB）。</span></li><li>巴塞爾協定 Ⅲ：提高銀行資本與流動性要求。<span class="ez">要求銀行多準備一點自己的錢和現金，遇到損失時才撐得住。</span></li></ul>' }
  ]}
  ],
  mcq: [
    { u:'re1', q:'抵押權人在債務人不清償時，最主要的權利是：', o:['直接取得房屋所有權','聲請法院拍賣抵押物並優先受償','要求債務人搬離房屋','終止債務人所有其他契約'], a:1, e:'抵押權不移轉占有，債務不清償時可聲請拍賣，從價金優先受償。' },
    { u:'re1', q:'在約定的最高金額內擔保不特定債權的抵押權是：', o:['普通抵押權','最高限額抵押權','權利抵押權','法定抵押權'], a:1, e:'民法 §881-1 最高限額抵押權，常見於企業往來或循環額度。' },
    { u:'re3', q:'LTV（貸款成數）越高，代表：', o:['借款人自備款越多','違約風險通常越高','貸款利率一定越低','房價一定越高'], a:1, e:'LTV = 貸款 ÷ 房價，自備款越少，房價下跌時越容易資不抵債。' },
    { u:'re1', q:'依房地合一稅 2.0，個人持有房地 2 年內出售，稅率為：', o:['15%','20%','35%','45%'], a:3, e:'2 年內 45%、2–5 年 35%、5–10 年 20%、超過 10 年 15%（自住符合條件 10%）。' },
    { u:'re1', q:'REITs 和 REATs 最主要的差別是：', o:['REITs 先募資再買不動產；REATs 先有不動產再信託發行證券','REITs 只能投資住宅','REATs 不需要受託機構','兩者完全相同'], a:0, e:'不動產投資信託先有錢後有物；不動產資產信託先有物後有錢。' },

// ===== 不動產財管 單元 1 補充：房貸的法律名詞（英美制度＋台灣對照） =====
DATA.re.sections[0].cards.push(
  { id:'re1e', t:'房貸的兩份文件：本票（Promissory Note）與抵押契約（Mortgage）', en:'Promissory note vs mortgage',
    plain:'一筆房貸其實有兩份文件：本票（或借據）證明「你欠錢、承諾還錢」，是債務本身；抵押契約把房子拿來「擔保」這筆債。兩者分開：前者是對人的請求權，後者是對物的擔保權。',
    life:'跟朋友借錢：借據寫「我欠你 10 萬，每月還 1 萬」（本票），另外再寫一張「如果不還，我的機車讓你拿去賣」（抵押）。',
    body:'<p class="ez lead">美國房貸一定有兩份文件，分工很清楚：<b>Note</b>＝「我欠你錢、我會還」（債）；<b>Mortgage</b>＝「如果我不還，你可以拿這間房子抵」（擔保）。考試最常考的是誰叫什麼名字，以及兩份文件各管什麼。</p><h4>Promissory note 本票／借款憑證</h4><ul><li>借款人<b>無條件承諾</b>在特定時間支付特定金額的書面文件，是<b>債務本身</b>（the debt）。<span class="ez">「無條件」＝不能說「房子漏水所以我不付」，欠款就是欠款。Note 就是那張借據。</span></li><li>載明：本金、利率、付款金額與日期、到期日、違約與加速條款、提前還款條款。<span class="ez">借多少、利率多少、每月付多少、什麼時候還完，以及不還的後果，都寫在 note 裡。</span></li><li>借款人對 note 負<b>個人責任</b>（personal liability）：除非是無追索權貸款，否則房子拍賣不夠還時，貸方可以再向借款人追討。<span class="ez">個人責任＝這是「你本人」欠的錢，不只是房子欠的。房子賣掉不夠還，銀行還可以追你的薪水和其他財產。</span></li><li>Note 可以轉讓（negotiable），次級市場買賣的其實是 note（連同擔保它的 mortgage）。<span class="ez">銀行把房貸賣給別人時，賣的是那張借據（收錢的權利），抵押權跟著一起移轉。</span></li></ul><h4>Mortgage 抵押契約</h4><ul><li>把不動產當作 note 的<b>擔保</b>（security instrument），在不動產上設定 <b>lien</b>。<span class="ez">Mortgage 本身不是借錢，而是在房子上「掛一個牌子」：這間房子有人有優先受償權。</span></li><li><b>Mortgagor</b> = <b>借款人</b>（提供抵押的人）；<b>Mortgagee</b> = <b>貸方</b>（取得抵押權的人）。容易搞反！<span class="ez">記法：字尾 <b>-or</b> 是「給出去的人」，借款人把抵押權<b>給</b>銀行，所以借款人是 mortgagor；<b>-ee</b> 是「收到的人」，銀行收到抵押權，所以是 mortgagee。（跟 employer / employee 一樣）</span></li><li>Mortgage 本身不是債務，沒有 note 就沒有可以擔保的東西（從屬性）。<span class="ez">先有債才需要擔保。債還清了，擔保也就消失。</span></li><li><b>Mortgage loan</b>（抵押貸款）：以不動產為擔保的貸款 = note + mortgage。<span class="ez">我們口語說的「房貸」，在法律上就是這兩份文件加在一起。</span></li></ul><h4>Mortgage bond</h4><ul><li>有些州（例如紐約）把借款人的還款承諾稱為 <b>bond</b>，所以房貸文件叫 “bond and mortgage”，功能和 note 相同。<span class="ez">只是名字不同：在紐約叫 bond，其他地方叫 note，意思都是那張借據。</span></li><li>在公司財務中，<b>mortgage bond</b> 指以不動產為擔保發行的公司債（違約時債權人對該不動產有優先權）。<span class="ez">公司財務裡的 mortgage bond 是另一回事：公司拿自己的廠房當擔保來發債。</span></li></ul><h4>台灣的本票</h4><ul><li><b>票據法 §3</b>：本票是發票人簽發一定金額，於指定到期日由自己<b>無條件支付</b>給受款人或執票人的票據。<span class="ez">台灣的本票就是「我承諾會付你這筆錢」的紙，跟美國的 note 很像。</span></li><li><b>票據法 §123</b>：執票人向本票發票人行使追索權時，可以<b>聲請法院裁定後強制執行</b> → 不用經過冗長訴訟，所以貸款、租賃、分期付款常要求簽本票。<span class="ez">本票最大的威力：對方不付錢時，持有本票的人可以很快請法院裁定，然後直接強制執行（查封財產），不用打好幾年的官司。</span></li><li>台灣房貸通常包含：借款契約＋本票（部分銀行）＋<b>抵押權設定契約</b>（到地政事務所登記，取得他項權利證明書）。<span class="ez">台灣房貸三件組：借款契約（債）＋本票（讓銀行追債更快）＋抵押權設定（擔保，要去地政事務所登記）。</span></li></ul>',
    terms:[['promissory note','本票、借款憑證：債務本身'],['mortgage','抵押契約：擔保工具'],['mortgagor','抵押人＝借款人'],['mortgagee','抵押權人＝貸方'],['mortgage loan','抵押貸款 = note + mortgage'],['personal liability','個人責任：可追討借款人其他財產']] },
  { id:'re1f', t:'Lien（留置權／擔保物權）與 Lien Theory vs Title Theory', en:'Liens; lien theory vs title theory',
    plain:'Lien 是債權人在某個財產上的「擔保權利」：債務不還時可以就這個財產優先受償。美國各州對房貸有兩種看法：lien theory 認為房子還是借款人的、貸方只有擔保權；title theory 認為借款期間法律上的所有權（title）在貸方手上，還清才回到借款人。',
    life:'Lien theory：你的手機押給朋友當擔保，但手機還是你的；title theory：手機的「所有權登記」先放在朋友名下，你還清才改回你的名字，但手機一直是你在用。',
    body:'<p class="ez lead">Lien（擔保權）就是「這個東西上面掛了別人的權利，你不還錢，他可以拿這個東西去拍賣」。這張卡比較美國各州對房貸的兩種想法：銀行到底是只有<b>擔保權</b>，還是真的擁有<b>所有權</b>？</p><p>Lien 有很多種（tax lien、judgment lien、mortgage lien、mechanic’s lien……），種類和排序在第 3 組「Lien：種類與順位」詳細整理；這裡先比較美國各州對房貸的兩種法律看法。</p><h4>Lien theory vs Title theory</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>Lien theory 擔保權說</th><th>Title theory 所有權說</th></tr><tr><td>所有權（title）在誰</td><td><b>借款人</b></td><td>法律所有權（legal title）在<b>貸方</b>，借款人有衡平所有權（equitable title）</td></tr><tr><td>貸方的權利</td><td>只有 lien（擔保權）</td><td>名義上的所有權，借款人還清後依 <b>defeasance clause</b> 取回</td></tr><tr><td>違約時</td><td>貸方要<b>聲請法拍</b>（foreclosure）才能取得房子</td><td>理論上貸方可較快取得占有</td></tr><tr><td>占有使用</td><td>借款人</td><td>借款人（實務上）</td></tr></table></div><span class="ez">用一句話分：<b>Lien theory</b>＝房子是你的，銀行只是掛了一個擔保權，你不還錢時銀行要去法院申請拍賣。<b>Title theory</b>＝在你還完錢之前，房子的法律所有權「名義上」在銀行，你還清了才拿回來（defeasance clause 就是「還清後所有權自動回到你手上」的條款）。不管哪一種，平常都是你住。</span><ul><li>還有 <b>intermediate theory</b>（中間說）：平常採 lien theory，<b>違約時</b>所有權才移轉給貸方。<span class="ez">中間說是折衷：平常像 lien theory，一旦違約就變成 title theory。</span></li><li>美國多數州採 lien theory。實務上兩者差異已經不大，因為各州法律都保護借款人的贖回權利。<span class="ez">因為不管採哪一說，法律都保障借款人有機會在被拍賣前把錢還清、保住房子，所以實際上結果差不多。</span></li><li><b>台灣</b>的抵押權類似 lien theory：抵押權<b>不移轉占有、也不移轉所有權</b>，債務不還時抵押權人要聲請法院拍賣。<span class="ez">台灣銀行在房貸期間不會擁有你的房子，只有抵押權；你不還，銀行也不能自己把房子收走，一定要走法院拍賣，這就是 lien theory 的想法。</span></li></ul>',
    terms:[['lien','以財產擔保債務的權利'],['tax lien','欠稅的留置權，順位通常最優先'],['mechanic’s lien','工程款留置權'],['first / junior lien','第一順位／後順位擔保權'],['recording','登記，決定順位'],['legal vs equitable title','法律所有權 vs 衡平所有權'],['defeasance clause','還清後貸方權利消滅、所有權回到借款人的條款']] },
  { id:'re1g', t:'Deed of Trust：三方的信託契約', en:'Deed of trust',
    plain:'有些州不用一般的 mortgage，而用 deed of trust：借款人把房子的名義所有權交給一個中立的受託人（trustee）保管，貸方是受益人。借款人違約時，受託人可以依契約直接出售房子，不用經過法院，比較快。',
    life:'你和朋友借錢時，把機車的鑰匙交給班導（中立的第三人）保管。你還清，班導把鑰匙還你；你不還，班導可以直接幫朋友把機車賣掉。',
    body:'<p class="ez lead">Deed of trust 是 mortgage 的「三人版」：多了一個中立的第三人（trustee）幫忙拿著房子的名義所有權。多這個人的好處是：借款人違約時，<b>不用上法院就能拍賣</b>，又快又便宜。</p><ul><li>三方當事人：<ul><li><b>Trustor</b>（信託人）＝ <b>借款人</b>。<span class="ez">借款人把房子的名義所有權「信託」出去，所以是信託人（trustor）。</span></li><li><b>Trustee</b>（受託人）＝ 中立第三人（常是產權公司、律師），持有名義上的所有權。<span class="ez">受託人像公正的保管人：不偏向借款人，也不偏向銀行，只負責照契約做事。</span></li><li><b>Beneficiary</b>（受益人）＝ <b>貸方</b>。<span class="ez">這個安排是為了保護銀行的錢，銀行是得到好處的人，所以叫受益人（beneficiary）。</span></li></ul></li><li>借款人還清後，trustee 把所有權還給借款人：<b>reconveyance</b>（所有權返還）。<span class="ez">錢還清後，受託人把名義所有權還給借款人，這個動作叫 reconveyance。</span></li><li>違約時：契約中的 <b>power of sale</b>（出售權）讓 trustee 可以進行 <b>nonjudicial foreclosure</b>（非訴訟法拍）：依法定程序公告後拍賣，<b>不用經過法院</b> → 時間短、成本低。<span class="ez">「出售權」＝契約一開始就授權受託人：借款人違約時，你可以直接把房子拍賣。只要依法公告、等待法定期間，就能拍賣，不用打官司。</span></li><li>和一般 mortgage 比較：mortgage 是兩方（mortgagor、mortgagee），違約多半要 <b>judicial foreclosure</b>（訴訟法拍）。不過有些州的 mortgage 也可以附 power of sale。<span class="ez">比較：一般 mortgage 只有借款人和銀行兩方，違約時銀行通常要去法院告（judicial foreclosure），比較慢。</span></li><li>美國西部很多州（例如加州）常用 deed of trust。<span class="ez">記法：三方、受益人是銀行、可以不經法院拍賣。</span></li></ul>',
    terms:[['trustor','信託人＝借款人'],['trustee','受託人＝中立第三人'],['beneficiary','受益人＝貸方'],['reconveyance','還清後返還所有權'],['power of sale','出售權（可非訴訟拍賣）'],['nonjudicial foreclosure','不經法院的法拍']] },
  { id:'re1j', t:'各種房貸型態：Purchase-money、Junior、Wraparound、Blanket、Land contract', en:'Types of mortgages and financing arrangements',
    plain:'除了一般買房的房貸，還有賣方直接借錢給買方、二胎、一筆貸款擔保多筆土地、把舊貸款包在新貸款裡等不同型態，用在不同的交易情況。',
    life:'買二手車時，賣家說：「頭期款給我，剩下的分期付給我就好」→ 這就是賣方融資（purchase-money mortgage）。',
    body:'<p class="ez lead">前面學了 note、mortgage、lien、順位，這張卡是「應用題」：同樣的工具組合出很多種特殊房貸。每一種只要記住它<b>解決什麼問題</b>，以及<b>誰承擔風險</b>。</p><ul><li><b>Purchase-money mortgage</b>（購置價金抵押）：為了購買該不動產而設定的抵押，常指<b>賣方</b>直接提供融資（seller financing），順位通常優先。<span class="ez">例：買方錢不夠，賣方說「剩下的你分期付給我，房子押給我就好」。這筆抵押就是 purchase-money mortgage，賣方當起銀行。</span></li><li><b>Junior / second mortgage</b>（後順位／二胎）：在第一順位之後，利率較高；<b>home equity loan / HELOC</b>（房屋淨值貸款、循環額度）多是二順位。<span class="ez">房子已經押給第一家銀行，再押給第二家借錢。拍賣時第一順位先拿，第二順位常常拿不到，所以利率比較高。HELOC 像一張用房子擔保的信用卡額度，需要時才動用。</span></li><li><b>Wraparound mortgage</b>（包裹式抵押）：新貸款金額包含原本的舊貸款，借款人付款給新貸方，新貸方再繼續繳舊貸款 → 保留舊的低利率（但可能違反 due-on-sale clause）。<span class="ez">例：賣方原本有一筆 3% 的舊房貸，現在市場利率 7%。賣方借給買方一筆「包含舊貸款」的新貸款收 5%，然後自己繼續繳舊的 3%，賺中間的利差。風險是：原本的銀行發現房子賣掉了，可能要求舊貸款立刻還清（due-on-sale）。</span></li><li><b>Blanket mortgage</b>（總括抵押）：一筆貸款以<b>多筆</b>不動產擔保，常搭配 release clause（例如建商分批賣地）。<span class="ez">例：建商用 50 塊地一起擔保一筆大貸款。每賣出一塊地就先還一部分錢，銀行就把那塊地從擔保裡解除（release），買方才能拿到沒有負擔的土地。</span></li><li><b>Package mortgage</b>：擔保品包含房屋和附屬的家具、設備。<span class="ez">例如附家具、家電的新成屋，連家具一起當擔保。</span></li><li><b>Open-end mortgage</b>：可以在原抵押額度內再借款（future advances），類似台灣的<b>最高限額抵押權</b>。<span class="ez">先設好一個額度，之後在額度內再借錢，都由同一個抵押權擔保，不用重新設定。</span></li><li><b>Construction loan</b>（建築融資）：依工程進度分次撥款，完工後由長期貸款（permanent / take-out loan）取代。<span class="ez">蓋房子時房子還不存在，銀行不敢一次給錢，所以蓋一層撥一點。蓋好了再換成一般的長期房貸，把建築貸款還掉。</span></li><li><b>Land contract / installment sales contract</b>（分期付款買賣契約）：買方分期付款給賣方，<b>付清前所有權仍在賣方</b>；買方風險較高。<span class="ez">跟一般買房不同：買方付清最後一期前，房子還是賣方的。萬一賣方欠債、房子被查封，或買方中途繳不出來，買方可能什麼都拿不到。</span></li><li><b>Reverse mortgage</b>（逆向房貸）：見單元 9。<span class="ez">長者把房子押給銀行，銀行每月撥錢給他，欠款越滾越多。</span></li></ul>',
    terms:[['purchase-money mortgage','購置價金抵押（常為賣方融資）'],['junior mortgage','後順位抵押'],['HELOC','房屋淨值循環額度'],['wraparound mortgage','包裹式抵押'],['blanket mortgage','總括抵押（多筆不動產）'],['open-end mortgage','可再動用的抵押（類似最高限額）'],['land contract','分期付款買賣，付清才移轉所有權']] },
  { id:'re1k', t:'不動產的權利：Fee simple、Leasehold、Easement、Encumbrance', en:'Property rights and estates',
    plain:'買房買的其實是一組「權利」：可以使用、出租、出售、留給子孫。不同的權利型態（完全所有權、租賃權、地役權等）會影響能不能貸款、能貸多少。',
    life:'買下一間房子（完全所有權）vs 租了一間房子十年（租賃權）vs 鄰居有權從你家院子走過去（地役權）。',
    body:'<p class="ez lead">買房其實是在買一束<b>權利</b>（住、用、出租、賣掉、不讓別人進來）。不同的權利有不同的名字，有些很完整（可以永久擁有），有些只是暫時或部分的。銀行最喜歡擔保最完整的那一種。</p><ul><li><b>Real property</b>（不動產）：土地及其定著物，以及隨之而來的權利（bundle of rights：占有、使用、收益、處分、排除他人）。<span class="ez">想像成一把筷子：每一根是一種權利。你可以把其中一根給別人（例如出租＝把「使用」給房客），手上剩下的權利就變少了。</span></li><li><b>Fee simple absolute</b>（完全所有權）：最完整的所有權，可以無限期持有、出售、繼承 → 最適合當貸款擔保。<span class="ez">一整把筷子都在你手上，而且沒有期限。銀行拿這種權利當擔保最放心。</span></li><li><b>Life estate</b>（終身權益）：只在某人生存期間享有，之後回到原所有人或指定的人。<span class="ez">例：爸爸把房子給媽媽住到過世，之後歸兒子。媽媽有的就是 life estate，她不能把房子永久賣掉。</span></li><li><b>Leasehold</b>（租賃權）：依租約在一定期間內使用他人不動產；貸方對租賃權貸款時，要看剩餘租期。<span class="ez">租約只剩 5 年，銀行就不可能借你 20 年，因為擔保品 5 年後就沒了。</span></li><li><b>Easement</b>（地役權）：為了他人土地的便利而使用自己土地的權利（例如通行權）。<span class="ez">例：你家後面那塊地的人只能經過你家前面的路出入，他就有通行權，你不能把路封起來。</span></li><li><b>Encumbrance</b>（產權負擔）：所有對不動產權利的限制，包括 lien、easement、限制性約定等 → 買房前要做產權調查（title search）。<span class="ez">Encumbrance 是一個總稱：只要是會讓這間房子「不那麼乾淨」的東西都算，像有人掛了抵押權、有人有通行權。買房前一定要查清楚，不然買到後才發現別人有權利。</span></li><li><b>Title</b>（產權）與 <b>deed</b>（移轉所有權的契據）：warranty deed（賣方保證產權無瑕疵）vs quitclaim deed（只移轉賣方擁有的權利，不做保證）。<span class="ez">Title 是「擁有」這件事本身；deed 是把它交給別人的那張文件。Warranty deed 像有保固；quitclaim 像「現況出售、恕不保證」。</span></li><li><b>台灣對照</b>：所有權、地上權、典權、不動產役權（舊稱地役權）、抵押權；不動產物權要<b>登記</b>才生效（民法 §758）。<span class="ez">台灣的權利名稱不同，但概念類似：所有權 ≈ fee simple；不動產役權 ≈ easement；抵押權 ≈ mortgage lien。最大的差別是台灣一定要登記才算數。</span></li></ul>',
    terms:[['fee simple absolute','完全所有權'],['life estate','終身權益'],['leasehold','租賃權'],['easement','地役權（不動產役權）'],['encumbrance','產權負擔'],['title / deed','產權／移轉契據'],['warranty vs quitclaim deed','保證契據 vs 放棄契據']] }
);

    plain:'Title 是「所有權」這個法律狀態；deed 是把所有權從賣方（grantor）移轉給買方（grantee）的書面文件。買方和貸方都要確定產權沒有問題，所以要做產權調查、買產權保險，這些方法統稱 title assurance。',
    life:'買二手機車：行照上的名字是所有權（title），過戶文件是 deed，賣方是 grantor、買方是 grantee；去監理站查有沒有被查封或欠罰單，就是 title assurance。',
    body:'<p class="ez lead">買房時最怕的是：付了錢，結果房子<b>其實不是賣方的</b>，或上面有別人的權利。這張卡講三件事：①移轉所有權的文件（deed）長什麼樣；②不同的 deed 保證程度不同；③怎麼確保產權沒問題（title assurance）。</p><h4>基本名詞</h4><ul><li><b>Title</b>（所有權／產權）：擁有不動產的法律權利，以及證明這個權利的證據。<span class="ez">Title 是一個「狀態」：誰擁有這間房子。它不是一張紙。</span></li><li><b>Deed</b>（契據）：移轉所有權的書面文件。<span class="ez">Deed 才是那張紙：用來把 title 從賣方交給買方。</span></li><li><b>Grantor</b>（讓與人）：<b>賣方</b>、移轉所有權的人；<b>Grantee</b>（受讓人）：<b>買方</b>、取得所有權的人。（拼法是 grantor，不是 granter）<span class="ez">同樣用 -or / -ee 記：grantor 把房子「給出去」（賣方），grantee「收到」房子（買方）。</span></li><li>有效 deed 的要件：書面、讓與人有行為能力、指明受讓人、法定描述（legal description）、讓與的文字（words of conveyance）、讓與人簽名、<b>交付並受領</b>（delivery and acceptance）；再<b>登記</b>（recording）以對抗第三人。<span class="ez">重點是最後兩個：要真的交給買方、買方也接受，才算移轉；再去登記，其他人才能查得到，不會被賣方「一屋二賣」騙到。</span></li></ul><h4>Deed 的種類（保證程度由高到低）</h4><ul><li><b>General warranty deed</b>（一般保證契據）：賣方保證產權完整，包含<b>過去所有人</b>造成的瑕疵。主要保證（covenants）：seisin（確實擁有）、right to convey（有權移轉）、against encumbrances（沒有未揭露的負擔）、quiet enjoyment（不會被第三人主張權利干擾）、warranty forever。<span class="ez">保證範圍最大：不只保證賣方自己沒搞砸，連以前的屋主留下的問題都保證。以後出事，買方可以找賣方賠。五個保證大意是：我真的擁有、我有權賣、沒有隱藏的負擔、不會有人來跟你搶、永遠保證。</span></li><li><b>Special warranty deed</b>（特別保證契據）：只保證<b>賣方持有期間</b>沒有產生瑕疵。<span class="ez">只對「我住的那段時間」負責，之前的屋主造成的問題不管。</span></li><li><b>Bargain and sale deed</b>：表示賣方擁有產權，但不做保證。<span class="ez">暗示「我有產權」，但出事不賠。</span></li><li><b>Quitclaim deed</b>（放棄契據）：只移轉賣方「如果有的話」的權利，<b>完全不保證</b>，常用來消除產權疑慮（cloud on title）或家人之間移轉。<span class="ez">意思是「我手上如果有任何權利，全部給你；如果沒有，那就沒有」。常用在：離婚時一方把房子權利讓給另一方，或清除產權上某個不確定的疑慮。</span></li></ul><h4>Title assurance（產權保障）的方法</h4><ul><li><b>Abstract of title ＋ attorney’s opinion</b>：整理該不動產所有登記紀錄的摘要（產權鏈 <b>chain of title</b>），由律師判斷產權是否可交易（<b>marketable title</b>）。缺點：律師只對自己的過失負責，看不到的瑕疵（偽造、未登記的權利）沒有保障。<span class="ez">律師把這間房子歷年所有的買賣、抵押紀錄整理出來（產權鏈），判斷有沒有問題。但如果某份文件是偽造的、或有權利從來沒登記，律師也查不到，買方就沒保障。</span></li><li><b>Title insurance</b>（產權保險）：保險公司調查產權後承保，未來發現瑕疵造成損失由保險理賠。<b>一次付清保費</b>，保障到所有權移轉為止。<span class="ez">產權保險像「買房的保險」：保險公司先查一次，如果以後還是冒出產權問題，保險公司賠。保費只付一次，不是每年付。</span><ul><li><b>Owner’s policy</b>：保障買方，金額通常是買價。<span class="ez">保護你自己。</span></li><li><b>Lender’s policy</b>（mortgagee’s policy）：保障貸方，金額隨貸款餘額遞減；通常是貸方要求、借款人付費。<span class="ez">保護銀行，金額跟著貸款餘額變少。銀行要求、但錢由借款人出。</span></li></ul></li><li><b>Torrens system</b>（托崙斯登記制）：政府登記機關直接<b>確認並登記產權</b>，發給產權證書，登記本身就有公信力；美國只有少數地方使用。<span class="ez">政府直接確認「這間房子是誰的」並發證書，登記本身就是保證，不用再請律師或買保險。</span></li><li><b>Quiet title action</b>（確認產權之訴）：向法院請求確認產權，消除爭議。<span class="ez">直接請法院判決「這間房子是我的」，以後別人就不能再主張。</span></li></ul><h4>台灣對照</h4><ul><li>台灣採<b>登記生效＋公信力</b>（類似 Torrens）：不動產物權依法律行為取得、設定、移轉，<b>非經登記不生效力</b>（民法 §758）；信賴登記而取得權利的人受保護（土地法 §43、民法 §759-1）→ 所以台灣幾乎不需要產權保險。<span class="ez">台灣的地政登記就像 Torrens：登記簿上寫誰是所有人，大家就可以相信；就算登記有錯，善意相信登記而買的人也受保護。所以台灣買房不用買產權保險。</span></li><li>買賣時查<b>土地及建物登記謄本</b>，看所有權部和<b>他項權利部</b>（抵押權、地上權等）。<span class="ez">台灣買房前一定要調「登記謄本」：所有權部看屋主是誰，他項權利部看房子押給了誰、押了多少。</span></li></ul>',
    terms:[['title','所有權／產權'],['deed','移轉所有權的契據'],['grantor / grantee','讓與人（賣方）／受讓人（買方）'],['general warranty deed','一般保證契據'],['special warranty deed','特別保證契據'],['quitclaim deed','放棄契據（不保證）'],['chain of title','產權鏈'],['abstract of title','產權摘要'],['marketable title','可交易的產權'],['title insurance','產權保險'],['Torrens system','托崙斯登記制'],['cloud on title','產權疑慮']] }
);

const reD = (term, zh, one, rows) => `<details class="deep"><summary><b>${term}</b> ${zh}<small>｜${one}</small></summary><ul>${rows.map(r => Array.isArray(r) ? `<li><span class="dk">${r[0]}</span>${r[1]}</li>` : `<li>${r}</li>`).join('')}</ul></details>`;

  { id:'re1t', t:'Lien 的種類：Tax lien、Judgment lien、Mortgage lien、Mechanic’s lien', en:'Types of liens',
    plain:'Lien 是「用某個財產來擔保債務」的權利。房子上可能同時壓著好幾種 lien：欠稅產生的 tax lien、打輸官司產生的 judgment lien、借房貸設定的 mortgage lien、沒付工程款產生的 mechanic’s lien。先分清楚它們怎麼產生、管多大範圍，下一張卡才排得出順序。',
    life:'你的機車上可能貼了好幾張單子：停車費欠繳（稅）、法院的查封令（判決）、車貸的設定（抵押）、修車行沒收到修理費（工程款）。賣車時，每張單子都要先處理。',
    body: '<p class="ez lead">Lien 就是「掛在財產上的討債權」：你欠錢不還，他可以拿這個財產去賣、先拿錢。這張卡用兩個問題把 lien 分類：①是<b>你自己同意</b>掛上去的（自願），還是法律或法院<b>硬掛</b>的（非自願）？②只掛在<b>這一間房子</b>（特定），還是掛在你<b>所有財產</b>上（一般）？</p><h4>兩個分類軸</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>Specific 特定（只壓這一筆不動產）</th><th>General 一般（壓債務人所有財產）</th></tr>'
