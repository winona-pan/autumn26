DATA.cfa.sections.push(
  { id:'x-eq', t:'6. 權益投資 Equity Investments（11–14%）', cards: [
    { id:'xs1', t:'市場組織與結構：部位、槓桿、委託單', en:'Market Organization and Structure', pre:['blong','blev'],
      plain:'金融市場讓有錢的人和需要錢的人相遇。要懂做多做空、融資買股的槓桿和追繳、各種委託單，以及初級和次級市場怎麼運作。',
      life:'借錢買股票像是用信用卡分期買手機：手機漲價你賺更多，但跌價時銀行會要求你補錢，不補就把你的手機賣掉。',
      body:'<h4>金融體系的功能</h4><ul><li>儲蓄、借貸、籌資、管理風險、交換資產、利用資訊（價格發現）。</li><li>決定均衡利率、有效配置資本。</li></ul><h4>資產與契約分類</h4><ul><li>證券（債務、權益、集合投資工具）、貨幣、契約（遠期、期貨、交換、選擇權、保險）、商品、實體資產。</li><li>公開 vs 私人證券；初級 vs 次級市場；貨幣市場（≤ 1 年）vs 資本市場。</li></ul><h4>部位</h4><ul><li><b>多頭</b>（long）：擁有資產，價格上漲獲利。</li><li><b>空頭</b>（short）：借券賣出，價格下跌獲利。放空者要支付借券費，並把期間的股利補給出借人；理論上損失無限。</li></ul><h4>融資買進（槓桿部位）</h4><ul><li><b>槓桿比率</b> = 部位總值 ÷ 自有資金 = 1 ÷ 原始保證金比率。例：原始保證金 40% → 槓桿 2.5 倍。</li><li>報酬率 = (期末權益 − 期初權益) ÷ 期初權益（要扣利息、佣金，加股利）。</li><li><b>追繳價格</b>（margin call price）：</li></ul><p class="formula">P = P<sub>0</sub> × (1 − 原始保證金) ÷ (1 − 維持保證金)</p><ul><li>例：40 元買進、原始保證金 50%、維持保證金 25% → P = 40 × 0.5 ÷ 0.75 = 26.67 元，跌破就要補錢。</li></ul><h4>委託單</h4><ul><li><b>執行指示</b>（怎麼成交）：<ul><li><b>市價單</b>：馬上以市場最佳價格成交，價格不確定。</li><li><b>限價單</b>：設定最高買價或最低賣價，可能無法成交。限價買單高於最佳賣價 → 可成交（marketable）；低於最佳買價 → 「落後市場」（behind the market）。</li><li>其他：全部或無（all-or-nothing）、隱藏單、冰山單。</li></ul></li><li><b>有效期間指示</b>：當日有效（day）、取消前有效（GTC）、立即成交否則取消（IOC）、開盤／收盤單。</li><li><b>停損單</b>（stop order）：價格到達觸發價後才變成市價單或限價單。賣出停損用來限制損失。</li><li><b>清算指示</b>：誰負責交割，賣出時是否為放空。</li></ul><h4>初級與次級市場</h4><ul><li><b>初級市場</b>：公司或政府發行新證券。<ul><li><b>承銷</b>（underwritten offering）：投資銀行保證以約定價格買下全部證券。</li><li><b>代銷</b>（best efforts）：只盡力銷售，不保證。</li><li>私募（private placement）、<b>櫥架登記</b>（shelf registration，一次登記、分次發行）、股利再投資計畫、<b>現金增資認購權</b>（rights offering，現有股東優先認購）。</li></ul></li><li><b>次級市場</b>：投資人之間交易。<ul><li><b>集合競價</b>（call market）：在特定時間撮合，例如開盤。<b>連續市場</b>：隨時交易。</li><li><b>報價驅動市場</b>（quote-driven / dealer market）：向交易商買賣，例如債券、外匯。</li><li><b>委託單驅動市場</b>（order-driven）：依規則撮合投資人的委託單（價格優先、時間優先等），例如股票交易所。</li><li><b>經紀市場</b>（brokered）：經紀人幫忙找對手，例如不動產、大宗交易。</li></ul></li></ul><h4>運作良好的市場</h4><ul><li><b>營運效率</b>（交易成本低、流動性高）、<b>資訊效率</b>（價格迅速反映資訊）、<b>配置效率</b>（資金流向最好的用途）。</li><li>監管目標：防止詐欺與內線、確保公平、保護投資人、維持金融穩定。</li></ul>',
      ex:'The leverage ratio of a margin position equals the value of the asset divided by the equity in the position, which is the reciprocal of the initial margin requirement.' },
    { id:'xs2', t:'證券市場指數', en:'Security Market Indexes', pre:['bindex'],
      plain:'指數用來代表一群證券的整體表現。不同的加權方式（價格、市值、等權重）會讓同一群股票的指數表現不同。',
      life:'算全班平均身高：每個人一樣重要（等權重）；或身高越高的人影響越大（價格加權）；結果會不一樣。',
      body:'<h4>指數建構的決策</h4><ol><li>目標市場（例如台灣大型股）。</li><li>挑選成分證券。</li><li>加權方式。</li><li>多久重新平衡（rebalancing）。</li><li>多久重新檢視成分股（reconstitution）。</li></ol><h4>價格報酬 vs 總報酬</h4><ul><li><b>價格報酬指數</b>：只看價格變動。</li><li><b>總報酬指數</b>：價格變動 + 股利或利息再投資。長期差距很大。</li></ul><h4>加權方式</h4><ul><li><b>價格加權</b>：股價越高權重越大。指數 = Σ 價格 ÷ 除數。股票分割時要調整除數。例：道瓊工業指數、日經 225。缺點：權重和公司大小無關、分割會改變權重。</li><li><b>等權重</b>：每支一樣。優點簡單、分散；缺點：小型股權重偏高、價格變動後要經常<b>再平衡</b>（成本高）。</li><li><b>市值加權</b>：權重 = 市值占比。例：S&amp;P 500、台灣加權指數。優點：自動調整、符合市場組合。缺點：<b>高估的股票權重越來越大</b>（類似動能策略）。</li><li><b>流通市值加權</b>（float-adjusted）：只計算市場上可流通的股數（排除大股東、政府持股）。多數指數用這種。</li><li><b>基本面加權</b>：依營收、盈餘、股利等加權。偏向價值股（有「逆向」再平衡效果）。</li></ul><h4>指數的用途</h4><ul><li>反映市場情緒、衡量系統性風險（β）、績效評估的基準、建立投資組合（指數基金、ETF）、建模。</li></ul><h4>指數種類</h4><ul><li><b>股票</b>：大盤、跨國、產業、風格（價值／成長、大型／小型）。</li><li><b>固定收益</b>：建構困難 → 債券數量多、很多不常交易（價格難取得）、到期和新發行使成分股變動快、交易商市場。</li><li><b>另類投資</b>：<ul><li>商品指數：用期貨價格，報酬包含展期報酬。</li><li>不動產：鑑價指數（波動被低估）、重複交易指數、REIT 指數。</li><li>避險基金：基金<b>自願</b>申報 → <b>存活者偏誤</b>、表現差的不報（選擇偏誤），指數報酬偏高。</li></ul></li></ul>',
      ex:'In a market-capitalization-weighted index, stocks that become overvalued receive increasingly larger weights, which is a potential drawback of this method.' },
    { id:'xs3', t:'市場效率', en:'Market Efficiency',
      plain:'有效率的市場裡，價格會很快反映所有相關資訊，所以很難持續打敗大盤。效率分成弱式、半強式、強式三種程度。',
      life:'夜市新開一家很好吃的店，大家很快就知道、排隊人潮馬上出現 → 資訊很快反映在「價格」（排隊時間）上，想撿便宜很難。',
      body:'<h4>定義</h4><ul><li><b>有效率市場</b>：價格迅速、合理地反映所有可得資訊。投資人無法在扣除成本和風險調整後，持續賺取<b>超額報酬</b>。</li><li><b>市場價值 vs 內在價值</b>：市場有效率時兩者接近。</li></ul><h4>影響效率的因素</h4><ul><li>市場參與者越多、資訊越容易取得、交易成本越低、套利（包含放空）限制越少 → 越有效率。</li><li>先進市場通常比新興市場有效率。</li></ul><h4>三種效率形式</h4><div class="tblwrap"><table class="tbl"><tr><th>形式</th><th>價格反映</th><th>無法賺超額報酬的方法</th></tr><tr><td><b>弱式</b></td><td>過去的價格與交易量</td><td><b>技術分析</b></td></tr><tr><td><b>半強式</b></td><td>所有<b>公開</b>資訊（含過去價格）</td><td>技術分析＋<b>基本面分析</b></td></tr><tr><td><b>強式</b></td><td>所有公開和<b>非公開</b>（內線）資訊</td><td>任何方法，連內線也沒用</td></tr></table></div><ul><li>研究發現：已開發市場大致是<b>半強式</b>有效率，但<b>不是強式</b>（內線交易可以賺超額報酬，所以法律才禁止）。</li><li>事件研究：在公開消息發布後，價格很快調整 → 支持半強式。</li></ul><h4>對投資的啟示</h4><ul><li>市場越有效率，<b>被動投資</b>（指數基金）越有吸引力。</li><li>基本面分析仍然有價值：正是分析師的研究讓市場保持效率。</li><li>投資組合經理人的角色：依客戶需求建構投組（風險、稅、限制），而不只是挑股票。</li></ul><h4>市場異常現象</h4><ul><li><b>時間序列異常</b>：一月效應（小型股一月報酬特別高）、週末效應、動能（短期贏家持續贏）、過度反應（長期輸家反轉）。</li><li><b>橫斷面異常</b>：<b>規模效應</b>（小型股報酬較高）、<b>價值效應</b>（低 P/E、低 P/B 股報酬較高）。</li><li><b>其他</b>：封閉型基金折價、盈餘意外後價格持續漂移、IPO 長期表現不佳、股利殖利率和報酬的關係。</li><li>很多異常在被發現後消失，或扣除交易成本後無法獲利，也可能是<b>資料探勘</b>或風險沒有正確調整的結果。</li></ul><h4>行為財務學的解釋</h4><ul><li><b>損失趨避</b>、<b>過度自信</b>、<b>從眾</b>（herding）、<b>資訊瀑布</b>（跟著前面的人做）、代表性偏誤、心理帳戶。</li><li>行為偏誤存在不代表市場無效率；關鍵是能否<b>持續</b>利用來賺取超額報酬。</li></ul>',
      ex:'If markets are semi-strong-form efficient, neither technical analysis nor fundamental analysis based on public information can consistently earn abnormal returns.' },
    { id:'xs4', t:'權益證券概述：普通股、特別股、存託憑證', en:'Overview of Equity Securities', pre:['bstock'],
      plain:'股票分成普通股和特別股。普通股有投票權但股利不固定；特別股股利固定、優先分配，但通常沒有投票權。外國公司的股票可以用存託憑證的方式在本國交易。',
      life:'普通股像公司的正式成員（可以投票、分紅不一定）；特別股像 VIP 會員（固定先拿到優惠，但不能參與決策）。',
      body:'<h4>普通股</h4><ul><li>剩餘請求權、有限責任、有投票權。</li><li><b>直接投票</b>（statutory）：每股對每個席次一票。<b>累積投票</b>（cumulative）：票數可以集中投給某位候選人，有利少數股東。</li><li>可贖回（callable，公司可以用約定價格買回）、可賣回（putable，股東可以要求公司買回）。</li><li>有些公司有不同類別股票（例如 A 股有 10 票、B 股有 1 票）。</li></ul><h4>特別股（優先股）</h4><ul><li>股利固定、分配順序優先於普通股、清算時優先於普通股但次於債權人；通常沒有投票權。</li><li><b>累積</b>：沒發的股利會累積，要先補發才能發普通股股利。<b>非累積</b>：沒發就沒了。</li><li><b>參加</b>（participating）：除了固定股利，公司獲利好時還可以多分。</li><li><b>可轉換</b>：可以轉換成普通股 → 有上漲潛力，創投常用。</li><li>風險：一般而言，可賣回、累積、可轉換的特別股風險比較低。</li></ul><h4>私人權益 vs 公開權益</h4><ul><li>私人權益：沒有公開市場，流動性差、揭露少，經理人可以專注長期。投資形式包括創投、槓桿收購、私人投資上市公司（PIPE）。</li></ul><h4>投資外國股票</h4><ul><li>直接投資外國股票（要換匯、遵守外國規則）。</li><li><b>存託憑證</b>（DR）：銀行持有外國股票，發行憑證在本國交易。<ul><li><b>贊助型</b>：外國公司參與，憑證持有人有投票權。<b>非贊助型</b>：沒有投票權。</li><li><b>全球存託憑證 GDR</b>：在美國以外發行（例如在倫敦、盧森堡）。</li><li><b>美國存託憑證 ADR</b>：在美國交易，分成不同等級（Level I 只能在 OTC 交易；Level II 在交易所交易；Level III 可以籌資；Rule 144A 私募給機構投資人）。</li></ul></li><li><b>全球登記股份</b>（GRS）：同一股份可在不同國家交易所以不同貨幣交易。</li><li><b>一籃子存託憑證</b>（BLDR）：一籃子 DR 組成的 ETF。</li></ul><h4>權益與公司價值</h4><ul><li><b>帳面價值</b>：資產負債表的股東權益，反映過去。<b>市場價值</b>：市值，反映市場對未來的預期。</li><li>ROE = 淨利 ÷ 平均股東權益。注意：買回庫藏股會讓權益減少、ROE 上升。</li><li><b>股東的要求報酬率</b> = 公司的<b>股權成本</b>（從公司的角度看）。股權成本很難直接觀察，要用模型估計。</li></ul>',
      ex:'Cumulative preference shares require that any unpaid dividends be paid in full before any dividends can be paid to common shareholders.' },
    { id:'xs5', t:'公司分析：過去與現在', en:'Company Analysis: Past and Present',
      plain:'分析一家公司，要先了解它的商業模式、收入怎麼來、成本結構、需要多少資本投入，以及過去的財務表現。',
      life:'評估要不要加盟一家飲料店：先了解它賣什麼、一杯賺多少、店租和人事成本多少、開店要花多少錢。',
      body:'<h4>公司研究報告的內容</h4><ul><li>投資結論與摘要、公司概況、產業與競爭分析、財務分析與預測、估值、風險、ESG 考量。</li></ul><h4>了解商業模式</h4><ul><li>公司賣什麼？賣給誰？怎麼收錢？為什麼客戶選它？</li><li>關鍵成功因素、競爭優勢（護城河）、經營團隊。</li></ul><h4>收入分析</h4><ul><li><b>收入驅動因子</b> = 數量 × 價格。例：門市數 × 每店來客數 × 客單價。</li><li>分析各產品、地區、客戶群的貢獻與成長。</li><li>收入的品質：經常性 vs 一次性、合約期間、客戶集中度。</li></ul><h4>營運成本分析</h4><ul><li><b>固定成本 vs 變動成本</b>：固定成本比例高 → 營業槓桿大，營收成長時利潤成長更快，但衰退時也跌得更兇。</li><li>毛利率、營業利益率的趨勢與同業比較。</li><li>單位經濟效益：每單位的收入與成本。</li></ul><h4>資本投資與營運資金</h4><ul><li>資本密集度：資本支出 ÷ 營收、固定資產週轉率。</li><li>營運資金需求：現金循環週期。</li><li>看<b>自由現金流</b>：能不能自給自足，還是需要外部融資。</li></ul><h4>資本結構</h4><ul><li>負債水準、利息負擔、負債到期分布、信用評等。</li></ul><h4>ESG 分析</h4><ul><li>辨認對該產業有<b>重大</b>財務影響的 ESG 因素（例如礦業的環境風險、科技業的隱私問題）。</li><li>評估公司如何管理這些風險。</li></ul>',
      ex:'A company with a high proportion of fixed costs has high operating leverage, so its operating income is more sensitive to changes in revenue.' },
    { id:'xs6', t:'產業與競爭分析', en:'Industry and Competitive Analysis',
      plain:'公司的表現很大程度取決於所在產業。用產業分類找同業比較，用五力分析看產業好不好賺，用生命週期看產業處在哪個階段。',
      life:'在大學附近開影印店：同業有幾家（競爭）、學生改用平板不印了（替代品）、紙張漲價（供應商）、學生很在意價格（買方）。',
      body:'<h4>產業分類</h4><ul><li><b>商業分類系統</b>：GICS、ICB、RBICS，依主要業務分類。</li><li><b>政府分類系統</b>：ISIC、NAICS 等。</li><li>依景氣敏感度：<b>循環性</b>（汽車、奢侈品、營建）vs <b>防禦性</b>（食品、公用事業、醫療）。</li><li><b>同業群組</b>（peer group）：商業模式、客戶、產品相似的公司。</li></ul><h4>產業特性分析</h4><ul><li>產業規模、成長率、獲利能力、市場集中度、進入障礙、資本密集度、產品差異化、價格競爭程度。</li></ul><h4>Porter 五力</h4><ol><li><b>新進入者的威脅</b>：進入障礙高（資本需求、規模經濟、品牌、法規）→ 威脅低。</li><li><b>替代品的威脅</b>：替代品多、轉換成本低 → 威脅高。</li><li><b>買方議價能力</b>：買方集中、產品同質 → 買方力量大。</li><li><b>供應商議價能力</b>：供應商少、投入關鍵 → 供應商力量大。</li><li><b>現有競爭者的競爭強度</b>：競爭者多、成長慢、固定成本高、退出障礙高 → 競爭激烈。</li></ol><ul><li>五力越弱，產業的長期獲利能力越好。</li></ul><h4>產業生命週期</h4><ol><li><b>萌芽期</b>：成長慢、價格高、需要大量投資、失敗率高。</li><li><b>成長期</b>：需求快速成長、價格下降、新進者多、獲利改善。</li><li><b>洗牌期</b>（shakeout）：成長放慢、競爭激烈、產能過剩、弱者退出。</li><li><b>成熟期</b>：成長很慢、產業整合、進入障礙高、價格競爭。</li><li><b>衰退期</b>：需求下降、產能過剩、價格戰、更多退出。</li></ol><h4>外部影響因素（PESTLE）</h4><ul><li>政治（Political）、經濟（Economic）、社會（Social）、科技（Technological）、法律（Legal）、環境（Environmental）。</li></ul><h4>公司競爭策略</h4><ul><li><b>成本領導</b>：成為最低成本的生產者。</li><li><b>差異化</b>：提供獨特產品，收取溢價。</li><li><b>集中</b>（focus）：專注在特定區隔市場（可以是成本集中或差異化集中）。</li></ul>',
      ex:'According to Porter’s five forces framework, high barriers to entry reduce the threat of new entrants and support higher long-run industry profitability.' },
    { id:'xs7', t:'公司分析：預測', en:'Company Analysis: Forecasting',
      plain:'在了解公司和產業之後，要預測未來的營收、成本、資本支出和現金流，作為評價的基礎。好的預測會檢查假設是否合理。',
      life:'預測一家手搖飲明年的營收：店數會增加幾家、每家每天賣幾杯、每杯多少錢，再扣掉原料和店租。',
      body:'<h4>預測的對象</h4><ul><li>可以直接預測最終數字（例如 EPS），也可以預測<b>驅動因子</b>（例如銷量、價格）再算出結果。後者比較能檢驗假設。</li><li>通常預測：營收、營業成本、非營業項目、資本支出、營運資金、資本結構。</li></ul><h4>預測方法</h4><ul><li><b>歷史結果</b>：以過去成長率或比率延伸（適合成熟穩定的公司）。</li><li><b>歷史基本比率與均值回歸</b>：極端的成長率或利潤率長期會回到平均水準。</li><li><b>管理階層指引</b>（guidance）：公司自己的預測，要判斷可信度。</li><li><b>分析師自己的判斷</b>：結合產業分析、競爭分析。</li></ul><h4>營收預測</h4><ul><li><b>由上而下</b>：市場規模 × 市占率；或 GDP 成長 → 產業成長。</li><li><b>由下而上</b>：數量 × 價格；依產品線、地區加總；產能利用率。</li></ul><h4>成本預測</h4><ul><li>區分固定和變動成本。變動成本隨營收變動，固定成本相對穩定 → 營收成長時利潤率擴大（營業槓桿）。</li><li>規模經濟：產量越大，單位成本越低。</li><li>要考慮原物料價格、工資、競爭導致的價格壓力。</li></ul><h4>資本投資與營運資金</h4><ul><li>維持性資本支出（≈ 折舊）+ 成長性資本支出。</li><li>營運資金用週轉天數預測，隨營收成長增加。</li></ul><h4>預測期間與情境</h4><ul><li>預測期間：直到公司達到<b>穩定狀態</b>為止；之後用終值。</li><li>考慮景氣循環：用整個循環的平均（normalized）數字。</li><li><b>情境分析</b>：樂觀、基本、悲觀情境，評估估值的範圍。</li><li><b>敏感度分析</b>：關鍵假設（成長率、利潤率）變動對結果的影響。</li></ul>',
      ex:'Over longer forecast horizons, analysts often assume that unusually high growth rates and margins will revert toward industry averages.' },
    { id:'xs8', t:'股票評價：觀念與基本工具', en:'Equity Valuation: Concepts and Basic Tools',
      plain:'股票評價是估計股票的內在價值，再和市價比較：內在價值高於市價就是被低估。主要方法有：現金流折現（股利折現）、乘數法（本益比等）、資產法。',
      life:'買二手機車前，先估它值多少錢（車況、里程、市場行情）。如果賣家開價比你估的低，就是撿到便宜。',
      body:'<h4>內在價值 vs 市價</h4><ul><li>內在價值 &gt; 市價 → <b>低估</b>（買進）；&lt; → <b>高估</b>（賣出）；差不多 → 合理。</li><li>還要考慮：自己的估值模型和假設是否可靠，以及市場可能知道你不知道的資訊。</li></ul><h4>三類評價模型</h4><ul><li><b>現值模型</b>（DCF）：股利折現模型 DDM、自由現金流 FCFE 模型。</li><li><b>乘數模型</b>：P/E、P/B、P/S、P/CF、EV/EBITDA。</li><li><b>資產基礎模型</b>：資產市值 − 負債市值。</li></ul><h4>股利</h4><ul><li>現金股利、股票股利（股數增加但每股價值下降，總價值不變）、股票分割、反分割、庫藏股買回。</li><li>重要日期：宣告日 → 除息日（ex-dividend date，在這天之後買的人拿不到）→ 登記日 → 發放日。除息日股價大約下跌股利金額。</li></ul><h4>股利折現模型 DDM</h4><p class="formula">V<sub>0</sub> = Σ D<sub>t</sub> ÷ (1 + r)<sup>t</sup></p><ul><li><b>特別股</b>（股利固定、永續）：V<sub>0</sub> = D ÷ r。</li><li><b>Gordon 成長模型</b>：</li></ul><p class="formula">V<sub>0</sub> = D<sub>1</sub> ÷ (r − g) = D<sub>0</sub>(1 + g) ÷ (r − g)</p><ul><li>條件：r &gt; g，且 g 永遠固定。適合<b>成熟、穩定發股利</b>的公司。</li><li>可持續成長率 g = b × ROE（b = 保留率）。</li><li><b>多階段</b>模型：前 n 年高成長（逐年折現），第 n 年用 Gordon 算終值 V<sub>n</sub> = D<sub>n+1</sub> ÷ (r − g)，再折現回今天。</li></ul><h4>FCFE 模型</h4><ul><li>FCFE = CFO − FCInv + 淨借款。適合不發股利、或股利和獲利能力無關的公司。</li></ul><h4>乘數法</h4><ul><li><b>理論本益比</b>（由 Gordon 推導）：</li></ul><p class="formula">P<sub>0</sub>/E<sub>1</sub> = (D<sub>1</sub>/E<sub>1</sub>) ÷ (r − g)</p><ul><li>股利支付率越高、成長率越高、要求報酬率越低 → 合理 P/E 越高。</li><li><b>可比公司法</b>：和同業的平均乘數比較。缺點：如果整個產業都被高估，比較結果也會錯。</li><li><b>企業價值 EV</b> = 普通股市值 + 特別股市值 + 負債市值 − 現金與短期投資。EV/EBITDA 適合比較資本結構不同的公司、EBITDA 為正時。</li><li>P/B 適合金融業、資產為主的公司；P/S 適合虧損或新創公司。</li></ul><h4>資產基礎法</h4><ul><li>適合：資產多為有形、容易估價的公司（例如天然資源、金融機構）、即將清算的公司。</li><li>不適合：無形資產多、資產的市值難估的公司。</li></ul><h4>選擇模型的考量</h4><ul><li>符合公司特性（是否發股利、是否穩定成長）、資料品質和取得性、評價目的。常用多種模型交叉驗證。</li></ul>',
      ex:'The Gordon growth model values a stock as next year’s dividend divided by the difference between the required rate of return and the constant dividend growth rate.' }
  ]},
  { id:'x-fi', t:'7. 固定收益 Fixed Income（11–14%）', cards: [
    { id:'xi1', t:'債券的基本特徵與契約條款', en:'Fixed-Income Instrument Features', pre:['bbond'],
      plain:'債券是借錢的契約，寫清楚誰借錢、借多少、利率多少、什麼時候還、有沒有擔保，以及借錢的人必須遵守哪些規定。',
      life:'借錢給朋友時寫一張借據：寫明金額、利息、還款日期，可能還要求他拿機車當擔保，並答應這段期間不能再跟別人借錢。',
      body:'<h4>基本要素</h4><ul><li><b>發行人</b>：政府、公司、超國家組織（例如世界銀行）。</li><li><b>到期日</b>：還本的日期。剩餘期間叫 tenor。超過一年的是資本市場工具；一年以內是貨幣市場工具。永續債沒有到期日。</li><li><b>面額</b>（par / face / principal）。</li><li><b>票面利率</b>（coupon rate）和付息頻率（年付、半年付、季付）。</li><li><b>計價貨幣</b>：雙幣債券（票息和本金不同貨幣）、外幣債券。</li></ul><h4>契約（indenture）與條款</h4><ul><li><b>肯定條款</b>（affirmative）：發行人必須做的事，例如按時付款、維持保險、遵守法律、維持財報品質。</li><li><b>否定條款</b>（negative）：發行人不能做的事，例如不能再舉債超過某水準、不能出售重要資產、不能把資產抵押給其他債權人（negative pledge）、不能發超過一定金額的股利。</li><li><b>交叉違約</b>（cross-default）：其他債務違約就算本債券違約。</li><li>受託人（trustee）代表債券持有人監督發行人。</li></ul><h4>清償順位與擔保</h4><ul><li><b>有擔保</b>（secured）：有特定資產當擔保品。<b>無擔保</b>（debentures）。</li><li><b>優先</b>（senior）vs <b>次順位</b>（subordinated）：清算時優先順位不同，次順位風險較高、利率較高。</li><li>擔保債券例子：抵押債券、設備信託憑證、<b>擔保債券</b>（covered bond）。</li></ul><h4>信用增強</h4><ul><li><b>內部</b>：<b>次順位結構</b>（subordination，下層先吸收損失）、<b>超額擔保</b>（overcollateralization，擔保品價值 &gt; 債券面額）、<b>超額利差</b>（excess spread，擔保品收益 &gt; 支付的利息）。</li><li><b>外部</b>：第三方保證（銀行保證、擔保保險 surety bond、信用狀 letter of credit）。缺點：第三方本身也有信用風險。</li></ul><h4>法律與稅務</h4><ul><li><b>國內債券</b>、<b>外國債券</b>（外國發行人在本國發行，例如武士債、揚基債）、<b>歐洲債券</b>（在發行國貨幣以外的國家發行，不受單一國家監管，通常是無記名債券）、全球債券。</li><li>稅：票息通常課所得稅；美國市政債通常免聯邦稅；<b>原始發行折價</b>（OID，例如零息債）可能每年就要對累積的利息課稅。</li></ul><h4>或有條款（內含選擇權）</h4><ul><li><b>可贖回債券</b>（callable）：發行人可以在到期前用贖回價買回。利率下跌時發行人會贖回再用低利率借 → 對投資人不利 → 殖利率較高。<ul><li>贖回保護期（call protection / lockout）。</li><li>美式（隨時可贖）、歐式（只有一個日期）、百慕達式（多個指定日期）。</li><li><b>補足贖回</b>（make-whole call）：贖回價 = 剩餘現金流以國債利率加小利差折現 → 對投資人比較公平。</li></ul></li><li><b>可賣回債券</b>（putable）：投資人可以要求發行人提前買回。利率上升時投資人會賣回 → 對投資人有利 → 殖利率較低。</li><li><b>可轉換債券</b>：投資人可以轉換成發行公司的股票。<ul><li><b>轉換比率</b> = 每張債券可換的股數；<b>轉換價格</b> = 面額 ÷ 轉換比率。</li><li><b>轉換價值</b> = 股價 × 轉換比率。</li><li>轉換溢價 = 可轉債價格 − 轉換價值。</li><li>殖利率較低（因為有轉換選擇權的價值）。</li></ul></li><li><b>附認股權證債券</b>：認股權證可以和債券分開交易。</li><li><b>應急可轉債 CoCo</b>：銀行資本不足時自動轉換成股票或減記，用來補充銀行資本。</li></ul>',
      ex:'A callable bond gives the issuer the right to redeem the bond before maturity, so investors demand a higher yield than on an otherwise identical option-free bond.' },
    { id:'xi2', t:'債券的現金流結構與種類', en:'Fixed-Income Cash Flows and Types',
      plain:'債券的本金可以到期一次還，也可以分期攤還；票息可以固定、浮動、遞增，甚至和通膨或信用評等連動。',
      life:'房貸通常每月繳本金加利息（攤還）；而定存是到期一次拿回本金（一次還本）。',
      body:'<h4>本金償還方式</h4><ul><li><b>到期一次還本</b>（bullet）：期間只付利息，到期還全部本金。</li><li><b>完全攤還</b>（fully amortizing）：每期付固定金額，包含利息和部分本金，到期剛好還完（例如房貸）。</li><li><b>部分攤還</b>（partially amortizing）：期間攤還部分本金，到期有一筆<b>氣球款</b>（balloon payment）。</li><li><b>償債基金</b>（sinking fund）：發行人每年必須償還部分本金（用抽籤或市場買回）。好處：降低信用風險。缺點：利率下跌時你的債券可能被以面額贖回（再投資風險）。</li></ul><h4>票息結構</h4><ul><li><b>固定利率</b>。</li><li><b>浮動利率債券 FRN</b>：票息 = <b>參考利率</b>（市場參考利率 MRR，例如 SOFR）+ <b>報價利差</b>（quoted margin）。利率風險很低，因為票息會隨市場調整。可能有上限（cap）或下限（floor）。<b>反向浮動</b>（inverse floater）：參考利率上升時票息下降。</li><li><b>階梯票息</b>（step-up）：票息依時間表上升 → 保護投資人免於利率上升。</li><li><b>信用連結票息</b>：發行人信用評等下降時票息上升。</li><li><b>實物支付</b>（PIK）：用更多債券代替現金支付利息（常見於高槓桿公司）。</li><li><b>遞延票息</b>：前幾年不付息，之後才開始付（適合專案融資，前期沒有現金流）。</li><li><b>指數連結債券</b>：票息或本金和指數連動。最常見的是<b>通膨連結債券</b>（例如美國 TIPS）：本金依通膨調整，票息 = 固定利率 × 調整後本金（資本指數化）。保護投資人的購買力。</li><li><b>零息債券</b>：不付利息，以低於面額的價格發行，到期付面額。</li></ul><h4>其他</h4><ul><li><b>永續債</b>：沒有到期日，只付息。</li><li><b>綠色債券</b>：資金用於環境相關專案。</li><li>對發行人和投資人來說，這些結構都在分配利率風險、信用風險和再投資風險。</li></ul>',
      ex:'A floating-rate note pays a coupon equal to a market reference rate plus a quoted margin, so its price is much less sensitive to changes in interest rates than a fixed-rate bond.' },
    { id:'xi3', t:'債券的發行、交易與各類發行人市場', en:'Fixed-Income Issuance and Trading; Markets for Corporate and Government Issuers',
      plain:'債券在初級市場發行，主要在交易商之間的櫃檯市場交易。公司、政府、地方政府和政府機構各有不同的籌資方式。附買回交易（repo）是重要的短期資金來源。',
      life:'政府發行公債就像銀行標售定存單：大家出價，政府決定利率和誰買得到；之後持有人想賣，就去找券商報價。',
      body:'<h4>債券市場分類</h4><ul><li>依發行人：家計、非金融公司、政府、金融機構。</li><li>依信用品質：<b>投資等級</b>（BBB−/Baa3 以上）vs <b>高收益</b>（垃圾債）。</li><li>依到期：貨幣市場（≤ 1 年）vs 資本市場。</li><li>依地區：國內、已開發、新興市場。</li></ul><h4>發行方式</h4><ul><li><b>公開發行</b>：<ul><li><b>承銷</b>：投資銀行買下全部債券再轉賣。</li><li><b>代銷</b>（best efforts）。</li><li><b>拍賣</b>：政府公債常用。</li><li><b>櫥架登記</b>（shelf registration）：一次登記，多次發行。</li></ul></li><li><b>私募</b>：直接賣給少數機構投資人，不需要公開登記，流動性差、條款可客製化。</li></ul><h4>次級市場</h4><ul><li>主要是<b>櫃檯市場</b>（OTC），由交易商報出<b>買價</b>（bid）和<b>賣價</b>（ask/offer）。</li><li>買賣價差反映流動性：國債最窄，高收益債和新興市場債較寬。</li><li>交割：國債通常 T+1，公司債 T+2（依市場不同）。</li></ul><h4>公司的債務融資</h4><ul><li><b>短期</b>：<ul><li>銀行貸款、信用額度（承諾 vs 非承諾）。</li><li><b>商業本票 CP</b>：大型公司發行的無擔保短期債務（美國最長 270 天），通常要有備用信用額度（backup lines）以因應無法再發行的<b>展期風險</b>。</li><li><b>附買回交易</b>（repo）。</li></ul></li><li><b>長期</b>：公司債、<b>中期票據 MTN</b>（持續發行、可客製化期間）。</li><li>投資等級公司常用無擔保債；高收益公司常需要擔保、條款較嚴格。</li></ul><h4>附買回交易 Repo</h4><ul><li>賣出證券，並約定在未來以較高價格買回 → 本質是<b>以證券為擔保的借款</b>。</li><li><b>Repo 利率</b>：買回價格和賣出價格的差（年化）。</li><li><b>折價率</b>（haircut）：擔保品價值超過借款金額的比例。</li><li>影響 repo 利率的因素：擔保品品質越好 → 利率越低；期間越長 → 越高；擔保品越稀有（special collateral）→ 越低；有交付擔保品給貸方 → 越低。</li><li><b>反向附買回</b>（reverse repo）：從貸方的角度看。</li></ul><h4>政府發行人</h4><ul><li><b>主權債</b>（sovereign）：中央政府發行，以本國貨幣發行的信用風險最低（可以印鈔）。<ul><li>最新發行的叫 <b>on-the-run</b>（流動性最好，常作為基準），之前的叫 off-the-run。</li><li>拍賣方式：<b>單一價格拍賣</b>（荷蘭式，所有得標者用同一價格）、<b>多重價格拍賣</b>（得標者各付自己出的價）。</li></ul></li><li><b>非主權政府</b>：地方政府（美國市政債）。<ul><li><b>一般責任債</b>（GO bonds）：以地方政府的稅收償還。</li><li><b>收入債</b>（revenue bonds）：以特定專案的收入償還（例如收費公路），風險較高。</li></ul></li><li><b>準政府／政府機構</b>：例如美國的房利美、房地美，可能有隱含的政府保證。</li><li><b>超國家組織</b>：世界銀行、亞洲開發銀行等，信用評等通常很高。</li></ul>',
      ex:'A repurchase agreement is economically a collateralized loan, and the haircut represents the amount by which the collateral value exceeds the loan amount.' },
    { id:'xi4', t:'債券評價：價格與殖利率', en:'Fixed-Income Bond Valuation: Prices and Yields',
      plain:'債券價格就是未來票息和本金的現值。市場利率上升，價格就下跌。在兩次付息日之間買賣，還要計算應計利息。',
      life:'你持有一張每年付 5% 利息的借據，如果現在銀行利率變成 7%，沒人想用原價買你的 5% 借據，只能降價賣。',
      body:'<h4>債券定價公式</h4><p class="formula">PV = PMT ÷ (1 + r)<sup>1</sup> + PMT ÷ (1 + r)<sup>2</sup> + … + (PMT + FV) ÷ (1 + r)<sup>N</sup></p><ul><li>r 是<b>市場折現率</b>（必要報酬率），用來折現的利率就是<b>到期殖利率 YTM</b>。</li><li>票面利率 = 市場利率 → <b>平價</b>；票面利率 &lt; 市場利率 → <b>折價</b>；票面利率 &gt; 市場利率 → <b>溢價</b>。</li></ul><h4>價格與殖利率的關係（五個特性）</h4><ol><li><b>反向</b>：殖利率上升，價格下跌。</li><li><b>凸性</b>：殖利率下跌造成的價格漲幅 &gt; 同幅度上升造成的跌幅。</li><li><b>票面利率效果</b>：其他條件相同，票面利率越<b>低</b>，價格對殖利率越敏感。</li><li><b>到期期間效果</b>：其他條件相同，到期越<b>長</b>，價格越敏感（通常如此）。</li><li><b>收斂到面額</b>（pull to par）：殖利率不變的話，折價或溢價債券的價格會隨時間接近面額。</li></ol><h4>即期利率定價</h4><ul><li>每一期的現金流用<b>對應期限的即期利率</b>（零息利率）折現：PV = PMT/(1 + Z<sub>1</sub>) + PMT/(1 + Z<sub>2</sub>)² + …</li><li>這樣算出來的價格和用 YTM 算的相同；YTM 是即期利率的某種加權平均。</li></ul><h4>應計利息、全價與淨價</h4><ul><li><b>全價</b>（full / dirty price）：買方實際支付的價格。</li><li><b>應計利息</b> AI = (t ÷ T) × 每期票息（t = 上次付息到交割日的天數，T = 付息期間天數）。</li><li><b>淨價</b>（flat / clean price）= 全價 − 應計利息。市場報價用淨價（避免價格在付息日跳動）。</li></ul><p class="formula">全價 = PV<sub>上次付息日</sub> × (1 + r)<sup>t/T</sup></p><ul><li><b>計息天數慣例</b>：政府債常用實際天數/實際天數（actual/actual）；公司債常用 30/360。</li></ul><h4>矩陣定價</h4><ul><li>不常交易的債券，用信用評等、到期日、票面利率相似且有交易的債券的殖利率來<b>內插</b>估計。</li><li>也用來幫新發行債券訂票面利率。</li></ul>',
      ex:'When a bond’s coupon rate is less than the market discount rate, the bond is priced at a discount to par value.' },
    { id:'xi5', t:'固定利率債券的殖利率與利差', en:'Yield and Yield Spread Measures for Fixed-Rate Bonds',
      plain:'殖利率有很多種算法：到期殖利率、當期殖利率、贖回殖利率……利差則是債券殖利率比基準利率多出來的部分，反映信用和流動性風險。',
      life:'比較兩家銀行的定存要用「年利率」換算到同一基準；比較兩張債券的風險，看它比國債多給你多少利息（利差）。',
      body:'<h4>到期殖利率 YTM 的假設</h4><ul><li>持有到期、所有款項準時全額支付、票息以相同的 YTM <b>再投資</b>。</li><li>是債券的內部報酬率 IRR。</li></ul><h4>年化與換算</h4><ul><li>付息頻率不同要換算：半年付息的 YTM 是「半年利率 × 2」，叫做<b>債券等值殖利率</b>（semiannual bond basis）。</li><li>換算公式：(1 + APR<sub>m</sub>/m)<sup>m</sup> = (1 + APR<sub>n</sub>/n)<sup>n</sup>。例：半年複利 5% → 年複利 (1.025)² − 1 = 5.0625%。</li><li><b>街頭慣例</b>（street convention）：假設款項在預定日期支付（忽略假日）；<b>真實殖利率</b>：用實際付款日。</li></ul><h4>其他殖利率</h4><ul><li><b>當期殖利率</b>（current yield）= 年票息 ÷ <b>淨價</b>。只看票息，不考慮資本利得和時間價值。</li><li><b>簡單殖利率</b>（simple yield）= (年票息 + 直線攤銷的利得或損失) ÷ 淨價。</li><li><b>贖回殖利率</b>（yield to call）：假設在某個贖回日被贖回。</li><li><b>最差殖利率</b>（yield to worst）：所有可能的贖回日和到期殖利率中<b>最低</b>的。</li><li><b>選擇權調整殖利率</b>：扣除內含選擇權價值後的殖利率。</li></ul><h4>利差</h4><ul><li>殖利率 = 基準利率（國債利率）+ <b>利差</b>（反映信用風險、流動性風險、稅等）。</li><li><b>G-spread</b>：和<b>政府公債</b>殖利率比（相同到期，必要時內插）。</li><li><b>I-spread</b>（內插利差）：和<b>利率交換</b>（swap）利率比。</li><li><b>Z-spread</b>（零波動利差）：加在<b>整條即期利率曲線</b>上的固定利差，讓折現後價格等於市價。比 G-spread 精確。</li><li><b>OAS</b>（選擇權調整利差）= Z-spread − 選擇權成本。可贖回債券：OAS &lt; Z-spread。</li><li>利差變大 → 價格下跌。</li></ul><h4>貨幣市場工具的報價</h4><ul><li><b>貼現率基礎</b>（例如美國國庫券）：PV = FV × [1 − (天數/年) × DR]；DR = (年/天數) × (FV − PV)/FV。</li><li><b>附加利率基礎</b>（add-on，例如定存、LIBOR 類的利率）：PV = FV ÷ [1 + (天數/年) × AOR]；AOR = (年/天數) × (FV − PV)/PV。</li><li>貼現率會<b>低估</b>投資人的實際報酬（因為分母用面額）。比較時要換算成同一基準（例如債券等值殖利率，用 365 天的附加利率）。</li></ul>',
      ex:'The Z-spread is the constant spread that, when added to each spot rate on the benchmark curve, makes the present value of the bond’s cash flows equal to its price.' },
    { id:'xi6', t:'浮動利率債券的殖利率', en:'Yield and Yield Spread Measures for Floating-Rate Instruments',
      plain:'浮動利率債券的票息會隨市場利率調整。價格會不會偏離面額，要看「報價利差」和市場要求的「折現利差」誰大。',
      life:'你的打工時薪跟著基本工資調整（浮動），再加 20 元的加給。如果現在市場上同類工作要加 30 元才找得到人，你這份工作就沒那麼吸引人了。',
      body:'<h4>重要名詞</h4><ul><li><b>市場參考利率 MRR</b>：例如 SOFR、EURIBOR。</li><li><b>報價利差</b>（quoted margin, QM）：發行時約定、固定不變的加碼。</li><li><b>要求利差／折現利差</b>（required margin / discount margin, DM）：現在市場要求的加碼，反映目前的信用風險。</li></ul><h4>價格與利差的關係</h4><ul><li>QM = DM → 在付息重設日價格回到<b>面額</b>。</li><li>QM &gt; DM → <b>溢價</b>（信用變好，市場要求的加碼變少）。</li><li>QM &lt; DM → <b>折價</b>（信用變差）。</li></ul><h4>定價公式（簡化）</h4><p class="formula">PV = Σ [(MRR + QM) × FV ÷ m] ÷ [1 + (MRR + DM) ÷ m]<sup>t</sup> + FV ÷ [1 + (MRR + DM) ÷ m]<sup>N</sup></p><ul><li>m = 每年付息次數。假設 MRR 未來不變。</li></ul><h4>利率風險</h4><ul><li>浮動利率債的利率風險很低：票息會重設，價格在重設日接近面額。</li><li>主要剩下<b>信用風險</b>（DM 變動）。存續期間大約只到下一次重設日。</li></ul>',
      ex:'If a floating-rate note’s quoted margin exceeds the discount margin required by the market, the note will be priced at a premium to par.' },
    { id:'xi7', t:'利率期限結構：即期、平價與遠期曲線', en:'The Term Structure of Interest Rates: Spot, Par, and Forward Curves',
      plain:'不同到期日的利率連成一條曲線，就是殖利率曲線。即期利率是零息債的利率；遠期利率是「今天約定未來某段期間的利率」，可以從即期利率推算出來。',
      life:'現在借錢 1 年利率 2%、借 2 年年利率 3%。那麼市場隱含「一年後再借一年」的利率大約是 4%，因為兩種方式最後要一樣划算。',
      body:'<h4>三種曲線</h4><ul><li><b>即期利率曲線</b>（spot / zero curve）：各期限零息債的殖利率 Z<sub>1</sub>、Z<sub>2</sub>…。用來折現各期現金流最精確。</li><li><b>平價曲線</b>（par curve）：各期限「以面額發行」的附息債的殖利率（票面利率 = 殖利率）。可以用<b>拔靴法</b>（bootstrapping）從平價曲線推出即期曲線。</li><li><b>遠期曲線</b>（forward curve）：未來某時點開始、某期間的利率。</li></ul><h4>遠期利率</h4><p class="formula">(1 + Z<sub>B</sub>)<sup>B</sup> = (1 + Z<sub>A</sub>)<sup>A</sup> × (1 + IFR<sub>A, B−A</sub>)<sup>B−A</sup></p><ul><li>IFR<sub>A, B−A</sub>：從第 A 年開始、為期 B − A 年的<b>隱含遠期利率</b>。</li><li>例：Z<sub>1</sub> = 2%、Z<sub>2</sub> = 3% → (1.03)² = 1.02 × (1 + f) → f = 1.0609/1.02 − 1 = 4.01%。</li><li>投資人在「買 2 年期」和「買 1 年期再展期 1 年」之間無差異的利率 → <b>損益兩平再投資利率</b>。</li><li>債券價格也可以用遠期利率逐期折現：PV = CF<sub>1</sub>/(1 + f<sub>0,1</sub>) + CF<sub>2</sub>/[(1 + f<sub>0,1</sub>)(1 + f<sub>1,1</sub>)] + …</li></ul><h4>曲線形狀</h4><ul><li><b>正斜率</b>（向上）：長期利率 &gt; 短期，最常見。此時遠期曲線在即期曲線之上，即期曲線在平價曲線之上（附息債的 YTM 低於同期即期利率）。</li><li><b>倒掛</b>（向下）：常被視為衰退的訊號。此時遠期 &lt; 即期 &lt; 平價。</li><li><b>平坦</b>、<b>駝峰</b>。</li></ul><h4>YTM 與即期利率</h4><ul><li>附息債的 YTM 是各即期利率的<b>加權平均</b>（權重偏向到期時的大筆本金）。</li><li>如果殖利率曲線不平，同到期、不同票面利率的債券 YTM 會不同（票面利率效果）。</li></ul>',
      ex:'An implied forward rate is the breakeven reinvestment rate that makes an investor indifferent between buying a long-term zero-coupon bond and rolling over shorter-term bonds.' },
    { id:'xi8', t:'利率風險與報酬：投資期間與存續期間缺口', en:'Interest Rate Risk and Return',
      plain:'債券投資的報酬來自三個部分：票息、票息再投資的收入、賣出時的價格變化。利率變動對再投資收入和價格的影響方向相反，在某個投資期間會剛好抵銷。',
      life:'利率上升時，你的債券價格會下跌（壞事），但收到的利息可以用更高的利率再存起來（好事）。持有夠久，好事會補回壞事。',
      body:'<h4>債券報酬的來源</h4><ol><li><b>票息</b>收入。</li><li><b>票息再投資</b>的收入（利滾利）。</li><li>賣出或到期時的<b>資本利得或損失</b>（相對於攤銷後成本）。</li></ol><h4>兩種利率風險</h4><ul><li><b>市場價格風險</b>：利率上升 → 賣出價格下跌。投資期間<b>短</b>時，這個風險比較重要。</li><li><b>再投資風險</b>：利率下跌 → 票息再投資收入減少。投資期間<b>長</b>時，這個風險比較重要。</li><li>兩者方向相反。</li></ul><h4>Macaulay 存續期間與投資期間</h4><ul><li><b>Macaulay 存續期間</b>：價格風險和再投資風險<b>剛好抵銷</b>的投資期間（假設利率只變動一次、平行移動）。</li><li><b>存續期間缺口</b> = Macaulay 存續期間 − 投資期間。</li><li><b>缺口 &gt; 0</b>（投資期間比存續期間短）：價格風險為主 → <b>利率上升時受損</b>。</li><li><b>缺口 &lt; 0</b>（投資期間比存續期間長）：再投資風險為主 → <b>利率下跌時受損</b>。</li><li>缺口 = 0：對利率的一次性小幅變動免疫（<b>免疫策略</b>的基礎）。</li></ul><h4>水平報酬</h4><ul><li>持有到期的人，如果利率不變，實現報酬率 = 買進時的 YTM。</li><li>持有期間報酬率：(期末總值 ÷ 期初價格)<sup>1/n</sup> − 1。</li></ul>',
      ex:'When the investment horizon is shorter than the bond’s Macaulay duration, the duration gap is positive and market price risk dominates reinvestment risk.' },
    { id:'xi9', t:'存續期間：衡量債券對利率的敏感度', en:'Yield-Based Bond Duration Measures and Properties',
      plain:'存續期間告訴你「利率變動 1%，債券價格大約變動幾 %」。存續期間越長，利率風險越大。',
      life:'存續期間像蹺蹺板的長度：板子越長（存續期間越長），另一頭輕輕一壓，這頭就翹得越高（價格變動越大）。',
      body:'<h4>Macaulay 存續期間</h4><ul><li>各期現金流到來時間的<b>加權平均</b>，權重是每筆現金流現值佔債券價格的比例。單位是「年」（或期）。</li><li>零息債的 Macaulay 存續期間 = 到期期間。</li></ul><h4>修正存續期間</h4><p class="formula">ModDur = MacDur ÷ (1 + r)</p><p class="formula">%ΔPV ≈ −ModDur × Δ殖利率</p><ul><li>r 是每期殖利率（半年付息要用半年利率；年化的存續期間 = 每期存續期間 ÷ 每年期數）。</li><li>例：ModDur = 7，殖利率上升 0.5% → 價格約下跌 3.5%。</li></ul><h4>近似修正存續期間</h4><p class="formula">ApproxModDur = (PV<sub>−</sub> − PV<sub>+</sub>) ÷ (2 × Δ殖利率 × PV<sub>0</sub>)</p><ul><li>PV<sub>−</sub>：殖利率下降 Δ 後的價格；PV<sub>+</sub>：上升後的價格。</li></ul><h4>有效存續期間</h4><ul><li>用<b>基準殖利率曲線</b>的變動計算（而不是債券本身的 YTM）。適合<b>含選擇權債券</b>和 MBS（現金流會隨利率改變）。</li><li>公式同上，但用曲線平移 ΔCurve。</li></ul><h4>金額存續期間與 PVBP</h4><ul><li><b>金額存續期間</b>（money duration）= ModDur × 全價（× 部位面額）。價格變動金額 ≈ −MoneyDur × Δy。</li><li><b>基點價值 PVBP</b>（DV01）：殖利率變動 1 個基點（0.01%）時價格變動的金額。</li></ul><h4>存續期間的特性</h4><ul><li>到期<b>越長</b> → 存續期間越長（一般情況；深度折價的長期債可能例外）。</li><li>票面利率<b>越高</b> → 存續期間越短（早期現金流較多）。</li><li>殖利率<b>越高</b> → 存續期間越短。</li><li>零息債：存續期間 = 到期期間（同到期中最長）。</li><li><b>永續債</b>：MacDur = (1 + r) ÷ r。</li><li>在付息日之間，存續期間會隨時間逐漸縮短，付息後跳升（鋸齒狀）。</li><li><b>可贖回債</b>：有效存續期間 ≤ 普通債（利率下跌時可能被贖回，價格上漲有限）。</li><li><b>可賣回債</b>：有效存續期間 ≤ 普通債（利率上升時可以賣回，價格下跌有限）。</li></ul><h4>投資組合的存續期間</h4><ul><li>≈ 各債券存續期間以<b>市值</b>加權平均。假設殖利率曲線平行移動。</li></ul>',
      ex:'Holding other factors constant, a bond with a lower coupon rate, a longer time to maturity, or a lower yield will have a higher duration.' },
    { id:'xi10', t:'凸性：修正存續期間的估計誤差', en:'Yield-Based Bond Convexity and Portfolio Properties',
      plain:'存續期間假設價格和殖利率是直線關係，但其實是彎曲的。凸性用來修正這個誤差。正凸性對投資人有利：利率下跌時漲更多、上升時跌更少。',
      life:'存續期間像用直尺量彎曲的路，距離短時還算準，距離長時就有誤差；凸性就是把彎曲的部分補回來。',
      body:'<h4>完整的價格變動估計</h4><p class="formula">%ΔPV ≈ −ModDur × Δy + ½ × Convexity × (Δy)²</p><ul><li>凸性項總是用 (Δy)²，所以<b>不管利率上升或下降</b>，正凸性都讓價格變動往有利方向修正。</li><li>例：ModDur = 7、凸性 = 60、Δy = +1% → −7% + ½ × 60 × 0.0001 = −7% + 0.3% = <b>−6.7%</b>。</li></ul><h4>近似凸性</h4><p class="formula">ApproxCon = (PV<sub>−</sub> + PV<sub>+</sub> − 2PV<sub>0</sub>) ÷ [(Δy)² × PV<sub>0</sub>]</p><ul><li><b>有效凸性</b>：用基準曲線的變動計算，適合含選擇權債券。</li><li><b>金額凸性</b> = 凸性 × 全價。</li></ul><h4>凸性的特性</h4><ul><li>到期越長、票面利率越低、殖利率越低 → 凸性越大。</li><li>現金流越<b>分散</b>（不集中在某一時點）→ 凸性越大。</li><li>普通債（無選擇權）有<b>正凸性</b>。</li><li><b>可贖回債</b>：殖利率低時（接近會被贖回），價格上漲受限 → <b>負凸性</b>。</li><li><b>可賣回債</b>：殖利率高時價格下跌受限 → 凸性比普通債更大。</li><li>其他條件相同時，投資人偏好凸性較大的債券（會付比較高的價格）。</li></ul><h4>投資組合</h4><ul><li>投資組合的存續期間和凸性 ≈ 個別債券的市值加權平均。</li><li>限制：只在殖利率曲線<b>平行移動</b>時準確。</li></ul>',
      ex:'Positive convexity means that a bond’s price increases more when yields fall than it decreases when yields rise by the same amount.' },
    { id:'xi11', t:'以曲線為基礎的風險衡量與實證存續期間', en:'Curve-Based and Empirical Fixed-Income Risk Measures',
      plain:'含選擇權的債券要用整條殖利率曲線的變動來算有效存續期間。殖利率曲線不一定平行移動，所以有「關鍵利率存續期間」。實證存續期間則用歷史資料估計。',
      life:'天氣預報只說「明天會比較熱」不夠，還要知道早上、中午、晚上各自熱多少 → 關鍵利率存續期間看曲線上每一段的變化。',
      body:'<h4>有效存續期間與凸性</h4><ul><li>當債券現金流會隨利率改變（可贖回、可賣回、MBS）時，殖利率本身無法定義 → 改用<b>基準曲線的平行移動</b>計算。</li><li>需要用評價模型（例如二項樹）算出曲線上下移動後的價格。</li><li>可贖回債：利率低時有效存續期間變短、凸性為負。</li></ul><h4>關鍵利率存續期間（部分存續期間）</h4><ul><li>只移動殖利率曲線上<b>某一個期限</b>的利率（例如 5 年期），看價格變動多少。</li><li>所有關鍵利率存續期間<b>加總 = 有效存續期間</b>。</li><li>用來衡量<b>形狀風險</b>（曲線變陡、變平、彎曲）。</li></ul><h4>實證存續期間</h4><ul><li>用<b>歷史資料迴歸</b>估計：債券價格實際上對基準利率變動的反應。</li><li><b>分析存續期間</b>（用公式算）假設利差不變。</li><li>但實際上，經濟變差時政府公債殖利率下跌（避險），信用利差卻擴大 → 兩者部分抵銷 → <b>高收益債的實證存續期間比分析存續期間短</b>。</li><li>政府公債：實證和分析存續期間接近。</li></ul>',
      ex:'The sum of a bond’s key rate durations equals its effective duration, and key rate durations are used to measure exposure to changes in the shape of the yield curve.' },
    { id:'xi12', t:'信用風險：違約機率、回收率與信用評等', en:'Credit Risk',
      plain:'信用風險是借錢的人不還錢的風險。預期損失 = 違約機率 × 違約後損失多少。信用評等機構用 AAA 到 D 的評等告訴投資人風險高低。',
      life:'借錢給同學：他有多大機率不還（違約機率）、萬一不還你能拿回多少（回收率）、一共借了多少（曝險）。',
      body:'<h4>信用風險的組成</h4><p class="formula">預期損失 = 違約機率 PD × 違約損失率 LGD × 曝險金額</p><ul><li><b>LGD</b> = 1 − 回收率。</li><li>信用相關風險：<b>降評風險</b>（評等下降、利差擴大、價格下跌）、<b>市場流動性風險</b>（賣不掉或要大幅折價）。</li></ul><h4>信用分析的 4 C</h4><ul><li><b>能力</b>（Capacity）：產生現金流償債的能力（產業分析、公司分析）。</li><li><b>資本</b>（Capital）：公司的資本緩衝、財務實力。</li><li><b>擔保品</b>（Collateral）：可以用來償債的資產價值。</li><li><b>契約條款</b>（Covenants）：保護債權人的條款。</li><li>有時再加上<b>品格</b>（Character）：經營團隊的誠信與能力。</li></ul><h4>清償順位</h4><ul><li>順序（高到低）：第一順位擔保債 → 第二順位擔保債 → 優先無擔保債 → 次順位債 → 特別股 → 普通股。</li><li>同一順位的債權人地位相同（<b>pari passu</b>）。</li><li>實務上破產重整時常<b>偏離絕對優先原則</b>（為了加快程序、讓次順位債權人同意）。</li><li>順位越高，回收率越高。</li></ul><h4>信用評等</h4><ul><li>投資等級：S&amp;P/Fitch <b>BBB−</b>、Moody’s <b>Baa3</b> 以上。以下是<b>高收益</b>（投機等級、垃圾債）。D 表示已違約。</li><li><b>發行人評等</b>（公司本身，通常看優先無擔保債）vs <b>債券評等</b>。</li><li><b>評等調整</b>（notching）：次順位債評等比發行人低；有擔保的可能較高。高收益發行人的調整幅度較大。</li><li>依賴評等的風險：評等可能落後於市場、會變動、會出錯（例如 2008 年的 MBS）、難以反映突發事件（例如訴訟、併購）。</li></ul><h4>信用利差</h4><ul><li>信用利差 = 公司債殖利率 − 同到期政府債殖利率。反映預期損失、流動性風險、稅等。</li><li>利差變動的價格影響：%ΔP ≈ −ModDur × Δspread + ½ × Convexity × (Δspread)²。</li><li>影響利差的因素：景氣循環（衰退時擴大）、市場整體狀況、交易商資本、市場的供需。</li><li>評等越低，利差越大，利差的波動也越大。</li></ul>',
      ex:'Expected loss equals the probability of default multiplied by the loss given default, where loss given default equals one minus the recovery rate.' },
    { id:'xi13', t:'政府與公司發行人的信用分析', en:'Credit Analysis for Government and Corporate Issuers',
      plain:'分析國家的信用，要看政治制度、經濟實力、財政狀況、外匯存底；分析公司的信用，要看獲利能力、現金流、負債水準和利息保障倍數。',
      life:'判斷一個家庭能不能借錢：看家人的收入穩不穩定（經濟實力）、負債多少（槓桿）、有沒有存款（流動性）、家裡的規矩嚴不嚴（制度）。',
      body:'<h4>主權信用分析</h4><ul><li><b>質性因素</b>：<ul><li><b>制度與政府效能</b>：法治、政治穩定、政府透明度、償債意願與紀錄。</li><li><b>經濟</b>：人均所得、成長前景、經濟多元化。</li><li><b>財政</b>：政府負債水準、財政赤字、稅收能力。</li><li><b>貨幣</b>：央行獨立性與可信度、匯率制度、本國貨幣是否為國際儲備貨幣。</li><li><b>對外</b>：外匯存底、經常帳、外債水準。</li></ul></li><li><b>量化指標</b>：政府負債/GDP、財政收支/GDP、利息支出/收入、實質 GDP 成長、外匯存底/短期外債、經常帳/GDP。</li><li><b>本國貨幣評等</b>通常高於<b>外國貨幣評等</b>：本國貨幣債務可以靠印鈔或加稅償還，外國貨幣債務要靠出口賺外匯。</li></ul><h4>非主權政府</h4><ul><li><b>一般責任債</b>：看地方經濟、稅基、預算管理、退休金負擔。</li><li><b>收入債</b>：看專案本身，例如<b>償債保障比率</b>（debt service coverage ratio）= 淨收入 ÷ 應付本息。</li><li>政府機構、國營企業：看是否有政府支持。</li></ul><h4>公司信用分析</h4><ul><li><b>質性</b>：商業模式、產業結構與競爭地位、經營團隊、公司治理、ESG 風險、法規環境。</li><li><b>量化</b>（常用比率）：<ul><li>獲利能力：EBIT 利潤率、EBITDA 利潤率。</li><li><b>保障倍數</b>：EBIT ÷ 利息費用、EBITDA ÷ 利息費用（越高越好）。</li><li><b>槓桿</b>：負債 ÷ EBITDA（越低越好）、負債 ÷ 資本、FFO（營運資金）÷ 負債（越高越好）。</li><li>流動性：現金、未動用額度、短期債務到期分布。</li></ul></li><li>評估<b>債務結構</b>：哪些負債在哪個子公司（結構性次順位：母公司債權人排在子公司債權人後面）。</li><li>高收益債的分析：更重視流動性、現金流預測、清算價值、債務結構與條款。</li><li>產業因素：景氣循環性、季節性、成長性、競爭程度、法規。</li></ul>',
      ex:'Sovereign ratings on local currency debt are typically higher than ratings on foreign currency debt because a government can raise taxes or print its own currency to meet local currency obligations.' },
    { id:'xi14', t:'資產證券化', en:'Fixed-Income Securitization',
      plain:'資產證券化是把一堆貸款（例如房貸、車貸）打包起來，切成不同風險等級的證券賣給投資人。銀行可以提早拿回資金，投資人可以選擇自己想要的風險等級。',
      life:'一家水果店把一整箱各種水果分成「精選禮盒」「一般包」「格外品」三種等級賣：品質最好的最貴、最安全，格外品便宜但風險高。',
      body:'<h4>證券化的好處</h4><ul><li>對銀行（發起人）：資產從資產負債表移出、提早拿回資金可以再放款、降低融資成本。</li><li>對投資人：可以直接投資原本只有銀行能持有的資產、可以選擇不同風險和報酬的分券。</li><li>對經濟：提高資本市場效率、降低借款人成本。</li><li>風險：結構複雜、2008 年金融海嘯顯示可能造成系統性風險。</li></ul><h4>參與者與結構</h4><ul><li><b>發起人</b>（originator / seller）：原本放款的銀行，把貸款賣給 SPE。</li><li><b>特殊目的機構 SPE / SPV</b>：專門持有資產、發行證券的獨立法人。<b>破產隔離</b>（bankruptcy remote）：發起人破產時，SPE 的資產不受影響 → 證券的信用可能比發起人更好。</li><li><b>服務機構</b>（servicer）：收款、催收（常常是發起人自己）。</li><li><b>受託人</b>（trustee）：代表投資人監督。</li></ul><h4>分券（tranching）</h4><ul><li><b>信用分券</b>：<ul><li><b>優先</b>（senior）→ <b>中間</b>（mezzanine）→ <b>次順位／權益</b>（subordinated / equity）。</li><li>損失由下往上吸收（次順位先承擔），現金流由上往下分配（<b>瀑布式</b> waterfall）。</li><li>次順位分券是上層的<b>信用增強</b>。</li></ul></li><li><b>時間分券</b>：依本金償還的先後順序分（例如循序償還 CMO），用來重新分配<b>提前還款風險</b>。</li></ul><h4>擔保債券 Covered bonds</h4><ul><li>銀行發行、以一池資產（擔保池）擔保的債券，<b>留在銀行的資產負債表上</b>。</li><li><b>雙重追索權</b>：投資人可以向發行銀行求償，也可以對擔保池求償。</li><li>擔保池是<b>動態</b>的：不良資產要被替換。</li><li>信用風險比一般 ABS 低、殖利率也較低。歐洲很常見。</li></ul>',
      ex:'A special purpose entity is bankruptcy remote, so the assets backing an asset-backed security are protected if the originator becomes insolvent.' },
    { id:'xi15', t:'資產擔保證券 ABS', en:'Asset-Backed Security (ABS) Instrument and Market Features',
      plain:'ABS 以房貸以外的資產擔保，例如車貸、信用卡應收帳款、學貸。不同資產的現金流特性不同，例如信用卡債沒有固定還款期，所以結構設計也不同。',
      life:'把一千張分期付款的機車貸款打包，每月的還款就是 ABS 投資人的收入來源。',
      body:'<h4>攤還型 vs 非攤還型資產</h4><ul><li><b>攤還型</b>：借款人定期還本金和利息（例如車貸、房貸）。</li><li><b>非攤還型</b>：沒有固定還本計畫（例如信用卡）。</li></ul><h4>汽車貸款 ABS</h4><ul><li>以車貸或租賃的應收款擔保，攤還型，可能有提前還款（換車、出售）。</li><li>信用增強：次順位分券、超額擔保、<b>準備帳戶</b>（reserve account）、超額利差。</li></ul><h4>信用卡應收帳款 ABS</h4><ul><li>非攤還型，通常是<b>循環結構</b>（revolving）：</li><li><b>鎖定期</b>（lockout / revolving period）：持卡人還的本金拿去<b>買新的應收款</b>，投資人只收利息（和費用）。</li><li>鎖定期結束後，本金才開始分配給投資人（或一次償還）。</li><li><b>提前攤還條款</b>（early/rapid amortization）：如果擔保池表現太差（例如超額利差變負），會提前開始還本金，保護投資人。</li><li>浮動利率常見。</li></ul><h4>其他 ABS</h4><ul><li>學生貸款、設備租賃、太陽能貸款 ABS 等。</li></ul><h4>擔保債務憑證 CDO</h4><ul><li>以一池<b>債務工具</b>擔保：公司債（CBO）、銀行貸款（<b>CLO</b>，最常見）、甚至其他 ABS。</li><li>由<b>擔保品管理人</b>主動買賣擔保池的資產。</li><li>結構：優先、中間、次順位分券；擔保品管理人的目標是讓擔保池報酬高於支付給優先分券的利息。</li><li><b>合成 CDO</b>：用信用違約交換（CDS）取得信用曝險，而不是直接持有債券。</li><li>投資人要評估：擔保池的違約率和相關性、擔保品管理人的能力、分券結構。</li></ul>',
      ex:'Credit card receivable ABS typically have a lockout period during which principal repayments are used to purchase additional receivables rather than paid to investors.' },
    { id:'xi16', t:'不動產抵押貸款證券 MBS 與提前還款風險', en:'Mortgage-Backed Security (MBS) Instrument and Market Features',
      plain:'MBS 以房貸擔保。房貸借款人可以提前還款，所以 MBS 投資人的最大風險是現金流時點不確定：利率下跌時太早拿回錢（收縮風險），利率上升時太晚拿回錢（延伸風險）。',
      life:'你借錢給很多人買房，利率下跌時大家都去轉貸、把錢提早還你，你只能把錢拿去存低利率；利率上升時大家都不提早還，你的錢被綁在低利率的貸款上。',
      body:'<h4>住宅房貸的特徵</h4><ul><li>到期期間（常見 15 年、30 年）、利率（固定、<b>可調整 ARM</b>、混合型）、攤還方式（完全攤還、<b>只付利息</b>、<b>氣球型</b>）。</li><li><b>提前還款選擇權</b>：借款人可以提前還；有些有<b>提前還款罰金</b>。</li><li><b>追索權</b>：有追索權的貸款，房子拍賣不夠還時可以繼續追討借款人的其他資產；美國很多州是<b>無追索權</b>（借款人可以「棄屋」strategic default）。</li><li><b>貸款成數 LTV</b>：越高越危險；<b>負債收入比</b>。</li></ul><h4>機構 vs 非機構 RMBS</h4><ul><li><b>機構 RMBS</b>：由政府機構（Ginnie Mae，有政府完全保證）或政府支持企業（Fannie Mae、Freddie Mac）保證 → 信用風險極低，主要是<b>提前還款風險</b>。房貸要符合條件（conforming loans）。</li><li><b>非機構 RMBS</b>：民間發行，有信用風險 → 需要信用增強。</li></ul><h4>轉付證券 Pass-through</h4><ul><li>把擔保池的本金和利息（扣除服務費等）按比例轉付給投資人。</li><li>轉付利率 &lt; 擔保池的加權平均票面利率 <b>WAC</b>（差額是服務費和保證費）。<b>WAM</b> = 加權平均到期期間。</li></ul><h4>提前還款的衡量</h4><ul><li><b>單月死亡率 SMM</b>：當月提前還款金額 ÷ (月初餘額 − 當月預定本金)。</li><li><b>條件提前還款率 CPR</b>（年化）：CPR = 1 − (1 − SMM)<sup>12</sup>。</li><li><b>PSA 基準</b>：100 PSA = 第 1 個月 CPR 0.2%，每月增加 0.2%，到第 30 個月達 6% 後固定。200 PSA = 兩倍速度。</li><li>平均存續期（weighted average life）：提前還款越快，WAL 越短。</li></ul><h4>提前還款風險</h4><ul><li><b>收縮風險</b>（contraction risk）：利率<b>下跌</b> → 提前還款加速 → 拿回的錢只能以低利率再投資；價格上漲有限（類似可贖回債的<b>負凸性</b>）。</li><li><b>延伸風險</b>（extension risk）：利率<b>上升</b> → 提前還款變慢 → 存續期間變長，錢被綁在低於市場的利率。</li></ul><h4>擔保房貸憑證 CMO</h4><ul><li>把轉付證券的現金流重新分配給不同分券，<b>重新分配提前還款風險</b>（不會消除）。</li><li><b>循序償還</b>（sequential-pay）：本金先全部還給 A 分券，A 還完再還 B…… → A 收縮風險小，後面的分券延伸風險小。</li><li><b>計畫攤還分券 PAC</b>：只要提前還款速度在一定範圍內（PAC collar），就按預定時間表還本 → 現金流穩定。</li><li><b>支撐分券</b>（support / companion）：吸收提前還款速度的變動，保護 PAC → 風險較高、殖利率較高。</li><li>浮動利率分券、反向浮動分券、只收利息 IO、只收本金 PO。</li></ul><h4>商用不動產 MBS（CMBS）</h4><ul><li>以商用不動產（辦公大樓、商場、公寓）貸款擔保，通常是<b>無追索權</b> → 重點是物業本身的現金流。</li><li>信用指標：<b>償債保障比率 DSCR</b> = 淨營業收入 ÷ 應付本息（越高越好）；<b>LTV</b>（越低越好）。</li><li><b>提前還款保護</b>（比住宅房貸強）：<ul><li>提前還款鎖定期（lockout）。</li><li>提前還款罰金點數（penalty points）。</li><li><b>收益維持費</b>（yield maintenance）：補償投資人的利息損失。</li><li><b>失效條款</b>（defeasance）：借款人用公債組合取代原本的現金流。</li></ul></li><li><b>氣球風險</b>：很多商用貸款到期要一次還大筆本金，如果借款人無法再融資 → 延長期間（類似延伸風險）。</li></ul>',
      ex:'Contraction risk is the risk that falling interest rates accelerate prepayments, while extension risk is the risk that rising rates slow prepayments and lengthen the security’s life.' }
  ]}
);
// ===== CFA Level I 完整筆記（4/4）：衍生性商品、另類投資、投資組合管理 =====
DATA.cfa.sections.push(
  { id:'x-der', t:'8. 衍生性商品 Derivatives（5–8%）', cards: [
    { id:'xd1', t:'衍生性商品與市場的特徵', en:'Derivative Instrument and Derivative Market Features', pre:['bspot'],
      plain:'衍生性商品的價值「衍生」自另一個標的資產（股票、利率、匯率、商品）。可以在交易所交易（標準化、有結算所），也可以在櫃檯私下議定（可客製化、有交易對手風險）。',
      life:'演唱會門票的「轉售權」：它本身的價值取決於演唱會門票的行情，門票越搶手，轉售權越值錢。',
      body:'<h4>定義</h4><ul><li>衍生性商品是一種<b>契約</b>，價值取決於<b>標的資產</b>（underlying）的表現。</li><li>標的資產：股票、股價指數、固定收益、利率、外匯、商品、信用、甚至天氣或其他衍生品。</li><li><b>名目本金</b>（notional）：計算付款的基準金額，通常不實際交換。</li><li>特性：期初投入很少（或零）→ <b>槓桿</b>效果大。</li></ul><h4>交易所 vs 櫃檯（OTC）</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>交易所交易</th><th>櫃檯交易 OTC</th></tr><tr><td>條款</td><td><b>標準化</b>（規格、到期日）</td><td>可<b>客製化</b></td></tr><tr><td>交易對手風險</td><td>很低（<b>結算所</b>擔任中央交易對手 CCP）</td><td>較高（要評估對方信用）</td></tr><tr><td>保證金</td><td>必須，每日結算</td><td>依合約，現在大多也要擔保品</td></tr><tr><td>透明度與流動性</td><td>高</td><td>較低</td></tr><tr><td>監管</td><td>嚴格</td><td>2008 年後加強（例如要求透過中央結算）</td></tr><tr><td>例子</td><td>期貨、上市選擇權</td><td>遠期、交換、客製化選擇權</td></tr></table></div><ul><li><b>中央結算</b>（central clearing）：2008 年金融海嘯後，很多標準化的 OTC 衍生品被要求透過中央交易對手結算，以降低系統性風險。</li></ul>',
      ex:'Exchange-traded derivatives are standardized and cleared through a central counterparty, which largely eliminates counterparty credit risk.' },
    { id:'xd2', t:'遠期承諾與或有請求權：遠期、期貨、交換、選擇權、CDS', en:'Forward Commitment and Contingent Claim Features and Instruments',
      plain:'衍生性商品分兩大類：遠期承諾（雙方都有義務：遠期、期貨、交換）和或有請求權（買方有權利但沒有義務：選擇權、信用違約交換）。',
      life:'訂婚宴場地簽約（雙方都要履行）是遠期承諾；付訂金保留場地、可以選擇不辦但訂金不退，就是選擇權。',
      body:'<h4>遠期承諾 Forward commitments</h4><ul><li><b>遠期契約</b>：今天約定在未來以遠期價格 F<sub>0</sub>(T) 買賣標的資產。<ul><li>多方到期損益 = S<sub>T</sub> − F<sub>0</sub>(T)；空方 = F<sub>0</sub>(T) − S<sub>T</sub>。</li><li>零和遊戲；簽約時價值為 0（不用付錢）。</li><li>可以實物交割或<b>現金交割</b>（NDF 無本金交割遠期）。</li></ul></li><li><b>期貨</b>：標準化的遠期，在交易所交易。<ul><li><b>每日結算</b>（mark-to-market）：每天依結算價計算損益，從保證金帳戶增減。</li><li><b>原始保證金</b>、<b>維持保證金</b>：保證金低於維持水準 → <b>追繳</b>，要補到<b>原始</b>保證金。</li><li>有些期貨有<b>漲跌停限制</b>。</li><li>大多在到期前平倉。</li></ul></li><li><b>交換</b>（swap）：雙方約定在未來一系列日期交換現金流。<ul><li><b>利率交換</b>：一方付固定利率，另一方付浮動利率（只交換利息差額，不交換本金）。</li><li>交換 = 一系列遠期契約的組合。</li><li>其他：貨幣交換、股權交換、商品交換。</li></ul></li></ul><h4>或有請求權 Contingent claims</h4><ul><li><b>選擇權</b>：買方付<b>權利金</b>，取得在到期日（或之前）以<b>履約價 X</b> 買進（買權 call）或賣出（賣權 put）的<b>權利</b>。賣方有義務。<ul><li>買權到期價值 c<sub>T</sub> = max(0, S<sub>T</sub> − X)；賣權 p<sub>T</sub> = max(0, X − S<sub>T</sub>)。</li><li>損益 = 到期價值 − 權利金。</li><li>買權損益兩平：X + c<sub>0</sub>；賣權：X − p<sub>0</sub>。</li><li>最大損失：買方 = 權利金；買權賣方 = 無限；賣權賣方 = X − p<sub>0</sub>。</li><li><b>歐式</b>：只能在到期日履約；<b>美式</b>：到期前任何時間都可以。</li><li><b>價內</b>（in the money）：現在履約有價值；<b>價平</b>、<b>價外</b>。</li></ul></li><li><b>信用衍生性商品</b>：<b>信用違約交換 CDS</b>。<ul><li>保護買方定期付費（CDS 利差）給保護賣方。</li><li>參考實體發生<b>信用事件</b>（例如違約、破產）時，賣方補償買方的損失。</li><li>像是債券的保險，但買方不一定要持有債券。</li></ul></li></ul>',
      ex:'A forward commitment obligates both parties to transact in the future, whereas a contingent claim gives the holder the right, but not the obligation, to transact.' },
    { id:'xd3', t:'衍生性商品的好處、風險與用途', en:'Derivative Benefits, Risks, and Issuer and Investor Uses',
      plain:'衍生性商品可以用很低的成本轉移風險、發現價格，但槓桿高、結構複雜，用不好會造成巨大損失，甚至引發系統性風險。',
      life:'機車保險讓你用一點保費轉移事故風險（好處）；但如果用借來的錢大量賭某支股票的選擇權，賭錯就可能賠光（風險）。',
      body:'<h4>好處</h4><ul><li><b>風險配置與轉移</b>：讓不想承擔風險的人轉給願意承擔的人（避險）。</li><li><b>資訊發現</b>：期貨和選擇權價格反映市場對未來的預期（例如隱含波動率）。</li><li><b>營運優勢</b>：交易成本低、流動性高、容易放空、用很少資金取得大額曝險（資本效率）。</li><li>提高<b>市場效率</b>：套利讓價格錯誤更快被修正。</li></ul><h4>風險</h4><ul><li><b>高槓桿</b>：小幅價格變動就可能造成大額損失。</li><li><b>複雜度</b>：難以理解和評價。</li><li><b>基差風險</b>：避險工具和被避險資產的價格變動不完全一致。</li><li><b>流動性風險</b>：保證金追繳需要現金。</li><li><b>交易對手信用風險</b>（OTC）。</li><li><b>系統性風險</b>：過度投機可能危及整個金融體系（例如 2008 年）。</li></ul><h4>發行人（公司）的用途：避險會計</h4><ul><li><b>現金流量避險</b>：避免未來現金流的變動（例如用利率交換把浮動利率借款變成固定）。有效部分的損益先進 <b>OCI</b>，等被避險項目影響損益時再轉入。</li><li><b>公允價值避險</b>：避免資產或負債價值的變動（例如用利率交換把固定利率債變成浮動）。衍生品和被避險項目的損益都進<b>損益表</b>，互相抵銷。</li><li><b>國外營運淨投資避險</b>：避免子公司外幣淨資產的匯率風險，損益進 OCI。</li></ul><h4>投資人的用途</h4><ul><li>改變投資組合的曝險（例如用指數期貨調整 β、用利率交換調整存續期間）。</li><li>實施投資策略：避險、增加收益（例如賣出掩護性買權）、取得難以直接投資的市場。</li><li>槓桿或投機。</li></ul>',
      ex:'In a cash flow hedge, the effective portion of the gain or loss on the derivative is initially recognized in other comprehensive income.' },
    { id:'xd4', t:'套利、複製與持有成本', en:'Arbitrage, Replication, and the Cost of Carry in Pricing Derivatives', pre:['barb'],
      plain:'衍生品的價格由「無套利」原則決定：如果兩種組合未來的結果一樣，今天的價格也必須一樣。遠期價格 = 現貨價格 + 持有成本 − 持有收益。',
      life:'如果超商的可樂比旁邊大賣場便宜很多，大家就會去超商大量買再拿去賣，直到價格差不多為止 → 這就是套利讓價格一致。',
      body:'<h4>套利與單一價格法則</h4><ul><li><b>套利</b>：不用投入資金、沒有風險，就能賺錢的機會。</li><li><b>單一價格法則</b>：未來現金流相同的資產，今天的價格必須相同。</li><li>衍生品定價的核心：用標的資產和無風險借貸<b>複製</b>衍生品的現金流，所以衍生品的價格 = 複製組合的成本。</li><li><b>風險中立定價</b>：因為可以完美複製（避險），所以定價時不需要知道投資人的風險偏好，用<b>無風險利率</b>折現即可。</li><li>現實限制：交易成本、放空限制、借款利率不等於放款利率、稅。</li></ul><h4>遠期價格：沒有持有成本或收益</h4><p class="formula">F<sub>0</sub>(T) = S<sub>0</sub> × (1 + r)<sup>T</sup></p><ul><li>複製：今天借錢買現貨，到期交貨並還錢。</li><li>如果 F<sub>0</sub> &gt; S<sub>0</sub>(1 + r)<sup>T</sup> → <b>現金持有套利</b>（cash-and-carry）：借錢買現貨、放空遠期。</li><li>如果 F<sub>0</sub> &lt; S<sub>0</sub>(1 + r)<sup>T</sup> → <b>反向現金持有套利</b>：放空現貨、把錢存起來、買進遠期。</li></ul><h4>持有成本與收益</h4><p class="formula">F<sub>0</sub>(T) = (S<sub>0</sub> − PV(I) + PV(C)) × (1 + r)<sup>T</sup></p><ul><li><b>收益</b> I（降低遠期價格）：股利、債券票息、外幣利息、商品的<b>便利收益</b>（convenience yield，持有實物的好處，例如避免缺貨）。</li><li><b>成本</b> C（提高遠期價格）：倉儲費、保險費。</li><li>連續複利版本：F<sub>0</sub>(T) = S<sub>0</sub> × e<sup>(r + c − i)T</sup>。</li><li>股價指數：F<sub>0</sub> = S<sub>0</sub> × e<sup>(r − 股利殖利率)T</sup>。</li></ul>',
      ex:'Under the no-arbitrage principle, the forward price equals the spot price compounded at the risk-free rate, adjusted for the costs and benefits of holding the underlying.' },
    { id:'xd5', t:'遠期契約的定價與評價、FRA、匯率遠期', en:'Pricing and Valuation of Forward Contracts and for an Underlying with Varying Maturities',
      plain:'遠期「價格」是簽約時約定的成交價；遠期「價值」是合約現在值多少錢。簽約時價值是 0，之後隨著現貨價格變動，對多方或空方產生正或負的價值。',
      life:'你三個月前約好用 3 萬買一台二手機車。現在同款車行情漲到 3.3 萬，你手上這份合約就「值錢」了，約值 3 千元（再扣一點時間價值）。',
      body:'<h4>價格 vs 價值</h4><ul><li><b>遠期價格</b> F<sub>0</sub>(T)：簽約時決定、之後固定。</li><li><b>遠期價值</b> V<sub>t</sub>(T)：合約在時間 t 的價值。簽約時 V<sub>0</sub> = 0。</li></ul><h4>多方在期中的價值</h4><p class="formula">V<sub>t</sub>(T) = S<sub>t</sub> − F<sub>0</sub>(T) × (1 + r)<sup>−(T−t)</sup></p><ul><li>有持有收益或成本時：V<sub>t</sub> = S<sub>t</sub> − PV<sub>t</sub>(I) + PV<sub>t</sub>(C) − F<sub>0</sub>(T)(1 + r)<sup>−(T−t)</sup>。</li><li>另一種寫法：V<sub>t</sub> = [F<sub>t</sub>(T) − F<sub>0</sub>(T)] × (1 + r)<sup>−(T−t)</sup>（新遠期價格和原約定價差額的現值）。</li><li>到期時：V<sub>T</sub> = S<sub>T</sub> − F<sub>0</sub>(T)。</li><li>空方的價值 = −多方價值。</li></ul><h4>遠期利率協議 FRA</h4><ul><li>約定未來某段期間的利率（例如「3×9 FRA」：3 個月後開始、為期 6 個月）。</li><li>多方（付固定、收浮動）在市場利率上升時獲利。</li><li>到期結算（在期間<b>開始</b>時結算，所以要折現）：</li></ul><p class="formula">結算金額 = 名目本金 × (MRR − FRA 利率) × (天數/360) ÷ [1 + MRR × (天數/360)]</p><ul><li>FRA 利率 = 由即期利率推算的<b>隱含遠期利率</b>。</li></ul><h4>不同期限的標的：利率與債券</h4><ul><li>遠期利率可以從即期利率推出：(1 + Z<sub>B</sub>)<sup>B</sup> = (1 + Z<sub>A</sub>)<sup>A</sup>(1 + IFR)<sup>B−A</sup>。</li><li>債券遠期：遠期價格 = (債券價格 − 期間票息現值) × (1 + r)<sup>T</sup>。</li></ul><h4>匯率遠期</h4><p class="formula">F<sub>f/d</sub> = S<sub>f/d</sub> × (1 + r<sub>f</sub>)<sup>T</sup> ÷ (1 + r<sub>d</sub>)<sup>T</sup></p><ul><li>就是<b>拋補利率平價</b>：利率高的貨幣遠期貼水。</li><li>連續複利：F = S × e<sup>(r<sub>f</sub> − r<sub>d</sub>)T</sup>（f 是價格貨幣、d 是基準貨幣）。</li></ul>',
      ex:'A forward contract has zero value at initiation; its value later depends on the difference between the current spot price and the present value of the original forward price.' },
    { id:'xd6', t:'期貨的定價與評價', en:'Pricing and Valuation of Futures Contracts',
      plain:'期貨和遠期很像，但因為每日結算，期貨的價值每天都被「歸零」。期貨價格和遠期價格會因為利率和標的價格的相關性而略有不同。',
      life:'遠期像是年底一次結算的打賭；期貨像每天收盤就結算一次，輸的人今天就要付錢給贏的人。',
      body:'<h4>每日結算的影響</h4><ul><li>每天結算後，期貨部位的價值<b>重設為 0</b>（損益已經實現在保證金帳戶）。</li><li>結算前的價值 = (今天結算價 − 昨天結算價) × 合約規模。</li><li>期貨價格的計算方式和遠期相同：F<sub>0</sub> = S<sub>0</sub>(1 + r)<sup>T</sup> ± 持有成本與收益。</li></ul><h4>期貨價格 vs 遠期價格</h4><ul><li>如果利率固定（或和標的價格無關）→ 期貨價格 = 遠期價格。</li><li>如果<b>標的價格和利率正相關</b>：多方期貨在價格上漲時拿到的現金，可以用較高利率再投資 → 多方偏好期貨 → <b>期貨價格 &gt; 遠期價格</b>。</li><li>負相關 → 期貨價格 &lt; 遠期價格。</li><li>期貨還有：結算所降低信用風險、流動性較好；但有保證金現金流的資金成本。</li></ul><h4>利率期貨</h4><ul><li>例如短期利率期貨（3 個月 SOFR 期貨）：報價 = <b>100 − 利率</b>（利率上升，期貨價格下跌，和債券一樣）。</li><li><b>基點價值 BPV</b>：每 0.01% 利率變動的損益。例：名目本金 100 萬、期間 3 個月 → BPV = 1,000,000 × 0.0001 × (90/360) = <b>25 美元</b>。</li><li>期貨利率和 FRA 利率會因為<b>凸性偏誤</b>而略有不同。</li><li>長期利率期貨（公債期貨）：空方有交割選擇權（最便宜可交割債券）。</li></ul>',
      ex:'If futures prices are positively correlated with interest rates, futures prices will be higher than otherwise identical forward prices.' },
    { id:'xd7', t:'利率交換與其他交換的定價與評價', en:'Pricing and Valuation of Interest Rate and Other Swaps',
      plain:'利率交換可以看成一連串的遠期利率協議（FRA）。交換利率（固定端的利率）在簽約時被設定成讓合約價值為 0；之後利率變動，合約就會對其中一方有利。',
      life:'你和朋友約好：未來三年，每年你付他固定 3% 的利息，他付你浮動利率的利息。如果後來市場利率上升到 5%，這個約定對你有利。',
      body:'<h4>交換的本質</h4><ul><li>利率交換 = 一系列<b>遠期利率協議</b>的組合，但每期的固定利率都相同（交換利率）。</li><li>也可以看成：<b>付固定、收浮動</b> = 買浮動利率債 + 發行固定利率債。</li><li>只交換<b>淨額</b>，名目本金不交換。</li></ul><h4>交換利率的決定</h4><ul><li>簽約時交換價值 = 0 → 固定端現金流的現值 = 浮動端（隱含遠期利率）現金流的現值。</li><li>交換利率就是一個「平均」的遠期利率；也等於同期間<b>平價債券</b>的票面利率。</li></ul><p class="formula">交換利率 s = (1 − DF<sub>N</sub>) ÷ (DF<sub>1</sub> + DF<sub>2</sub> + … + DF<sub>N</sub>)</p><ul><li>DF<sub>i</sub> = 1 ÷ (1 + Z<sub>i</sub>)<sup>i</sup>（折現因子）。</li></ul><h4>交換的價值（期中）</h4><p class="formula">付固定方的價值 = (現在的交換利率 − 原約定交換利率) × 名目本金 × Σ 剩餘期間的折現因子</p><ul><li>市場利率<b>上升</b> → 付固定、收浮動的一方<b>獲利</b>（類似放空債券）。</li><li>收固定的一方相反（類似持有固定利率債券）。</li></ul><h4>用途</h4><ul><li>公司把浮動利率借款轉成固定（現金流量避險）。</li><li>投資人調整投資組合的存續期間：收固定 → 增加存續期間；付固定 → 減少。</li><li>其他交換：貨幣交換（期初和期末交換本金）、股權報酬交換、商品交換。</li></ul>',
      ex:'An interest rate swap can be viewed as a series of forward rate agreements, each with the same fixed rate equal to the swap rate.' },
    { id:'xd8', t:'選擇權的定價：影響因素與價格界限', en:'Pricing and Valuation of Options',
      plain:'選擇權的價值 = 內含價值（現在履約值多少）+ 時間價值（未來可能更有利的機會）。標的價格、履約價、到期時間、波動度、利率、股利都會影響選擇權價格。',
      life:'演唱會門票的轉讓權：距離演唱會越久（時間越長）、門票行情波動越大，這個權利越值錢，因為有機會漲很多。',
      body:'<h4>內含價值與時間價值</h4><ul><li><b>內含價值</b>（exercise value）：買權 = max(0, S − X)；賣權 = max(0, X − S)。</li><li><b>時間價值</b> = 選擇權價格 − 內含價值。到期時時間價值 = 0。</li></ul><h4>影響選擇權價值的因素</h4><div class="tblwrap"><table class="tbl"><tr><th>因素增加</th><th>買權</th><th>賣權</th></tr><tr><td>標的價格 S</td><td>↑</td><td>↓</td></tr><tr><td>履約價 X</td><td>↓</td><td>↑</td></tr><tr><td>到期時間 T</td><td>↑</td><td>通常 ↑（深度價內的歐式賣權可能 ↓）</td></tr><tr><td>波動度 σ</td><td>↑</td><td>↑</td></tr><tr><td>無風險利率 r</td><td>↑</td><td>↓</td></tr><tr><td>持有收益（股利）</td><td>↓</td><td>↑</td></tr><tr><td>持有成本（倉儲）</td><td>↑</td><td>↓</td></tr></table></div><ul><li>波動度是唯一讓買權和賣權<b>同方向</b>變動的因素：選擇權下檔有限、上檔可能很大，所以波動越大越值錢。</li></ul><h4>價格界限（歐式）</h4><ul><li>買權：max[0, S<sub>0</sub> − X(1 + r)<sup>−T</sup>] ≤ c<sub>0</sub> ≤ S<sub>0</sub>。</li><li>賣權：max[0, X(1 + r)<sup>−T</sup> − S<sub>0</sub>] ≤ p<sub>0</sub> ≤ X(1 + r)<sup>−T</sup>。</li><li>美式選擇權價值 ≥ 歐式（多了提前履約的權利）。</li><li><b>沒有股利的美式買權永遠不應提前履約</b> → 價值 = 歐式買權。（提前履約會損失時間價值和履約價的利息）</li><li>美式賣權可能值得提前履約（深度價內時，早點拿到 X 可以賺利息）。</li></ul><h4>評價模型</h4><ul><li>二項式模型（Level I 只考一期）、Black-Scholes-Merton（Level II）。</li><li><b>隱含波動率</b>：從市場選擇權價格反推的波動度，反映市場預期。</li></ul>',
      ex:'An increase in volatility increases the value of both call and put options because option holders benefit from large favorable moves while their losses are limited.' },
    { id:'xd9', t:'賣權買權平價：用選擇權複製其他部位', en:'Option Replication Using Put–Call Parity',
      plain:'賣權買權平價說明：「股票 + 賣權」和「買權 + 無風險債券」的到期結果一模一樣，所以今天的價格也要一樣。用這個關係可以組出合成的買權、賣權或股票。',
      life:'「買股票再保險（買賣權）」和「只買股票的上漲權（買權）再把剩下的錢存定存」，到期結果完全相同。',
      body:'<h4>賣權買權平價</h4><p class="formula">S<sub>0</sub> + p<sub>0</sub> = c<sub>0</sub> + X(1 + r)<sup>−T</sup></p><ul><li>左邊：<b>保護性賣權</b>（protective put）= 股票 + 賣權。</li><li>右邊：<b>信託買權</b>（fiduciary call）= 買權 + 零息債（面額 X）。</li><li>兩者到期價值都是 max(S<sub>T</sub>, X)。</li><li>只適用<b>歐式</b>選擇權、相同履約價和到期日。</li></ul><h4>合成部位（移項就好）</h4><ul><li><b>合成買權</b>：c<sub>0</sub> = S<sub>0</sub> + p<sub>0</sub> − X(1 + r)<sup>−T</sup> → 買股票、買賣權、借錢（放空債券）。</li><li><b>合成賣權</b>：p<sub>0</sub> = c<sub>0</sub> − S<sub>0</sub> + X(1 + r)<sup>−T</sup> → 買買權、放空股票、買債券。</li><li><b>合成股票</b>：S<sub>0</sub> = c<sub>0</sub> − p<sub>0</sub> + X(1 + r)<sup>−T</sup>。</li><li><b>合成債券</b>：X(1 + r)<sup>−T</sup> = S<sub>0</sub> + p<sub>0</sub> − c<sub>0</sub>。</li><li>如果實際價格違反平價，就有套利機會：買便宜的那邊、賣貴的那邊。</li></ul><h4>賣權買權遠期平價</h4><p class="formula">F<sub>0</sub>(T)(1 + r)<sup>−T</sup> + p<sub>0</sub> = c<sub>0</sub> + X(1 + r)<sup>−T</sup></p><ul><li>用遠期契約加債券取代股票。</li></ul><h4>常見選擇權策略</h4><ul><li><b>掩護性買權</b>（covered call）：持有股票 + 賣出買權。犧牲上漲空間，換取權利金收入。</li><li><b>保護性賣權</b>：持有股票 + 買進賣權。像保險，設定下檔底線。</li></ul><h4>應用：公司的價值</h4><ul><li>股東的權益 = 以公司資產為標的、履約價為負債面額的<b>買權</b>（資產 &gt; 負債時股東拿剩餘，否則有限責任拿 0）。</li><li>有風險的公司債 = 無風險債券 − <b>賣權</b>（債權人實際上賣了一個賣權給股東）。</li><li>所以：資產價值 = 權益（買權）+ 有風險債券。</li></ul>',
      ex:'Put–call parity states that a protective put has the same payoff as a fiduciary call, so a long stock plus a long put must equal a long call plus a risk-free bond.' },
    { id:'xd10', t:'一期二項式模型評價選擇權', en:'Valuing a Derivative Using a One-Period Binomial Model',
      plain:'假設股價下一期只會漲到某個價格或跌到某個價格，就可以用股票和借貸組出跟選擇權完全一樣的報酬，從而算出選擇權的價格。',
      life:'猜拳只有兩種結果時，你可以事先安排一組賭注，讓不管輸贏結果都和另一組賭注一樣，那兩組賭注就應該同樣價錢。',
      body:'<h4>設定</h4><ul><li>今天股價 S<sub>0</sub>；下一期上漲到 S<sub>u</sub> = u × S<sub>0</sub>，或下跌到 S<sub>d</sub> = d × S<sub>0</sub>。</li><li>到期時選擇權的價值：c<sub>u</sub> = max(0, S<sub>u</sub> − X)、c<sub>d</sub> = max(0, S<sub>d</sub> − X)。</li><li>條件：d &lt; 1 + r &lt; u（否則有套利）。</li></ul><h4>方法一：風險中立機率</h4><p class="formula">π = (1 + r − d) ÷ (u − d)</p><p class="formula">c<sub>0</sub> = [π × c<sub>u</sub> + (1 − π) × c<sub>d</sub>] ÷ (1 + r)</p><ul><li>π 不是真實的上漲機率，是讓股票預期報酬剛好等於無風險利率的「假想機率」。</li><li>選擇權價格<b>不取決於</b>真實的上漲機率。</li></ul><h4>方法二：複製（避險比率）</h4><p class="formula">避險比率 h = (c<sub>u</sub> − c<sub>d</sub>) ÷ (S<sub>u</sub> − S<sub>d</sub>)</p><ul><li>買 h 股股票 + 賣 1 個買權 → 不管漲跌，結果都一樣（無風險）。</li><li>無風險組合要賺無風險利率：h × S<sub>0</sub> − c<sub>0</sub> = (h × S<sub>u</sub> − c<sub>u</sub>) ÷ (1 + r)。</li><li>也可以寫成：c<sub>0</sub> = h × S<sub>0</sub> − 借款金額。</li></ul><h4>例題</h4><ul><li>S<sub>0</sub> = 50、u = 1.2、d = 0.8、X = 50、r = 5%。</li><li>S<sub>u</sub> = 60 → c<sub>u</sub> = 10；S<sub>d</sub> = 40 → c<sub>d</sub> = 0。</li><li>π = (1.05 − 0.8) ÷ (1.2 − 0.8) = 0.625。</li><li>c<sub>0</sub> = (0.625 × 10 + 0.375 × 0) ÷ 1.05 = <b>5.95</b>。</li><li>避險比率 h = (10 − 0) ÷ (60 − 40) = 0.5 股。</li><li>賣權：p<sub>u</sub> = 0、p<sub>d</sub> = 10 → p<sub>0</sub> = 0.375 × 10 ÷ 1.05 = 3.57。驗證平價：50 + 3.57 = 5.95 + 50/1.05 = 53.57 ✓。</li></ul>',
      ex:'In the binomial model, the option value is the expected payoff using risk-neutral probabilities, discounted at the risk-free rate.' }
  ]},
  { id:'x-alt', t:'9. 另類投資 Alternative Investments（7–10%）', cards: [
    { id:'xa1', t:'另類投資的特徵、投資方式與基金結構', en:'Alternative Investment Features, Methods, and Structures',
      plain:'另類投資是股票、債券、現金以外的投資，例如私募股權、不動產、避險基金、商品。它們流動性差、透明度低、費用高，但可能提供分散效果和較高報酬。',
      life:'投資一家朋友的新創咖啡店：你不能隨時賣掉股份（流動性差）、不清楚每天的帳（透明度低），但如果成功，報酬可能很高。',
      body:'<h4>特徵</h4><ul><li><b>流動性差</b>、通常需要<b>長期鎖定</b>資金。</li><li>需要<b>專業知識</b>，資訊不透明。</li><li><b>費用高</b>（管理費 + 績效費）。</li><li>和傳統資產的<b>相關性較低</b> → 分散效果。</li><li>歷史報酬資料有限，常是<b>鑑價</b>而非市價 → 波動被低估。</li><li>法律和稅務結構複雜、監管較少。</li></ul><h4>投資方式</h4><div class="tblwrap"><table class="tbl"><tr><th>方式</th><th>說明</th><th>優點</th><th>缺點</th></tr><tr><td><b>基金投資</b></td><td>投資在基金，由 GP 管理</td><td>不需要太多專業、分散</td><td>費用最高、無法控制投資決策</td></tr><tr><td><b>共同投資</b>（co-investing）</td><td>投資基金之外，再直接跟投特定案子</td><td>費用較低、可學習</td><td>可能被選擇性提供較差的案子（逆選擇）</td></tr><tr><td><b>直接投資</b></td><td>自己直接投資標的</td><td>沒有中間費用、完全控制</td><td>需要大量專業和資源、難分散</td></tr></table></div><h4>有限合夥結構</h4><ul><li><b>普通合夥人 GP</b>：基金經理人，負責管理，無限責任。</li><li><b>有限合夥人 LP</b>：出資的投資人，有限責任、不參與管理。</li><li><b>有限合夥契約 LPA</b>：規定條款；<b>附函</b>（side letter）：給特定 LP 的特別條款。</li><li>其他形式：<b>獨立管理帳戶 SMA</b>（投資人自己的帳戶）、<b>組合型基金</b>（fund of funds，多一層費用但分散）。</li></ul><h4>費用與分配條款</h4><ul><li><b>管理費</b>：通常 1–2%，依<b>承諾資本</b>（私募）或管理資產（避險基金）計算。</li><li><b>績效費</b>（incentive fee / <b>附帶權益</b> carried interest）：通常 20% 的利潤。</li><li><b>門檻報酬率</b>（hurdle rate）：報酬超過這個水準才收績效費。<ul><li><b>硬門檻</b>：只對超過門檻的部分收績效費。</li><li><b>軟門檻</b>：超過門檻後，對全部報酬收績效費。</li></ul></li><li><b>追補條款</b>（catch-up）：超過門檻後，GP 先拿較高比例，直到「追上」約定的分潤比例。</li><li><b>高水位</b>（high-water mark）：基金價值必須超過之前的最高淨值，才再收績效費 → 避免對同一段報酬重複收費。</li><li><b>回撥</b>（clawback）：GP 之前多拿的績效費要還回來。</li><li><b>分配瀑布</b>：<ul><li><b>整體基金式</b>（歐式 whole-of-fund）：LP 拿回全部出資加門檻報酬後，GP 才拿績效費 → 對 LP 有利。</li><li><b>逐案式</b>（美式 deal-by-deal）：每個案子獲利就分 → 對 GP 有利。</li></ul></li></ul>',
      ex:'A high-water mark ensures that the manager earns an incentive fee only on gains that take the fund’s value above its previous peak.' },
    { id:'xa2', t:'另類投資的績效與報酬計算', en:'Alternative Investment Performance and Returns',
      plain:'另類投資的績效常用 IRR 和投資倍數衡量。因為資產很少交易、用鑑價，報告的波動度和相關性會被低估。費用計算是必考題。',
      life:'你的房子三年才估價一次，所以「帳面價值」看起來很穩定，但如果真的要賣，價格可能和估價差很多。',
      body:'<h4>績效指標</h4><ul><li><b>IRR</b>：考慮現金流時點的報酬率，私募基金最常用（從成立以來的 since-inception IRR）。</li><li><b>投入資本倍數 MOIC</b> = (已實現價值 + 未實現價值) ÷ 投入資本。不考慮時間。</li><li><b>J 曲線</b>：私募基金初期因為費用和投資尚未成熟，報酬為負；之後投資獲利、退出，報酬上升。</li></ul><h4>報酬資料的問題</h4><ul><li><b>鑑價平滑化</b>（appraisal smoothing）：用估價而非市價 → <b>波動度和相關性被低估</b>，看起來風險比實際低、分散效果比實際好。</li><li><b>存活者偏誤</b>：失敗的基金不再報告，指數只剩成功的 → 報酬<b>高估</b>。</li><li><b>回填偏誤</b>（backfill）：基金加入資料庫時，把過去好的績效也補進去 → 報酬高估。</li><li><b>槓桿</b>：放大報酬和風險，要調整比較。</li><li>報酬分布常有<b>負偏態</b>和<b>肥尾</b>，用標準差衡量風險不夠；可用<b>下方差</b>、Sortino 比率、最大跌幅。</li></ul><h4>費用計算例題</h4><ul><li>基金期初 1 億，年底 1.2 億（費用前）；管理費 2%（依期末資產）、績效費 20%（扣管理費後計算）、無門檻。</li><li>管理費 = 1.2 億 × 2% = 240 萬。</li><li>績效費 = (1.2 億 − 1 億 − 240 萬) × 20% = 1,760 萬 × 20% = 352 萬。</li><li>投資人淨報酬 = (1.2 億 − 240 萬 − 352 萬 − 1 億) ÷ 1 億 = <b>14.08%</b>。</li><li>如果有<b>高水位</b>：之前最高淨值是 1.25 億，今年淨值還沒超過 → <b>沒有績效費</b>，只收管理費。</li><li>考試注意：管理費依期初還是期末資產？績效費是扣管理費前還是後算？門檻是硬的還是軟的？</li></ul>',
      ex:'Appraisal-based valuations tend to smooth reported returns, which understates volatility and correlations with other asset classes.' },
    { id:'xa3', t:'私人資本：私募股權與私募債權', en:'Investments in Private Capital: Equity and Debt',
      plain:'私募股權投資沒上市的公司（創投、成長股權、收購），透過改善經營後出場獲利。私募債權是直接借錢給公司，不透過銀行或公開債市。',
      life:'創投像在學生創業比賽中挑選有潛力的團隊投資；收購基金像買下一家經營不善的老店，改造後再賣掉。',
      body:'<h4>私募股權類型</h4><ul><li><b>槓桿收購 LBO</b>：用大量借款收購成熟公司（常常是上市公司下市）。<ul><li><b>管理層收購 MBO</b>：由現有經營團隊參與收購。</li><li><b>管理層換手收購 MBI</b>：外部經營團隊進入。</li><li>獲利來源：改善營運效率、降低成本、財務槓桿、多重收購整合。</li></ul></li><li><b>創業投資 VC</b>：投資新創公司，分階段：<ul><li>形成階段：<b>種子前</b>（pre-seed / angel）、<b>種子</b>（seed）、<b>早期</b>（early stage，產品開發、開始營運）。</li><li><b>後期</b>（later stage）：擴張、準備上市。</li><li>報酬分布極端：大多數失敗、少數大成功。</li></ul></li><li><b>成長股權</b>：投資已經有獲利、想擴張的成熟公司，通常是少數股權、低槓桿。</li></ul><h4>退出方式</h4><ul><li><b>出售給策略買家</b>（trade sale，賣給同業）。</li><li><b>IPO</b>：通常價格最高，但耗時、成本高、受市場狀況影響。</li><li><b>二手出售</b>（secondary sale，賣給另一家私募基金）。</li><li><b>資本重組</b>（recapitalization，增加負債、發股利給基金，部分退出）。</li><li><b>註銷／清算</b>（write-off）。</li></ul><h4>私募債權類型</h4><ul><li><b>直接放款</b>（direct lending）：直接借錢給中型企業，通常是優先、有擔保、浮動利率。</li><li><b>創投債</b>（venture debt）：借給新創公司，常附認股權證。</li><li><b>夾層融資</b>（mezzanine）：次順位債，介於優先債和股權之間，常附認股權證或可轉換，用於 LBO。</li><li><b>困境債</b>（distressed debt）：買進陷入財務困境公司的債務，參與重整取得控制權或回收價值。</li><li><b>單一級距貸款</b>（unitranche）：把優先債和次順位債合成一筆貸款，利率介於兩者之間。</li><li>其他：不動產債、基礎建設債、特殊情況投資。</li></ul><h4>風險與報酬</h4><ul><li>報酬（高到低）：創投 &gt; 收購 &gt; 夾層 &gt; 直接放款。</li><li>風險：流動性風險、槓桿風險、評價困難、經理人能力差異大（績效分散度高，選對經理人很重要）。</li><li>私募和公開市場的相關性看起來低，部分是因為鑑價平滑。</li></ul>',
      ex:'In a leveraged buyout, a private equity firm acquires a company using a significant amount of debt, aiming to improve operations and exit at a higher value.' },
    { id:'xa4', t:'不動產與基礎建設', en:'Real Estate and Infrastructure',
      plain:'不動產投資可以是直接買房、買 REIT（不動產投資信託）或買房貸證券。基礎建設是道路、電廠、機場等長期資產，現金流穩定。',
      life:'買一間套房出租是直接投資不動產；買 REIT 的股票就像和很多人一起持有一棟商辦大樓，每年分租金收入。',
      body:'<h4>不動產投資的四種形式</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>權益</th><th>債權</th></tr><tr><td>私人</td><td>直接擁有不動產、私募不動產基金</td><td>房貸、私人不動產貸款</td></tr><tr><td>公開</td><td><b>REIT</b>、不動產公司股票</td><td>MBS（住宅、商用）</td></tr></table></div><h4>不動產的特性</h4><ul><li>每個物件獨特（異質性）、單價高、流動性差、交易成本高、需要管理。</li><li>報酬來源：<b>租金收入</b> + <b>增值</b>。</li><li>可以部分抗通膨（租金和價格隨通膨調整）。</li><li>物業類型：住宅、<b>商用</b>（辦公大樓、零售商場、工業／倉儲、多戶住宅、飯店）。</li></ul><h4>不動產估價方法</h4><ul><li><b>收益法</b>：<ul><li><b>直接資本化</b>：價值 = 淨營業收入 NOI ÷ <b>資本化率</b>（cap rate）。NOI = 租金收入 − 營運費用（不扣折舊和利息）。</li><li>Cap rate 越低 → 價值越高。</li><li><b>現金流折現法</b>：把多年的現金流和期末售價折現。</li></ul></li><li><b>成本法</b>：土地價值 + 重建成本 − 折舊。適合特殊用途的物業。</li><li><b>比較法</b>（sales comparison）：參考附近類似物件的成交價，調整差異。適合住宅。</li></ul><h4>REIT</h4><ul><li>公開交易，流動性好。要把大部分盈餘分配給股東，公司層級通常<b>免稅</b>。</li><li>和股市的相關性比直接不動產高。</li><li>估價：用 <b>FFO</b>（營運資金 = 淨利 + 折舊 − 出售物業的利得）或 AFFO（再扣掉維持性資本支出）。</li></ul><h4>基礎建設</h4><ul><li>提供公共服務的長期資產：<ul><li><b>經濟型</b>：交通（道路、機場、港口）、公用事業（電力、水）、通訊（電塔、光纖）。</li><li><b>社會型</b>：學校、醫院、監獄。</li></ul></li><li><b>新建</b>（greenfield）：從頭開發，風險和報酬較高。<b>既有</b>（brownfield）：已經營運，現金流較穩定。</li><li>收入方式：使用者付費（例如收費公路）、<b>可用性付費</b>（政府依設施可用與否付費，風險較低）。</li><li>特性：需求穩定、獨占或寡占、長期合約 → 現金流穩定；但有法規和政治風險。</li><li>投資方式：直接投資、私募基礎建設基金、上市基礎建設公司或基金。</li></ul>',
      ex:'Under the direct capitalization method, the value of a property equals its net operating income divided by the capitalization rate.' },
    { id:'xa5', t:'天然資源：商品、農地、林地', en:'Natural Resources',
      plain:'天然資源包括商品（能源、金屬、農產品）、農地和林地。商品通常透過期貨投資，報酬來自價格變動、展期報酬和保證金利息。',
      life:'林地像一個會自己長大的存錢筒：樹每年長大（生物性成長），不急著砍，可以等木材價格好的時候再賣。',
      body:'<h4>商品的類別</h4><ul><li>能源（原油、天然氣）、基本金屬（銅、鋁）、貴金屬（黃金、白銀）、農產品（穀物、軟性商品）、畜產（牛、豬）。</li><li>投資方式：期貨（最常見）、商品 ETF、商品相關公司股票、實物。</li></ul><h4>商品期貨的報酬來源</h4><ol><li><b>現貨報酬</b>（spot price return）：現貨價格的變動。</li><li><b>展期報酬</b>（roll return）：期貨快到期時，賣掉近月、買進遠月的損益。<ul><li><b>逆價差</b>（backwardation，期貨價 &lt; 現貨價）→ 展期<b>賺錢</b>（賣高買低）。</li><li><b>正價差</b>（contango，期貨價 &gt; 現貨價）→ 展期<b>賠錢</b>。</li></ul></li><li><b>擔保品報酬</b>（collateral return）：保證金存放在國庫券等的利息。</li><li>（投資組合還有<b>再平衡報酬</b>。）</li></ol><h4>期貨價格與現貨價格的關係</h4><ul><li>期貨價格 ≈ 現貨價格 × (1 + r) + 倉儲成本 − <b>便利收益</b>。</li><li>便利收益高（例如存貨不足）→ 逆價差；倉儲成本高、存貨充足 → 正價差。</li></ul><h4>農地與林地</h4><ul><li><b>農地</b>：報酬來自農作物收入 + 土地增值。作物必須在成熟時收成，受天氣影響。</li><li><b>林地</b>：報酬來自<b>生物性成長</b>（樹木長大）、木材價格變動、土地增值。<b>可以延後砍伐</b>等待好價格 → 比農地有彈性。</li><li>兩者都可能有抗通膨效果，和其他資產相關性低。</li></ul><h4>投資天然資源的理由與風險</h4><ul><li>理由：<b>抗通膨</b>、分散投資、搭上全球經濟成長或供需失衡。</li><li>風險：價格波動大、天氣與自然災害、政治風險、ESG 議題（環境破壞、碳排放）。</li></ul>',
      ex:'When a commodity futures market is in backwardation, rolling a long futures position generates a positive roll return.' },
    { id:'xa6', t:'避險基金：策略與結構', en:'Hedge Funds',
      plain:'避險基金是靈活的投資基金，可以放空、用槓桿、投資衍生品，目標是不論市場漲跌都賺錢（絕對報酬）。策略很多樣，費用很高、流動性有限制。',
      life:'一般基金像只能往前開的車（只能做多）；避險基金可以前進、後退、轉彎（做多、放空、用槓桿），但油錢（費用）很貴。',
      body:'<h4>特徵</h4><ul><li>追求<b>絕對報酬</b>（不和大盤比）。</li><li>可以使用<b>槓桿、放空、衍生品</b>，投資限制少。</li><li>監管較少、揭露少，通常只開放給合格投資人。</li><li>費用高（傳統 2 and 20）。</li><li>流動性限制：<b>鎖定期</b>（lockup，期間內不能贖回）、<b>贖回通知期</b>、贖回頻率（每月或每季）、<b>贖回閘門</b>（gate，限制一次贖回的比例）、贖回費。</li><li>結構：<b>主從式基金</b>（master-feeder）：不同地區的投資人投資各自的子基金（feeder），子基金再投資同一個主基金（master）→ 稅務效率、規模經濟。</li></ul><h4>主要策略</h4><ul><li><b>股票相關</b>：<ul><li><b>股票多空</b>（long/short）：做多看好的、放空看壞的，仍有部分市場曝險。</li><li><b>市場中立</b>：多空部位相抵，β ≈ 0，只賺選股的報酬。</li><li><b>空頭偏向</b>（short bias）：以放空為主。</li></ul></li><li><b>事件驅動</b>：<ul><li><b>併購套利</b>：買進被收購公司、放空收購公司，賺取併購完成時的價差。風險是併購失敗。</li><li><b>困境證券</b>：投資陷入財務困難的公司。</li><li>激進投資（activist）、特殊情況。</li></ul></li><li><b>相對價值</b>：<ul><li><b>可轉債套利</b>：買可轉債、放空公司股票。</li><li><b>固定收益套利</b>：利用相關債券之間的定價錯誤，常用高槓桿。</li></ul></li><li><b>機會型</b>：<ul><li><b>全球總體</b>（global macro）：依總體經濟觀點投資利率、匯率、商品、股市。</li><li><b>管理期貨</b>（managed futures / CTA）：多用系統化、趨勢追蹤的方式交易期貨。</li></ul></li><li><b>多經理人／多策略</b>：組合型基金、多策略平台。</li></ul><h4>投資與盡職調查</h4><ul><li>評估：投資策略與流程、風險管理、操作與法遵、經理人背景、費用與條款、基金規模、流動性條款、透明度。</li><li>績效分散度大，挑選經理人很重要；組合型基金可以分散但多一層費用。</li><li>報酬資料有存活者偏誤、回填偏誤。</li></ul>',
      ex:'A merger arbitrage strategy typically buys the shares of the target company and sells short the shares of the acquirer, profiting if the deal is completed.' },
    { id:'xa7', t:'數位資產入門', en:'Introduction to Digital Assets',
      plain:'數位資產是用分散式帳本（區塊鏈）技術創造、儲存和交易的資產，包括加密貨幣、穩定幣、NFT 等。價格波動大、監管仍在發展中。',
      life:'區塊鏈像全班共同維護的記帳本：每筆交易大家都有一份紀錄，要改帳必須大多數人同意，所以很難作假。',
      body:'<h4>分散式帳本技術 DLT</h4><ul><li>由網路中多個參與者共同維護的資料庫，每個節點都有一份帳本副本。</li><li><b>區塊鏈</b>：一種 DLT，交易被打包成區塊，用密碼學連結成鏈，很難竄改。</li><li><b>共識機制</b>：決定誰能新增區塊。<ul><li><b>工作量證明 PoW</b>：用運算能力解題（挖礦），耗電量大（例：比特幣）。</li><li><b>權益證明 PoS</b>：依持有並質押的代幣數量決定，較省能源（例：以太坊）。</li></ul></li><li><b>公有（無需許可）</b>：任何人都可以參與。<b>私有（需要許可）</b>：只有授權的參與者。</li><li><b>智能合約</b>：條件達成時自動執行的程式。</li></ul><h4>數位資產的類型</h4><ul><li><b>加密貨幣</b>：比特幣、以太幣等。沒有中央發行機構，價值來自供需與網路效應。</li><li><b>穩定幣</b>：價值和某資產（例如美元）掛鉤，以準備資產支持。</li><li><b>央行數位貨幣 CBDC</b>：由央行發行的數位法幣。</li><li><b>代幣</b>：<ul><li><b>NFT</b>（非同質化代幣）：代表獨一無二的資產（藝術品、收藏品）。</li><li>證券型代幣、功能型代幣。</li><li><b>資產代幣化</b>：把實體資產（不動產、藝術品）的所有權切割成代幣。</li></ul></li><li><b>去中心化金融 DeFi</b>：用智能合約提供借貸、交易等金融服務，沒有傳統中介。</li></ul><h4>投資方式</h4><ul><li>直接持有（需要數位錢包、管理私鑰）、透過交易所、期貨、ETF 或信託、相關公司股票、創投基金。</li></ul><h4>風險與特性</h4><ul><li>價格<b>波動極大</b>、沒有內在現金流（評價困難）。</li><li>監管不確定、詐欺與駭客風險、交易所倒閉風險、私鑰遺失。</li><li>和傳統資產的相關性不穩定，市場壓力時可能上升。</li></ul>',
      ex:'Proof of stake validates transactions based on the amount of cryptocurrency staked by validators and uses far less energy than proof of work.' }
  ]},
  { id:'x-pm', t:'10. 投資組合管理 Portfolio Management（8–12%）', cards: [
    { id:'xp1', t:'投資組合管理概論', en:'Portfolio Management: An Overview', pre:['bdiv'],
      plain:'投資組合管理的重點是看「整體」而不是單一資產。流程分成規劃、執行、回饋三步。不同類型的投資人（個人、退休基金、保險公司）有不同的需求和限制。',
      life:'安排一週的飲食，不只看每一餐好不好吃，而是看整週營養是否均衡（整體觀點）。',
      body:'<h4>投資組合觀點</h4><ul><li>分散投資可以在不降低期望報酬的情況下降低風險。</li><li>但在市場崩盤時，資產相關性常會上升，分散效果變差。</li></ul><h4>投資組合管理流程</h4><ol><li><b>規劃</b>：了解客戶需求 → 撰寫<b>投資政策書 IPS</b> → 形成資本市場預期 → 決定<b>策略性資產配置</b>。</li><li><b>執行</b>：資產配置 → 證券分析 → 建構投資組合。</li><li><b>回饋</b>：監控與<b>再平衡</b> → <b>績效衡量與報告</b>。</li></ol><h4>投資人類型</h4><div class="tblwrap"><table class="tbl"><tr><th>投資人</th><th>投資期間</th><th>風險承受度</th><th>流動性需求</th></tr><tr><td>個人</td><td>依年齡而定</td><td>依個人而定</td><td>依個人而定</td></tr><tr><td>確定給付制退休基金</td><td>長</td><td>高</td><td>低（依員工年齡結構）</td></tr><tr><td>捐贈基金、基金會</td><td>非常長</td><td>高</td><td>低</td></tr><tr><td>銀行</td><td>短</td><td>低</td><td>高</td></tr><tr><td>保險公司</td><td>壽險長、產險短</td><td>低</td><td>高</td></tr><tr><td>投資公司（基金）</td><td>不定</td><td>不定</td><td>高</td></tr><tr><td>主權財富基金</td><td>長</td><td>高</td><td>低</td></tr></table></div><ul><li><b>確定給付 DB</b>：雇主承擔投資風險。<b>確定提撥 DC</b>：員工承擔投資風險。</li></ul><h4>資產管理產業</h4><ul><li><b>主動</b> vs <b>被動</b>管理（被動持續成長，費用較低）。</li><li><b>傳統</b>（股票、債券）vs <b>另類</b>資產管理公司。</li><li>趨勢：被動投資成長、大數據與 AI、<b>機器人理財</b>（robo-advisers）、產業整併。</li></ul><h4>集合投資商品</h4><ul><li><b>共同基金</b>：<ul><li><b>開放型</b>：可以隨時以淨值申購或贖回。</li><li><b>封閉型</b>：發行固定股數，在市場交易，價格可能折價或溢價於淨值。</li></ul></li><li><b>ETF</b>：在交易所交易、通常追蹤指數；有<b>實物申購贖回</b>機制讓價格接近淨值；稅務效率高。</li><li><b>獨立管理帳戶 SMA</b>：為單一投資人管理，可客製化、稅務效率高，但最低金額高。</li><li>避險基金、私募基金。</li></ul>',
      ex:'The portfolio management process consists of three steps: planning, execution, and feedback.' },
    { id:'xp2', t:'投資組合的風險與報酬（一）：效用與效率前緣', en:'Portfolio Risk and Return: Part I', pre:['bcorr','bsd'],
      plain:'投資人討厭風險，用效用函數衡量「風險調整後的滿意度」。把不同資產組合起來，可以畫出效率前緣：在每個風險水準下，報酬最高的組合。',
      life:'同樣多賺 1,000 元，膽小的人要求風險很低才願意，膽大的人能接受比較高的風險 → 每個人的「無差異曲線」不一樣。',
      body:'<h4>主要資產類別的歷史風險報酬</h4><ul><li>長期而言：小型股 &gt; 大型股 &gt; 長期公司債 &gt; 長期政府債 &gt; 國庫券（報酬和風險都是這個順序）。</li><li>風險和報酬有正向關係。</li><li>報酬常有負偏態和肥尾，不是完全的常態分布。</li></ul><h4>風險趨避與效用</h4><p class="formula">U = E(r) − ½ × A × σ²</p><ul><li>A = <b>風險趨避係數</b>：A &gt; 0 風險趨避（大部分人）；A = 0 風險中立；A &lt; 0 風險愛好。</li><li>A 越大，越討厭風險。</li><li>注意：報酬和標準差要用<b>小數</b>（例如 10% = 0.10）。</li><li>無風險資產的效用 = 它的報酬（σ = 0）。</li><li><b>無差異曲線</b>：效用相同的報酬與風險組合；風險趨避者的曲線向上傾斜，A 越大越陡。</li></ul><h4>資本配置線 CAL</h4><ul><li>把無風險資產和一個風險投資組合結合：</li></ul><p class="formula">E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>i</sub>) − R<sub>f</sub>) ÷ σ<sub>i</sub>] × σ<sub>p</sub></p><ul><li>斜率就是 Sharpe ratio。</li><li><b>最適投資組合</b>：CAL 和投資人最高無差異曲線的<b>切點</b>。風險趨避程度越高的人，持有越多無風險資產。</li></ul><h4>兩資產組合與相關性</h4><ul><li>相關係數越低，組合的風險越低（同樣報酬下）。</li><li>ρ = +1：沒有分散效果；ρ = −1：可以組出零風險組合。</li></ul><h4>效率前緣</h4><ul><li><b>最小變異數前緣</b>：在每個報酬水準下，風險最低的組合。</li><li><b>全域最小變異數組合</b>：前緣上風險最低的點。</li><li><b>效率前緣</b>：全域最小變異數組合<b>以上</b>的部分（同樣風險下報酬最高）。</li><li>加入無風險資產後，最好的 CAL 和效率前緣相切於<b>最適風險組合</b>（tangency portfolio）。</li><li><b>兩基金分離定理</b>：所有投資人都持有相同的最適風險組合，只是依各自的風險偏好調整和無風險資產的比例（投資決策和融資決策分開）。</li></ul>',
      ex:'The optimal investor portfolio is located at the point of tangency between the capital allocation line and the investor’s highest attainable indifference curve.' },
    { id:'xp3', t:'投資組合的風險與報酬（二）：CML、CAPM、SML 與績效指標', en:'Portfolio Risk and Return: Part II', pre:['bbeta','bsharpe'],
      plain:'如果大家看法一樣，最適風險組合就是市場組合，連到無風險利率的線是資本市場線 CML。CAPM 說：個別資產只有系統性風險（β）會得到補償。',
      life:'去吃到飽餐廳，有些風險可以靠「多拿幾樣菜」分散掉（不合口味的換一道），但如果整家餐廳食材都不新鮮（系統性風險），怎麼拿都躲不掉。',
      body:'<h4>資本市場線 CML</h4><p class="formula">E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>m</sub>) − R<sub>f</sub>) ÷ σ<sub>m</sub>] × σ<sub>p</sub></p><ul><li>假設投資人有相同預期（同質預期）→ 所有人的最適風險組合 = <b>市場組合</b>。</li><li>CML 上：市場組合左邊是<b>借出</b>（部分投資無風險資產），右邊是<b>借入</b>（用槓桿買更多市場組合）。借款利率較高時，右邊斜率變平。</li><li>CML 的 x 軸是<b>總風險</b> σ，只適用效率投資組合。</li></ul><h4>系統性與非系統性風險</h4><ul><li><b>系統性風險</b>（市場風險）：無法分散（利率、景氣、通膨）。</li><li><b>非系統性風險</b>（公司特有）：可以透過分散消除。</li><li>因為非系統性風險可以免費分散掉，市場只會補償<b>系統性風險</b>。</li></ul><h4>報酬產生模型</h4><ul><li><b>多因子模型</b>：報酬由多個因子解釋（例如 Fama-French 三因子：市場、規模、價值）。</li><li><b>市場模型</b>（單一指數模型）：R<sub>i</sub> = α<sub>i</sub> + β<sub>i</sub>R<sub>m</sub> + e<sub>i</sub>。</li></ul><h4>Beta</h4><p class="formula">β<sub>i</sub> = Cov(R<sub>i</sub>, R<sub>m</sub>) ÷ σ<sub>m</sub>² = ρ<sub>i,m</sub> × σ<sub>i</sub> ÷ σ<sub>m</sub></p><ul><li>市場 β = 1；無風險資產 β = 0。</li><li>也可以用迴歸（R<sub>i</sub> 對 R<sub>m</sub>）的斜率估計。</li></ul><h4>CAPM 與證券市場線 SML</h4><p class="formula">E(R<sub>i</sub>) = R<sub>f</sub> + β<sub>i</sub> × [E(R<sub>m</sub>) − R<sub>f</sub>]</p><ul><li>SML 的 x 軸是 <b>β</b>（系統性風險），適用<b>所有</b>資產和組合。</li><li>CAPM 假設：投資人風險趨避、追求效用最大、無摩擦市場（無稅、無交易成本）、單一投資期間、同質預期、資產無限可分、價格接受者。</li><li><b>證券選擇</b>：預期報酬 &gt; SML 要求報酬（點在 SML <b>上方</b>）→ <b>低估</b>，應買進；在下方 → 高估。</li><li>CAPM 的應用：估計股權成本、資本預算的折現率、績效評估。</li></ul><h4>績效衡量指標</h4><div class="tblwrap"><table class="tbl"><tr><th>指標</th><th>公式</th><th>風險</th></tr><tr><td><b>Sharpe ratio</b></td><td>(R<sub>p</sub> − R<sub>f</sub>) ÷ σ<sub>p</sub></td><td>總風險；適合評估整體投資組合</td></tr><tr><td><b>Treynor ratio</b></td><td>(R<sub>p</sub> − R<sub>f</sub>) ÷ β<sub>p</sub></td><td>系統性風險；適合分散良好的組合</td></tr><tr><td><b>M²</b></td><td>(R<sub>p</sub> − R<sub>f</sub>) × σ<sub>m</sub>/σ<sub>p</sub> − (R<sub>m</sub> − R<sub>f</sub>)</td><td>總風險；把組合調整到市場風險水準，以百分比表示</td></tr><tr><td><b>Jensen’s α</b></td><td>R<sub>p</sub> − [R<sub>f</sub> + β<sub>p</sub>(R<sub>m</sub> − R<sub>f</sub>)]</td><td>系統性風險；&gt; 0 表示打敗 CAPM 預期</td></tr></table></div><ul><li>Sharpe 和 M² 的排名相同；Treynor 和 Jensen’s α 的排名通常相同。</li></ul>',
      ex:'A security plotting above the security market line has an expected return greater than its CAPM required return and is therefore considered undervalued.' },
    { id:'xp4', t:'投資組合規劃與建構：投資政策書', en:'Basics of Portfolio Planning and Construction',
      plain:'投資前要先寫投資政策書（IPS），寫清楚客戶的報酬目標、風險承受度，以及流動性、期間、稅、法規、特殊需求等限制，再依此決定資產配置。',
      life:'規劃畢業旅行：先確定目標（想去哪、玩什麼）和限制（預算、天數、誰不能坐飛機），再決定行程。',
      body:'<h4>投資政策書 IPS 的內容</h4><ul><li>客戶介紹、IPS 的目的、各方的責任、程序（例如多久更新）。</li><li><b>投資目標</b>：報酬目標和風險目標。</li><li><b>投資限制</b>。</li><li>投資準則（例如可以用槓桿、衍生品嗎）、評估和檢討的方式、附錄（例如策略性資產配置、再平衡政策）。</li></ul><h4>風險目標：能力 vs 意願</h4><ul><li><b>承擔風險的能力</b>（ability）：客觀條件，例如投資期間長短、資產規模相對於需求、收入穩定性、保險。</li><li><b>承擔風險的意願</b>（willingness）：主觀心理態度。</li><li>兩者衝突時，通常採取<b>比較保守</b>的那個（例如能力高、意願低 → 要教育客戶，但仍以意願為主；能力低、意願高 → 以能力為準）。</li><li>風險可以用絕對（例如標準差、最大損失）或相對（相對基準的追蹤誤差）表示。</li></ul><h4>報酬目標</h4><ul><li>要和風險目標一致、可以達成。</li><li>可以用絕對報酬或相對報酬表示；要區分名目或實質、稅前或稅後。</li></ul><h4>投資限制（記憶口訣：LTTLU）</h4><ul><li><b>流動性</b>（Liquidity）：短期需要多少現金（例如買房、學費、緊急預備金）。</li><li><b>期間</b>（Time horizon）：可能是多階段（例如工作期、退休期）。</li><li><b>稅</b>（Taxes）：不同帳戶、不同投資的稅務處理。</li><li><b>法律與法規</b>（Legal and regulatory）：例如退休基金的投資限制、內部人交易限制。</li><li><b>特殊情況</b>（Unique circumstances）：例如宗教或道德考量（不投資菸酒）、ESG 偏好、繼承財產。</li></ul><h4>資產配置</h4><ul><li><b>策略性資產配置</b>（SAA）：長期的目標資產配置，是決定投資組合報酬最重要的因素。</li><li><b>戰術性資產配置</b>（TAA）：依短期市場判斷暫時偏離 SAA。</li><li><b>資產類別</b>的定義：類別內資產相似、類別間相關性低、能提供分散效果。</li><li><b>再平衡</b>：當實際配置偏離目標太多時調回（例如設定 ±5% 的區間）。</li><li><b>核心－衛星</b>：核心部位用被動或低風險策略，衛星部位用主動策略。</li><li><b>風險預算</b>：決定在哪裡承擔多少風險（例如主動風險要分配給哪些經理人）。</li><li><b>ESG 考量</b>：可以寫入 IPS（排除、整合、主題投資等）。</li></ul>',
      ex:'When a client’s ability and willingness to take risk conflict, the adviser should generally adopt the more conservative of the two and educate the client.' },
    { id:'xp5', t:'個人投資者的行為偏誤', en:'The Behavioral Biases of Individuals',
      plain:'投資人常常不理性。偏誤分成兩大類：認知錯誤（想錯、算錯，可以透過教育改善）和情緒偏誤（感覺影響決策，比較難改，常只能調適）。',
      life:'買的股票跌了不想賣，覺得「沒賣就沒賠」（損失趨避）；考試考好就覺得自己是天才，考差就怪題目太難（過度自信、自我歸因）。',
      body:'<h4>認知錯誤 Cognitive errors（比較容易修正）</h4><p><b>一、信念固著</b>（belief perseverance）：堅持原本的看法</p><ul><li><b>保守偏誤</b>：有新資訊時調整太慢，太依賴舊的看法。</li><li><b>確認偏誤</b>：只找支持自己看法的資訊，忽略反面證據 → 持股過度集中。</li><li><b>代表性偏誤</b>：用刻板印象分類（「好公司就是好股票」），忽略基本比率；樣本太小就下結論。</li><li><b>控制幻覺</b>：以為自己能控制結果 → 交易過多、分散不足。</li><li><b>後見之明偏誤</b>：事後覺得「我早就知道了」→ 高估自己的預測能力。</li></ul><p><b>二、資訊處理錯誤</b></p><ul><li><b>定錨與調整</b>：以最初的數字（例如買進價、之前的預測）為錨，調整不足。</li><li><b>心理帳戶</b>：把錢分到不同帳戶，各自看待（例如「中獎的錢可以亂花」），忽略整體投資組合的相關性。</li><li><b>框架效應</b>：同樣的問題用不同方式描述，做出不同決定（例如「90% 存活」vs「10% 死亡」）。</li><li><b>可得性偏誤</b>：容易想起來的事就覺得比較可能發生（例如新聞常報導的事）、投資自己熟悉的公司（本國偏誤）。</li></ul><h4>情緒偏誤 Emotional biases（比較難修正，常要調適）</h4><ul><li><b>損失趨避</b>：損失帶來的痛苦大於同等獲利的快樂 → <b>處分效應</b>（太早賣掉賺錢的股票、太久抱著賠錢的股票）；賠錢時反而冒更大風險想翻本。</li><li><b>過度自信</b>：高估自己的知識和預測能力。<ul><li>預測過度自信：預測區間太窄。</li><li>確定性過度自信：高估機率。</li><li>結果：交易太頻繁、低估風險、分散不足。</li><li><b>自我歸因偏誤</b>：成功歸功自己、失敗怪罪外部。</li></ul></li><li><b>自我控制偏誤</b>：只顧短期享受，犧牲長期目標（例如存不了退休金）。</li><li><b>現狀偏誤</b>：不想改變，維持現狀（例如一直不調整投資組合）。</li><li><b>稟賦效應</b>：對已經擁有的東西評價較高（例如繼承的股票捨不得賣）。</li><li><b>後悔趨避</b>：怕做錯決定後悔，所以不行動或從眾（買大家都買的）。</li></ul><h4>和市場現象的關係</h4><ul><li>動能效應、泡沫與崩盤、價值股與成長股的報酬差異，都可能和行為偏誤有關。</li><li>行為偏誤可能讓價格偏離內在價值，但能否持續套利獲利是另一回事。</li></ul>',
      ex:'Cognitive errors stem from faulty reasoning and can often be corrected through education, whereas emotional biases stem from feelings and are more difficult to correct.' },
    { id:'xp6', t:'風險管理入門', en:'Introduction to Risk Management',
      plain:'風險管理不是消除風險，而是確定組織願意承擔多少風險、承擔哪些風險，並持續衡量、監控和調整。',
      life:'騎機車上學：不可能完全沒風險，但可以戴安全帽（降低）、買保險（轉移）、下雨天改搭公車（避免）。',
      body:'<h4>風險管理架構</h4><ul><li><b>風險治理</b>：由董事會等最高層級決定組織的風險承受度和方向。</li><li><b>風險承受度</b>（risk tolerance）：組織<b>願意</b>承擔多少風險。</li><li><b>風險辨識與衡量</b>。</li><li><b>基礎設施</b>：人員、系統、資料。</li><li><b>政策與程序</b>。</li><li><b>監控、溝通、策略分析與整合</b>。</li></ul><h4>風險預算</h4><ul><li>決定要承擔哪些風險、各承擔多少。</li><li>例：把總風險分配到不同資產類別、不同因子、不同經理人。</li></ul><h4>風險的分類</h4><ul><li><b>財務風險</b>：<ul><li><b>市場風險</b>：利率、匯率、股價、商品價格變動。</li><li><b>信用風險</b>：對方不付款。</li><li><b>流動性風險</b>：無法以合理價格快速賣出。</li></ul></li><li><b>非財務風險</b>：<ul><li><b>作業風險</b>：內部流程、人員、系統失敗或外部事件（包括網路攻擊）。</li><li>交割風險、法律風險、法規遵循風險、<b>模型風險</b>（模型錯誤或誤用）、<b>尾部風險</b>（極端事件比預期多）、會計風險、稅務風險、償付能力風險。</li></ul></li><li>個人的風險：<b>死亡風險</b>（太早過世）、<b>長壽風險</b>（活太久，錢不夠用）。</li><li>風險之間會互相影響（例如市場大跌 → 流動性變差 → 信用風險上升）。</li></ul><h4>衡量風險</h4><ul><li><b>標準差</b>：總波動。</li><li><b>β</b>：股票的市場風險。</li><li><b>存續期間</b>：債券的利率風險。</li><li><b>Delta、Gamma、Vega</b> 等：選擇權的敏感度。</li><li><b>風險值 VaR</b>：在特定信心水準下、特定期間內的<b>最低</b>損失（例：5% 的機率一天損失至少 100 萬）。</li><li><b>條件風險值 CVaR</b>：超過 VaR 時的平均損失（衡量尾部）。</li><li><b>情境分析</b>與<b>壓力測試</b>：模擬極端事件的影響。</li></ul><h4>調整風險的方法</h4><ul><li><b>預防與避免</b>：不從事該活動。</li><li><b>接受</b>：自我保險（例如提列準備）、分散。</li><li><b>轉移</b>：買保險（把風險轉給保險公司）。</li><li><b>移轉／移動</b>（shifting）：用衍生性商品改變風險分布（例如買賣權限制下檔）。</li><li>選擇方法要比較成本和效益。</li></ul>',
      ex:'Value at risk is the minimum loss expected to occur with a given probability over a specified time period.' }
  ]}
);

// 衍金課本、投資學等卡片上的 CFA 標籤 → 對應到 Level I 科目
function cfaTopic(t) {
  if (/Ethic|道德/.test(t)) return 'eth';
  if (/Behavioral|Portfolio|CAPM|Sharpe|CML|SML|beta、systematic/.test(t) && !/^CFA Quant/.test(t)) return 'pm';
  if (/Quant|expected value|time value|holding period|discounted cash flow/.test(t)) return 'quant';
  if (/Econ/.test(t)) return 'econ';
  if (/Financial Statement|FSA/.test(t)) return 'fsa';
  if (/Corporate/.test(t)) return 'corp';
  if (/Equity|P\/E/.test(t)) return 'eq';
  if (/Fixed Income/.test(t)) return 'fi';
  if (/Alternative/.test(t)) return 'alt';
  if (/Deriv|option|forward|futures|hedge|basis|margin|open interest|put/.test(t)) return 'der';
  return 'pm';
}

function cfaBar(r, max) { return `<span class="wbar"><i style="left:${r[0] / max * 100}%;width:${(r[1] - r[0]) / max * 100}%"></i></span>`; }
function cfaDays(s) { return Math.ceil((new Date(s + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5); }
function cfaDate(s) { const [y, m, d] = s.split('-'); return `${+y}/${+m}/${+d}`; }

  <section class="msbox" id="cfa-rule"><h3>考試規則與考場須知</h3>
    <ul>
      <li><b>次數限制：</b>每個級別一年最多考 2 次，不能連續兩個考期都考，兩次至少間隔 6 個月；每個級別一輩子最多考 6 次。</li>
      <li><b>實務技能模組（PSM）：</b>每一級都要完成一個 Practical Skills Module（例如 Python 程式基礎、資料科學與 AI、分析師技能）才會拿到成績。<b>同一個模組不能在不同級別重複用</b>。</li>
      <li><b>計算機：</b>只能用 Texas Instruments BA II Plus（含 Professional 版）或 HP 12C（含 Platinum 等版本）。建議現在就買 BA II Plus 開始練。</li>
      <li><b>財報準則：</b>財報題預設用 IFRS，題目寫明才用 US GAAP。</li>
      <li><b>考試當天：</b>帶有效護照，至少提早 30 分鐘到 Prometric 考場；考場先到先選，越早預約越好。兩場中間可以休息。</li>
      <li><b>台灣考場：</b>台灣有 Prometric 考場（台北），預約時用國家和城市篩選查詢，以報名系統為準。</li>
      <li><b>成績：</b>考期結束後約 5–7 週公布，只有及格／不及格，加上各科表現的分析。</li>

  <section class="msbox" id="cfa-charter"><h3>考完三級之後：拿到證照</h3>

    <p class="sm-p">還沒拿到證照前，不能自稱「CFA」或「CFA Level I」，只能寫「通過 CFA Program Level I」。這也是道德科 VII(B) 的考點。</p></section>

  <section class="msbox" id="cfa-plan"><h3>讀書計畫建議</h3>

function planSettings() {
